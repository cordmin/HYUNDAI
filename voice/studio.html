<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다잇 음성 작업실</title>
<style>
:root{color-scheme:light;--ink:#24323b;--muted:#60707b;--paper:#fff;--base:#f3f5f4;--line:#dae2df;--accent:#356b61}*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font:15px/1.65 "Segoe UI","Malgun Gothic",sans-serif}header{background:#203f3a;color:#f1f6f3;padding:32px max(24px,calc((100vw - 1200px)/2))}h1{margin:0 0 5px;font-size:27px;font-weight:600}header p{margin:0;color:#c4d7cf}.shell{max-width:1250px;margin:auto;padding:24px}button,select,input,textarea{font:inherit}button{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.tabs{display:flex;gap:8px}.tabs button[aria-selected=true]{background:#e0ece7;border-color:#7b9e90}.summary{margin-left:auto;color:var(--muted)}.status{background:#e4eee8;padding:12px 16px;border-radius:10px;margin:16px 0;color:#284b40}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}select,input[type=search]{background:white;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}input[type=search]{flex:1;min-width:190px}.check{display:flex;gap:8px;align-items:center}.clip{padding:22px;background:white;border:1px solid var(--line);border-radius:14px;margin:0 0 15px}.clip-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.tag{font-size:12px;color:var(--muted)}h2{font-size:19px;margin:2px 0 10px;font-weight:600}.transcript{font-size:17px;margin:8px 0 15px}.cue{color:var(--muted);font-size:13px}.voices{display:grid;grid-template-columns:1fr 1fr;gap:20px}.voice{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.voice-name{min-width:52px}.voice small{color:var(--muted)}audio{width:100%;height:36px}.voice button{margin-left:auto;padding:6px 12px;font-size:13px;min-height:38px}details{margin-top:14px}summary{cursor:pointer;color:var(--muted);font-size:13px}.editor{display:grid;gap:10px;margin-top:14px}textarea,input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}textarea{min-height:80px}.editor label{font-size:13px;color:var(--muted)}.editor button{justify-self:start}.rehearsal{max-width:800px;margin:25px auto;background:white;padding:32px;border:1px solid var(--line);border-radius:18px}.rehearsal h2{font-size:24px}.operator{background:#f3eee4;border-radius:12px;padding:16px;margin:18px 0}.operator small,.response small{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.response{padding:18px 0;font-size:22px}.foot{font-size:13px;color:var(--muted);margin-top:24px}.counter{color:var(--muted);font-size:13px}a{color:var(--accent)}[hidden]{display:none!important}.error{color:#a4372a}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:650px){.shell{padding:16px}.voices{grid-template-columns:1fr;gap:10px}.summary{margin-left:0}.clip{padding:18px}.rehearsal{padding:22px}.bar{gap:8px}}
</style></head><body>
<header><h1>다잇 음성 작업실</h1><p>Cruz · Nika / Gemini 3.8 Flash TTS</p></header>
<main class="shell">
<div class="bar"><nav class="tabs" aria-label="작업 화면"><button data-tab="library" aria-selected="true">음원 라이브러리</button><button data-tab="rehearsal" aria-selected="false">시연 리허설</button></nav><span id="summary" class="summary"></span></div>
<div id="batchStatus" class="status" role="status">음원 목록을 불러오는 중…</div>
<section id="library">
<div class="bar"><button id="generateMissing" class="primary">미완성 음원 생성</button><button id="generateSelected">선택 대사 생성</button><button id="stop">생성 중지</button><label class="check"><input type="checkbox" id="selectVisible">현재 목록 선택</label></div>
<div class="filters"><select id="category" aria-label="상황 분류"><option value="">모든 상황</option></select><input id="search" type="search" aria-label="대사 검색" placeholder="제목, 대사, 사용자 질문 검색"><select id="voiceFilter" aria-label="생성할 목소리"><option value="both">Cruz + Nika</option><option>Cruz</option><option>Nika</option></select></div>
<div id="clips"></div>
</section>
<section id="rehearsal" hidden>
<div class="bar"><select id="playlist" aria-label="시연 시나리오"></select><select id="rehearsalVoice" aria-label="시연 목소리"><option>Cruz</option><option>Nika</option></select></div>
<div class="rehearsal"><div id="step" class="counter"></div><h2 id="rehearsalTitle"></h2><div class="operator"><small>진행자가 읽을 사용자 대사 · 실제 음성 인식 아님</small><span id="operatorCue"></span></div><div class="response"><small>다잇의 예시 응답</small><div id="appResponse"></div></div><audio id="rehearsalAudio" controls preload="none"></audio><div class="bar" style="margin-top:20px"><button id="prevStep">이전 응답</button><button id="playStep" class="primary">응답 듣기</button><button id="nextStep">다음 응답</button></div></div>
</section>
<p class="foot">상황별 대사 × 2개 목소리. 시연용 고정 음원입니다. 학교·날씨·내비 상태는 가상 상황이며 실제 데이터가 아닙니다. 이 PC 리허설은 수동 재생이며 Android 앱의 기기 내 음성 인식과는 별개입니다. API 키는 서버에서만 읽고 이 화면이나 APK로 보내지 않습니다.</p>
</main>
<script>
let data=null, selected=new Set(), rehearsalIndex=0, lastSignature='', tab='library';
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const voices=()=>$('voiceFilter').value==='both'?['Cruz','Nika']:[$('voiceFilter').value];
function lines(){const q=$('search').value.toLowerCase(),category=$('category').value;return data.catalog.lines.filter(x=>(!category||x.category===category)&&(!q||[x.title,x.text,x.cue].join(' ').toLowerCase().includes(q)));}
async function post(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(value.error||'요청 실패');return value;}
async function act(callback){try{await callback();await refresh(true);}catch(e){$('batchStatus').textContent=e.message;$('batchStatus').classList.add('error');}}
function renderClips(){
if(!data)return;const visible=lines();
$('clips').innerHTML=visible.length?visible.map(x=>`<article class="clip" data-id="${esc(x.id)}"><div class="clip-head"><div><span class="tag">${esc(x.category)} · ${esc(x.id)}</span><h2>${esc(x.title)}</h2></div><label class="check"><input type="checkbox" data-select="${esc(x.id)}" ${selected.has(x.id)?'checked':''}>선택</label></div><div class="cue">사용자: ${esc(x.cue)}</div><p class="transcript">${esc(x.text)}</p><div class="voices">${['Cruz','Nika'].map(v=>{const clip=x.clips[v];return `<div class="voice"><strong class="voice-name">${v}</strong><small>${clip?clip.duration+'초 · 생성됨':'미생성 / 대본 변경'}</small><button data-generate="${esc(x.id)}" data-voice="${v}">${clip?'새 테이크':'생성'}</button>${clip?`<audio controls preload="none" src="/audio/${v}/${x.id}?v=${clip.sha256}"></audio>`:''}</div>`;}).join('')}</div><details><summary>대본 수정</summary><div class="editor"><label>제목<input name="title" type="text" value="${esc(x.title)}" maxlength="80"></label><label>진행자 질문<input name="cue" type="text" value="${esc(x.cue)}" maxlength="200"></label><label>다잇 대사<textarea name="text" maxlength="400">${esc(x.text)}</textarea></label><button data-save="${x.id}">대본 저장</button></div></details></article>`).join(''):'<div class="empty">해당하는 대사가 없습니다.</div>';
const busy=data.batch.running||data.batch.external_running;$('clips').querySelectorAll('button').forEach(b=>b.disabled=busy);
}
function renderRehearsal(){
if(!data)return;const p=data.catalog.playlists.find(x=>x.id===$('playlist').value)||data.catalog.playlists[0];rehearsalIndex=Math.max(0,Math.min(rehearsalIndex,p.line_ids.length-1));const x=data.catalog.lines.find(x=>x.id===p.line_ids[rehearsalIndex]),v=$('rehearsalVoice').value;
$('step').textContent=`${rehearsalIndex+1} / ${p.line_ids.length} · ${v}`;$('rehearsalTitle').textContent=x.title;$('operatorCue').textContent=x.cue;$('appResponse').textContent=x.text;
const player=$('rehearsalAudio');player.pause();if(x.clips[v])player.src=`/audio/${v}/${x.id}?v=${x.clips[v].sha256}`;else player.removeAttribute('src');$('playStep').disabled=!x.clips[v];$('prevStep').disabled=rehearsalIndex===0;$('nextStep').disabled=rehearsalIndex===p.line_ids.length-1;
}
async function refresh(force=false){
const result=await fetch('/api/state').then(r=>r.json());if(result.error)throw Error(result.error);data=result;
const total=data.catalog.lines.length*2,ready=data.catalog.lines.reduce((n,x)=>n+Object.values(x.clips).filter(Boolean).length,0),busy=data.batch.running||data.batch.external_running;
$('summary').textContent=`${data.catalog.lines.length}개 대사 · ${ready} / ${total}개 음원`;$('batchStatus').classList.remove('error');$('batchStatus').textContent=data.batch.external_running?'명령줄에서 생성 중 · 완료 파일은 자동 반영됩니다.':data.batch.running?`${data.batch.log} · ${data.batch.done}/${data.batch.total}`:data.batch.log;
$('generateMissing').disabled=busy;$('generateSelected').disabled=busy;$('stop').disabled=!data.batch.running;
if(!$('category').dataset.loaded){for(const c of new Set(data.catalog.lines.map(x=>x.category))){const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o);}for(const p of data.catalog.playlists){const o=document.createElement('option');o.value=p.id;o.textContent=p.title;$('playlist').append(o);}$('category').dataset.loaded='1';renderRehearsal();}
const signature=JSON.stringify(data.catalog.lines),audioActive=[...document.querySelectorAll('audio')].some(a=>!a.paused&&!a.ended);if(force||signature!==lastSignature){if((force||!document.activeElement.closest('.editor'))&&!audioActive){renderClips();lastSignature=signature;}}
$('clips').querySelectorAll('button').forEach(b=>b.disabled=busy);
}
$('clips').addEventListener('change',e=>{if(e.target.dataset.select){if(e.target.checked)selected.add(e.target.dataset.select);else selected.delete(e.target.dataset.select);}});
$('clips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.generate)act(()=>post('/api/generate',{voices:[b.dataset.voice],ids:[b.dataset.generate],force:true}));if(b.dataset.save){const article=b.closest('article');act(()=>post('/api/edit',{id:b.dataset.save,title:article.querySelector('[name=title]').value,cue:article.querySelector('[name=cue]').value,text:article.querySelector('[name=text]').value}));}});
$('generateMissing').onclick=()=>act(()=>post('/api/generate',{voices:voices()}));
$('generateSelected').onclick=()=>act(()=>{if(!selected.size)throw Error('대사를 선택해 주세요');return post('/api/generate',{voices:voices(),ids:[...selected]});});
$('stop').onclick=()=>act(()=>post('/api/stop',{}));
$('selectVisible').onchange=e=>{lines().forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id));renderClips();};
$('category').onchange=renderClips;$('search').oninput=renderClips;
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause();});},true);
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('audio').forEach(a=>a.pause());tab=b.dataset.tab;for(const name of ['library','rehearsal'])$(name).hidden=name!==tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));if(tab==='rehearsal')renderRehearsal();});
$('playlist').onchange=()=>{rehearsalIndex=0;renderRehearsal();};$('rehearsalVoice').onchange=renderRehearsal;
$('prevStep').onclick=()=>{rehearsalIndex--;renderRehearsal();};$('nextStep').onclick=()=>{rehearsalIndex++;renderRehearsal();};$('playStep').onclick=()=>{$('rehearsalAudio').play().catch(e=>$('batchStatus').textContent=e.message);};
refresh().catch(e=>$('batchStatus').textContent=e.message);setInterval(()=>refresh().catch(()=>{}),5000);
</script></body></html>
