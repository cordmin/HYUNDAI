plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// The release key stays off the repository: tools/Make-Release-Key.ps1 writes android/keystore.properties.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
android {
    namespace 'io.dait.app'
    compileSdk 34
    useLibrary 'android.car'
    defaultConfig {
        applicationId 'io.dait.app'
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName '0.3-journey'
        testInstrumentationRunner 'io.dait.app.OfflineVoiceCheck'
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false // Vosk and JNA reach native code by reflection.
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += ['wav', 'm4a'] }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    testImplementation 'junit:junit:4.13.2'
}
