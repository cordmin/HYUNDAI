      .replace(/(-?\d+(?:\.\d+)?)[ ,]\s*(-?\d+(?:\.\d+)?)/g, (_, x, y) => `${ITCHI.lx(+x).toFixed(1)} ${ITCHI.ly(+y).toFixed(1)}`);

    // 보상 이름은 깃털이다(2026-11-05 결정). 기기에 남는 값의 이름(ieum)은 이미 쌓인 기록을 잃지 않게 그대로 둔다.
    // 다른 내용 아래 한 줄로 붙을 때(오전 준비물, 쉬는 날)
    function featherLine(progress) {
      return progress.ieum ? `모은 깃털 ${progress.ieum}개` : '수업을 마치면 깃털을 받아요';
    }

    // 「모은 깃털」 칸 이름 아래에 올 때. 이름과 같은 말을 되풀이하지 않는다.
    function featherCount(progress) {
      return progress.ieum ? `${progress.ieum}개` : '수업을 마치면 하나씩 받아요';
    }

    function lessonDoneLine(run) {
      return run.trip.earned ? `배움과 이어졌어요, 깃털 +${run.trip.earned}` : '수업을 멈췄어요. 다음에 이어 가요';
    }

    function isLessonResting() {
      return !!lessonRun && !lessonRun.done && Lesson.isBreak(lessonRun.pieces[lessonRun.index]);
    }

    // fromStop이면 지난번 멈춘 곳부터 잇는다.
    function startLesson(lessonId, fromStop) {
      const trip = fromStop ? stopTrip(lessonId) : lessonTripFor(lessonId);
      if (!trip || !trip.lesson || !(trip.resume || Lesson.fits(trip.lesson, trip.minutes))) return;
      if (lessonRecordOn() && askMicFirst(() => startLesson(lessonId, fromStop))) return;
      disarm();
      tripForDoor = null; // 내릴 때 한마디가 수업을 끊고 지나가지 않게 한다
      clearTimeout(doorTimer);
      currentMode = 'lesson';
      stage = '';
      hasArrived = false;
      micBroken = false;
      startPeriod({ ...trip, earned: 0, endsAt: Date.now() + lessonMinutes * 60 * 1000 });
      syncJourney();
    }

    // 끝까지 못 들은 수업이 있고 이 시간에 이어 들을 수 있으면 그 수업을 돌려준다.
    function stoppedLesson(minutes) {
      const resume = lessonProgress().resume;
      if (!Lesson.resumeFresh(resume, toYmd(new Date()))) return null;
      const lesson = DAIT_LESSONS.find(item => item.id === resume.lesson);
      return lesson && Lesson.resumeFits(lesson, resume, minutes) ? lesson : null;
    }

    // 멈춘 곳부터 이어 들을 때 남은 분. 처음부터 듣는 길이와 다르다.
    function stopMinutesLeft(lesson, minutes) {
      return Math.max(1, Math.round(Lesson.totalSeconds(Lesson.resumePlan(lesson, lessonProgress().resume, minutes)) / 60));
    }

    // 멈춘 곳부터 듣는 수업은 교시로 나누지 않고 그 수업 하나만 잇는다.
    function stopTrip(lessonId) {
      const lesson = stoppedLesson(lessonMinutes);
      if (!lesson || lesson.id !== lessonId) return null;
      return { ...Lesson.planTrip([lesson], lessonMinutes), resume: lessonProgress().resume };
    }

    // 교시마다 기록을 따로 남기려고 교시마다 새로 시작한다. 앞 교시를 마쳤으면 그 복습이 앞에 붙는다.
    // 멈춘 곳부터 이을 때는 복습 없이 멈춘 조각부터 말하고, 앞에서 들은 조각도 들은 것으로 센다.
    function startPeriod(trip) {
      const before = trip.resume ? Lesson.resumeHeard(trip.lesson, trip.resume) : [];
      // 쉬지 않고 이어 붙인 수업은 앞 수업을 방금 들었으므로 그 복습을 붙이지 않는다.
      const records = trip.number > 1 && !trip.rest ? [] : lessonProgress().records;
      const pieces = trip.resume ? Lesson.resumePlan(trip.lesson, trip.resume, trip.minutes)
        : Lesson.plan(trip.lesson, DAIT_LESSONS, trip.minutes, records);
      const run = {
        lesson: trip.lesson, trip, pieces: Lesson.withBreak(pieces, trip), plannedSeconds: Lesson.lessonSeconds([...before, ...pieces]), short: Lesson.isShort([...before, ...pieces]),
        index: 0, heard: before, heardBefore: before.length, answers: [], meters: 0, lastMeters: null, lastMetersAt: 0, startedAt: Date.now(),
        reachedEnd: false, done: false, finished: false, stopped: false, saved: false
      };
      lessonRun = run;
      setTimeout(() => { if (lessonRun === run) endLesson(); }, TRIP_CAP_MS); // 차 상태가 멈춰도 앞쪽 작업이 끝없이 남지 않게 한다
      heard = '';
      noteLessonNavi();
      fitLessonToEta(remainMinutes());
      playLessonPiece();
    }

    // 길 안내가 있으면 남은 시간을, 없으면 고른 시간에서 지난 만큼 뺀 시간을 뒤 교시에 나눈다.
    function tripSeconds(trip) {
      const eta = remainMinutes();
      return eta !== null ? eta * 60 : (trip.endsAt - Date.now()) / 1000;
    }

    function playLessonPiece(offset = 0) {
      const run = lessonRun;
      if (!run || run.done) return;
      clearTimeout(lessonTimer);
      run.stopped = false;
      run.paused = false;
      run.wait = null;
      run.pieceStartedAt = Date.now() - offset * 1000;
      run.positionSeconds = offset;
      run.partialPiece = offset > 0 ? run.pieces[run.index].id : null;
      const piece = run.pieces[run.index];
      if (Lesson.isClosing(piece)) run.reachedEnd = true;
      if (Lesson.isBreak(piece)) {
        saveLesson(run); // 마친 교시는 쉬는 시간이 시작될 때 바로 남긴다
        run.restedFrom = Date.now();
      }
      heard = '';
      speakLessonPiece(piece, offset);
      renderStage();
      updateDriveScreen(piece.line);
    }

    // 음원이 오기 전에는 대사 길이만큼 소리 없이 기다려, 흐름과 시간 맞춤을 그대로 시험한다.
    function speakLessonPiece(piece, offset = 0) {
      const speechSeconds = Lesson.speechSeconds(piece);
      if (offset >= speechSeconds && Lesson.isQuestion(piece)) {
        lessonWait(Math.max(0, Lesson.totalSeconds([piece]) - offset) * 1000, nextLessonPiece);
        return;
      }
      if (piece.voiced) {
        speak([piece.clip], Lesson.isQuestion(piece) && canRecordAnswer() ? 'free' : '');
        if (offset > 0) {
          const seq = speechSeq;
          if (window.AndroidBridge && window.AndroidBridge.seekSpeech) window.AndroidBridge.seekSpeech(Math.round(offset * 1000), seq);
          else if (!window.AndroidBridge) {
            const player = document.getElementById('audioPlayer');
            const seek = () => { if (seq === speechSeq) player.currentTime = offset; };
            player.onloadedmetadata = seek; // src 변경 직후에는 이전 음원의 readyState가 잠깐 남을 수 있다.
            if (player.readyState >= 1) seek();
          }
        }
        return;
      }
      stopSpeech();
      speechPhase = 'speaking';
      const seq = speechSeq;
      lessonWait(Math.max(0, speechSeconds - offset) * 1000, () => window.onSpeechEvent(JSON.stringify({ event: 'ended', seq })));
    }

    // 소리 없이 기다리는 동안(음원 없는 조각, 발문 뒤 생각할 틈)은 타이머로 잰다. 일시정지하면 남은 만큼 다시 잰다.
    function lessonWait(ms, then) {
      const run = lessonRun;
      clearTimeout(lessonTimer);
      const rate = isLessonResting() ? 1 : lessonPlaybackPrefs.rate;
      run.wait = { then, rate, endsAt: Date.now() + ms / rate };
      lessonTimer = setTimeout(() => { if (lessonRun === run && !run.paused) { run.wait = null; then(); } }, ms / rate);
    }

    // 사람이 누른 일시정지. 앱이 먼저 다시 말을 걸지 않고, 이어 듣기를 누를 때까지 기다린다.
    function pauseLesson() {
      const run = lessonRun;
      if (!run || run.done || run.paused || run.stopped || isLessonResting()) return;
      run.paused = true;
      run.pausedAt = Date.now();
      if (run.wait) {
        clearTimeout(lessonTimer);
        run.wait.left = Math.max(0, run.wait.endsAt - run.pausedAt) * (run.wait.rate || 1);
      } else holdSpeech();
      renderStage();
      updateDriveScreen();
    }

    // 30초 안이면 멈춘 곳에서, 넘으면 지금 조각을 처음부터 잇는다. 멈춘 동안 도착이 가까워졌으면 뒤쪽 조각부터 뺀다.
    function resumeLesson() {
      const run = lessonRun;
      if (!run || run.done || !run.paused) return;
      const away = Date.now() - run.pausedAt;
      run.paused = false;
      run.pieceStartedAt += away;
      fitLessonToEta(hasArrived ? 0 : remainMinutes());
      if (run.done) return;
      if (away > LESSON_RESUME_MS) { playLessonPiece(); return; }
      if (run.wait) lessonWait(run.wait.left, run.wait.then);
      else proceedSpeech();
      renderStage();
      updateDriveScreen();
    }

    // 현재 교시만 처음부터 다시 듣는다. 중간 시도는 기록·보상으로 확정하지 않는다.
    function restartLesson() {
      const run = lessonRun;
      if (!run || run.done || isLessonResting() || isDrivingMode) return;
      clearTimeout(lessonTimer);
      stopSpeech();
      const progress = lessonProgress();
      if (progress.resume && progress.resume.lesson === run.lesson.id) {
        writeStored(LESSON_KEY, Lesson.keepResume(progress, null));
      }
      const trip = { ...run.trip, resume: null };
      // 목적지 없이 고른 시간은 새로 센다. 길 안내 중이면 실제 남은 시간으로 다시 맞춘다.
      if (Number.isFinite(trip.endsAt)) trip.endsAt += Date.now() - run.startedAt;
      startPeriod(trip);
      lessonRun.meters = run.meters;
    }

    // 「이전」: 조각을 조금 들었으면 그 조각을 처음부터, 막 시작했으면 앞 조각을 다시 말한다. 지난 교시로는 돌아가지 않는다.
    function prevLessonPiece() {
      const run = lessonRun;
      if (!run || run.done || isLessonResting()) return;
      const listened = (run.paused ? run.pausedAt : Date.now()) - run.pieceStartedAt;
      if (listened < LESSON_BACK_MS && run.index > 0) run.index--;
      playLessonPiece();
      fitLessonToEta(hasArrived ? 0 : remainMinutes()); // 다시 듣는 만큼 뒤쪽 선택 조각을 뺀다
    }

    // 수업 화면 오른쪽 버튼: 쉬는 시간이면 다음 교시, 멈췄으면 잇기, 아니면 일시정지.
    function lessonMainAction() {
      const run = lessonRun;
      if (!run || run.done) return;
      if (isLessonResting()) nextLessonPiece();
      else if (run.stopped) playLessonPiece();
      else if (run.paused) resumeLesson();
      else pauseLesson();
    }

    function lessonMainLabel(run) {
      if (isLessonResting()) return run.trip.rest ? '다음 교시 듣기' : '다음 수업 듣기';
      return run.paused || run.stopped ? '이어 듣기' : '일시정지';
    }

    function nextLessonPiece() {
      const run = lessonRun;
      if (!run || run.done) return;
      clearTimeout(lessonTimer);
      const rested = Lesson.isBreak(run.pieces[run.index]);
      run.index++;
      if (rested) startPeriod(Lesson.nextPeriod(run.trip, tripSeconds(run.trip)));
      else if (run.index >= run.pieces.length) endLesson();
      else playLessonPiece();
    }

    function onLessonSpeech(info) {
      const run = lessonRun;
      if (!run || run.done || info.event === 'listening') return;
      if (run.paused && info.event !== 'stopped') { run.wait = { then: () => onLessonSpeech(info), left: 0 }; return; } // 일시정지와 거의 같이 조각이 끝났으면 이어 듣기를 누른 뒤에 넘어간다
      const piece = run.pieces[run.index];
      if (Lesson.isBreak(piece) && !isDrivingMode && run.trip.rest) { endLesson(); return; } // 쉬는 시간이 끝났을 때 주차 중이면 사람 없는 차에서 말을 시작하지 않는다. 바로 이어 붙인 수업은 사람이 그대로 있다
      if (info.event === 'stopped') {
        run.stopped = true; // 음악이나 통화가 소리를 돌려주지 않으면 사람이 이어 듣기를 누를 때까지 멈춘다
        renderStage();
        updateDriveScreen();
        return;
      }
      if (Lesson.isBreak(piece)) { nextLessonPiece(); return; }
      if (run.partialPiece !== piece.id && !run.heard.includes(piece)) run.heard.push(piece);
      if (info.event === 'heard') {
        if (info.text.length <= 12 && Journey.isQuiet(info.text)) { endLesson(); return; }
        run.answers.push({ level: piece.level, question: piece.line, text: info.text });
        nextLessonPiece();
      } else if (info.event === 'silence') nextLessonPiece(); // 답하지 않아도 재촉하지 않는다
      else if (Lesson.isQuestion(piece)) {
        if (info.event === 'micFailed') micBroken = true;
        lessonWait(piece.wait * 1000, nextLessonPiece); // 생각할 틈
      } else nextLessonPiece();
    }

    // 내비의 남은 거리로 이번 수업에서 달린 거리를 잰다. 길 안내가 없으면 거리를 더하지 않는다.
    function noteLessonNavi() {
      const run = lessonRun;
      if (!run || !naviInfo || !Number.isFinite(naviInfo.remainDistance)) return;
      const now = Date.now();
      if (run.lastMeters !== null) {
        const reachable = TOP_SPEED_MPS * (now - run.lastMetersAt) / 1000;
        run.meters += Math.min(Math.max(0, run.lastMeters - naviInfo.remainDistance), reachable);
      }
      run.lastMeters = naviInfo.remainDistance;
      run.lastMetersAt = now;
    }

    function fitLessonToEta(minutes) {
      const run = lessonRun;
      if (!run || run.done || minutes === null) return;
      // 쉬는 시간을 지낸 만큼은 앞으로 쉴 시간이 아니므로 남은 시간에 도로 더해 맞춘다.
      const rested = isLessonResting() ? (Date.now() - run.restedFrom) / 1000 : 0;
      const fitted = Lesson.fitTrip(run.pieces, run.index, (Math.max(0, minutes * 60 - 20) * lessonPlaybackPrefs.rate + Math.min(20, minutes * 60)) + rested, run.lesson, run.trip);
      run.pieces = fitted.pieces;
      run.trip.count = fitted.count;
      if (run.index >= run.pieces.length) endLesson(); // 쉬는 시간에 뒤 교시가 다 빠졌다
    }

    function endLesson() {
      const run = lessonRun;
      if (!run || run.done) return;
      clearTimeout(lessonTimer);
      stopSpeech();
      run.done = true;
      saveLesson(run);
      heard = '';
      render();
      updateDriveScreen();
      if (hasArrived) closeAfterArrival();
    }

    // 교시마다 한 번만 남긴다. 마친 교시는 저마다 깃털과 숙제가 된다.
    function saveLesson(run) {
      if (run.saved) return;
      run.saved = true;
      run.finished = Lesson.countsAsFinished(run);
      if (run.finished) run.trip.earned++;
      if (run.heard.length > run.heardBefore) { // 멈춘 곳부터 잇다가 새로 들은 조각이 없으면 기록도 멈춘 날짜도 그대로 둔다
        const ymd = toYmd(new Date());
        const progress = Lesson.finishLesson(lessonProgress(), run.lesson, ymd, run.finished, run.meters / 1000, run.answers, run.short);
        const point = run.finished ? null : Lesson.resumePoint(run.lesson, run.heard, ymd); // 다음 이동에서 멈춘 곳부터 잇게 한다
        writeStored(LESSON_KEY, point ? Lesson.keepResume(progress, point) : progress);
      }
    }

    // 처음으로 돌아갈 때 듣던 수업을 정리한다.
    function closeLesson() {
      endLesson();
      lessonRun = null;
    }

    // 주행 중에는 고르는 화면을 열지 않고, 가는 길에 들어갈 수업 하나를 버튼 하나로 제안한다.
    function lessonOffer(trip) {
      if (school && trip.mode === 'afternoon' && trip.kind !== 'weekend' && !(naviInfo && !trip.known)) return null; // 학교가 없는 사람에게는 등하교를 묻지 않는다
      const minutes = Lesson.minutesFor(remainMinutes());
      return stoppedLesson(minutes) || Lesson.recommend(DAIT_LESSONS, minutes, lessonProgress().records)[0] || null;
    }

    // ========================================================
    // Gleo 음성 비서 (assets/schema.json)
    // Gleo가 부른 기능을 처리하고 AndroidBridge.gleoRespond로 답한다. message는 Gleo 규칙대로 영어 한 문장이다.
    // ========================================================
    function gleoReply(functionName, status, message, mode) {
      if (window.AndroidBridge && AndroidBridge.gleoRespond) AndroidBridge.gleoRespond(JSON.stringify({ functionName, status, message, mode: mode || 'voice' }));
    }

    window.onGleoAction = function(functionName, paramsText) {
      let params = {};
      try { params = JSON.parse(paramsText) || {}; } catch (e) {}
      if (functionName === 'START_LESSON') gleoStartLesson(params);
      else if (functionName === 'CONTROL_LESSON') gleoControlLesson(params);
      else gleoReply(functionName, 'fail', 'DAIT does not know this request.');
    };

    // 길 안내 중이면 도착까지 남은 시간을 넘지 않게 듣는다. 수업이 바로 말을 시작하므로 Gleo는 말하지 않는다.
    function gleoStartLesson(params) {
      const fn = 'START_LESSON';
      const run = lessonRun;
      if (run && !run.done && currentMode === 'lesson') {
        if (run.paused || run.stopped || isLessonResting()) { gleoResume(run); gleoReply(fn, 'success', 'Resumed the DAIT lesson.', 'silent'); }
        else gleoReply(fn, 'success', 'A DAIT lesson is already playing.', 'beep');
        return;
      }
      const eta = remainMinutes();
      const asked = Math.floor(Number(params.minutes));
      const wanted = asked > 0 ? asked : null;
      lessonMinutes = eta !== null ? Math.min(Lesson.minutesFor(eta), wanted || Infinity) : (wanted || Lesson.DEFAULT_MINUTES);
      const lesson = Lesson.forRequest(DAIT_LESSONS, lessonMinutes, lessonProgress().records, params.subject);
      if (!lesson) { gleoReply(fn, 'fail', 'There is no DAIT lesson that fits this time.'); return; }
      const before = lessonRun;
      const asking = pendingStart;
      startLesson(lesson.id);
      if (lessonRun && lessonRun !== before && !lessonRun.done) gleoReply(fn, 'success', `Started the ${lesson.subject} lesson.`, 'silent');
      else if (pendingStart && pendingStart !== asking) gleoReply(fn, 'asking', 'Please allow the microphone on the DAIT screen first.'); // 답 남기기를 켰는데 마이크 허락을 묻는 중
      else gleoReply(fn, 'fail', 'DAIT could not start a lesson for this time.');
    }

    // 쉬는 시간이면 다음 교시를 시작한다.
    function gleoResume(run) {
      if (isLessonResting()) nextLessonPiece();
      else if (run.stopped) playLessonPiece();
      else if (run.paused) resumeLesson();
    }

    function gleoControlLesson(params) {
      const fn = 'CONTROL_LESSON';
      const run = lessonRun;
      if (!run || run.done || currentMode !== 'lesson') { gleoReply(fn, 'fail', 'No DAIT lesson is playing right now.'); return; }
      if (params.command === 'pause') {
        if (run.paused || run.stopped) gleoReply(fn, 'success', 'The DAIT lesson is already paused.', 'beep');
        else if (isLessonResting()) gleoReply(fn, 'fail', 'The DAIT lesson is on a break now.');
        else { pauseLesson(); gleoReply(fn, 'success', 'Paused the DAIT lesson.', 'beep'); }
      } else if (params.command === 'resume') {
        gleoResume(run);
        gleoReply(fn, 'success', 'Resumed the DAIT lesson.', 'silent');
      } else gleoReply(fn, 'asking', 'Should DAIT pause or resume the lesson?');
    }

    // ========================================================
    // 학교 정보 (나이스 교육정보 개방 포털)
    // ========================================================
    const NEIS_URL = 'https://relay-khaki-omega.vercel.app/neis/';
    const SCHOOL_KEY = 'dait.school';
    const DAYS_KEY = 'dait.schoolDays';
    const DAYS_AHEAD = 7;
    const EVENTS_KEY = 'dait.schoolEvents';
    const EVENT_DAYS_AHEAD = 45;
    const GRADE_FIELDS = ['ONE', 'TW', 'THREE', 'FR', 'FIV', 'SIX'];
    const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    let school = readStored(SCHOOL_KEY);
    let schoolDays = readStored(DAYS_KEY) || {};
    let schoolEvents = readStored(EVENTS_KEY) || {};
    let settings = {};
    let neisSeq = 0;
    let homeStale = false;
    const neisWaiting = {};

    function readStored(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }

    function writeStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.log('Storage error:', e); }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function toYmd(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}${month}${day}`;
    }

    function fromYmd(ymd) {
      return new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)) - 1, Number(ymd.slice(6, 8)));
    }

    function upcomingDates() {
      const start = new Date();
      return Array.from({ length: DAYS_AHEAD + 1 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }

    function dayLabel(ymd) {
      const dates = upcomingDates();
      if (ymd === toYmd(dates[0])) return '오늘';
      if (ymd === toYmd(dates[1])) return '내일';
      return WEEKDAYS[fromYmd(ymd).getDay()];
    }

    // 인증키는 중계 서버에만 있다. 앱에서는 Kotlin이 대신 받고, 브라우저 미리보기는 중계 서버에 직접 묻는다.
    window.onNeisResult = function(requestId, body) {
      const resolve = neisWaiting[requestId];
      delete neisWaiting[requestId];
      if (resolve) resolve(body);
    };

    function neisBody(service, query) {
      if (window.AndroidBridge) {
        return new Promise(resolve => {
          const requestId = ++neisSeq;
          neisWaiting[requestId] = resolve;
          window.AndroidBridge.neisGet(requestId, service, query);
        });
      }
      return fetch(`${NEIS_URL}${service}?${query}`).then(response => response.text());
    }

    async function neisRows(service, params) {
      const query = new URLSearchParams({ Type: 'json', pIndex: '1', pSize: '100', ...params }).toString();
      const data = JSON.parse(await neisBody(service, query));
      if (data.RESULT) {
        if (data.RESULT.CODE === 'INFO-200') return [];
        throw new Error(data.RESULT.CODE);
      }
      return data[service][1].row;
    }

    function mainDish(dishes) {
      const items = dishes.split(/<br\s*\/?>/i)
        .map(item => item.replace(/\([^)]*\)/g, '').replace(/[*]/g, '').replace(/[a-zA-Z]+\s*$/, '').trim())
        .filter(Boolean);
      return items.find(item => !/(밥|국|탕|찌개|김치|깍두기|우유|주스)$/.test(item)) || items[0] || '';
    }

    // 시간표 창구는 학교급마다 다르다.
    const SCHOOL_KINDS = {
      '초등학교': { service: 'elsTimetable', grades: [1, 2, 3, 4, 5, 6] },
      '중학교': { service: 'misTimetable', grades: [1, 2, 3] },
      '고등학교': { service: 'hisTimetable', grades: [1, 2, 3] }
    };

    function timetableService(target) {
      return (SCHOOL_KINDS[target.kind] || SCHOOL_KINDS['초등학교']).service;
    }

    // 학사일정에서 우리 학년 일정만 날짜별로 모은다. 토요휴업일은 뺀다.
    function eventsByDay(rows, grade) {
      const days = {};
      rows.forEach(row => {
        if (row.EVENT_NM.includes('토요휴업')) return;
        const marks = GRADE_FIELDS.map(field => row[`${field}_GRADE_EVENT_YN`]);
        if (marks.includes('Y') && marks[Number(grade) - 1] !== 'Y') return;
        (days[row.AA_YMD] = days[row.AA_YMD] || []).push({ name: row.EVENT_NM, off: row.SBTR_DD_SC_NM !== '해당없음' });
      });
      return days;
    }

    async function refreshSchoolEvents(target) {
      const today = toYmd(new Date());
      try {
        const rows = await neisRows('SchoolSchedule', {
          ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code, AA_FROM_YMD: today, AA_TO_YMD: toYmd(new Date(fromYmd(today).getTime() + EVENT_DAYS_AHEAD * 86400000))
        });
        if (school !== target) return;
        schoolEvents = eventsByDay(rows, target.grade);
        writeStored(EVENTS_KEY, schoolEvents);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School events error:', e);
      }
    }

    // 시간표는 하루씩 받는다.
    async function refreshSchoolDays() {
      if (!school) return;
      const target = school;
      refreshSchoolEvents(target);
      const dates = upcomingDates();
      const ymds = dates.map(toYmd);
      const base = { ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code };
      try {
        const schoolDates = dates.filter(date => date.getDay() !== 0 && date.getDay() !== 6);
        const [timetables, meals] = await Promise.all([
          Promise.all(schoolDates.map(date => neisRows(timetableService(target), {
            ...base, GRADE: target.grade, CLASS_NM: target.classNm, ALL_TI_YMD: toYmd(date)
          }))),
          neisRows('mealServiceDietInfo', {
            ...base, MMEAL_SC_CODE: '2', MLSV_FROM_YMD: ymds[0], MLSV_TO_YMD: ymds[ymds.length - 1]
          })
        ]);
        const days = {};
        ymds.forEach(ymd => { days[ymd] = { subjects: [], meal: '' }; });
        timetables.flat().sort((a, b) => Number(a.PERIO) - Number(b.PERIO)).forEach(row => {
          const day = days[row.ALL_TI_YMD];
          if (day && !day.subjects.includes(row.ITRT_CNTNT)) day.subjects.push(row.ITRT_CNTNT);
        });
        meals.forEach(row => {
          if (days[row.MLSV_YMD]) days[row.MLSV_YMD].meal = mainDish(row.DDISH_NM);
        });
        if (school !== target) return;
        schoolDays = days;
        lastRefreshDay = ymds[0];
        writeStored(DAYS_KEY, days);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School data error:', e);
      }
    }

    // 시험 날은 시간표가 없을 수 있으므로 점심이나 학사일정이 있어도 수업일로 본다.
    function isClassDay(ymd) {
      if (!Journey.isSchoolDay(ymd, schoolEvents)) return false;
      const day = schoolDays[ymd];
      return !!(day && (day.subjects.length > 0 || day.meal)) || !!schoolEvents[ymd];
    }

    // 앱을 다시 볼 때 날짜가 바뀌었으면 자료를 새로 받고 첫 화면도 지금 시각으로 다시 그린다.
    window.onAppResumed = function() {
      syncLocation();
      if (school && lastRefreshDay !== toYmd(new Date())) refreshSchoolDays();
      refreshHomeIfIdle();
    };

    function schoolPlan() {
      const today = toYmd(new Date());
      const ymd = Object.keys(schoolDays).sort()
        .find(key => key >= today && isClassDay(key));
      if (!school || !ymd) return null;
      const day = schoolDays[ymd];
      return { ...day, ymd, weekday: fromYmd(ymd).getDay(), label: dayLabel(ymd), hasPe: day.subjects.some(subject => subject.replace(/[^가-힣]/g, '').startsWith('체육')) };
    }

    function schoolLevel() {
      return school ? school.kind.charAt(0) : '초';
    }

    // 지금 여정에 맞는 교사 규칙. 하교는 오늘, 등교는 다가오는 수업일을 기준으로 본다.
    function ruleFor(mode) {
      if (!school) return null;
      const plan = schoolPlan();
      const ymd = mode === 'afternoon' || !plan ? toYmd(new Date()) : plan.ymd;
      return Journey.pickRule(DAIT_RULES.rules, { mode, level: schoolLevel(), ymd, events: schoolEvents });
    }

    function subjectChoices() {
      const plan = schoolPlan();
      if (!plan || plan.subjects.length === 0) return null;
      const preferred = ['체육', '과학', '국어'].filter(subject => plan.subjects.includes(subject));
      return [...new Set([...preferred, ...plan.subjects])].slice(0, 3);
    }

    // 지금 여정을 한 곳에서 정한다. 첫 화면·칸·대화 시작이 모두 이것을 따른다.
    // 우선순위: 내비 목적지(학교/집) → 주말·방학은 다음 수업일 준비 → 다니는 길 기억 → 수업일의 시간대(오전 등교·오후 하교)
    function currentTrip() {
      const now = new Date();
      const minutes = naviRemainMinutes();
      const mins = minutes === null ? null : Math.max(1, Math.round(minutes));
      if (naviInfo && naviInfo.name) {
        const fig = { figure: mins === null ? '' : String(mins), figureUnit: mins === null ? '' : '분' };
        if (school && placeMatches(naviInfo, school)) return { mode: 'morning', kind: 'school', known: true, where: `${school.name}까지`, minutes: mins, when: '', ...fig };
        if (homePlace && placeMatches(naviInfo, homePlace)) return { mode: 'afternoon', kind: 'home', known: true, where: '집까지', minutes: mins, when: '', ...fig };
      }
      // 여기부터는 목적지가 학교도 집도 아니거나 없다. 남은 시간은 쓰지 않는다
      const unknownMins = null;
      const todayYmd = toYmd(now);
      const todayHasClass = isClassDay(todayYmd);
      const isWeekend = now.getDay() === 0 || now.getDay() === 6;
      if (school && schoolDays[todayYmd] && !todayHasClass) {
        const plan = schoolPlan();
        const label = plan ? plan.label : '다음 수업일';
        return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: `${label} 준비`, figure: label.replace('요일', ''), figureUnit: label.endsWith('요일') ? '요일' : '' };
      }
      if ((!school || !schoolDays[todayYmd]) && isWeekend) return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: '다음 수업일 준비', figure: '월', figureUnit: '요일' };
      const guess = tripGuess(now);
      const afternoon = guess ? guess === 'afternoon' : now.getHours() >= 12;
      const hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      return { mode: afternoon ? 'afternoon' : 'morning', kind: afternoon ? 'afternoon' : 'morning', known: false, where: '', minutes: unknownMins, when: afternoon ? '오늘 오후' : '오늘 아침', figure: hhmm, figureUnit: '' };
    }

    // 교사 규칙이 있는 날은 첫 화면의 말도 규칙을 따른다.
    // ========================================================
    // 가 볼 만한 곳 (공공데이터포털 한국관광공사 국문 관광정보)
    // 브라우저 미리보기에서는 예시를 보여 준다.
    // ========================================================
    const PLACE_TOPICS = ['과학관', '박물관', '유적지', '체험관'];
    const PLACE_LIMIT = 8;
    const PLACE_TYPES = ['12', '14', '28']; // 관광지, 문화시설, 레포츠. 숙박·식당·쇼핑은 뺀다.
    // 관광공사 자료의 시도 코드(2026-11-03 실제 응답으로 확인). 전남과 광주는 전남광주통합특별시(12)로 합쳐졌고, 세종은 36110이다.
    // 학교 주소가 옛 이름(전라남도, 광주광역시)이어도 같은 코드로 찾는다.
    const REGIONS = [
      ['서울', '11', '서울'], ['부산', '26', '부산'], ['대구', '27', '대구'], ['인천', '28', '인천'],
      ['전남광주', '12', '전남광주'], ['광주', '12', '전남광주'], ['대전', '30', '대전'], ['울산', '31', '울산'], ['세종', '36110', '세종'],
      ['경기', '41', '경기'], ['강원', '51', '강원'], ['충북', '43', '충북'], ['충청북', '43', '충북'],
      ['충남', '44', '충남'], ['충청남', '44', '충남'], ['전북', '52', '전북'], ['전라북', '52', '전북'],
      ['전남', '12', '전남광주'], ['전라남', '12', '전남광주'], ['경북', '47', '경북'], ['경상북', '47', '경북'],
      ['경남', '48', '경남'], ['경상남', '48', '경남'], ['제주', '50', '제주']
    ];
    const SAMPLE_PLACES = {
      '과학관': [['국립과천과학관', '경기도 과천시'], ['국립중앙과학관', '대전광역시 유성구']],
      '박물관': [['국립중앙박물관', '서울특별시 용산구'], ['국립경주박물관', '경상북도 경주시']],
      '유적지': [['경주 불국사', '경상북도 경주시'], ['수원 화성', '경기도 수원시']],
      '체험관': [['한국잡월드', '경기도 성남시'], ['국립어린이과학관', '서울특별시 종로구']]
    };

    let places = {};
    let tourSeq = 0;
    const tourWaiting = {};

    window.onTourResult = function(requestId, body) {
      const resolve = tourWaiting[requestId];
      delete tourWaiting[requestId];
      if (resolve) resolve(body);
    };

    function schoolRegion() {
      const address = school ? school.address : '';
      const found = REGIONS.find(row => address.startsWith(row[0]));
      return found ? { code: found[1], name: found[2] } : null;
    }

    function tourBody(query) {
      return new Promise(resolve => {
        const requestId = ++tourSeq;
        tourWaiting[requestId] = resolve;
        window.AndroidBridge.tourGet(requestId, 'searchKeyword2', query);
      });
    }

    function tourRows(data) {
      const header = data.response.header;
      if (header.resultCode !== '0000') throw new Error(header.resultCode);
      const items = data.response.body.items;
      const rows = items && items.item ? [].concat(items.item) : [];
      return rows
        .filter(row => PLACE_TYPES.includes(String(row.contenttypeid)))
        .map(row => ({ name: row.title, address: row.addr1 || '', lat: Number(row.mapy), lng: Number(row.mapx) })); // 관광공사 좌표: mapy가 위도, mapx가 경도
    }

    // 차의 지금 위치(다니는 길 기억을 켠 경우), 없으면 학교 위치에서 가까운 순으로 줄 세우고 직선거리를 붙인다.
    // 둘 다 모르면 받은 차례(이름순) 그대로 둔다. 실제 길로 걸리는 시간은 길 안내를 누르면 내비가 보여 준다.
    function nearestFirst(rows) {
      const school = knownSpots().school;
      const origin = carSpot || school;
      if (!origin) return { rows, from: '' };
      const measured = rows.map(row => ({ ...row, km: row.lat && row.lng ? Journey.distanceM(origin, row) / 1000 : null }));
      measured.sort((a, b) => (a.km === null) - (b.km === null) || a.km - b.km);
      return { rows: measured, from: carSpot ? '지금 위치에서 가까운 순' : '학교에서 가까운 순' };
    }

    function kmText(km) {
      return km < 10 ? `${km.toFixed(1)}km` : `${Math.round(km)}km`;
    }

    async function searchPlaces(topic) {
      places = { topic, rows: [], sample: false, message: '찾는 중이에요' };
      render();
      if (!window.AndroidBridge) {
        places = { topic, rows: SAMPLE_PLACES[topic].map(row => ({ name: row[0], address: row[1] })), sample: true, message: '' };
        render();
        return;
      }
      const region = schoolRegion();
      const query = new URLSearchParams({
        numOfRows: '100', pageNo: '1', MobileOS: 'AND', MobileApp: 'DAIT', _type: 'json', arrange: 'A', keyword: topic,
        ...(region ? { lDongRegnCd: region.code } : {})
      }).toString();
      let next;
      try {
        const near = nearestFirst(tourRows(JSON.parse(await tourBody(query))));
        next = { topic, rows: near.rows.slice(0, PLACE_LIMIT), near: near.from, sample: false, message: near.rows.length > 0 ? '' : '찾는 곳이 없어요' };
      } catch (e) {
        next = { topic, rows: [], sample: false, message: '지금은 찾을 수 없어요' };
      }
      // 기다리는 사이 다른 주제를 골랐거나 화면을 나갔으면 이 결과는 버린다.
      if (currentMode !== 'places' || places.topic !== topic) return;
      places = next;
      render();
    }

    // 좌표가 있고 차의 내비에 닿을 수 있을 때만 길 안내를 건다. 브라우저 미리보기의 예시 장소는 이름과 주소만 보여 준다.
    function canRoute(row) {
      return !!window.AndroidBridge && Number.isFinite(row.lat) && Number.isFinite(row.lng) && row.lat !== 0 && row.lng !== 0;
    }

    // 고른 곳으로 Pleos 내비 길 안내를 시작하고 첫 화면으로 돌아간다. 안내가 시작되면 첫 화면이 도착까지 남은 시간에 맞춘 수업을 보여 준다.
    function routeToPlace(index) {
      const row = places.rows[index];
      if (!row || !canRoute(row) || isDrivingMode) return;
      window.AndroidBridge.startRoute(JSON.stringify({ name: row.name, address: row.address, lat: row.lat, lng: row.lng }));
      goHome();
    }

    function openPlaces() {
      stopSpeech();
      currentMode = 'places';
      searchPlaces(PLACE_TOPICS[0]);
    }

    function renderPlaces(container) {
      const region = schoolRegion();
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span class="top-label">${region ? `${escapeHtml(region.name)}에서 ` : ''}가 볼 만한 곳</span>
            <span class="top-label">${places.rows.length > 0 ? (places.sample ? '예시' : '자료: 한국관광공사') : ''}</span>
          </div>
          <div class="places-body">
            <div class="settings-list">
              ${PLACE_TOPICS.map(topic => `<button class="choice-chip" onclick="searchPlaces('${topic}')"${topic === places.topic ? ' aria-pressed="true"' : ''}>${topic}</button>`).join('')}
            </div>
            ${places.message ? `<div class="settings-message">${escapeHtml(places.message)}</div>` : ''}
            ${places.near && places.rows.length ? `<div class="card-sub">${escapeHtml(places.near)}</div>` : ''}
            <div class="place-list">
              ${places.rows.map((row, i) => canRoute(row)
                ? `<button class="place-row place-go" aria-label="${escapeHtml(row.name)} 여기로 안내" onclick="routeToPlace(${i})"><span class="place-text"><span class="place-name">${escapeHtml(row.name)}</span><span class="place-address">${typeof row.km === 'number' ? `약 ${kmText(row.km)} · ` : ''}${escapeHtml(row.address)}</span></span><span class="place-action" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11 22 2l-9 19-2-8z"/></svg></span></button>`
                : `<div class="place-row"><span class="place-name">${escapeHtml(row.name)}</span><span class="place-address">${escapeHtml(row.address)}</span></div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function isParkedScreen() {
      return currentMode === 'settings' || currentMode === 'places' || currentMode === 'lessonPick' || currentMode === 'records';
    }

    function openSettings() {
      if (isDrivingMode) return;
      if (currentMode === 'lesson') closeLesson();
      stopSpeech();
      currentMode = 'settings';
      settings = { step: 'search', query: '', results: [], classes: [], message: '' };
      render();
    }

    function renderSettings(container) {
      let title = school ? `${school.name} ${school.grade}학년 ${school.classNm}반` : '학교를 등록해 주세요';
      let body = '';

      if (settings.step === 'search') {
        body = `
          <div class="school-search-row">
            <input id="schoolInput" class="school-input" type="text" placeholder="학교 이름" value="${escapeHtml(settings.query)}"
                   onkeydown="if (event.key === 'Enter') searchSchools()">
            <button class="choice-chip" onclick="searchSchools()">찾기</button>
          </div>
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.results.map((row, i) => `<button class="choice-chip" onclick="pickSchool(${i})">${escapeHtml(row.SCHUL_NM)} · ${escapeHtml(row.LCTN_SC_NM)}</button>`).join('')}
          </div>
        `;
      } else if (settings.step === 'grade') {
        title = '몇 학년인가요?';
        body = `<div class="settings-list">${SCHOOL_KINDS[settings.picked.SCHUL_KND_SC_NM].grades.map(grade => `<button class="choice-chip" onclick="pickGrade(${grade})">${grade}학년</button>`).join('')}</div>`;
      } else if (settings.step === 'memory') {
        title = '다니는 길을 기억할까요?';
        body = `
          <div class="settings-message">날짜, 10분 단위 시간, 집·학교 구분, 문 열림을 이 차에만 60일 남겨요. 직접 정한 학교와 집의 위치도 남겨요. 끄면 모두 지워요.</div>
          <div class="settings-list">
            <button class="choice-chip" onclick="confirmTripMemory()">켜기</button>
            <button class="choice-chip" onclick="cancelTripMemory()">취소</button>
          </div>
        `;
      } else {
        title = '몇 반인가요?';
        body = `
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.classes.map((name, i) => `<button class="choice-chip" onclick="pickClass(${i})">${escapeHtml(name)}${/^\d+$/.test(name) ? '반' : ''}</button>`).join('')}
          </div>
        `;
      }

      const onOff = key => `<span class="setting-state">${readStored(key) === false ? '꺼짐' : '켜짐'}</span>`;
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
          </div>
          <div class="settings-grid">
            <div class="dialogue-card">
              <div class="settings-center">
                <div class="main-question">${escapeHtml(title)}</div>
                ${body}
              </div>
            </div>
            <div class="settings-side">
              <button class="setting-row" onclick="toggleQuestions()"><span>질문</span>${onOff(QUESTIONS_KEY)}</button>
              ${micState() === 'none' ? '' : `<button class="setting-row" onclick="toggleVoiceAnswers()"><span>말로 답하기</span>${onOff(VOICE_KEY)}</button>`}
              <button class="setting-row" onclick="toggleLessonRecord()"><span>수업 대답 기록</span><span class="setting-state">${lessonRecordLabel()}</span></button>
              <div class="card-sub">${lessonRecordNote() || '켜면 수업 발문에 말한 답을 이 차 안에만 글로 남겨요. 녹음 파일은 만들지 않고 서버로 보내지 않아요.'}</div>
              ${locationState() === 'none' ? '' : `<button class="setting-row" onclick="toggleTripMemory()"><span>다니는 길 기억</span><span class="setting-state">${tripMemoryState()}</span></button>`}
              ${canSaveSpot('school') ? '<button class="setting-row" onclick="saveSpot(\'school\')"><span>지금 위치를 학교로</span></button>' : ''}
              ${canSaveSpot('home') ? '<button class="setting-row" onclick="saveSpot(\'home\')"><span>지금 위치를 집으로</span></button>' : ''}
              ${canSaveHome() ? '<button class="setting-row" onclick="saveHomeFromNavi()"><span>지금 목적지를 집으로</span></button>' : ''}
              ${homePlace || tripSpots.home ? `<button class="setting-row" onclick="clearHome()"><span>집 지우기${homePlace ? ` (${escapeHtml(homePlace.name)})` : ''}</span></button>` : ''}
              ${school ? '<button class="setting-row" onclick="clearSchool()"><span>학교 지우기</span></button>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    function toggleQuestions() {
      writeStored(QUESTIONS_KEY, readStored(QUESTIONS_KEY) === false);
      render();
    }

    function toggleVoiceAnswers() {
      writeStored(VOICE_KEY, readStored(VOICE_KEY) === false);
      render();
    }

    async function searchSchools() {
      const query = document.getElementById('schoolInput').value.trim();
      if (!query) return;
      settings.query = query;
      settings.results = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('schoolInfo', { SCHUL_NM: query });
        settings.results = rows.filter(row => row.SD_SCHUL_CODE.trim() && SCHOOL_KINDS[row.SCHUL_KND_SC_NM]).slice(0, 8);
        settings.message = settings.results.length > 0 ? '' : '찾는 학교가 없어요';
      } catch (e) {
        console.log('School search error:', e);
        settings.message = '지금은 학교를 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickSchool(index) {
      settings.picked = settings.results[index];
      settings.step = 'grade';
      render();
    }

    async function pickGrade(grade) {
      const now = new Date();
      settings.grade = grade;
      settings.step = 'class';
      settings.classes = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('classInfo', {
          ATPT_OFCDC_SC_CODE: settings.picked.ATPT_OFCDC_SC_CODE,
          SD_SCHUL_CODE: settings.picked.SD_SCHUL_CODE,
          AY: String(now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear()),
          GRADE: String(grade)
        });
        settings.classes = [...new Set(rows.map(row => row.CLASS_NM))];
        settings.message = settings.classes.length > 0 ? '' : '찾는 반이 없어요';
      } catch (e) {
        console.log('Class search error:', e);
        settings.message = '지금은 반을 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickClass(index) {
      school = {
        office: settings.picked.ATPT_OFCDC_SC_CODE,
        code: settings.picked.SD_SCHUL_CODE,
        name: settings.picked.SCHUL_NM,
        address: settings.picked.ORG_RDNMA || '',
        kind: settings.picked.SCHUL_KND_SC_NM,
        grade: String(settings.grade),
        classNm: settings.classes[index]
      };
      schoolDays = {};
      writeStored(SCHOOL_KEY, school);
      writeStored(DAYS_KEY, schoolDays);
      schoolEvents = {};
      writeStored(EVENTS_KEY, schoolEvents);
      delete routePlaces.school;
      writeStored(ROUTE_KEY, routePlaces);
      forgetSpot('school');
      goHome();
      refreshSchoolDays();
    }

    function clearSchool() {
      school = null;
      schoolDays = {};
      schoolEvents = {};
      delete routePlaces.school;
      writeStored(ROUTE_KEY, routePlaces);
      forgetSpot('school');
      try {
        localStorage.removeItem(SCHOOL_KEY);
        localStorage.removeItem(DAYS_KEY);
        localStorage.removeItem(EVENTS_KEY);
      } catch (e) {
        console.log('Storage error:', e);
      }
      goHome();
    }

    document.getElementById('audioPlayer').addEventListener('ended', playPreviewClip);

    // In-App Detection & Driving Restriction API
    if (window.location.href.includes('android_asset') || navigator.userAgent.includes('Android') || new URLSearchParams(window.location.search).has('app')) {
      document.body.classList.add('in-app');
    }

    // 주행 중: 상세 화면을 닫고 문장 하나와 큰 버튼 둘만 보여 준다. 재생 중인 음성은 이어 간다.
    // 대화 중이 아니면(첫 화면·설정) 조작할 것이 없으므로 "주차 후 이어갈게요"만 보여 준다.
    window.setDrivingMode = function(isDriving, isRealDriving) {
      const departing = isDriving && !isDrivingMode;
      isDrivingMode = isDriving;
      document.body.classList.toggle('driving', isDriving);
      document.body.classList.toggle('real-driving', !!isRealDriving);
      trackDoorTrip(isDriving);
      document.getElementById('demoDrive').classList.toggle('on', isDriving);
      if (isDriving && (isParkedScreen() || (departing && currentMode === 'lesson' && isDialogueDone()))) goHome();
      trackTrip(isDriving);
      if (!isDriving && isLessonResting() && lessonRun.trip.rest) endLesson(); // 쉬는 시간에 주차하면 내린 것으로 보고 수업을 닫는다
      if (departing && armed) startArmed();
      else if (departing && speechPhase === 'idle') advanceWithoutMic();
      if (currentMode === 'lesson' && lessonRun && !lessonRun.done) { lessonRun.scrubbing = false; renderStage(); }
      updateDriveScreen();
      syncJourney();
    };

    function updateDriveScreen(sentence) {
      const inDialogue = currentMode && !isParkedScreen();
      const trip = inDialogue ? null : currentTrip();
      const offer = inDialogue ? null : lessonOffer(trip);
      const canStart = !inDialogue && (!!offer || (trip.mode === 'afternoon' && trip.kind !== 'weekend'));
      const minutes = Lesson.minutesFor(remainMinutes());
      const fromStop = !!offer && offer === stoppedLesson(minutes);
      const text = inDialogue ? (sentence || document.querySelector('.main-question')?.textContent || '')
        : offer ? (fromStop ? '지난번 멈춘 곳부터 들을까요?' : offer.question)
        : canStart ? '하교 이야기를 들을까요?' : '주차 후 이어갈게요';
      document.getElementById('driveSentence').textContent = text;
      const paused = inDialogue && currentMode === 'lesson' && lessonRun && lessonRun.paused;
      const offerLine = !offer ? '' : fromStop ? `${offer.title} · 남은 약 ${stopMinutesLeft(offer, minutes)}분` : lessonPromise(offer, minutes);
      document.getElementById('driveSub').textContent = inDialogue ? (paused ? '잠시 멈췄어요' : heardLineText()) : offer ? offerLine : (canStart ? '' : '설정과 자세한 내용은 주차한 뒤 열어요');
      const done = inDialogue && isDialogueDone();
      const lessonOn = inDialogue && currentMode === 'lesson' && !done;
      const replay = document.getElementById('driveReplay');
      replay.textContent = lessonOn ? '이전' : '다시 듣기';
      replay.disabled = !inDialogue || isLessonResting();
      replay.hidden = canStart;
      const next = document.getElementById('driveNext');
      next.textContent = canStart ? '듣기' : done ? '마치기' : lessonOn ? lessonMainLabel(lessonRun) : '넘기기';
      next.disabled = !inDialogue && !canStart;
      syncLessonMedia();
    }

    // ========================================================
    // 핸들 버튼과 차의 미디어 화면 (앱의 LessonMedia.kt)
    // 듣는 수업이 있을 때만 차가 다잇을 재생 중인 오디오로 보고, 핸들의 재생·멈춤·이전 버튼을 수업 화면의 버튼과 같게 처리한다.
    // ========================================================
    let sentLessonMedia = '';
    function syncLessonMedia() {
      if (!window.AndroidBridge || !AndroidBridge.setLessonMedia) return;
      const run = lessonRun;
      const active = !!run && !run.done && currentMode === 'lesson';
      const playing = active && !run.paused && !run.stopped && !isLessonResting();
      const title = active ? run.lesson.title : '';
      const subtitle = active ? (isLessonResting() ? '쉬는 시간' : `${run.lesson.subject} 수업`) : '';
      const text = JSON.stringify([active, playing, title, subtitle]);
      if (text === sentLessonMedia) return;
      sentLessonMedia = text;
      AndroidBridge.setLessonMedia(active, playing, title, subtitle);
    }

    window.onMediaKey = function(command) {
      const run = lessonRun;
      if (!run || run.done || currentMode !== 'lesson') return;
      if (command === 'pause') pauseLesson();
      else if (command === 'play') gleoResume(run);
      else if (command === 'previous') seekLessonBy(-lessonPlaybackPrefs.back);
      else if (command === 'next') seekLessonBy(lessonPlaybackPrefs.forward);
      updateDriveScreen();
    };

    function driveReplay() {
      if (currentMode === 'lesson') { if (!isDialogueDone()) seekLessonBy(-lessonPlaybackPrefs.back); }
      else if (currentMode && !isParkedScreen()) render();
    }

    function driveNext() {
      if (!currentMode || isParkedScreen()) {
        const trip = currentTrip();
        const offer = lessonOffer(trip);
        if (offer) { lessonMinutes = Lesson.minutesFor(remainMinutes()); startLesson(offer.id, offer === stoppedLesson(lessonMinutes)); }
        else if (trip.mode === 'afternoon' && trip.kind !== 'weekend') startFlow('afternoon');
      } else if (isDialogueDone()) goHome();
      else if (currentMode === 'lesson') lessonMainAction();
      else skipQuestion();
      updateDriveScreen();
    }

    function toggleDrivingDemo() {
      if (window.AndroidBridge) {
        window.AndroidBridge.toggleDrivingSim();
      } else {
        window.setDrivingMode(!isDrivingMode);
      }
    }

    // 차가 보내는 목적지와 남은 시간. 앱의 NaviBridge가 부른다.
    // 실제 값이 오면 시연 조작(8분 전·4분 전·2분 전)보다 우선한다.
    let naviInfo = null;

    window.onNaviUpdate = function(jsonText) {
      let info;
      try { info = JSON.parse(jsonText); } catch (e) { return; }
      if (info.event === 'places') learnFromNavi(info.places || []);
      else if (info.event === 'routeEnded' && performance.now() - routeStartedAt < ROUTE_SWAP_MS) return; // 경로를 바꾸면 옛 경로의 종료 신호가 뒤따른다
      else if (info.event === 'destination' || info.event === 'routeStarted') {
        if (info.event === 'routeStarted') routeStartedAt = performance.now();
        // 길 안내가 없을 때는 이름 없이 0으로 오므로 도착 직전과 구분한다.
        if (!info.name && !(Number(info.remainTime) > 0)) { const had = !!naviInfo; naviInfo = null; renderDemoPanel(); if (had) refreshHomeIfIdle(); return; }
        const changed = !naviInfo || naviInfo.name !== (info.name || '') || (currentMode === 'settings' && !document.querySelector('[onclick="saveHomeFromNavi()"]') && canSaveHomeFor(info));
        naviInfo = { name: info.name || '', address: info.address || '', remainTime: Number(info.remainTime), remainDistance: Number(info.remainDistance), at: Date.now() };
        noteNaviPlace();
        learnFromNavi([info]);
        applyNaviEta();
        if (changed) refreshHomeIfIdle();
      } else if (info.event === 'routeCancelled' || info.event === 'routeEnded' || info.event === 'arrived' || info.event === 'unavailable') {
        // 내비에 따라 도착 신호 없이 안내 종료만 올 수 있으므로, 거의 다 온 때의 종료도 도착으로 본다.
        const reached = info.event === 'arrived' || (info.event === 'routeEnded' && Journey.tierFor(naviRemainMinutes()) === 'arrive');
        if (reached) noteTripArrival();
        naviPlace = '';
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
        if (reached) finishOnArrival();
      } else if (info.event === 'status' && info.status !== 'ROUTE_DRIVE') {
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
      }
    };

    function refreshHomeIfIdle() {
      if (isIntroPlaying) { homeStale = true; return; }
      if (!currentMode || currentMode === 'settings') render();
    }
    // 길 안내 중 10초마다 같은 목적지가 와도 설정 화면의 '집으로' 버튼이 늦지 않게, 목적지 이름이 생기면 다시 그린다

    // ========================================================
    // 목적지로 등교·하교 제안 (기획안 ②: 목적지가 학교면 등교, 집이면 하교)
    // 자동으로 대화를 시작하지는 않는다. 안전 원칙: 운전자 조작 없이 소리를 내지 않는다.
    // ========================================================
    const HOME_KEY = 'dait.home';
    let homePlace = readStored(HOME_KEY);
    let routePlaces = readStored(ROUTE_KEY) || {}; // 내비에서 알아 둔 학교와 집의 좌표

    function normalizePlace(text) {
      return String(text || '').replace(/\s+/g, '').replace(/[()·,.]/g, '');
    }

    // 도로명 주소에서 '산정로 171'처럼 도로 이름과 번지만 뽑는다.
    function roadPart(address) {
      const m = String(address || '').match(/([가-힣A-Za-z0-9]+(?:로|길|대로))\s*(\d+(?:-\d+)?)/);
      return m ? m[1] + m[2] : '';
    }

    function placeMatches(dest, place) {
      if (!dest || !place) return false;
      const destName = normalizePlace(dest.name), placeName = normalizePlace(place.name);
      // '집'처럼 짧은 이름은 '피자집'에도 들어가므로 네 글자가 넘을 때만 일부 일치를 인정한다.
      const longEnough = Math.min(destName.length, placeName.length) >= 4;
      if (destName && placeName && (destName === placeName || (longEnough && (destName.includes(placeName) || placeName.includes(destName))))) return true;
      const destRoad = roadPart(dest.address), placeRoad = roadPart(place.address);
      return !!(destRoad && placeRoad && destRoad === placeRoad);
    }

    // 좌표를 배우면 실제 길 안내로 이어지므로, 이름이 같고 주소도 어긋나지 않을 때만 같은 곳으로 본다.
    function isSamePlace(found, target) {
      const foundRoad = roadPart(found.address), targetRoad = roadPart(target.address);
      if (foundRoad && targetRoad) return foundRoad === targetRoad;
      if (normalizePlace(found.name) !== normalizePlace(target.name)) return false;
      if (!found.address || !target.address) return true;
      return found.address.split(/\s+/).some(word => word.length >= 2 && target.address.includes(word));
    }

    function canSaveHome() { return canSaveHomeFor(naviInfo); }
    function canSaveHomeFor(dest) {
      return !!(dest && dest.name) && !(school && placeMatches(dest, school)) && !(homePlace && placeMatches(dest, homePlace));
    }

    function saveHomeFromNavi() {
      if (!canSaveHome()) return;
      delete routePlaces.home;
      writeStored(ROUTE_KEY, routePlaces);
      forgetSpot('home');
      homePlace = { name: naviInfo.name, address: naviInfo.address || '' };
      writeStored(HOME_KEY, homePlace);
      writeStored(HOME_CLEARED_KEY, false);
      goHome();
    }

    function clearHome() {
      homePlace = null;
      writeStored(HOME_CLEARED_KEY, true);
      delete routePlaces.home;
      writeStored(ROUTE_KEY, routePlaces);
      forgetSpot('home');
      try { localStorage.removeItem(HOME_KEY); } catch (e) { console.log('Storage error:', e); }
      render();
    }

    // ========================================================
    // 다니는 길 기억 (보호자가 켰을 때만)
    // 어디서 어디로 갔는지의 구분만 기록해 등교·하교 판단을 돕는다. 좌표와 지나온 길은 남기지 않는다.
    // 판단이 맞아도 첫 화면과 주행 화면의 제안만 바뀌고, 말을 먼저 걸지 않는다.
    // 시동을 끄면 타이머가 사라지므로 여정은 다음 출발 때 마감한다.
    // ========================================================
    const TRIP_MEMORY_KEY = 'dait.tripMemory';
    const TRIPS_KEY = 'dait.trips';
    const TRIP_OPEN_KEY = 'dait.tripOpen';
    const SPOTS_KEY = 'dait.tripSpots';
    const STOP_GAP_MS = 3 * 60 * 1000; // 신호 대기나 잠깐 정차는 같은 여정으로 본다
    const FIX_FRESH_MS = 60 * 1000; // 내비가 앱을 덮으면 위치가 끊기므로 이보다 오래된 위치는 믿지 않는다
    const TRIP_KEEP_DAYS = 60;
    let trips = readStored(TRIPS_KEY) || [];
    let tripOpen = readStored(TRIP_OPEN_KEY);
    let tripSpots = readStored(SPOTS_KEY) || {}; // 내비에 없는 학교와 집을 보호자가 지금 위치로 정한 좌표
    let carSpot = null; // 지금 좌표. 저장하지 않는다
    let carPlace = ''; // 'home' | 'school' | 'other' | ''
    let carFixAt = 0;
    let naviPlace = ''; // 내비 목적지가 학교나 집이면 그 구분. 도착 신호보다 먼저 목적지가 지워져도 남는다
    if (tripOpen && !tripOpen.parkedAt) tripOpen.parkedAt = 1; // 달리던 중 앱이 꺼졌으면 다음 출발 때 마감한다

    function tripMemoryOn() {
      return readStored(TRIP_MEMORY_KEY) === true;
    }

    function locationState() {
      return window.AndroidBridge ? window.AndroidBridge.locationState() : 'none';
    }

    function syncLocation() {
      if (window.AndroidBridge) window.AndroidBridge.setLocationOn(tripMemoryOn());
    }

    function knownSpots() {
      return { school: tripSpots.school || routePlaces.school, home: tripSpots.home || routePlaces.home };
    }

    function minuteOfDay(date) {
      return date.getHours() * 60 + date.getMinutes();
    }

    function saveTripOpen() {
      writeStored(TRIP_OPEN_KEY, tripOpen);
    }

    function freshPlace() {
      return Date.now() - carFixAt < FIX_FRESH_MS ? carPlace : '';
    }

    window.onCarLocation = function(lat, lng) {
      carSpot = { lat, lng };
      carFixAt = Date.now();
      updateCarPlace();
    };

    function updateCarPlace() {
      const place = Journey.placeLabel(carSpot, knownSpots());
      const changed = place !== carPlace;
      carPlace = place;
      if (tripOpen && freshPlace()) {
        // 출발 직후에만 출발지를 채운다. 달리던 중에 처음 받은 위치는 출발지가 아니다.
        const from = tripOpen.from || (Date.now() - tripOpen.startedAt < FIX_FRESH_MS ? place : '');
        if (from !== tripOpen.from || place !== tripOpen.last) {
          tripOpen.from = from;
          tripOpen.last = place;
          saveTripOpen();
        }
      }
      if (!changed) return;
      refreshHomeIfIdle();
      updateDriveScreen();
    }

    function startTrip(chosen) {
      const now = new Date();
      const place = freshPlace();
      tripOpen = { ymd: toYmd(now), day: now.getDay(), min: minuteOfDay(now), end: null, from: place, last: place, door: false, chosen, parkedAt: 0, startedAt: Date.now() };
      saveTripOpen();
    }

    function closeTrip() {
      if (!tripOpen) return;
      const record = Journey.finishTrip(tripOpen, trips[trips.length - 1]);
      const oldest = toYmd(new Date(Date.now() - TRIP_KEEP_DAYS * 24 * 60 * 60 * 1000));
      trips = [...trips, ...(record ? [record] : [])].filter(trip => trip.ymd >= oldest);
      writeStored(TRIPS_KEY, trips);
      tripOpen = null;
      saveTripOpen();
    }

    function trackTrip(isDriving) {
      if (!tripMemoryOn()) return;
      if (!isDriving) {
        if (tripOpen && !tripOpen.parkedAt) {
          tripOpen.parkedAt = Date.now();
          tripOpen.end = minuteOfDay(new Date());
          saveTripOpen();
        }
        return;
      }
      if (tripOpen && !tripOpen.parkedAt) return;
      const talking = (currentMode === 'morning' || currentMode === 'afternoon') && !isDialogueDone() ? currentMode : '';
      if (tripOpen && Date.now() - tripOpen.parkedAt < STOP_GAP_MS) {
        tripOpen.parkedAt = 0;
        tripOpen.end = null;
        tripOpen.chosen = tripOpen.chosen || talking;
        saveTripOpen();
        return;
      }
      closeTrip();
      startTrip(talking);
    }

    // 보호자가 고른 대화는 이 여정이 무엇인지 알려 준다.
    function noteTripChoice(mode) {
      if (!tripOpen || tripOpen.parkedAt) return;
      tripOpen.chosen = mode;
      saveTripOpen();
    }

    // 교문 앞에서는 주차하지 않고 내릴 수 있으므로 학교 앞에서 문이 열리면 여정을 마감한다.
    function noteTripDoor() {
      if (!tripOpen || (tripOpen.parkedAt && Date.now() - tripOpen.parkedAt > DOOR_WINDOW_MS)) return;
      tripOpen.door = true;
      saveTripOpen();
      if (freshPlace() !== 'school' || tripOpen.from === 'school') return;
      if (tripOpen.end === null) tripOpen.end = minuteOfDay(new Date());
      closeTrip();
      if (isDrivingMode) startTrip('');
    }

    function noteNaviPlace() {
      naviPlace = school && placeMatches(naviInfo, school) ? 'school' : homePlace && placeMatches(naviInfo, homePlace) ? 'home' : '';
    }

    // 내비가 앱을 덮어 위치가 끊겨도 도착 신호로 도착한 곳을 안다.
    function noteTripArrival() {
      if (!naviPlace) return;
      carPlace = naviPlace;
      carFixAt = Date.now();
      if (!tripOpen) return;
      tripOpen.last = naviPlace;
      saveTripOpen();
    }

    // 달리는 동안에는 출발한 곳과 시각으로 판단해, 시간이 지나도 판단이 바뀌지 않게 한다.
    function tripGuess(now) {
      if (!tripMemoryOn()) return null;
      const driving = isDrivingMode && tripOpen;
      const previous = trips[trips.length - 1];
      const last = driving || !tripOpen ? previous : Journey.finishTrip(tripOpen, previous) || previous;
      return Journey.guessMode({ place: driving ? tripOpen.from : freshPlace(), trips, last, ymd: toYmd(now), day: now.getDay(), min: driving ? tripOpen.min : minuteOfDay(now) });
    }

    // 학교 바로 옆에 살면 집에서도 학교로 나오므로, 집은 그 자리에서도 정할 수 있게 한다.
    function canSaveSpot(kind) {
      const place = freshPlace();
      const here = place === 'other' || (kind === 'home' && place === 'school');
      return tripMemoryOn() && here && !knownSpots()[kind] && (kind === 'home' || !!school);
    }

    function saveSpot(kind) {
      if (!canSaveSpot(kind)) return;
      tripSpots[kind] = carSpot;
      writeStored(SPOTS_KEY, tripSpots);
      updateCarPlace();
      render();
    }

    function forgetTrips() {
      trips = [];
      tripOpen = null;
      writeStored(TRIPS_KEY, trips);
      saveTripOpen();
    }

    // 학교나 집이 바뀌면 지난 기록의 구분이 맞지 않으므로 함께 지운다.
    function forgetSpot(kind) {
      delete tripSpots[kind];
      writeStored(SPOTS_KEY, tripSpots);
      forgetTrips();
      carPlace = '';
      updateCarPlace();
    }

    function turnOnTripMemory() {
      writeStored(TRIP_MEMORY_KEY, true);
      syncLocation();
      settings.step = 'search';
      settings.message = '다니는 길 기억을 켰어요';
    }

    function tripMemoryState() {
      if (!tripMemoryOn() || locationState() === 'ask') return '꺼짐';
      return carSpot ? '켜짐' : '위치 찾는 중';
    }

    // 무엇을 남기는지 보호자가 먼저 읽고 켜게 한다. 시스템 허락 창은 그다음이다.
    function toggleTripMemory() {
      if (tripMemoryOn() && locationState() !== 'ask') {
        writeStored(TRIP_MEMORY_KEY, false);
        syncLocation();
        forgetTrips();
        tripSpots = {};
        writeStored(SPOTS_KEY, tripSpots);
        carSpot = null;
        carPlace = '';
        settings.message = '기억을 지웠어요';
      } else {
        settings.step = 'memory';
      }
      render();
    }

    function confirmTripMemory() {
      if (locationState() === 'ask') {
        window.AndroidBridge.requestLocation();
        return;
      }
      turnOnTripMemory();
      render();
    }

    function cancelTripMemory() {
      settings.step = 'search';
      render();
    }

    window.onLocationAnswered = function() {
      if (locationState() === 'ready') {
        turnOnTripMemory();
      } else {
        settings.step = 'search';
        settings.message = '정확한 위치를 허락하면 켤 수 있어요';
      }
      if (currentMode === 'settings') render();
    };

    // 남은 시간은 초, 남은 거리는 m 단위다. 에뮬레이터에서 판교→서울시청 1740초·26000m로 확인했다.
    function naviRemainMinutes() {
      if (!naviInfo || !Number.isFinite(naviInfo.remainTime)) return null;
      return naviInfo.remainTime / 60;
    }

    // 도착이 가까워지면 말하던 문장은 끝까지 하고, 다음 내비 응답 때 마무리로 넘어간다.
    function applyNaviEta() {
      renderDemoPanel();
      if (currentMode === 'lesson') { noteLessonNavi(); fitLessonToEta(hasArrived ? 0 : remainMinutes()); return; } // 도착한 뒤 늦게 온 남은 시간으로 교시를 되살리지 않는다
      if (!currentMode || isParkedScreen() || speechPhase === 'speaking' || speechPaused || hasArrived) return;
      if (Journey.tierFor(remainMinutes()) !== 'arrive') return;
      if (stage === 'ETA_SHORT' || stage === 'PARENT_BRIDGE' || stage === 'NEXT_DAY') return; // 가족 대화는 끊지 않는다
      // 대화를 일찍 마친 등교도 내리기 전 준비물 확인은 한 번 한다 (기획안 ④)
      if (!isDialogueDone() || currentMode === 'morning') setStage('ETA_SHORT');
    }

    function renderDemoPanel() {
      const minutes = naviRemainMinutes();
      const live = minutes !== null;
      const shown = remainMinutes();
      const buttons = [['demoEtaLong', 8], ['demoEtaMid', 4], ['demoEtaShort', 2]];
      buttons.forEach(([id, value]) => {
        const button = document.getElementById(id);
        button.classList.toggle('on', !live && shown === value);
        button.disabled = live;
      });
      document.getElementById('demoEtaLong').textContent = live ? `${Math.max(1, Math.round(minutes))}분 전` : '8분 전';
      document.getElementById('demoEtaLong').classList.toggle('on', live || shown === 8);
    }

    // 시연용 목적지. 차에서 실제 값이 오면(앱 안) 쓰지 않는다. 없음 → 학교 → 집 → 없음 순으로 돈다.
    let destDemoStep = 0;
    function cycleDestDemo() {
      if (window.AndroidBridge) return;
      destDemoStep = (destDemoStep + 1) % 3;
      const fake = destDemoStep === 1 && school ? { name: school.name, address: school.address, remainTime: 480, remainDistance: 4000 }
        : destDemoStep === 2 ? { name: homePlace ? homePlace.name : '우리집', address: homePlace ? homePlace.address : '', remainTime: 480, remainDistance: 4000 }
        : null;
      document.getElementById('demoDest').classList.toggle('on', !!fake);
      if (fake) window.onNaviUpdate(JSON.stringify({ event: 'destination', ...fake }));
      else window.onNaviUpdate(JSON.stringify({ event: 'routeCancelled' }));
    }

    // 시연용 남은 시간. 차에서 실제 값이 오면 쓰지 않는다.
    function setEtaDemo(minutes) {
      if (naviRemainMinutes() !== null) return;
      demoMinutes = demoMinutes === minutes ? null : minutes;
      applyNaviEta();
    }

    // ========================================================
    // 시그니처 인트로 스플래시 애니메이션 엔진
    // ========================================================
    let isIntroPlaying = false;
    let introTimers = [];

    function clearIntroTimers() {
      introTimers.forEach(t => clearTimeout(t));
      introTimers = [];
    }

    function playChimeSound() {
      if (isDrivingMode) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        // 산뜻하고 경쾌한 현대 ccNC 차음 스타일 피치 (880Hz -> 1760Hz)
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {
        // 브라우저 자동 재생 정책 제한 시 안전 패스
      }
    }

    function playSplashIntro() {
      if (isIntroPlaying) return;
      isIntroPlaying = true;
      clearIntroTimers();

      const overlay = document.getElementById('splashOverlay');
      const brand = document.getElementById('splashBrandContainer');
      const ribbon = document.getElementById('splashRibbonPath');
      const crossbar = document.getElementById('splashCrossbarPath');
      const dotGroup = document.getElementById('splashDotGroup');
      const dotRipple = document.getElementById('splashDotRipple');
      const aura = document.querySelector('.splash-aura');

      if (!overlay || !ribbon) {
        isIntroPlaying = false;
        return;
      }

      // 오버레이 및 브랜드 상태 초기화 (전체 화면 상태로 리셋)
      overlay.style.transition = 'none';
      overlay.style.display = 'flex';
      overlay.style.opacity = '1';
      overlay.style.visibility = 'visible';

      if (aura) {
        aura.style.transition = 'none';
        aura.style.opacity = '0.9';
      }

      brand.style.transition = 'none';
      brand.style.transform = 'translate(0, 0) scale(1)';
      brand.style.opacity = '1';

      if (dotGroup) dotGroup.classList.remove('pop');
      if (dotRipple) dotRipple.classList.remove('expand');

      // 카드 초기화 (오른쪽에서 당겨져 들어올 준비)
      const cards = document.querySelectorAll('.home-card');
      cards.forEach((card) => {
        card.style.transition = 'none';
        card.style.transform = 'translateX(30px)';
        card.style.opacity = '0';
      });

      // 잇찌 장면(2026-11-05): 잇찌가 날갯짓하며 날아와 앉았다가 다잇 로고로 바뀐다. 그 뒤는 원래처럼 점이 톡 찍히고
      // 로고가 위로 올라간다. 움직임 줄이기 설정이면 잇찌 장면 없이 원래 장면만. 화면을 누르면 언제든 건너뛴다.
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const logoSvg = document.getElementById('splashLogoSvg');
      if (!reduce && logoSvg && typeof ITCHI !== 'undefined') {
        ribbon.style.transition = 'none'; ribbon.style.opacity = '0';
        crossbar.style.transition = 'none'; crossbar.style.opacity = '0';
        if (aura) aura.style.opacity = '0.5';
        const holder = document.createElement('div');
        holder.className = 'splash-itchi-holder';
        holder.innerHTML = itchiHtml({ celebrated: true, trip: { earned: 0 } }, { splash: true });
        holder.style.cssText = `position:absolute;left:${logoSvg.offsetLeft}px;top:${logoSvg.offsetTop}px;width:${logoSvg.offsetWidth}px;height:${logoSvg.offsetHeight}px;pointer-events:none`;
        brand.appendChild(holder);
        const svg = holder.querySelector('svg');
        svg.style.cssText = 'width:100%;height:100%;overflow:visible';
        splashItchiCancel = ITCHI.splash(svg, () => {
          splashItchiCancel = null;
          holder.remove();
          ribbon.style.opacity = ''; crossbar.style.opacity = '';
          if (aura) { aura.style.transition = 'opacity 0.3s ease'; aura.style.opacity = '0.9'; }
          logoSteps(true);
        });
        return;
      }
      logoSteps(false);

      // written: 로고가 이미 그려진 상태(잇찌가 로고로 바뀐 뒤)면 손글씨 단계를 건너뛰고 점 찍기부터
      function logoSteps(written) {
      const shift = written ? 1120 : 0;
      const at = (ms, fn) => introTimers.push(setTimeout(fn, Math.max(0, ms - shift)));

      // SVG 스트로크 대시 설정 (전체 길이 측정)
      const ribbonLength = ribbon.getTotalLength ? ribbon.getTotalLength() : 380;
      ribbon.style.transition = 'none';
      ribbon.style.strokeDasharray = ribbonLength;
      ribbon.style.strokeDashoffset = written ? 0 : ribbonLength;

      const crossbarLength = crossbar.getTotalLength ? crossbar.getTotalLength() : 20;
      crossbar.style.transition = 'none';
      crossbar.style.strokeDasharray = crossbarLength;
      crossbar.style.strokeDashoffset = written ? 0 : crossbarLength;

      // 동기식 리플로우 강제 (트랜지션 보장)
      void ribbon.getBoundingClientRect();

      // 1. 손글씨 쓰듯 캘리그래피 스트로크 스르륵 써내려가기 (0 ~ 1.05s)
      if (!written) requestAnimationFrame(() => {
        ribbon.style.transition = 'stroke-dashoffset 1.05s cubic-bezier(0.42, 0, 0.18, 1)';
        ribbon.style.strokeDashoffset = '0';
      });

      // 2. t 가로획 연결 (0.92s)
      if (!written) at(920, () => {
        crossbar.style.transition = 'stroke-dashoffset 0.18s ease-out';
        crossbar.style.strokeDashoffset = '0';
      });

      // 3. i 위에 점(Dot) 하나 마지막으로 딱! 찍히며 충격파 확산 (1.12s)
      at(1120, () => {
        if (dotGroup) dotGroup.classList.add('pop');
        if (dotRipple) dotRipple.classList.add('expand');
        playChimeSound();
      });

      // 4. 로고가 작아지며 화면 위쪽 제자리로 미끄러져 간다 (1.62s)
      at(1620, () => {
        const targetBadge = document.querySelector('.dait-brand-badge');
        if (targetBadge) {
          const from = brand.getBoundingClientRect();
          const to = targetBadge.getBoundingClientRect();
          const moveX = to.left + to.width / 2 - from.left - from.width / 2;
          const moveY = to.top + to.height / 2 - from.top - from.height / 2;
          brand.style.transition = 'transform 0.58s cubic-bezier(0.22, 1, 0.36, 1)';
          brand.style.transform = `translate(${moveX}px, ${moveY}px) scale(${to.width / from.width})`;
        }
        if (aura) {
          aura.style.transition = 'opacity 0.5s ease';
          aura.style.opacity = '0';
        }
      });

      // 5. 로고가 닿으면 덮개를 걷고 카드가 차례로 들어온다 (2.2s)
      at(2200, () => {
        overlay.style.transition = 'opacity 0.25s ease';
        overlay.style.opacity = '0';
        cards.forEach((card, idx) => {
          introTimers.push(setTimeout(() => {
            card.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.36s ease-out';
            card.style.transform = 'translateX(0)';
            card.style.opacity = '1';
          }, idx * 45));
        });
      });

      // 6. 카드 스타일과 스플래시 정리 (3s)
      at(3000, () => {
        cards.forEach((card) => {
          card.style.transition = '';
          card.style.transform = '';
          card.style.opacity = '';
        });
        overlay.style.display = 'none';
        finishIntro();
      });
      }
    }

    let splashItchiCancel = null; // 시작 화면 잇찌 장면을 멈추는 함수

    function finishIntro() {
      isIntroPlaying = false;
      if (homeStale && !currentMode) render();
      homeStale = false;
    }

    function skipSplashIntro() {
      clearIntroTimers();
      if (splashItchiCancel) { splashItchiCancel(); splashItchiCancel = null; }
      document.querySelectorAll('.splash-itchi-holder').forEach(h => h.remove());
      ['splashRibbonPath', 'splashCrossbarPath'].forEach(id => { const el = document.getElementById(id); if (el) { el.style.opacity = ''; el.style.strokeDashoffset = '0'; } });
      const overlay = document.getElementById('splashOverlay');
      const cards = document.querySelectorAll('.home-card');
      cards.forEach((card) => {
        card.style.transition = 'opacity 0.2s ease';
        card.style.transform = '';
        card.style.opacity = '1';
        setTimeout(() => {
          card.style.transition = '';
        }, 200);
      });
      if (overlay) {
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
          finishIntro();
        }, 200);
      }
    }

    // 제출용 앱에는 시연 버튼 줄을 두지 않는다. 브라우저 미리보기와 개발용 앱에만 보인다.
    if (window.AndroidBridge && window.AndroidBridge.isDebugBuild && !window.AndroidBridge.isDebugBuild()) document.body.classList.add('release');

    // Initial render and signature splash intro
    render();
    refreshSchoolDays();
    syncLocation();
    setTimeout(() => {
      playSplashIntro();
    }, 120);
  </script>
  <script src="dait-appearance.js?v=player-20261107"></script>
  <script src="dait-volume.js"></script>
