/* =====================================================================

   팀에서 받은 「Dait 까치 로고 모션」(received/dait_magpie_logo.html)을 바탕으로,
   새의 몸·리본·눈·t 가로줄·다리를 잇찌(dait-bird-final-calm-v2.svg)로 바꿨다.
   잇찌의 모티브는 까치다(2026-11-05 앱 담당 교사). 날갯짓 날개는 받은 파일의 까치 날개(흰 무늬 띠)를 그대로 쓴다.

function sampleKeys(arr, f, f0, step) {
  const u = (f - f0) / step, n = arr.length;
  const i = clamp(Math.floor(u), 0, n - 2), t = clamp(u - i, 0, 1);
  const p0 = arr[Math.max(0, i - 1)], p1 = arr[i], p2 = arr[i + 1], p3 = arr[Math.min(n - 1, i + 2)];
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);

function table(keys, f) {
  const n = keys.length;
  if (f <= keys[0][0]) return keys[0][1];
  if (f >= keys[n - 1][0]) return keys[n - 1][1];
  let i = 0; while (f > keys[i + 1][0]) i++;
  const [x0, y0] = keys[i], [x1, y1] = keys[i + 1], h = x1 - x0, t = (f - x0) / h;
  const slope = k => {
    if (k <= 0 || k >= n - 1) return 0;
    const d0 = (keys[k][1] - keys[k - 1][1]) / (keys[k][0] - keys[k - 1][0]);
    const d1 = (keys[k + 1][1] - keys[k][1]) / (keys[k + 1][0] - keys[k][0]);
    return d0 * d1 <= 0 ? 0 : 2 / (1 / d0 + 1 / d1);
  };
  const m0 = slope(i) * h, m1 = slope(i + 1) * h, t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * m0 + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * m1;
}

const IT_RIBBON = ['M 528 282 L 556 266 C 568 222, 594 200, 628 202', 'M 628 202 C 672 204, 696 226, 688 260', 'M 688 260 C 682 288, 668 304, 648 318',
  'M 648 318 C 622 338, 628 372, 664 372', 'M 664 372 C 684 372, 688 348, 704 348', 'M 704 348 C 722 348, 738 380, 756 380',
  'M 756 380 C 774 380, 794 352, 812 352', 'M 812 352 C 832 352, 858 384, 884 398', 'M 884 398 C 930 416, 976 442, 1018 472'];
const IT_EYE = [608, 262], IT_TBAR = [[956, 453.5], [996, 453.5]];
// 잇찌 좌표 → 까치 그림 좌표: 부리 끝(523,284)→(318.6,224.4), 꼬리 끝(1028,478)→(786.0,408.9)
const IA = [523, 284], IB = [1028, 478], MA = [318.6, 224.4], MB = [786.0, 408.9];
const I_S = Math.hypot(MB[0] - MA[0], MB[1] - MA[1]) / Math.hypot(IB[0] - IA[0], IB[1] - IA[1]);
const I_R = Math.atan2(MB[1] - MA[1], MB[0] - MA[0]) - Math.atan2(IB[1] - IA[1], IB[0] - IA[0]);
function i2m([x, y]) {
  const dx = (x - IA[0]) * I_S, dy = (y - IA[1]) * I_S;
  return [MA[0] + Math.cos(I_R) * dx - Math.sin(I_R) * dy, MA[1] + Math.sin(I_R) * dx + Math.cos(I_R) * dy];
}
function itchiSpace() { ctx.translate(MA[0], MA[1]); ctx.rotate(I_R); ctx.scale(I_S, I_S); ctx.translate(-IA[0], -IA[1]); }
const P = {}; for (const k in IT) P[k] = new Path2D(IT[k]);
function lin(x1, y1, x2, y2, stops) { const g = ctx.createLinearGradient(x1, y1, x2, y2); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
const GR = {

// 잇찌 리본을 길이로 고르게 나눈 점(까치 선과 같은 개수)과, 글자와 짝을 맞출 자리
// (부리, 정수리, 말림 아래, 물결1 꼭대기, 골, 물결2 꼭대기, 꼬리 끝)
const SVGNS = 'http://www.w3.org/2000/svg';
const holder = document.createElementNS(SVGNS, 'svg');
holder.setAttribute('width', 0); holder.setAttribute('height', 0); holder.style.position = 'absolute';
document.body.appendChild(holder);
const SEGS = IT_RIBBON.map(d => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); holder.appendChild(p); return p; });
const SEG_L = SEGS.map(p => p.getTotalLength()), RIB_L = SEG_L.reduce((a, b) => a + b, 0);
function ribbonPoint(u) {
  let d = u * RIB_L;
  for (let i = 0; i < SEGS.length; i++) {
    if (d <= SEG_L[i] || i === SEGS.length - 1) { const q = SEGS[i].getPointAtLength(Math.min(d, SEG_L[i])); return [q.x, q.y]; }
    d -= SEG_L[i];
  }
}
const cum = k => SEG_L.slice(0, k).reduce((a, b) => a + b, 0) / RIB_L;
const ANCH_ITCHI = [0, cum(1), cum(4), cum(5), cum(6), cum(7), 1];

/* ---------- 데이터 풀기 ---------- */
const NPT = D.bird.length / 2;
const BIRD = [], LET = [], BCOL = [], LCOL = [];
for (let i = 0; i < NPT; i++) {
  BIRD.push(i2m(ribbonPoint(i / (NPT - 1))));
  LET.push([D.letter[2 * i], D.letter[2 * i + 1]]);
  BCOL.push(D.birdCol.slice(3 * i, 3 * i + 3));
  LCOL.push(D.letterCol.slice(3 * i, 3 * i + 3));
}
function polyPath(flat) {
  const p = new Path2D(); p.moveTo(flat[0], flat[1]);
  for (let i = 2; i < flat.length; i += 2) p.lineTo(flat[i], flat[i + 1]);
  p.closePath(); return p;
}
const SHAPES = {};
for (const k in D.shapes) SHAPES[k] = { ...D.shapes[k], path: polyPath(D.shapes[k].poly) };

/* =====================================================================
   1) 비행: 눈 위치·크기·기울기 (원본 영상에서 잰 값, 2프레임 간격)
   ===================================================================== */
function birdXform(f) {
  if (f >= 82) return { x: EYE0[0], y: EYE0[1], s: 1, a: 0 };
  const T = D.track;
  return { x: sampleKeys(T.x, f, T.f0, T.step), y: sampleKeys(T.y, f, T.f0, T.step),
           s: sampleKeys(T.s, f, T.f0, T.step), a: sampleKeys(T.a, f, T.f0, T.step) };
}
function toScreen(xf, p) {
  const c = Math.cos(xf.a * DEG), s = Math.sin(xf.a * DEG);
  const dx = (p[0] - EYE0[0]) * xf.s, dy = (p[1] - EYE0[1]) * xf.s;
  return [xf.x + c * dx - s * dy, xf.y + s * dx + c * dy];
}
function birdSpace(xf) {
  ctx.translate(xf.x, xf.y); ctx.rotate(xf.a * DEG); ctx.scale(xf.s, xf.s);
  ctx.translate(-EYE0[0], -EYE0[1]);
}

/* =====================================================================
   2) 날개: 위(+58°) ↔ 아래(-54°)를 18.5프레임 주기로 오가며,
      가운데(-8°)에서는 옆면이 보이도록 폭이 0까지 줄었다가 뒤집힘
   ===================================================================== */
const FLAP = { period: 18.5, upAt: 18, up: 58.5, mid: -8, down: -57 };
const WING_FOLD = [[0, 1], [60, 1], [64, 0.8], [66, 0.65], [68, 0.5], [70, 0.38], [72, 0.28], [74, 0.2], [76, 0.1], [78, 0]];  // 내려앉으며 접힘
// 날개 모양 (u: 뿌리→끝, v: 날개 뒤쪽 방향) — 원본의 날개를 편 순간(0.6초)에서 따 온 윤곽
const pairs = flat => { const o = []; for (let i = 0; i < flat.length; i += 2) o.push([flat[i], flat[i + 1]]); return o; };
const NEAR_BLADE = pairs(D.wings.near), NEAR_PANEL = pairs(D.wings.panel);
const FAR_BLADE = pairs(D.wings.far), FAR_STRIPE = pairs(D.wings.fstripe);

function polyFill(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function wingPose(f) {
  const th = 2 * Math.PI * (f - FLAP.upAt) / FLAP.period;
  const k = Math.cos(th);                                     // +1 위, -1 아래, 0 옆면
  const phi = k > 0 ? lerp(FLAP.mid, FLAP.up, k) : lerp(FLAP.mid, FLAP.down, -k);
  return { k, phi, len: k > 0 ? 0.7 + 0.3 * k : 0.7 - 0.42 * k, g: table(WING_FOLD, f) };
}
function drawWing(root, phi, k, len, g, far) {
  if (g <= 0.01) return;
  const vk = Math.sign(k) * Math.max(0.05, Math.abs(k));     // 옆면일 때도 아주 얇게 보이도록
  ctx.save();
  ctx.translate(root[0], root[1]); ctx.rotate(-phi * DEG); ctx.scale(g * len, g * vk);
  if (far) {
    ctx.globalAlpha = 0.9;
    polyFill(FAR_BLADE, 'rgb(32,64,91)');
    polyFill(FAR_STRIPE, 'rgb(160,194,217)');
  } else {
    polyFill(NEAR_BLADE, 'rgb(30,63,90)');
    polyFill(NEAR_PANEL, 'rgb(213,236,247)');
    ctx.strokeStyle = 'rgba(120,145,170,0.8)'; ctx.lineWidth = 1.4 / Math.max(0.3, g); ctx.lineCap = 'round';
    for (const [p, q] of NEAR_LINES) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }
  }
  ctx.restore();
}

/* 속도선: 날아오는 동안 꼬리 뒤로 흐릿하게 */
function drawSpeedLines(f) {
  const a = 0.22 * ramp(f, 12, 20) * (1 - ramp(f, 58, 70));
  if (a <= 0) return;
  ctx.lineCap = 'round'; ctx.lineWidth = 1.6;
  for (const [p, q] of [[[790, 407], [960, 430]], [[775, 425], [910, 443]]]) {
    const g = ctx.createLinearGradient(p[0], p[1], q[0], q[1]);
    g.addColorStop(0, `rgba(150,190,225,${a})`); g.addColorStop(1, 'rgba(150,190,225,0)');
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
  }
}

/* =====================================================================
   3) 몸 색 빠지기 (꼬리 → 배 → 등·날개 → 머리 순)
   ===================================================================== */
const FADE = {
  tail:  [[84, 1], [88, 0.6], [92, 0]],
  belly: [[84, 1], [88, 0.85], [92, 0.7], [96, 0.47], [100, 0.33], [104, 0.08], [107, 0]],
  back:  [[92, 1], [96, 0.88], [100, 0.71], [104, 0.47], [108, 0.34], [112, 0.19], [116, 0]],

function fillShape(sh, alpha) {
  if (alpha <= 0.002) return;
  const g = ctx.createLinearGradient(sh.g[0], sh.g[1], sh.g[2], sh.g[3]);
  g.addColorStop(0, rgb(sh.c0)); g.addColorStop(1, rgb(sh.c1));
  ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.fill(sh.path); ctx.globalAlpha = 1;
}
function line(p, q, w, color) {
  ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke();
}

function drawBody(f, xf) {
  const aT = table(FADE.tail, f), aB = table(FADE.belly, f), aK = table(FADE.back, f), aH = table(FADE.head, f);
  if (aT + aB + aK + aH <= 0) return;
  const wp = wingPose(f);
  ctx.save(); birdSpace(xf);
  drawSpeedLines(f);
  drawWing([520, 214], wp.phi + 4, wp.k, wp.len, Math.pow(wp.g, 1.5), true);           // 뒤쪽 날개
  // ---- 잇찌 몸 (받은 파일의 까치 몸 대신) ----
  ctx.save(); itchiSpace();
  const fillP = (p, style, alpha) => { if (alpha <= 0.002) return; ctx.globalAlpha = alpha; ctx.fillStyle = style; ctx.fill(p); ctx.globalAlpha = 1; };
  const strokeP = (p, color, w, alpha) => { if (alpha <= 0.002) return; ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(p); ctx.globalAlpha = 1; };
  fillP(P.tail, GR.tail(), aT); strokeP(P.tailLine, 'rgba(16,39,62,0.65)', 2.5, aT);
  fillP(P.belly, GR.belly(), aB); fillP(P.bellyShade, 'rgba(181,224,250,0.36)', aB);
  fillP(P.backBridge, '#163452', aK); fillP(P.wing, GR.wing(), aK);
  strokeP(P.wingSeam, '#112A42', 3.5, aK); strokeP(P.wingLight, 'rgba(62,120,172,0.22)', 7.5, aK);
  fillP(P.head, GR.head(), aH); fillP(P.beak, '#1F3D5C', aH);
  // 다리: 날아오는 동안은 접어 두었다가 내려앉을 때 내린다. 몸 색이 빠질 때 배와 함께 사라진다
  const legIn = ramp(f, 66, 80), legs = legIn * aB;
  if (legs > 0.002) { ctx.save(); ctx.translate(0, (1 - easeOutCubic(legIn)) * -16); strokeP(P.legs, '#223F60', 11, legs); ctx.restore(); }
  ctx.restore();
  drawWing([545, 262], wp.phi, wp.k, wp.len, wp.g, false);                    // 앞쪽 날개
  ctx.restore();
}

/* =====================================================================

const ANCH_B = ANCH_ITCHI; // 잇찌 리본 기준(받은 파일 값: [0, 0.157, 0.445, 0.5515, 0.633, 0.711, 1.0])   // 까치 선 위치: 부리, 정수리, S목, 물결1, 골, 물결2, 꼬리끝
const ANCH_L = [0, 0.1442, 0.3628, 0.5601, 0.6646, 0.7739, 1.0];  // 짝이 되는 글자 위치: D 아래, D 위, D 왼쪽 끝, n 위, n 아래, i 위, t 위
const PROG = [
  [[118, 0], [120, 0.03], [124, 0.09], [128, 0.13], [132, 0.21], [136, 0.34], [140, 0.44], [144, 0.63], [148, 0.73], [152, 0.82], [156, 0.91], [160, 0.94], [164, 0.98], [168, 1]],
  [[115, 0], [120, 0.07], [124, 0.13], [128, 0.22], [132, 0.3], [136, 0.44], [140, 0.58], [144, 0.73], [148, 0.83], [152, 0.87], [156, 0.93], [160, 0.97], [168, 1]],

  [[96, 0], [100, 0.04], [104, 0.09], [108, 0.15], [112, 0.22], [116, 0.35], [120, 0.44], [124, 0.63], [128, 0.7], [132, 0.8], [136, 0.89], [140, 0.93], [146, 1]],
  [[98, 0], [100, 0.02], [104, 0.12], [108, 0.19], [112, 0.27], [116, 0.5], [120, 0.58], [124, 0.73], [128, 0.81], [132, 0.85], [136, 0.92], [140, 0.96], [148, 1]],
  [[98, 0], [100, 0.02], [104, 0.17], [108, 0.29], [112, 0.49], [116, 0.66], [120, 0.73], [124, 0.85], [128, 0.93], [136, 1]],
  [[88, 0], [92, 0.08], [96, 0.2], [100, 0.35], [104, 0.55], [108, 0.65], [112, 0.75], [116, 0.86], [120, 0.91], [124, 0.96], [128, 0.98], [136, 1]],
];
const DASH_REST = [i2m(IT_TBAR[0]), i2m(IT_TBAR[1]), 7.8 * I_S], DASH_END = [[721, 271.5], [790, 271.5], 13.7];
const DASH_PROG = [[86, 0], [88, 0.03], [92, 0.05], [96, 0.12], [100, 0.16], [104, 0.3], [108, 0.41], [112, 0.53], [116, 0.7], [120, 0.79], [124, 0.89], [128, 0.93], [132, 0.96], [140, 0.99], [150, 1]];

function letterAt(sig) {
  const u = sig * (NPT - 1), i = clamp(Math.floor(u), 0, NPT - 2), t = u - i;
  return { p: [lerp(LET[i][0], LET[i + 1][0], t), lerp(LET[i][1], LET[i + 1][1], t)],
           c: [0, 1, 2].map(k => lerp(LCOL[i][k], LCOL[i + 1][k], t)) };
}
function drawStroke(f, xf) {
  const prog = PROG.map(k => table(k, f));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let prev = null;
  for (let i = 0; i < NPT; i++) {
    const s = i / (NPT - 1);
    let k = 0; while (k < ANCH_B.length - 2 && s > ANCH_B[k + 1]) k++;
    const t = (s - ANCH_B[k]) / (ANCH_B[k + 1] - ANCH_B[k]);
    const lam = lerp(prog[k], prog[k + 1], t);
    const sig = lerp(ANCH_L[k], ANCH_L[k + 1], t);
    const b = toScreen(xf, BIRD[i]), L = letterAt(sig);
    const cur = { p: [lerp(b[0], L.p[0], lam), lerp(b[1], L.p[1], lam)],
                  w: lerp(BIRD_W * xf.s, LETTER_W, lam),
                  c: [0, 1, 2].map(j => lerp(BCOL[i][j], L.c[j], lam)) };
    if (prev) {
      ctx.beginPath(); ctx.moveTo(prev.p[0], prev.p[1]); ctx.lineTo(cur.p[0], cur.p[1]);
      ctx.lineWidth = (prev.w + cur.w) / 2; ctx.strokeStyle = rgb(prev.c); ctx.stroke();
    }
    prev = cur;
  }
  // t 가로획 (까치 꼬리의 짧은 흰 선)
  const d = table(DASH_PROG, f);
  const p0 = toScreen(xf, DASH_REST[0]), p1 = toScreen(xf, DASH_REST[1]);
  const a = [lerp(p0[0], DASH_END[0][0], d), lerp(p0[1], DASH_END[0][1], d)];
  const b = [lerp(p1[0], DASH_END[1][0], d), lerp(p1[1], DASH_END[1][1], d)];
  line(a, b, lerp(DASH_REST[2] * xf.s, DASH_END[2], d), 'rgb(250,253,255)');
}

/* =====================================================================
   5) 눈 → i의 점, 그리고 '통!'
   ===================================================================== */
const EYE_FLIGHT = [[117, 403.6, 205.8], [118, 404.3, 204.8], [119, 404.5, 204.6], [120, 404.6, 204.6], [121, 405.4, 202.7],

  [128, 420.2, 183.5], [129, 422.5, 180.3], [130, 425.7, 177.7], [134, 454.3, 149.1], [136, 468.3, 140.8], [137, 473.4, 137.8],

const EYE_X = EYE_FLIGHT.map(k => [k[0], k[1]]), EYE_Y = EYE_FLIGHT.map(k => [k[0], k[2]]);
const EYE_R = [[117, 10.2], [128, 11.0], [134, 11.8], [137, 12.5], [140, 13.1], [142, 13.7]];

// '통!' 타이밍 (프레임)
const F_START = 142, F_HIT = 154, F_LAUNCH = 159, F_LAND = 175;
const START = [520.4, 130.3], REST = [645.6, 220.1], DOT_R = 16.5;
const G = 0.75, HOP_V = 6.0, FALL_N = F_HIT - F_START;                // 중력, 튀는 세기(24px)
const VY0 = (REST[1] - START[1] - 0.5 * G * FALL_N * FALL_N) / FALL_N;
const SQUASH = { 154: 0.80, 155: 0.72, 156: 0.75, 157: 0.88, 158: 1.02,     // 통! 눌림
  159: 1.12, 160: 1.09, 161: 1.05, 162: 1.02, 163: 0.99,                     // 튀어 오르며 길쭉
  171: 1.00, 172: 1.02, 173: 1.04, 174: 1.06,                                // 떨어지며 길쭉
  175: 0.88, 176: 0.86, 177: 0.93, 178: 1.04, 179: 1.02, 180: 0.99, 181: 1.00 }; // 두 번째 착지
function squashAt(f) {                                                       // 프레임 사이도 부드럽게
  const a = Math.floor(f), b = a + 1, t = f - a;
  return lerp(SQUASH[a] ?? 1, SQUASH[b] ?? 1, t);
}
function dotMotion(f) {
  if (f < F_HIT) {                                                           // 포물선 낙하
    const k = f - F_START, u = k / FALL_N;
    const x = START[0] + (REST[0] - START[0]) * easeOutQuad(u);
    const y = START[1] + VY0 * k + 0.5 * G * k * k;
    const vx = 2 * (REST[0] - START[0]) * (1 - u) / FALL_N, vy = VY0 + G * k;
    const stretch = 1 + Math.min(0.16, 0.009 * Math.hypot(vx, vy)) * Math.min(1, (k + 1) / 4);
    const scale = 0.83 + 0.17 * easeOutQuad(Math.min(1, k / 8));          // 눈 크기 → 점 크기
    return { x, y, r: DOT_R * scale, theta: Math.atan2(vy, vx), st: stretch };
  }
  const sy = squashAt(f);
  let bottom = REST[1] + DOT_R;
  if (f >= F_LAUNCH && f < F_LAND) { const k = f - F_LAUNCH; bottom -= HOP_V * k - 0.5 * G * k * k; }
  return { x: REST[0], y: bottom - DOT_R * sy, r: DOT_R, theta: Math.PI / 2, st: sy };
}
function dot(x, y, r, theta, st, ring) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(theta); ctx.scale(st, 1 / Math.pow(st, 0.85));
  if (ring) { ctx.fillStyle = 'rgba(5,12,24,0.9)'; ctx.beginPath(); ctx.arc(0, 0, r + 1.2, 0, 7); ctx.fill(); }
  ctx.fillStyle = rgb(BLUE); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r * lerp(0.42, 0.455, ramp(r, 10.2, 16.5)), 0, 7); ctx.fill();
  ctx.restore();
}
function drawEye(f, xf) {
  const IE = i2m(IT_EYE), off = [IE[0] - 403.6, IE[1] - 205.8];
  if (f < 117) { const p = toScreen(xf, IE); dot(p[0], p[1], 11 * I_S * xf.s, 0, 1, true); return; }
  if (f < F_START) {
    const fade = 1 - ramp(f, 124, 134);                                       // 머리 위에서 떠날 때 테두리 사라짐
    const k = 1 - ramp(f, 117, 127);                                          // 잇찌 눈 자리에서 받은 파일의 길로 합류
    dot(table(EYE_X, f) + off[0] * k, table(EYE_Y, f) + off[1] * k, table(EYE_R, f), 0, 1, fade > 0.5);
    return;
  }
  const m = dotMotion(f);
  dot(m.x, m.y, m.r, m.theta, m.st, false);
}
function drawImpact(f) {                                                     // 파동 링 + 튀는 선 4개
  const t = f - F_HIT;
  if (t < 0 || t >= 16) return;
  const [cx, cy] = REST;
  { const u = t / 16, r = DOT_R + 9 + 24 * easeOutCubic(u);
    ctx.lineWidth = 2.6 * (1 - u) + 0.8; ctx.strokeStyle = `rgba(120,215,250,${0.5 * Math.pow(1 - u, 1.5)})`;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke(); }
  if (t < 10) {
    const u = t / 10, e = easeOutCubic(u), r1 = DOT_R + 9 + 12 * e, r2 = r1 + 9 * (1 - u) + 1.5;
    ctx.lineCap = 'round'; ctx.lineWidth = 2.8 * (1 - u) + 0.8; ctx.strokeStyle = `rgba(190,236,255,${1 - u * u})`;
    for (const deg of [152, 120, 60, 28]) {
      const dx = Math.cos(deg * DEG), dy = -Math.sin(deg * DEG);
      ctx.beginPath(); ctx.moveTo(cx + dx * r1, cy + dy * r1); ctx.lineTo(cx + dx * r2, cy + dy * r2); ctx.stroke();
    }
  }
}

/* =====================================================================
   한 프레임 그리기
   ===================================================================== */
function renderAt(f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgb(PAGE_BG); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = rgb(CARD_BG);
  ctx.beginPath(); ctx.roundRect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); ctx.clip();
  const xf = birdXform(f);
  drawBody(f, xf);
  drawImpact(f);
  drawEye(f, xf);
  drawStroke(f, xf);
  ctx.restore();
}

/* =====================================================================
   소리 (Web Audio로 직접 합성)
     0.10~1.15s  날갯짓 바람 소리 (2kHz 근처 잡음)
     2.57s       '통' (첫 착지)
     2.94s       '딩' (E6 + B6 종소리, 두 번째 착지)
   ===================================================================== */
function buildSound(ac, out, t0) {
  const sr = ac.sampleRate;
  // 바람 소리
  const len = Math.floor(1.3 * sr), buf = ac.createBuffer(1, len, sr), ch = buf.getChannelData(0);
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1;
  for (let i = 0; i < len; i++) ch[i] = rnd();
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = 0.75;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3300;
  const lp2 = ac.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 3800;
  const g = ac.createGain(); g.gain.value = 0;
  const N = 60, curve = new Float32Array(N);
  for (let i = 0; i < N; i++) { const t = 1.25 * i / (N - 1); curve[i] = 0.151 * Math.exp(-0.5 * Math.pow((t - 0.6) / (t < 0.6 ? 0.19 : 0.21), 2)); }
  g.gain.setValueCurveAtTime(curve, t0, 1.25);
  src.connect(bp).connect(lp).connect(lp2).connect(g).connect(out); src.start(t0);
  // 통
  const tong = t0 + F_HIT / FPS;
  const o1 = ac.createOscillator(), g1 = ac.createGain();
  o1.frequency.setValueAtTime(784, tong); o1.frequency.exponentialRampToValueAtTime(659.3, tong + 0.05);
  g1.gain.setValueAtTime(0, tong); g1.gain.linearRampToValueAtTime(0.022, tong + 0.003);
  g1.gain.setTargetAtTime(0, tong + 0.003, 0.075);
  o1.connect(g1).connect(out); o1.start(tong); o1.stop(tong + 0.6);
  // 딩
  const ding = t0 + 2.941;
  for (const [fr, amp] of [[1320, 0.0195], [1980, 0.0089]]) {
    const o = ac.createOscillator(), gg = ac.createGain(); o.frequency.value = fr;
    gg.gain.setValueAtTime(0, ding); gg.gain.linearRampToValueAtTime(amp, ding + 0.026);
    gg.gain.setTargetAtTime(0, ding + 0.026, 0.155);
    o.connect(gg).connect(out); o.start(ding); o.stop(ding + 1.8);
  }
}
let liveAudio = null;
function playSound() {
  try {
    liveAudio = liveAudio || new (window.AudioContext || window.webkitAudioContext)();
    if (liveAudio.state === 'suspended') liveAudio.resume();
    buildSound(liveAudio, liveAudio.destination, liveAudio.currentTime + 0.03);
  } catch (e) { /* 소리 없이 재생 */ }
}
// 영상 내보내기용: 같은 소리를 WAV로 렌더링
window.renderAudio = async () => {
  const ac = new OfflineAudioContext(2, 48000 * TOTAL / FPS, 48000);
  buildSound(ac, ac.destination, 0);
  const b = await ac.startRendering();
  const L = b.getChannelData(0), R = b.getChannelData(1), n = L.length;
  const pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { pcm[2 * i] = clamp(L[i], -1, 1) * 32767; pcm[2 * i + 1] = clamp(R[i], -1, 1) * 32767; }
  const bytes = new Uint8Array(pcm.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

/* ---------- 재생 ---------- */
window.renderFrame = n => { renderAt(n); return cv.toDataURL('image/png'); };
window.__ready = true;
if (/export=1/.test(location.search)) {
  document.body.classList.add('export');
} else {
  let t0 = performance.now();
  const loop = now => { renderAt(Math.min(TOTAL - 1, (now - t0) / 1000 * FPS)); requestAnimationFrame(loop); };
  cv.addEventListener('click', () => { t0 = performance.now(); playSound(); });
  requestAnimationFrame(loop);
}
</script>
