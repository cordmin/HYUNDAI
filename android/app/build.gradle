plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// The NEIS key stays out of the repository: set NEIS_API_KEY or put it in the root .env file.
def neisApiKey = System.getenv('NEIS_API_KEY') ?: ''
def envFile = rootProject.file('../.env')
if (!neisApiKey && envFile.exists()) {
    def line = envFile.readLines('UTF-8').find { it.startsWith('NEIS_API_KEY=') }
    if (line) neisApiKey = line.substring('NEIS_API_KEY='.length()).trim()
}
android {
    namespace 'io.dait.app'
    compileSdk 34
    useLibrary 'android.car'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.dait.app'
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '0.2-dialogue'
        testInstrumentationRunner 'io.dait.app.OfflineVoiceCheck'
        buildConfigField 'String', 'NEIS_API_KEY', "\"${neisApiKey}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += 'wav' }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
    testImplementation 'junit:junit:4.13.2'
}
