<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAIT</title>
  <style>
    :root {
      --surface: #F3F6F9;
      --paper: #FFFFFF;
      --accent: #004DA0;
      --accent-hover: #003673;
      --accent-soft: #E5EFFB;
      --ink: #0E1B2A;
      --muted: #5B6D82;
      --outline: #D5DFEA;
      --control: #E8EEF5;
      --control-hover: #DCE5F0;
      /* 큰 카드 색. 여정에 따라 바뀐다 */
      --hero-a: #061B3D;
      --hero-b: #0B3B7A;
      --hero-glow: #22B8E8;
      --hero-ink: #0B2A5B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #D5DBE3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Pleos Display */
    .pleos-display {
      width: 100%;
      max-width: 1060px;
      height: 600px;
      background:
        radial-gradient(80% 60% at 100% 100%, #E7EEF8 0%, transparent 60%),
        var(--surface);
      border-radius: 28px;
      border: 2px solid #C4CDD7;
      box-shadow: 0 24px 50px rgba(11, 26, 44, 0.16);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* In-App Fullscreen Integration for Hyundai Pleos */
    body.in-app {
      background: var(--surface);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    body.in-app .pleos-display {
      max-width: 100%;
      height: 100vh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    body.in-app .stage-container {
      padding: 30px 40px;
    }

    .restricted-message {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.6px;
    }

    /* Driving Simple Screen: 문장 하나와 큰 버튼 둘 */
    .drive-screen {
      position: absolute;
      inset: 0;
      background: var(--surface);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 48px;
      text-align: center;
    }
    body.driving .drive-screen { display: flex; }
    .drive-sentence {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--ink);
      letter-spacing: -0.6px;
      max-width: 900px;
    }
    .drive-sub {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .drive-actions {
      display: flex;
      gap: 20px;
    }
    .drive-btn {
      min-width: 220px;
      height: 76px;
      padding: 0 32px;
      border-radius: 24px;
      border: 1px solid var(--outline);
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }
    .drive-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .drive-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Demo Panel (시연용) */
    .demo-panel {
      position: absolute;
      right: 36px;
      bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 500;
    }
    body.in-app .demo-panel { right: 40px; }
    body.driving .demo-panel { z-index: 10000; }
    body.real-driving .demo-panel { display: none; } /* 실제 주행 중에는 문장 하나와 큰 버튼 둘만 */
    .demo-panel button {
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--control);
      border: 1px solid var(--outline);
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-panel button:hover { background: var(--control-hover); }
    .demo-panel button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .demo-panel button:disabled { cursor: default; opacity: 0.9; }


    /* Main Stage */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px 36px;
      position: relative;
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ========================================================
       첫 화면: 여정 하나를 크게, 보조 정보는 얇게
       왼쪽 큰 카드 = 지금 여정(어디로 · 몇 분 · 할 말 한 문장)
       오른쪽 = 오늘 챙길 것 두 줄 + 다른 여정으로 가는 작은 길
       ======================================================== */
    .bento-stage {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    /* 큰 카드 */
    .bento-hero {
      background:
        radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--hero-glow) 55%, transparent) 0%, transparent 55%),
        linear-gradient(160deg, var(--hero-b) 0%, var(--hero-a) 100%);
      border-radius: 28px;
      padding: 26px 30px 28px;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      min-height: 0;
      box-shadow: 0 24px 48px -18px color-mix(in srgb, var(--hero-a) 70%, transparent);
      transition: transform 0.18s ease;
    }
    .bento-hero.afternoon { --hero-a: #3B1033; --hero-b: #8A2E4F; --hero-glow: #FFA14A; --hero-ink: #5B1F3D; }
    .bento-hero.weekend { --hero-a: #1C1F3A; --hero-b: #3C3F6E; --hero-glow: #9A8CFF; --hero-ink: #2A2D55; }
    .bento-hero:hover { transform: translateY(-2px); }
    /* 가는 격자: 차량 계기판의 결 */
    .bento-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 1.2px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 70%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 70%);
      pointer-events: none;
    }
    .hero-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .dait-brand-badge {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
    }
    .school-setting-btn {
      min-height: 48px;
      padding: 8px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.22);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .school-setting-btn:hover { background: rgba(255,255,255,0.18); }
    .hero-top-actions { display: flex; gap: 8px; }

    /* 여정 그림: 출발점에서 목적지까지 한 획. 차 위치 점이 남은 시간만큼 가 있다 */
    .hero-figure {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .hero-route {
      width: 100%;
      height: auto;
      max-height: 100%;
      overflow: visible;
    }
    .hero-route .route-path { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .hero-route .route-done { stroke: #FFFFFF; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .hero-route .route-dot { fill: #FFFFFF; }
    .hero-route .route-dot-halo { fill: var(--hero-glow); opacity: 0.35; }
    .hero-route .route-end { fill: none; stroke: #FFFFFF; stroke-width: 2.5; }
    .hero-route .route-end-fill { fill: var(--hero-glow); }
    .hero-route text { font-family: inherit; font-weight: 800; fill: #FFFFFF; }
    .hero-route .route-figure { font-size: 34px; letter-spacing: -1.5px; }
    .hero-route .route-unit { font-size: 15px; font-weight: 700; fill: rgba(255,255,255,0.75); letter-spacing: 0; }
    .hero-route .route-label { font-size: 13px; font-weight: 700; fill: rgba(255,255,255,0.6); letter-spacing: 0.3px; }

    /* 여정 줄: 어디로 · 몇 분 */
    .hero-trip {
      margin-top: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.2px;
      min-height: 24px;
    }
    .hero-trip strong {
      color: #FFFFFF;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .hero-trip .trip-sep { opacity: 0.45; }

    /* 한 문장 */
    .hero-title {
      margin-top: 8px;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.14;
      letter-spacing: -1.4px;
      text-wrap: balance;
      position: relative;
      z-index: 1;
    }
    .hero-desc {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.4;
      color: rgba(255,255,255,0.78);
      position: relative;
      z-index: 1;
    }
    .hero-trip { position: relative; z-index: 1; }

    /* 시작 버튼 */
    .hero-cta {
      margin-top: 22px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      color: var(--hero-ink);
      padding: 0 10px 0 24px;
      height: 68px;
      border-radius: 20px;
      font-size: 21px;
      font-weight: 800;
      transition: transform 0.15s ease;
    }
    .hero-cta:hover { transform: translateX(2px); }
    .hero-cta-plane {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--hero-ink);
      color: #FFFFFF;
    }
    .cta-left { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .cta-arm {
      margin-left: auto;
      margin-right: 10px;
      height: 40px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cta-arm.on { background: rgba(255, 255, 255, 0.22); }
    .heard-bubble[hidden] { display: none; }

    /* 오른쪽 열 */
    .bento-right-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .info-dual-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .info-mini-tile {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px -14px rgba(11, 26, 44, 0.25);
      border-radius: 20px;
      padding: 18px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 118px;
      min-width: 0;
    }
    .tile-tint-prep { border-top: 4px solid var(--accent); }
    .tile-tint-meal { border-top: 4px solid #C2410C; }
    .mini-tile-label { display: flex; align-items: center; }
    .mini-text-bold {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .text-prep { color: var(--accent); }
    .text-meal { color: #C2410C; }
    .mini-tile-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .mini-tile-focus {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .mini-tile-sub {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
    }

    /* 오른쪽 큰 카드: 다른 여정으로 가는 길 */
    .bento-wide-card {
      flex: 1;
      min-height: 0;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px -14px rgba(11, 26, 44, 0.25);
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .bento-wide-card:hover { border-color: var(--accent); }
    .bento-wide-card.info {
      cursor: default;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    .bento-wide-card.info:hover { border-color: rgba(255,255,255,0.9); border-left-color: var(--accent); }
    .bento-wide-card.info .wide-card-title { font-size: 28px; line-height: 1.25; text-wrap: balance; }
    .wide-card-text { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; min-width: 0; }
    .wide-card-kicker {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .wide-card-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .wide-card-desc {
      font-size: 17px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.35;
    }
    .wide-card-arrow {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .subject-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .subject-chip {
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }
    .subject-chip.pe { background: #E0F2FE; color: #0369A1; }
    .subject-chip.art { background: #FDF2E9; color: #B45309; }
    .subject-chip.sci { background: #ECFDF5; color: #047857; }

    /* Dialogue Screen */
    .dialogue-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .dialogue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .back-btn {
      min-height: 48px;
      padding: 8px 22px;
      border-radius: 16px;
      background: var(--control);
      border: 1px solid var(--outline);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--control-hover); }

    .dialogue-card {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 32px;
      padding: 40px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 20px rgba(28, 46, 42, 0.05);
    }
    .card-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Dialogue Ambient Orb */
    .dialogue-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00B4D8 0%, #0077B6 50%, #04244B 100%);
      box-shadow: 0 0 35px rgba(0, 180, 216, 0.45), inset 0 0 14px rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Voice Visualizer Wave */
    .voice-visualizer {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 32px;
      margin-bottom: 24px;
    }
    .v-bar {
      width: 4px;
      height: 12px;
      background: var(--accent);
      border-radius: 4px;
      transform: scaleY(0.8);
      opacity: 0.9;
    }
    .v-bar:nth-child(2) { animation-delay: 0.15s; height: 26px; }
    .v-bar:nth-child(3) { animation-delay: 0.3s; height: 32px; }
    .v-bar:nth-child(4) { animation-delay: 0.45s; height: 20px; }
    .v-bar:nth-child(5) { animation-delay: 0.6s; height: 14px; }

    .main-question {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
      max-width: 780px;
    }
    .heard-bubble {
      margin-top: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 16px;
      display: inline-block;
    }

    /* Choice Chips */
    .options-row {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-top: 20px;
      justify-content: center;
    }
    .choice-chip {
      flex: 1;
      max-width: 240px;
      height: 60px;
      background: var(--control);
      border: 1px solid var(--outline);
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-chip:hover,
    .choice-chip[aria-pressed="true"] {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Primary Bottom Action */
    .bottom-bar {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }
    .primary-btn.secondary {
      width: 200px;
      background: var(--control);
      color: var(--ink);
      box-shadow: none;
    }
    .primary-btn.secondary:hover { background: var(--control-hover); }
    .primary-btn {
      width: 280px;
      height: 60px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 20px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 77, 160, 0.28);
    }
    .primary-btn:hover { background: var(--accent-hover); }

    /* ========================================================
       시그니처 인트로 스플래시 애니메이션 (Signature Splash Intro)
       ======================================================== */
    .splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background: linear-gradient(145deg, #07172C 0%, #0E294E 50%, #153C70 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      box-shadow: 0 14px 34px rgba(7, 23, 44, 0.32);
      transition: 
        top 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        left 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.22s ease,
        visibility 0.22s ease;
      cursor: pointer;
    }
    .splash-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* Ambient Pulsing Aura behind the logo */
    .splash-aura {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 180, 216, 0.28) 0%, rgba(0, 77, 160, 0.14) 42%, transparent 70%);
      filter: blur(36px);
      transform: scale(0.9);
      pointer-events: none;
    }

    .splash-bg-decor {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.06) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* Brand Container that will FLIP/glide to the top-left */
    .splash-brand-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transform-origin: center center;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    .splash-logo-svg {
      width: 380px;
      height: 130px;
      overflow: visible;
      filter: drop-shadow(0 12px 32px rgba(0, 180, 216, 0.42));
    }

    .splash-ribbon-path {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Dot Pop Animation & Shockwave Ripple */
    .splash-dot-group {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-group.pop {
      animation: dotPopIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dotPopIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.65); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-dot-ripple {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-ripple.expand {
      animation: rippleExpand 0.75s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { r: 3px; stroke-width: 3.5px; opacity: 1; }
      100% { r: 24px; stroke-width: 0.4px; opacity: 0; }
    }

    /* School Settings */
    .settings-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .school-search-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin-top: 14px;
    }
    .school-input {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      user-select: text;
    }
    .place-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-height: 0;
      margin-top: 14px;
      overflow-y: auto;
    }
    .place-row {
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(127,127,127,0.10);
      text-align: left;
    }
    .place-name { font-size: 18px; font-weight: 700; }
    .place-address { margin-top: 2px; font-size: 16px; color: var(--muted); }
    .place-source { margin-top: 10px; font-size: 16px; color: var(--muted); }
    .settings-message {
      margin-top: 12px;
      font-size: 17px;
      font-weight: 600;
      color: var(--muted);
    }
    .settings-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      min-height: 0;
      margin-top: 14px;
      overflow-y: auto;
    }
    .settings-list .choice-chip {
      flex: 0 1 auto;
      min-width: 72px;
      max-width: none;
      padding: 0 18px;
    }
    .school-search-row .choice-chip {
      flex: 0 0 96px;
      height: 52px;
    }

    /* 작은 앱 창(Pleos 분할 화면 등): 잘리는 곳 없이 한 화면에 들어오도록 줄인다 */
    @media (max-height: 540px), (max-width: 860px) {
      .stage-container,
      body.in-app .stage-container {
        min-height: 0;
        padding: 14px 20px 30px;
      }
      .demo-panel,
      body.in-app .demo-panel { right: 20px; }
      .drive-screen { gap: 18px; padding: 24px 28px 36px; }
      .drive-sentence { font-size: 28px; }
      .drive-btn { height: 60px; min-width: 170px; font-size: 20px; }
      .back-btn, .school-setting-btn { min-height: 44px; }
      .school-setting-btn { padding: 6px 14px; font-size: 16px; }

      .bento-stage { gap: 12px; }
      .bento-hero { padding: 18px 22px 20px; border-radius: 22px; }
      .hero-title { font-size: 27px; letter-spacing: -0.8px; }
      .hero-desc { font-size: 15px; }
      .hero-route .route-figure { font-size: 26px; }
      .hero-route .route-label { font-size: 12px; }
      .subject-chip { font-size: 14px; padding: 4px 10px; }
      .hero-trip { font-size: 15px; }
      .hero-title { margin-top: 6px; }
      .hero-desc { margin-top: 6px; }
      .hero-cta { height: 54px; margin-top: 16px; font-size: 18px; padding: 0 6px 0 18px; }
      .hero-cta-plane { width: 40px; height: 40px; }
      .cta-left { gap: 8px; }

      .bento-right-col { gap: 10px; }
      .info-dual-row { gap: 10px; }
      .info-mini-tile { padding: 12px 14px 12px; min-height: 92px; gap: 4px; }
      .mini-text-bold { font-size: 13px; }
      .mini-tile-focus { font-size: 20px; }
      .mini-tile-sub { font-size: 15px; }
      .bento-wide-card { padding: 14px 16px; }
      .wide-card-title { font-size: 22px; }
      .wide-card-desc { font-size: 15px; }
      .wide-card-arrow { width: 38px; height: 38px; }

      .dialogue-top { margin-bottom: 8px; }
      .back-btn { padding: 6px 16px; }
      .dialogue-card { padding: 12px 20px; border-radius: 24px; }
      .dialogue-orb { width: 52px; height: 52px; margin-bottom: 8px; }
      .main-question { font-size: 26px; }
      .heard-bubble { margin-top: 6px; padding: 4px 14px; }
      .options-row { margin-top: 10px; }
      .choice-chip { height: 48px; font-size: 17px; }
      .bottom-bar { margin-top: 8px; }
      .primary-btn { height: 48px; font-size: 17px; }
    }

    /* ========================================================
       진로·진학 안내: 쉬운 기사 요약 + 관련 체험 여행 루트
       ======================================================== */
    .career-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .career-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .career-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .data-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: var(--control);
      border: 1px solid var(--outline);
      padding: 5px 12px;
      border-radius: 999px;
    }
    .cat-tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 999px;
      color: var(--cat);
      background: var(--cat-soft);
    }

    /* 기사 목록 */
    .news-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      min-height: 0;
    }
    .news-card {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 22px;
      padding: 20px 22px;
      display: flex;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }
    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(14, 27, 42, 0.08);
    }
    .news-card-icon {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 18px;
      background: var(--cat-soft);
      color: var(--cat);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .news-card-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .news-card-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.3px;
    }
    .news-card-lead {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .news-card-foot {
      margin-top: auto;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    /* 기사 상세 */
    .news-detail {
      flex: 1;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
      min-height: 0;
    }
    .news-media {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 24px;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .media-tabs {
      display: flex;
      gap: 6px;
      background: var(--control);
      padding: 4px;
      border-radius: 14px;
      align-self: flex-start;
      margin-bottom: 14px;
    }
    .media-tab {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .media-tab.active {
      background: var(--paper);
      color: var(--accent);
      box-shadow: 0 2px 6px rgba(14, 27, 42, 0.08);
    }
    .media-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .news-headline {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.4px;
      margin: 10px 0 14px;
    }
    .easy-points {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .easy-points li {
      font-size: 17px;
      line-height: 1.55;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--surface);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .easy-points li.speaking {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    .listen-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .listen-head .dialogue-orb {
      width: 56px;
      height: 56px;
      margin: 0;
    }
    .listen-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
    }
    .media-replay {
      margin-top: auto;
      align-self: flex-start;
    }

    /* 짧은 영상: 장면 + 자막 + 내레이션 */
    .video-stage {
      flex: 1;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(145deg, #07172C 0%, #0E294E 55%, var(--cat) 140%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-progress {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
    }
    .video-progress span {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }
    .video-progress span i {
      display: block;
      height: 100%;
      width: 0;
      background: #FFFFFF;
    }
    .video-progress span.done i { width: 100%; }
    .video-progress span.now i { animation: sceneFill var(--scene-ms) linear forwards; }
    @keyframes sceneFill { to { width: 100%; } }
    .video-art {
      color: #FFFFFF;
      opacity: 0.95;
      margin-bottom: 70px;
      animation: sceneArt 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .video-art svg { width: 120px; height: 120px; }
    @keyframes sceneArt {
      from { transform: scale(0.82) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 0.95; }
    }
    .video-caption {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      background: rgba(4, 14, 28, 0.6);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      animation: sceneArt 0.5s ease;
    }
    .video-end {
      text-align: center;
    }
    .video-end .back-btn { margin-top: 14px; }

    .news-side {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .side-block {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 20px;
      padding: 16px 18px;
    }
    .side-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .side-question {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }
    .job-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .job-chip {
      font-size: 14px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .side-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .wide-btn {
      height: 54px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--outline);
      background: var(--control);
      color: var(--ink);
    }
    .wide-btn:hover { background: var(--control-hover); }
    .wide-btn.primary {
      border: none;
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(0, 77, 160, 0.28);
    }
    .wide-btn.primary:hover { background: var(--accent-hover); }

    /* 여행 루트 */
    .route-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
      min-height: 0;
    }
    .route-list {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 24px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    .route-leg {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0 4px 15px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .route-leg::before {
      content: '';
      width: 2px;
      height: 24px;
      background: repeating-linear-gradient(to bottom, var(--outline) 0 4px, transparent 4px 8px);
      margin-right: 16px;
    }
    .route-start {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .route-start .stop-num { background: var(--control); color: var(--muted); }
    .route-stop {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .stop-num {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-body { flex: 1; min-width: 0; }
    .stop-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stop-name {
      font-size: 18px;
      font-weight: 800;
    }
    .stop-type {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .stop-type.t-exp { background: #E5EFFB; color: #004DA0; }
    .stop-type.t-museum { background: #F3E8FF; color: #6D28D9; }
    .stop-type.t-heritage { background: #FEF3C7; color: #92400E; }
    .stop-type.t-trip { background: #DCFCE7; color: #166534; }
    .stop-meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }
    .stop-desc {
      font-size: 14px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .route-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .route-stat {
      text-align: center;
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 4px;
    }
    .route-stat b {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }
    .route-stat span {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .route-why {
      font-size: 15px;
      line-height: 1.5;
    }
    .source-note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }


    .route-wait {
      padding: 28px 4px;
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
    }
    .route-notice {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      color: #92400E;
      background: #FEF3C7;
      border-radius: 14px;
      padding: 10px 14px;
    }

    /* 시간표 칸이 줄지 않도록 진로 체험 칸은 내용 높이만 쓴다. */
    .bento-wide-card.career {
      flex: 0 0 auto;
      padding: 14px 20px;
      align-items: center;
      border-left: 4px solid #9A8CFF;
    }
    .bento-wide-card.career .wide-card-title { font-size: 21px; }
    .bento-wide-card.career .wide-card-desc { font-size: 15px; }
    .career-toast {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #0E1F36;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 600;
      max-width: 80%;
      text-align: center;
    }

    @media (max-height: 540px), (max-width: 860px) {
      .career-head { margin-bottom: 8px; }
      .career-title { font-size: 21px; }
      .news-grid, .news-detail, .route-layout { gap: 10px; }
      .news-card { padding: 14px 16px; gap: 12px; }
      .news-card-icon { width: 48px; height: 48px; border-radius: 14px; }
      .news-card-title { font-size: 17px; }
      .news-card-lead { font-size: 13px; }
      .news-media, .route-list { padding: 12px 16px; }
      .news-headline { font-size: 20px; margin: 6px 0 10px; }
      .easy-points li { font-size: 15px; padding: 8px 12px; }
      .video-art svg { width: 84px; height: 84px; }
      .video-caption { font-size: 15px; padding: 8px 12px; }
      .side-block { padding: 12px 14px; }
      .side-question { font-size: 15px; }
      .wide-btn { height: 46px; font-size: 15px; }
    }

  </style>
</head>
<body>

  <!-- Pleos Display (Pure App Window) -->
  <div class="pleos-display">

    <!-- Signature Splash Intro Overlay -->
    <div id="splashOverlay" class="splash-overlay" onclick="skipSplashIntro()">
      <div class="splash-bg-decor"></div>
      <div class="splash-aura"></div>
      
      <div id="splashBrandContainer" class="splash-brand-container">
        <svg id="splashLogoSvg" class="splash-logo-svg" viewBox="0 0 100 34" fill="none">
          <defs>
            <linearGradient id="splashFlowGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#38BDF8"/>
            </linearGradient>
            <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Main cursive ribbon D-a-i-t -->
          <path id="splashRibbonPath"
                class="splash-ribbon-path"
                d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10" 
                stroke="url(#splashFlowGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- t crossbar -->
          <path id="splashCrossbarPath"
                class="splash-ribbon-path"
                d="M74 16 h12"
                stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>

          <!-- i Dot Accent (with shockwave ring) -->
          <g id="splashDotGroup" class="splash-dot-group">
            <circle id="splashDotRipple" class="splash-dot-ripple" cx="62" cy="7.5" r="3" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <circle id="splashDot" cx="62" cy="7.5" r="3.2" fill="#38BDF8" filter="url(#neonGlow)"/>
            <circle cx="62" cy="7.5" r="1.5" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Main Stage -->
    <div id="stageArea" class="stage-container">
      <!-- Injected by JS -->
    </div>

    <!-- Driving Simple Screen: 주행 중에는 문장 하나와 큰 버튼 둘만 -->
    <div id="driveScreen" class="drive-screen">
      <div id="driveSentence" class="drive-sentence">주차 후 이어갈게요</div>
      <div id="driveSub" class="drive-sub"></div>
      <div class="drive-actions">
        <button id="driveReplay" class="drive-btn" onclick="driveReplay()">다시 듣기</button>
        <button id="driveNext" class="drive-btn primary" onclick="driveNext()">넘기기</button>
      </div>
    </div>

    <!-- Demo Panel: 시연용 주행 상태와 남은 시간 -->
    <div class="demo-panel">
      <button id="demoDrive" onclick="toggleDrivingDemo()">주행</button>
