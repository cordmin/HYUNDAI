<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAIT</title>
  <link rel="stylesheet" href="dait-base.css?v=polish-20261111-r9">
  <link rel="stylesheet" href="dait-pearl.css?v=polish-20261111-r9">
</head>
<body>

  <!-- Pleos Display (Pure App Window) -->
  <div class="pleos-display">

    <!-- Signature Splash Intro Overlay -->
    <div id="splashOverlay" class="splash-overlay" onclick="skipSplashIntro()">
      <div class="splash-aura"></div>
      
      <div id="splashBrandContainer" class="splash-brand-container">
        <svg id="splashLogoSvg" class="splash-logo-svg" viewBox="0 0 100 34" fill="none">
          <defs>
            <linearGradient id="splashFlowGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="var(--logo-start)"/>
              <stop offset="50%" stop-color="var(--logo-mid)"/>
              <stop offset="100%" stop-color="var(--logo-end)"/>
            </linearGradient>
          </defs>

          <!-- Main cursive ribbon D-a-i-t -->
          <path id="splashRibbonPath"
                class="splash-ribbon-path"
                d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10" 
                stroke="url(#splashFlowGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- t crossbar -->
          <path id="splashCrossbarPath"
                class="splash-ribbon-path"
                d="M74 16 h12"
                stroke="var(--logo-mid)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

          <!-- i Dot Accent (with shockwave ring) -->
          <circle id="splashDotRipple" class="splash-dot-ripple" cx="62" cy="7.5" r="3" fill="none" stroke="var(--logo-start)" stroke-width="2"/>
          <g id="splashDotGroup" class="splash-dot-group">
            <circle id="splashDot" cx="62" cy="7.5" r="3.2" fill="var(--logo-start)"/>
          </g>
        </svg>
      </div>
    </div>

    <header id="pearlNav" class="pearl-nav" aria-label="앱 메뉴"></header>

    <!-- Main Stage -->
    <div id="stageArea" class="stage-container">
      <!-- Injected by JS -->
    </div>
    <aside id="lessonDock" class="lesson-dock" aria-label="현재 듣는 수업" hidden></aside>

    <!-- Driving Simple Screen: 주행 중에는 문장 하나와 큰 버튼 둘만 -->
    <div id="driveScreen" class="drive-screen">
      <div id="driveSentence" class="drive-sentence">주차 후 이어갈게요</div>
      <div id="driveSub" class="drive-sub"></div>
      <div class="drive-actions">
        <button id="driveReplay" class="drive-btn" onclick="driveReplay()">다시 듣기</button>
        <button id="driveNext" class="drive-btn primary" onclick="driveNext()">넘기기</button>
      </div>
    </div>

  </div>

  <audio id="audioPlayer" preload="metadata"></audio>
  <audio id="bedPlayer" src="sounds/thinking-bed.wav" preload="none" loop></audio>

  <script src="dait-lesson.js?v=soft-controls-20261110"></script>
  <script src="dait-lessons.js?v=tts-complete-20261110"></script>
  <script src="dait-playback.js?v=horizon-layout-20261110"></script>
  <script src="dait-sound-levels.js?v=tts-complete-20261110"></script>
  <script src="dait-series.js?v=horizon-layout-20261110"></script>
  <script src="dait-playlist.js?v=horizon-layout-20261110"></script>
  <script src="dait-badges.js?v=polish-20261111-r9"></script>
  <script src="dait-app-core.js?v=horizon-layout-20261110"></script>
  <script src="dait-app-audio.js?v=horizon-layout-20261110"></script>
  <script src="dait-app-home.js?v=polish-20261111-r9"></script>
  <script src="dait-app-lesson.js?v=polish-20261111-r9"></script>
  <script src="dait-app-player.js?v=polish-20261111-r9"></script>
  <script src="dait-app-car.js?v=polish-20261111-r9"></script>
  <script src="dait-app-playlist.js?v=horizon-layout-20261110"></script>
  <script src="dait-app-start.js?v=horizon-layout-20261110"></script>
  <script src="dait-palette.js?v=polish-20261111-r9"></script>
  <script src="dait-appearance.js?v=polish-20261111-r9"></script>
  <script src="dait-queue-ui.js?v=pearl-settings-20261110"></script>
  <script src="dait-volume.js?v=horizon-layout-20261110"></script>
</body>
</html>
