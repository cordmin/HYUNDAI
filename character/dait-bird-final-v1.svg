<!-- 안티그래비티가 그린 귀여운 새 final-v1 원본 (2026-11-04 가져옴, 구상 단계·팀 확정 아님). 그림: dait-bird-final-v1.png -->
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headGrad" x1="550" y1="195" x2="700" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D608E"/>
      <stop offset="100%" stop-color="#20486C"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="670" y1="295" x2="860" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E6290"/>
      <stop offset="100%" stop-color="#1E4466"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="830" y1="420" x2="990" y2="505" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4060"/>
      <stop offset="50%" stop-color="#2B5C8A"/>
      <stop offset="100%" stop-color="#3873A6"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="560" y1="385" x2="830" y2="515" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5FBFF"/>
      <stop offset="55%" stop-color="#E1F2FE"/>
      <stop offset="100%" stop-color="#BCE3FA"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="520" y1="260" x2="985" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#93E0FD"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="82%" stop-color="#BEE9FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="550" y1="557" x2="862" y2="557" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182B42"/>
      <stop offset="55%" stop-color="#345B80"/>
      <stop offset="100%" stop-color="#274766"/>
    </linearGradient>
    <radialGradient id="eyeHaloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Solid #0B1220 background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#0B1220"/>

  <!-- Centered single bird & branch, height ~55% of 1080px (384 * 1.55 = 595px = 55.1%) -->
  <g transform="translate(960, 540) scale(1.55) translate(-745, -376)">
    
  <!-- Branch -->
  <line x1="550" y1="557" x2="862" y2="557" stroke="url(#branchGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Sculpted navy tail feather with gently forked tip -->
  <path d="M 822 448 L 862 412 C 904 428, 948 452, 990 481 C 996 485, 994 493, 984 493 L 960 491 L 970 505 C 974 511, 966 517, 955 513 C 908 492, 860 470, 822 448 Z" fill="url(#tailGrad)"/>
  <path d="M 850 432 C 890 452, 926 470, 960 491" stroke="#163450" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M 850 432 C 890 452, 926 470, 960 491" stroke="#4D8BC0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" transform="translate(0, 2)"/>

  <!-- Plump, round pale sky-tinted white belly -->
  <path d="M 544 346 C 550 452, 618 524, 716 524 C 794 524, 850 474, 862 412 L 840 365 L 640 365 L 580 346 Z" fill="url(#bellyGrad)"/>
  <!-- Soft lower belly shading -->
  <path d="M 572 448 C 622 515, 716 524, 784 508 C 834 492, 854 450, 862 412 C 840 460, 782 495, 704 495 C 638 495, 592 474, 572 448 Z" fill="#B5E0FA" opacity="0.38"/>

  <!-- Upper back bridge (dark navy) -->
  <path d="M 702 225 C 756 252, 826 326, 864 413 L 862 412 L 764 303 C 730 294, 704 304, 686 328 L 675 290 Z" fill="#1E4366"/>

  <!-- Plump folded wing fill -->
  <path d="M 670 344 C 638 368, 644 406, 684 406 C 702 406, 704 374, 718 374 C 732 374, 746 405, 760 405 C 776 405, 792 375, 808 375 C 824 375, 842 402, 862 412 C 846 362, 810 316, 764 303 C 730 294, 704 304, 686 328 L 670 344 Z" fill="url(#wingGrad)"/>
  <!-- Soft upper seam of the folded wing -->
  <path d="M 692 326 C 708 302, 734 294, 764 303 C 810 316, 846 362, 862 412" stroke="#163450" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 696 326 C 712 304, 736 298, 762 307 C 806 318, 842 362, 858 408" stroke="#3B78AC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M 738 344 C 768 368, 806 384, 844 396" stroke="#4D8BC0" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- Round, plump head dark navy fill -->
  <path d="M 544 268 C 558 212, 598 188, 644 190 C 696 192, 728 226, 720 270 C 714 304, 694 326, 670 344 C 638 368, 644 406, 684 406 C 702 406, 704 374, 718 374 L 684 406 C 606 404, 558 380, 544 348 C 536 330, 538 304, 544 282 Z" fill="url(#headGrad)"/>

  <!-- Small dark beak under the starting ribbon stroke at the beak tip -->
  <path d="M 515 282 L 546 268 L 545 294 Z" fill="#264769"/>

  <!-- ONE single unbroken glowing ribbon: Beak -> over round head -> round D-bottom curve -> chest/wing waves -> upper edge of tail feather -->
  <path d="M 520 280 L 544 268 C 558 212, 598 188, 644 190 C 696 192, 728 226, 720 270 C 714 304, 694 326, 670 344 C 638 368, 644 406, 684 406 C 702 406, 704 374, 718 374 C 732 374, 746 405, 760 405 C 776 405, 792 375, 808 375 C 824 375, 842 402, 862 412 C 904 428, 948 452, 986 480" stroke="#38BDF8" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.22" filter="url(#outerGlow)"/>
  <path d="M 520 280 L 544 268 C 558 212, 598 188, 644 190 C 696 192, 728 226, 720 270 C 714 304, 694 326, 670 344 C 638 368, 644 406, 684 406 C 702 406, 704 374, 718 374 C 732 374, 746 405, 760 405 C 776 405, 792 375, 808 375 C 824 375, 842 402, 862 412 C 904 428, 948 452, 986 480" stroke="url(#ribbonGrad)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Short glowing white 't' crossbar centered right over the tail ribbon so they clearly intersect like '+' / 't' -->
  <path d="M 934 459.5 L 976 459.5" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.32" filter="url(#outerGlow)"/>
  <path d="M 934 459.5 L 976 459.5" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Glowing i-dot Eye inside the round head -->
  <circle cx="615" cy="267" r="28" fill="url(#eyeHaloGrad)"/>
  <circle cx="615" cy="267" r="15.5" fill="#4CC3F7" opacity="0.88"/>
  <circle cx="615" cy="267" r="7.5" fill="#FFFFFF"/>

  <!-- Two small dark feet gathered neatly on the branch -->
  <path d="M 684 514 L 664 548 M 656 562 C 655 546, 672 544, 682 552" stroke="#294A6E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 754 498 L 728 548 M 720 562 C 719 546, 736 544, 746 552" stroke="#294A6E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  </g>
</svg>
