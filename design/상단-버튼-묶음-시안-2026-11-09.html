<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>상단 버튼 묶음 시안</title>
<style>
:root { --card:#fffafb; --ink:#352832; --lilac:#884d62; --line:#e5cdd6; --muted:#715e69; --paper:#fcf5f6; --soft:#f1dfe5; }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:#ecd9df; font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
.grid { display:flex; flex-direction:column; gap:30px; max-width:900px; margin:0 auto; }
h2 { font-size:19px; margin:0 0 4px; color:var(--lilac); }
p.note { margin:0 0 10px; color:var(--muted); font-size:14px; }
/* 앱 위쪽 줄 */
.bar { display:flex; align-items:center; gap:12px; padding:18px 20px; border:6px solid rgba(255,255,255,.86); border-radius:24px;
  background:linear-gradient(135deg,transparent 30%,#d7a9ba59),linear-gradient(120deg,#f8e9eb,#ecd9df); }
.logo { font:italic 700 28px Georgia,serif; color:var(--lilac); width:76px; }
.nav { display:flex; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:3px; }
.nav b { padding:11px 17px; font-size:17px; border-radius:12px; }
.nav b.on { background:var(--soft); color:var(--lilac); }
.tools { margin-left:auto; display:flex; align-items:center; }
.tools button { display:grid; place-items:center; width:46px; height:46px; padding:0; border:0; background:none; color:var(--ink); cursor:pointer; font:inherit; }
.tools svg { width:22px; height:22px; }

/* A: 카드 + 연분홍 버튼, 넓은 간격 */
.a .tools { gap:10px; padding:6px; background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 24px #3528320c; }
.a .tools button { background:var(--soft); border-radius:13px; color:var(--lilac); }

/* B: 칸막이 줄로 나눈 한 덩어리 */
.b .tools { background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px #3528320c; overflow:hidden; }
.b .tools button { width:56px; height:52px; }
.b .tools button + button { border-left:1px solid var(--line); }

/* C: 연분홍 받침 위에 흰 버튼이 떠 있음 */
.c .tools { gap:8px; padding:5px; background:var(--soft); border-radius:18px; box-shadow:inset 0 1px 3px #884d6218; }
.c .tools button { background:var(--card); border-radius:13px; box-shadow:0 2px 6px #884d6222, inset 0 1px 0 #fff; }

/* D: 알약 모양 카드 + 동그란 버튼 */
.d .tools { gap:10px; padding:5px 7px; background:var(--paper); border:1px solid var(--line); border-radius:999px; box-shadow:0 8px 24px #3528320c; }
.d .tools button { border-radius:50%; background:var(--soft); color:var(--lilac); }
</style></head><body>
<div class="grid" id="grid"></div>
<script>
const ICONS = {
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  set: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="17" r="2" fill="currentColor"/></svg>',
  vol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
};
const looks = [
  ['a', 'A · 카드 + 연분홍 버튼', '카드 안 버튼마다 연분홍 바탕을 깔아 "누르는 곳"이 바로 보임. 간격도 넓힘.'],
  ['b', 'B · 칸막이로 나눈 한 덩어리', '버튼 사이에 얇은 세로줄. 한 묶음이라는 느낌이 가장 강함.'],
  ['c', 'C · 받침 위에 떠 있는 흰 버튼', '연분홍 받침 위에 흰 버튼이 살짝 떠 있어 입체감으로 버튼임을 알림.'],
  ['d', 'D · 알약 카드 + 동그란 버튼', '둥근 알약 모양 카드에 동그란 버튼. 가장 부드러운 느낌.'],
];
document.getElementById('grid').innerHTML = looks.map(([cls, name, note]) => `<section class="${cls}"><h2>${name}</h2><p class="note">${note}</p>
  <div class="bar"><span class="logo">Dait</span><div class="nav"><b class="on">지금</b><b>수업</b><b>기록</b></div>
  <div class="tools"><button aria-label="어두운 화면">${ICONS.moon}</button><button aria-label="설정">${ICONS.set}</button><button aria-label="소리">${ICONS.vol}</button></div></div></section>`).join('');
</script>
</body></html>
