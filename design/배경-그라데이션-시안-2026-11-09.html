<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>배경 그라데이션 시안</title>
<style>
:root { --card:#fffafb; --ink:#352832; --lilac:#884d62; --line:#e5cdd6; --muted:#715e69; --paper:#fcf5f6; --soft:#f1dfe5; }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:#ecd9df; font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
.grid { display:flex; flex-direction:column; gap:36px; max-width:1100px; margin:0 auto; }
figcaption { font-size:20px; margin:0 0 10px; } figcaption b { color:var(--lilac); }
/* 앱 화면을 그대로 그린 틀 (파일로 열어도 보이게 iframe 없이) */
.frame { aspect-ratio:16/10; border:7px solid rgba(255,255,255,.86); border-radius:26px; padding:2.2% 2.6% 3.5%; display:flex; flex-direction:column; gap:3%; box-shadow:0 18px 50px #3528321a; }
.top { display:flex; align-items:center; gap:2%; }
.logo { font:italic 700 clamp(18px,3vw,34px) Georgia,serif; color:var(--lilac); width:9%; }
.nav { display:flex; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:4px; }
.nav b { padding:10px 18px; font-size:clamp(13px,1.8vw,20px); border-radius:12px; }
.nav b.on { background:var(--soft); color:var(--lilac); }
.right { margin-left:auto; display:flex; gap:12px; }
.pill { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 16px; font-size:clamp(12px,1.5vw,16px); font-weight:700; }
.card { flex:1; background:var(--paper); border-radius:18px; display:flex; align-items:center; padding:0 5%; }
.card h2 { font-size:clamp(20px,3.4vw,40px); margin:0 0 12px; line-height:1.3; }
.card p { margin:0 0 18px; font-size:clamp(12px,1.5vw,16px); }
.card span { display:inline-block; background:var(--lilac); color:#fff; border-radius:12px; padding:12px 20px; font-weight:700; }
</style></head><body>
<div class="grid" id="grid"></div>
<script>
// 지금 배경: #f8e9eb → #ecd9df. 오른쪽 아래로 갈수록 진해지는 4가지.
const looks = [
  ['지금 그대로', '비교용', 'linear-gradient(120deg,#f8e9eb,#ecd9df)'],
  ['A · 장미 노을', '같은 분홍이 오른쪽 아래로 짙어짐', 'linear-gradient(135deg,#f8e9eb 0%,#efd7de 45%,#d7a9ba 100%)'],
  ['B · 라벤더 안개', '분홍에서 연보라로', 'linear-gradient(135deg,#f8e9eb 0%,#ecdbe6 45%,#c9b5dc 100%)'],
  ['C · 복숭아 빛', '분홍에서 살구색으로 (앱에 넣었다가 철회)', 'linear-gradient(135deg,#f8e9eb 0%,#f5dcd8 45%,#ebb5aa 100%)'],
  ['D · 구석 빛 번짐', '오른쪽 아래 구석에만 둥글게 번짐', 'radial-gradient(circle at 100% 100%,#cf9fb2 0%,#e2c1cd 30%,transparent 65%),linear-gradient(120deg,#f8e9eb,#ecd9df)'],
];
document.getElementById('grid').innerHTML = looks.map(([name, note, bg]) => `<figure style="margin:0"><figcaption><b>${name}</b> · ${note}</figcaption>
  <div class="frame" style="background:${bg}">
    <div class="top"><span class="logo">Dait</span><div class="nav"><b class="on">지금</b><b>수업</b><b>기록</b></div><div class="right"><span class="pill">15분 수업</span><span class="pill">⚙ 🔈</span></div></div>
    <div class="card"><div><h2>왜 낮 하늘은 파랗고 노을은<br>붉을까?</h2><p>약 15분이면 답을 알게 돼요</p><span>듣기</span></div></div>
  </div></figure>`).join('');
</script>
</body></html>
