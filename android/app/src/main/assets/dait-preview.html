<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAIT</title>
  <style>
    :root {
      --bg-top: #3D3C70;
      --bg-bottom: #171C38;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.14);
      --line: rgba(255, 255, 255, 0.10);
      --ink: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.68);
      --lilac: #B3A6F5;
      --lilac-hover: #C6BCF8;
      --on-lilac: #1B1E3D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #D5DBE3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      word-break: keep-all;
    }
    button { font-family: inherit; }

    /* Pleos Display. 앱 창 665×420을 기준으로 창 크기에 맞춰 함께 커진다 */
    .pleos-display {
      --u: clamp(0.9px, min(100cqw / 665, 100cqh / 420), 1.7px);
      container-type: size;
      width: 100%;
      max-width: 1060px;
      height: 600px;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      border-radius: 28px;
      box-shadow: 0 24px 50px rgba(11, 26, 44, 0.16);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* In-App Fullscreen Integration for Hyundai Pleos */
    body.in-app {
      background: var(--bg-bottom);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    body.in-app .pleos-display {
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }

    /* Driving Simple Screen: 문장 하나와 큰 버튼 둘 */
    .drive-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(20 * var(--u));
      padding: calc(24 * var(--u)) calc(32 * var(--u)) calc(36 * var(--u));
      text-align: center;
    }
    body.driving .drive-screen { display: flex; }
    .drive-sentence {
      font-size: calc(30 * var(--u));
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.6px;
      max-width: 90%;
    }
    .drive-sub {
      font-size: calc(16 * var(--u));
      font-weight: 600;
      color: var(--muted);
    }
    .drive-actions {
      display: flex;
      gap: calc(16 * var(--u));
    }
    .drive-btn {
      min-width: calc(180 * var(--u));
      height: calc(64 * var(--u));
      padding: 0 calc(24 * var(--u));
      border-radius: calc(18 * var(--u));
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      font-size: calc(22 * var(--u));
      font-weight: 800;
      cursor: pointer;
    }
    .drive-btn.primary {
      background: var(--lilac);
      border-color: var(--lilac);
      color: var(--on-lilac);
    }
    .drive-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Demo Panel (시연용) */
    .demo-panel {
      position: absolute;
      right: calc(20 * var(--u));
      bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 500;
    }
    body.driving .demo-panel { z-index: 10000; }
    body.real-driving .demo-panel { display: none; } /* 실제 주행 중에는 문장 하나와 큰 버튼 둘만 */
    .demo-panel button {
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-panel button:hover { background: var(--glass-hover); }
    .demo-panel button.on {
      background: var(--lilac);
      border-color: var(--lilac);
      color: var(--on-lilac);
    }
    .demo-panel button:disabled { cursor: default; opacity: 0.9; }

    /* Main Stage */
    .stage-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: calc(14 * var(--u)) calc(20 * var(--u)) calc(30 * var(--u));
      position: relative;
    }

    /* ========================================================
       첫 화면: 인사 두 줄, 그 아래 작은 카드 여섯 장
       카드 한 장에는 이름 한 줄, 내용 한두 줄, 버튼 하나까지만 넣는다
       ======================================================== */
    .home-top {
      display: flex;
      align-items: center;
      gap: calc(12 * var(--u));
      margin-bottom: calc(10 * var(--u));
    }
    .dait-brand-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .dait-brand-badge svg {
      width: calc(62 * var(--u));
      height: calc(19 * var(--u));
    }
    .home-greeting {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: calc(10 * var(--u));
    }
    .home-title {
      font-size: calc(19 * var(--u));
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.4px;
    }
    .home-desc {
      font-size: calc(14 * var(--u));
      font-weight: 500;
      line-height: 1.3;
      color: var(--muted);
    }
    .home-tools { display: flex; gap: calc(8 * var(--u)); flex-shrink: 0; }
    .icon-btn {
      width: calc(44 * var(--u));
      height: calc(44 * var(--u));
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--glass-hover); }
    .icon-btn svg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }

    .home-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: calc(10 * var(--u));
    }
    .home-card {
      min-width: 0;
      min-height: 0;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(16 * var(--u));
      padding: calc(12 * var(--u)) calc(14 * var(--u));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-label {
      font-size: calc(13 * var(--u));
      font-weight: 700;
      line-height: 1.3;
      color: var(--muted);
    }
    .card-focus {
      margin-top: calc(6 * var(--u));
      font-size: calc(18 * var(--u));
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
    }
    .card-text {
      margin-top: calc(6 * var(--u));
      font-size: calc(14 * var(--u));
      font-weight: 700;
      line-height: 1.3;
    }
    /* 카드의 핵심 단어. 글자 수가 많으면 작아진다 */
    .card-big {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }
    .card-big.size-1 { font-size: calc(34 * var(--u)); }
    .card-big.size-2 { font-size: calc(26 * var(--u)); }
    .card-big.size-3 { font-size: calc(20 * var(--u)); }
    .card-big.size-4 { font-size: calc(17 * var(--u)); }
    .card-big .card-sub { letter-spacing: 0; }
    .card-ask {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: calc(15 * var(--u));
      font-weight: 700;
      line-height: 1.3;
    }
    .card-sub {
      margin-top: calc(2 * var(--u));
      font-size: calc(13 * var(--u));
      font-weight: 500;
      line-height: 1.3;
      color: var(--muted);
    }
    .card-btn {
      margin-top: auto;
      width: 100%;
      min-height: calc(44 * var(--u));
      padding: 0 calc(8 * var(--u));
      border: none;
      border-radius: calc(12 * var(--u));
      background: var(--lilac);
      color: var(--on-lilac);
      font-size: calc(14 * var(--u));
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .card-btn:hover { background: var(--lilac-hover); }
    .card-btn.quiet { background: var(--glass-hover); color: var(--ink); }
    .card-btn.quiet:hover { background: rgba(255, 255, 255, 0.2); }

    /* 시작 카드. 여정에 따라 색이 바뀐다 */
    .home-card.start {
      background: linear-gradient(150deg, #4B6BE8 0%, #7D59D8 58%, #B85BB4 100%);
      border-color: rgba(255, 255, 255, 0.18);
      cursor: pointer;
    }
    .home-card.start.afternoon { background: linear-gradient(150deg, #E4835A 0%, #C2527F 58%, #7A4BB5 100%); }
    .home-card.start.weekend { background: linear-gradient(150deg, #7C7FE0 0%, #6A55C8 58%, #4A3FA0 100%); }
    .home-card.start .card-label { color: rgba(255, 255, 255, 0.85); }
    .start-arrow {
      margin-top: auto;
      align-self: flex-end;
      width: calc(36 * var(--u));
      height: calc(36 * var(--u));
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: #3A2F80;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .start-arrow svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); }

    /* 어디로 카드: 네이버앱의 예약 카드처럼 왼쪽 세로줄 */
    .place-mark {
      margin-top: calc(6 * var(--u));
      padding-left: calc(8 * var(--u));
      border-left: calc(2 * var(--u)) solid #5FD6B4;
    }
    .place-mark .card-text {
      margin-top: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subject-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: center;
      justify-items: center;
      row-gap: calc(8 * var(--u));
      font-size: calc(22 * var(--u));
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    /* 좁고 긴 창에서는 두 줄로 놓고 내려서 본다 */
    @container (max-width: 520px) {
      .home-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;
        grid-auto-rows: calc(130 * var(--u));
        overflow-y: auto;
      }
      .settings-grid { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
      .place-list { grid-template-columns: minmax(0, 1fr); }
    }

    /* Dialogue Screen */
    .dialogue-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .dialogue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: calc(8 * var(--u));
      margin-bottom: calc(10 * var(--u));
    }
    .top-label {
      font-size: calc(14 * var(--u));
      font-weight: 700;
      color: var(--muted);
    }
    .back-btn {
      min-height: calc(44 * var(--u));
      padding: 0 calc(16 * var(--u));
      border-radius: calc(14 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: calc(14 * var(--u));
      font-weight: 700;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--glass-hover); }

    .dialogue-card {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(18 * var(--u));
      padding: calc(14 * var(--u)) calc(20 * var(--u));
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }
    .card-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Dialogue Ambient Orb */
    .dialogue-orb {
      width: calc(44 * var(--u));
      height: calc(44 * var(--u));
      flex-shrink: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #B3A6F5 0%, #7D59D8 55%, #3A2F80 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: calc(10 * var(--u));
    }

    /* Voice Visualizer Wave */
    .voice-visualizer {
      display: flex;
      gap: calc(3 * var(--u));
      align-items: center;
    }
    .v-bar {
      width: calc(2.5 * var(--u));
      height: calc(7 * var(--u));
      background: #FFFFFF;
      border-radius: calc(2 * var(--u));
    }
    .v-bar:nth-child(2) { height: calc(13 * var(--u)); }
    .v-bar:nth-child(3) { height: calc(17 * var(--u)); }
    .v-bar:nth-child(4) { height: calc(11 * var(--u)); }

    .main-question {
      font-size: calc(22 * var(--u));
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.4px;
      max-width: 90%;
    }
    .heard-bubble {
      margin-top: calc(8 * var(--u));
      background: var(--glass-hover);
      font-size: calc(14 * var(--u));
      font-weight: 700;
      padding: calc(4 * var(--u)) calc(14 * var(--u));
      border-radius: calc(12 * var(--u));
      display: inline-block;
    }
    .heard-bubble[hidden] { display: none; }

    /* Choice Chips */
    .options-row {
      display: flex;
      gap: calc(10 * var(--u));
      width: 100%;
      margin-top: calc(10 * var(--u));
      justify-content: center;
    }
    .choice-chip {
      flex: 1;
      max-width: calc(180 * var(--u));
      min-height: calc(44 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(12 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .choice-chip:hover,
    .choice-chip[aria-pressed="true"] {
      background: var(--lilac);
      color: var(--on-lilac);
      border-color: var(--lilac);
    }

    /* Primary Bottom Action */
    .bottom-bar {
      margin-top: calc(10 * var(--u));
      display: flex;
      justify-content: center;
      gap: calc(10 * var(--u));
    }
    .primary-btn {
      width: calc(190 * var(--u));
      height: calc(44 * var(--u));
      background: var(--lilac);
      color: var(--on-lilac);
      border: none;
      border-radius: calc(12 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 800;
      cursor: pointer;
    }
    .primary-btn:hover { background: var(--lilac-hover); }
    .primary-btn.secondary {
      width: calc(130 * var(--u));
      background: var(--glass-hover);
      color: var(--ink);
    }

    /* ========================================================
       시그니처 인트로 스플래시 애니메이션 (Signature Splash Intro)
       ======================================================== */
    .splash-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      cursor: pointer;
    }

    /* Ambient Pulsing Aura behind the logo */
    .splash-aura {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(179, 166, 245, 0.28) 0%, rgba(125, 89, 216, 0.14) 42%, transparent 70%);
      filter: blur(36px);
      transform: scale(0.9);
      pointer-events: none;
    }

    /* Brand Container that glides to the logo in the header */
    .splash-brand-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transform-origin: center center;
    }

    .splash-logo-svg {
      width: calc(240 * var(--u));
      height: calc(82 * var(--u));
      overflow: visible;
    }

    .splash-ribbon-path {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Dot Pop Animation & Shockwave Ripple */
    .splash-dot-group {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-group.pop {
      animation: dotPopIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dotPopIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.65); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-dot-ripple {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-ripple.expand {
      animation: rippleExpand 0.75s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { r: 3px; stroke-width: 3.5px; opacity: 1; }
      100% { r: 24px; stroke-width: 0.4px; opacity: 0; }
    }

    /* School Settings: 왼쪽 학교 찾기, 오른쪽 설정 목록 */
    .settings-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: calc(10 * var(--u));
    }
    .settings-grid .main-question { font-size: calc(18 * var(--u)); }
    .lesson-pick {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: calc(16 * var(--u));
    }
    .lesson-main, .lesson-side {
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: calc(8 * var(--u));
    }
    .lesson-main .main-question { font-size: calc(18 * var(--u)); text-align: left; }
    .lesson-main { padding-right: calc(8 * var(--u)); } /* 스크롤 막대가 버튼을 덮지 않게 한다 */
    .lesson-times, .lesson-subjects { display: flex; flex-wrap: wrap; gap: calc(6 * var(--u)); flex-shrink: 0; }
    .lesson-times .choice-chip, .lesson-subjects .choice-chip { min-width: 0; font-size: calc(14 * var(--u)); padding: 0 calc(4 * var(--u)); }
    .lesson-row { display: flex; gap: calc(6 * var(--u)); flex-shrink: 0; }
    .lesson-row .choice-chip {
      min-width: 0;
      max-width: none;
      padding: calc(4 * var(--u)) calc(10 * var(--u));
      text-align: left;
    }
    .lesson-row .card-btn { width: auto; flex: 0 0 calc(98 * var(--u)); margin-top: 0; font-size: calc(13 * var(--u)); }
    .lesson-title { display: block; font-size: calc(14 * var(--u)); line-height: 1.3; }
    .lesson-meta { display: block; font-size: calc(13 * var(--u)); font-weight: 500; opacity: 0.75; }
    .lesson-side .card-btn { margin-top: 0; flex-shrink: 0; }
    .settings-side {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: calc(6 * var(--u));
      overflow-y: auto;
    }
    .setting-row {
      min-height: calc(44 * var(--u));
      padding: calc(4 * var(--u)) calc(14 * var(--u));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(8 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(12 * var(--u));
      color: var(--ink);
      font-size: calc(14 * var(--u));
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .setting-row:hover { background: var(--glass-hover); }
    .setting-state { flex-shrink: 0; color: var(--lilac); }
    .settings-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .school-search-row {
      display: flex;
      gap: calc(8 * var(--u));
      width: 100%;
      margin-top: calc(10 * var(--u));
    }
    .school-input {
      flex: 1;
      min-width: 0;
      height: calc(44 * var(--u));
      padding: 0 calc(14 * var(--u));
      border-radius: calc(12 * var(--u));
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.18);
      color: var(--ink);
      font-family: inherit;
      font-size: calc(15 * var(--u));
      font-weight: 600;
      user-select: text;
    }
    .school-input::placeholder { color: var(--muted); }
    .settings-message {
      margin-top: calc(8 * var(--u));
      font-size: calc(14 * var(--u));
      font-weight: 600;
      color: var(--muted);
    }
    .settings-list {
      display: flex;
      flex-wrap: wrap;
      gap: calc(8 * var(--u));
      justify-content: center;
      width: 100%;
      min-height: 0;
      margin-top: calc(10 * var(--u));
      overflow-y: auto;
    }
    .settings-list .choice-chip {
      flex: 0 1 auto;
      min-width: calc(64 * var(--u));
      max-width: none;
      padding: 0 calc(14 * var(--u));
    }
    .school-search-row .choice-chip { flex: 0 0 calc(72 * var(--u)); }

    /* 가 볼 만한 곳 */
    .places-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .places-body .settings-list { justify-content: flex-start; margin-top: 0; flex-shrink: 0; }
    .place-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: min-content;
      gap: calc(8 * var(--u));
      flex: 1;
      min-height: 0;
      margin-top: calc(10 * var(--u));
      overflow-y: auto;
    }
    .place-row {
      padding: calc(10 * var(--u)) calc(14 * var(--u));
      border-radius: calc(12 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
    }
    .place-name { font-size: calc(15 * var(--u)); font-weight: 700; line-height: 1.3; }
    .place-address { margin-top: calc(2 * var(--u)); font-size: calc(13 * var(--u)); color: var(--muted); }

  </style>
</head>
<body>

  <!-- Pleos Display (Pure App Window) -->
  <div class="pleos-display">

    <!-- Signature Splash Intro Overlay -->
    <div id="splashOverlay" class="splash-overlay" onclick="skipSplashIntro()">
      <div class="splash-aura"></div>
      
      <div id="splashBrandContainer" class="splash-brand-container">
        <svg id="splashLogoSvg" class="splash-logo-svg" viewBox="0 0 100 34" fill="none">
          <defs>
            <linearGradient id="splashFlowGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#38BDF8"/>
            </linearGradient>
            <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Main cursive ribbon D-a-i-t -->
          <path id="splashRibbonPath"
                class="splash-ribbon-path"
                d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10" 
                stroke="url(#splashFlowGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- t crossbar -->
          <path id="splashCrossbarPath"
                class="splash-ribbon-path"
                d="M74 16 h12"
                stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>

          <!-- i Dot Accent (with shockwave ring) -->
          <g id="splashDotGroup" class="splash-dot-group">
            <circle id="splashDotRipple" class="splash-dot-ripple" cx="62" cy="7.5" r="3" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <circle id="splashDot" cx="62" cy="7.5" r="3.2" fill="#38BDF8" filter="url(#neonGlow)"/>
            <circle cx="62" cy="7.5" r="1.5" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Main Stage -->
    <div id="stageArea" class="stage-container">
      <!-- Injected by JS -->
    </div>

    <!-- Driving Simple Screen: 주행 중에는 문장 하나와 큰 버튼 둘만 -->
    <div id="driveScreen" class="drive-screen">
      <div id="driveSentence" class="drive-sentence">주차 후 이어갈게요</div>
      <div id="driveSub" class="drive-sub"></div>
      <div class="drive-actions">
        <button id="driveReplay" class="drive-btn" onclick="driveReplay()">다시 듣기</button>
        <button id="driveNext" class="drive-btn primary" onclick="driveNext()">넘기기</button>
      </div>
    </div>

    <!-- Demo Panel: 시연용 주행 상태와 남은 시간 -->
    <div class="demo-panel">
      <button id="demoDrive" onclick="toggleDrivingDemo()">주행</button>
      <button id="demoEtaLong" onclick="setEtaDemo(8)">8분 전</button>
      <button id="demoEtaMid" onclick="setEtaDemo(4)">4분 전</button>
      <button id="demoEtaShort" onclick="setEtaDemo(2)">2분 전</button>
      <button id="demoDest" onclick="cycleDestDemo()">목적지</button>
      <button onclick="window.onDoorOpened()">문 열림</button>
    </div>

  </div>

  <audio id="audioPlayer" preload="none"></audio>

  <script src="dait-rules.js"></script>
  <script src="dait-journey.js"></script>
  <script src="dait-lesson.js"></script>
  <script src="dait-lessons.js"></script>
  <script>
    // State
    const voice = 'nika';
    let currentMode = null; // 'morning' | 'afternoon' | 'tour' | null
    let stage = '';
    let heard = '';
    let isDrivingMode = false;
    let currentChoices = [];
    let demoMinutes = null; // 시연 조작으로 고른 남은 분
    let speechPhase = 'idle'; // 'idle' | 'speaking' | 'listening'
    let unclearCount = 0;
    let listenSince = 0; // 이번 질문을 듣기 시작한 때
    let speechSeq = 0; // 지난 말에 대한 늦은 알림을 가려내는 순번
    let previewQueue = []; // 브라우저 미리보기에서 이어 틀 음원
    let speechPaused = false; // 길 안내나 통화가 소리를 가져간 동안
    let tripMuted = false; // 이번 대화는 소리를 내지 않음
    let pendingIntro = []; // 첫 질문 앞에 붙일 말(남은 시간, 오늘 시간표)
    let micBroken = false; // 이번 대화에서 마이크를 열지 못함
    let noMicTimer = null;
    let doorTimer = null;
    let closeTimer = null;
    let routeStartedAt = 0;
    let lastRefreshDay = '';
    let tripForDoor = null; // 내릴 때 한마디: 대화를 시작한 여정. 달렸는지와 주차 시각을 기억한다.
    let currentRule = null; // 이번 대화에 쓰는 교사 규칙
    let ruleMissing = false; // 규칙 대화에서 준비물을 못 챙겼다고 답함
    let armed = null; // 출발하면 들려주기: { mode, timer }. 수업이면 mode는 'lesson'이고 lesson과 minutes를 함께 둔다
    let pendingStart = null; // 마이크 허락을 기다리는 동작
    let micAsked = false;
    let hasArrived = false;
    let journeyActive = false;
    const MEMORY_KEY = 'dait.morningMemory';
    const VOICE_KEY = 'dait.voiceAnswers';
    const QUESTIONS_KEY = 'dait.questions';
    const ROUTE_KEY = 'dait.routePlaces';
    const HOME_CLEARED_KEY = 'dait.homeCleared'; // 보호자가 지운 집을 내비 즐겨찾기로 되살리지 않는다
    const ARM_MS = 30 * 60 * 1000;
    const ARRIVAL_CLOSE_MS = 4000;
    const NO_MIC_WAIT_MS = 8000;
    const LISTEN_PATIENCE_MS = 12000;
    const DOOR_WINDOW_MS = 5 * 60 * 1000;
    const TRIP_CAP_MS = 2 * 60 * 60 * 1000;
    const ROUTE_SWAP_MS = 3000;

    // DAIT 공식 확정 캘리그래피 로고 (시안 2 커넥티드 리본 + i Dot)
    function getDaitLogoHtml() {
      return `
        <div class="dait-brand-badge" onclick="event.stopPropagation(); playSplashIntro();">
          <svg width="94" height="28" viewBox="0 0 100 32" fill="none">
            <path d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10 M74 16 h12" 
                  stroke="url(#flowGradBadge)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="62" cy="7.5" r="2.8" fill="#38BDF8"/>
            <defs>
              <linearGradient id="flowGradBadge" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/>
                <stop offset="0.6" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#38BDF8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      `;
    }

    function render() {
      renderStage();
      syncJourney();
    }

    function renderStage() {
      const stageArea = document.getElementById('stageArea');

      // 1. Home Screen (단일 완성형 스마트 벤토)
      if (!currentMode) {
        renderHome(stageArea);
        return;
      }

      // 2. School Settings
      if (currentMode === 'settings') {
        renderSettings(stageArea);
        return;
      }

      // 3. Places to visit
      if (currentMode === 'places') {
        renderPlaces(stageArea);
        return;
      }

      // 4. Lessons
      if (currentMode === 'lessonPick') {
        renderLessonPick(stageArea);
        return;
      }
      if (currentMode === 'lesson') {
        renderLesson(stageArea);
        return;
      }

      // 5. Dialogue Flow
      renderDialogueFlow(stageArea);
    }

    // --- 첫 화면: 인사 두 줄과 작은 카드 여섯 장 ---
    function renderHome(container) {
      const trip = currentTrip();
      const info = homeInfo(trip);
      const isMorning = trip.mode === 'morning';
      const other = isMorning ? 'afternoon' : 'morning';
      const startClass = trip.kind === 'weekend' ? ' weekend' : (isMorning ? '' : ' afternoon');
      const startLabel = !school ? '학교 등록하기'
        : trip.kind === 'weekend' ? `${(schoolPlan() || { label: '다음 수업일' }).label} 준비 듣기`
        : `${isMorning ? '등교' : '하교'} 대화 시작하기`;
      const now = new Date();
      container.innerHTML = `
        <div class="home-top">
          ${getDaitLogoHtml()}
          <div class="home-greeting">
            <div class="home-title">${escapeHtml(info.title)}</div>
            <div class="home-desc">${escapeHtml(info.desc)}</div>
          </div>
          <div class="home-tools">
            <button class="card-btn" onclick="openLessons()">${armed && armed.lesson ? '수업 예약' : '수업 듣기'}</button>
            <button class="icon-btn" aria-label="가 볼 만한 곳" onclick="openPlaces()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
            </button>
            <button class="icon-btn" aria-label="학교 설정" onclick="openSettings()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-2.82-1.17l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0-1.17-2.82H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.17-2.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 2.82-1.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 2.82 1.17l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0 1.17 2.82H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1"/></svg>
            </button>
          </div>
        </div>

        <div class="home-grid">
          <div class="home-card start${startClass}" onclick="${school ? `startFlow('${trip.mode}')` : 'openSettings()'}">
            <div class="card-label">${now.getMonth() + 1}월 ${now.getDate()}일 ${WEEKDAYS[now.getDay()]}</div>
            <div class="card-focus">${escapeHtml(startLabel)}</div>
            <div class="start-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            </div>
          </div>

          ${tripCardHtml(trip)}

          <div class="home-card">
            <div class="card-label">${escapeHtml(info.prepLabel)}</div>
            ${bigWordHtml(info.prep, info.prepSub)}
          </div>

          <div class="home-card">
            <div class="card-label">${escapeHtml(info.scheduleLabel)}</div>
            ${info.subjects.length > 0
              ? `<div class="subject-grid">${[...new Set(info.subjects.map(shortSubject))].map(c => `<span>${escapeHtml(c)}</span>`).join('')}</div>`
              : bigWordHtml(school ? '확인 필요' : '등록 필요')}
          </div>

          <div class="home-card">
            <div class="card-label">${escapeHtml(info.mealLabel)}</div>
            ${bigWordHtml(info.meal)}
          </div>

          <div class="home-card">
            <div class="card-label">오늘의 질문</div>
            <div class="card-ask">${escapeHtml(info.question)}</div>
            ${trip.known || Journey.start(other, { ...journeyContext(), rule: ruleFor(other) }) === 'SILENT' ? '' : `<button class="card-btn quiet" onclick="startFlow('${other}')">${other === 'morning' ? '등교' : '하교'} 대화</button>`}
          </div>
        </div>
      `;
    }

    function bigWordHtml(word, sub) {
      const size = word.length <= 4 ? 1 : word.length <= 6 ? 2 : word.length <= 10 ? 3 : 4;
      return `<div class="card-big size-${size}"><span>${escapeHtml(word)}</span>${sub ? `<div class="card-sub">${escapeHtml(sub)}</div>` : ''}</div>`;
    }

    // 시간표 카드에는 두 글자로 줄여 넣는다. 한 글자로 줄이면 국수, 도미처럼 다른 낱말로 읽힌다.
    function shortSubject(name) {
      return name.split(/[·\s]/)[0].slice(0, 2);
    }

    // 어디로 카드. 네이버앱의 예약 카드처럼 장소 한 줄, 시간 한 줄, 버튼 하나.
    function tripCardHtml(trip) {
      if (!school) {
        return `<div class="home-card">
          <div class="card-label">학교</div>
          <div class="card-focus">등록 전</div>
          <button class="card-btn" onclick="startFlow('${trip.mode}')">예시로 듣기</button>
        </div>`;
      }
      if (trip.kind === 'weekend') {
        return `<div class="home-card">
          <div class="card-label">쉬는 날</div>
          <div class="card-focus">가 볼 만한 곳</div>
          <button class="card-btn" onclick="openPlaces()">찾아보기</button>
        </div>`;
      }
      const place = trip.mode === 'morning' ? school.name : '집';
      return `<div class="home-card">
        <div class="card-label">어디로</div>
        <div class="place-mark">
          <div class="card-text">${escapeHtml(place)}</div>
          ${trip.minutes !== null ? `<div class="card-sub">${trip.minutes}분 남음</div>` : ''}
        </div>
        <button class="card-btn${armed ? ' quiet' : ''}" onclick="toggleArm('${trip.mode}')">${armLabel(trip)}</button>
      </div>`;
    }

    function armLabel(trip) {
      if (armed) return armed.lesson ? '수업 예약 취소' : '출발하면 들려줄게요';
      if (routePlaceFor(trip.mode) && !naviInfo) return trip.mode === 'morning' ? '학교로 안내' : '집으로 안내';
      return '출발하면 듣기';
    }

    function renderDialogueFlow(container) {
      const flow = Journey.flows[currentMode];
      const modeName = currentMode === 'morning' ? '등교' : '하교';
      const data = stage === 'NEXT_DAY' ? Journey.nextDayStep(schoolPlan(), currentRule, DAIT_RULES)
        : stage.startsWith('RULE') ? Journey.ruleStep(stage, currentRule, ruleMissing, DAIT_RULES.extras.rule_missing)
        : stage === 'AFTER_SUBJECT' ? Journey.subjectStep((readStored(MEMORY_KEY) || {}).subject || '', DAIT_RULES)
        : (flow[stage] || flow.DONE);

      const subjectStages = ['SUBJECT', 'SUBJECT_MISSING', 'SUBJECT_TODAY'];
      const todayChoices = currentMode === 'morning' && subjectStages.includes(stage) ? subjectChoices() : null;
      currentChoices = todayChoices || data.choices || [];

      speakStage(data.clips || [data.clip]);
      updateDriveScreen(data.title);

      let optionsHtml = '';
      if (currentChoices.length > 0) {
        optionsHtml = `
          <div class="options-row">
            ${currentChoices.map((c, i) => `<button class="choice-chip" onclick="handleAnswer(currentChoices[${i}])">${escapeHtml(c)}</button>`).join('')}
          </div>
        `;
      }

      const buttonLabel = isDialogueDone() ? '마치기' : '다시 듣기';
      const skipHtml = isDialogueDone() ? '' : '<button class="primary-btn secondary" onclick="skipQuestion()">넘기기</button>';

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span class="top-label">${modeName}</span>
          </div>

          <div class="dialogue-card">
            <div class="card-center">
              <div class="dialogue-orb">
                <div class="voice-visualizer">
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                </div>
              </div>
              <div class="main-question">${escapeHtml(data.title)}</div>
              <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
            </div>

            ${optionsHtml}
          </div>

          <div class="bottom-bar">
            <button class="primary-btn" onclick="handlePrimaryAction()">
              ${buttonLabel}
            </button>
            ${skipHtml}
          </div>
        </div>
      `;
    }

    function journeyContext() {
      const plan = schoolPlan();
      const memory = readStored(MEMORY_KEY);
      return {
        tier: Journey.tierFor(remainMinutes()),
        driving: isDrivingMode,
        school: !!school,
        hasPe: !!(plan && plan.hasPe),
        rule: currentRule,
        noQuestions: readStored(QUESTIONS_KEY) === false,
        nextDay: !!school && !!schoolDays[toYmd(new Date())] && !isClassDay(toYmd(new Date())),
        etaMinutes: currentTrip().known ? naviRemainMinutes() : demoMinutes,
        subjects: plan && plan.ymd === toYmd(new Date()) ? plan.subjects : [],
        memory: memory && memory.date === toYmd(new Date()) ? memory : {}
      };
    }

    function remainMinutes() {
      const live = naviRemainMinutes();
      return live === null ? demoMinutes : live;
    }

    function startFlow(mode) {
      if (askMicFirst(() => startFlow(mode))) return;
      disarm();
      currentMode = mode;
      heard = '';
      unclearCount = 0;
      listenSince = 0;
      hasArrived = false;
      micBroken = false;
      tripMuted = false;
      currentRule = ruleFor(mode);
      ruleMissing = false;
      const context = journeyContext();
      stage = Journey.start(mode, context);
      pendingIntro = stage === 'NEXT_DAY' ? [] : Journey.intro(mode, context, DAIT_RULES);
      const trip = { drove: isDrivingMode, parkedAt: 0 };
      tripForDoor = trip;
      setTimeout(() => endDoorTrip(trip), TRIP_CAP_MS); // 차 상태가 멈춰도 앞쪽 작업이 끝없이 남지 않게 한다
      noteTripChoice(mode);
      render();
    }

    function goHome() {
      if (currentMode === 'lesson') closeLesson();
      stopSpeech();
      if (tripForDoor && !tripForDoor.drove) tripForDoor = null; // 주차 중에 들어 본 대화는 여정이 아니다
      currentMode = null;
      stage = '';
      heard = '';
      hasArrived = false;
      render();
      updateDriveScreen();
    }

    function setStage(nextStage) {
      stage = nextStage;
      unclearCount = 0;
      listenSince = 0;
      render();
    }

    function handleAnswer(ans, shown = ans) {
      if (isDialogueDone()) return;
      heard = shown;
      const result = Journey.next(currentMode, stage, ans, journeyContext());
      if (result.remember) rememberMorning(result.remember);
      ruleMissing = !!result.missing;
      setStage(result.stage);
    }

    function isDialogueDone() {
      if (currentMode === 'lesson') return !!lessonRun && lessonRun.done;
      return Journey.isDone(stage);
    }

    // 질문을 건너뛴다. 답을 지어내지 않고 다음 단계로만 넘어간다.
    function skipQuestion() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      if (currentMode === 'lesson') { nextLessonPiece(); return; }
      heard = '';
      setStage(Journey.skip(currentMode, stage, journeyContext()));
    }

    // 아침에 고른 과목과 쉬기 여부를 기기에 남겨 하교 때 다시 꺼낸다 (기획안 ③⑤)
    function rememberMorning(patch) {
      const today = toYmd(new Date());
      const memory = readStored(MEMORY_KEY);
      const base = memory && memory.date === today ? memory : { date: today };
      writeStored(MEMORY_KEY, { ...base, ...patch });
    }

    function handlePrimaryAction() {
      if (isDialogueDone()) {
        goHome();
      } else if (currentMode === 'lesson') {
        if (!isLessonResting()) playLessonPiece();
      } else {
        render();
      }
    }

    // ========================================================
    // 출발하면 들려주기
    // 시동만으로 말을 시작하지 않는다. 주차 중에 보호자가 고른 여정만 출발할 때 시작한다.
    // ========================================================
    function toggleArm(mode) {
      if (armed) { disarm(); render(); return; }
      if (askMicFirst(() => toggleArm(mode))) return;
      arm({ mode });
      render();
      const place = routePlaceFor(mode);
      if (place && !naviInfo && window.AndroidBridge) window.AndroidBridge.startRoute(JSON.stringify(place));
    }

    function arm(choice) {
      armed = { ...choice, timer: setTimeout(() => {
        disarm();
        refreshHomeIfIdle();
        if (currentMode === 'lessonPick') render();
      }, ARM_MS) };
    }

    // 고른 대로 출발할 때 시작한다. 수업은 출발할 때 아는 남은 시간을 먼저 쓴다.
    // 그 시간에 들어가지 않는 수업이면 말을 시작하지 않고 예약만 지운다.
    function startArmed() {
      const { mode, lesson, minutes } = armed;
      disarm();
      if (mode !== 'lesson') { startFlow(mode); return; }
      const eta = remainMinutes();
      lessonMinutes = eta !== null ? Lesson.minutesFor(eta) : minutes;
      startLesson(lesson);
      refreshHomeIfIdle(); // 시간이 모자라 시작하지 못했으면 예약이 사라진 것을 보여 준다
    }

    // 내비에서 알아 둔 학교와 집의 좌표. 있으면 첫 화면에서 바로 길 안내를 시작할 수 있다.
    function routePlaceFor(mode) {
      return routePlaces[mode === 'morning' ? 'school' : 'home'] || null;
    }

    function learnRoutePlace(kind, place) {
      if (!Number.isFinite(place.lat) || !place.lat) return;
      const known = routePlaces[kind];
      if (known && known.lat === place.lat && known.lng === place.lng) return;
      routePlaces[kind] = { name: place.name || '', address: place.address || '', lat: place.lat, lng: place.lng, poiId: place.poiId || '', poiSubId: place.poiSubId || '', poiProvider: place.poiProvider || '' };
      writeStored(ROUTE_KEY, routePlaces);
      updateCarPlace();
      refreshHomeIfIdle();
    }

    // 내비 즐겨찾기와 최근 목적지에서 학교를 찾고, '집' 즐겨찾기는 집으로 등록한다.
    function learnFromNavi(places) {
      places.filter(place => place.name && place.lat).forEach(place => {
        if (school && isSamePlace(place, school)) learnRoutePlace('school', place);
        if (place.category === 'HOME' && !homePlace && readStored(HOME_CLEARED_KEY) !== true) {
          homePlace = { name: place.name, address: place.address || '' };
          writeStored(HOME_KEY, homePlace);
        }
        if (homePlace && isSamePlace(place, homePlace)) learnRoutePlace('home', place);
      });
    }

    function disarm() {
      if (armed) clearTimeout(armed.timer);
      armed = null;
    }

    // 여정 동안에는 내비가 앱을 덮어도 말하고 들을 수 있게 앱을 유지한다.
    // 달리는 중에 내려놓으면 내비 뒤에서 다시 올릴 수 없으므로 주차하거나 대화를 닫을 때까지 둔다.
    function syncJourney() {
      const inDialogue = !!currentMode && !isParkedScreen();
      const finishedParked = isDialogueDone() && speechPhase === 'idle' && !isDrivingMode;
      const active = !!armed || (inDialogue && !finishedParked) || !!(tripForDoor && tripForDoor.drove);
      if (active === journeyActive) return;
      journeyActive = active;
      if (window.AndroidBridge) window.AndroidBridge.setJourneyActive(active);
    }

    // 실제로 달린 여정 뒤 주차한 상태에서 아이 쪽 문이 처음 열릴 때 한 번만 말한다 (기획안 ④)
    function trackDoorTrip(isDriving) {
      if (!tripForDoor) return;
      if (isDriving) {
        tripForDoor.drove = true;
        tripForDoor.parkedAt = 0;
        clearTimeout(doorTimer);
      } else if (tripForDoor.drove && !tripForDoor.parkedAt) {
        const parked = tripForDoor;
        parked.parkedAt = Date.now();
        doorTimer = setTimeout(() => endDoorTrip(parked), DOOR_WINDOW_MS);
      }
    }

    function endDoorTrip(trip) {
      if (tripForDoor !== trip) return;
      tripForDoor = null;
      syncJourney();
    }

    window.onDoorOpened = function() {
      noteTripDoor();
      if (!tripForDoor || !tripForDoor.drove) return;
      // 교문 앞에서 기어 D로 세운 채 내릴 수 있으므로 도착 직전이면 주차 전이라도 말한다.
      const stoppedAtEnd = isDrivingMode && Journey.tierFor(remainMinutes()) === 'arrive';
      if (!stoppedAtEnd && (isDrivingMode || !tripForDoor.parkedAt)) return;
      clearTimeout(closeTimer);
      tripForDoor = null;
      hasArrived = !!currentMode && !isParkedScreen(); // 아이가 내리는 순간이므로 말을 마치면 대화를 닫는다
      speak([DAIT_RULES.extras.p_door_bag].filter(Boolean), '');
      syncJourney();
    };

    // ========================================================
    // 말하기와 듣기
    // 앱에서는 VoiceSession이, 브라우저 미리보기에서는 audio 태그가 소리를 낸다.
    // ========================================================
    function micState() {
      return window.AndroidBridge ? window.AndroidBridge.micState() : 'none';
    }

    // 처음 대화를 시작할 때 주차 중에만 마이크 허락을 묻는다.
    function askMicFirst(action) {
      if (micAsked || isDrivingMode || micState() !== 'ask' || readStored(VOICE_KEY) === false) return false;
      micAsked = true;
      pendingStart = action;
      window.AndroidBridge.requestMic();
      return true;
    }

    window.onMicAnswered = function() {
      const action = pendingStart;
      pendingStart = null;
      if (action) action();
    };

    function canListen() {
      return !micBroken && micState() === 'ready' && readStored(VOICE_KEY) !== false;
    }

    function speakStage(clips) {
      listenSince = 0;
      const intro = pendingIntro;
      pendingIntro = [];
      if (tripMuted) stopSpeech();
      else speak([...intro, ...clips].filter(Boolean), listenNow());
    }

    function listenNow() {
      return canListen() ? Journey.listenSpec(currentMode, stage, currentChoices, currentRule) : '';
    }

    function speak(clips, listen) {
      clearTimeout(noMicTimer);
      speechPhase = 'speaking';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) {
        window.AndroidBridge.speak(JSON.stringify(clips), listen, speechSeq);
        return;
      }
      previewQueue = clips.slice();
      playPreviewClip();
    }

    // 브라우저 미리보기: 음원을 차례로 튼다. temp/로 시작하는 것은 임시 음성이다.
    function playPreviewClip() {
      const clip = previewQueue.shift();
      if (!clip) {
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
        return;
      }
      const player = document.getElementById('audioPlayer');
      player.src = clip.startsWith('lesson/') ? `voices/${clip}.m4a` : clip.includes('/') ? `voices/${clip}.wav` : `voices/${voice}/${clip}.wav`;
      player.play().catch(e => {
        console.log('Audio error:', e);
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
      });
    }

    function stopSpeech() {
      clearTimeout(noMicTimer);
      speechPhase = 'idle';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) window.AndroidBridge.stopSpeech();
      else document.getElementById('audioPlayer').pause();
    }

    function heardLineText() {
      if (speechPhase === 'listening') return '듣고 있어요';
      return heard ? `“${heard}”` : '';
    }

    function showHeardLine() {
      const line = document.getElementById('heardLine');
      if (line) {
        line.textContent = heardLineText();
        line.hidden = !line.textContent;
      }
      updateDriveScreen();
    }

    window.onSpeechEvent = function(jsonText) {
      const info = JSON.parse(jsonText);
      if (info.seq !== speechSeq) return; // 지난 말에 대한 늦은 알림
      if (info.event === 'paused' || info.event === 'resumed') {
        speechPaused = info.event === 'paused';
        return;
      }
      speechPhase = info.event === 'listening' ? 'listening' : 'idle';
      showHeardLine();
      if (currentMode === 'lesson') { onLessonSpeech(info); return; }
      if (info.event === 'heard') onHeard(info.text, info.reference);
      else if (info.event === 'silence') onUnclear();
      else if (info.event === 'listening') {
        listenSince = listenSince || performance.now();
        applyNaviEta();
      }
      else {
        if (info.event === 'micFailed') micBroken = true;
        applyNaviEta();
        syncJourney();
        if (hasArrived) closeAfterArrival();
        else if (info.event === 'stopped') endWithoutSpeaking();
        else if (!listenIfMicIsReady()) advanceWithoutMic();
      }
    };

    // 첫 말을 하는 사이에 음성 모델이 준비되었으면 지금부터 듣는다.
    function listenIfMicIsReady() {
      if (!currentMode || isParkedScreen() || isDialogueDone() || !listenNow()) return false;
      speak([], listenNow());
      return true;
    }

    // 음악이나 통화가 소리를 돌려주지 않으면 끼어들지 않고 대화를 마친다.
    function endWithoutSpeaking() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      tripMuted = true;
      setStage('QUIET_END');
    }

    // 마이크를 쓸 수 없는 차에서는 달리는 동안 답을 받을 길이 없다.
    // 가족이 이야기할 틈을 둔 뒤 다음 단계로 넘어가, 질문 하나에서 멈춰 있지 않게 한다.
    function advanceWithoutMic() {
      if (currentMode === 'lesson' || !isDrivingMode || canListen() || !currentMode || isParkedScreen() || isDialogueDone() || stage === 'PARENT_BRIDGE') return;
      clearTimeout(noMicTimer);
      noMicTimer = setTimeout(() => {
        if (speechPhase === 'idle' && isDrivingMode) skipQuestion();
      }, NO_MIC_WAIT_MS);
    }

    function onHeard(text, reference) {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      const result = Journey.interpret(stage, text, reference, currentChoices, currentRule);
      if (result.kind === 'answer') handleAnswer(result.answer, result.heard);
      else if (result.kind === 'quiet') {
        rememberMorning({ rest: true });
        setStage('REST');
      } else if (result.kind === 'sad') {
        rememberMorning({ rest: true }); // 「오늘은 질문 없이」라고 했으니 그날은 다시 묻지 않는다
        setStage('REST_SOFT');
      }
      else if (result.kind === 'repeat') render();
      else if (performance.now() - listenSince < LISTEN_PATIENCE_MS) speak([], listenNow()); // 잡음일 수 있으니 재촉하지 않고 더 듣는다
      else onUnclear();
    }

    // 한 번 더 물어보고, 그래도 답이 없으면 재촉하지 않고 멈춘다 (기획안 ⑤)
    function onUnclear() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      if (stage === 'AFTER_DETAIL') { setStage('PARENT_BRIDGE'); return; } // 더 말하지 않아도 된다고 했으니 재촉하지 않는다
      unclearCount++;
      listenSince = 0;
      if (unclearCount >= 2) setStage('QUIET_END');
      else speak(['error_repeat'], listenNow());
    }

    // 도착하면 진행 중이던 질문을 마치고 인사한 뒤 첫 화면으로 돌아간다.
    function finishOnArrival() {
      if (!currentMode || isParkedScreen()) return;
      if (currentMode === 'lesson') {
        hasArrived = true;
        if (lessonRun.done) closeAfterArrival();
        else if (lessonRun.stopped) endLesson();
        else fitLessonToEta(0);
        return;
      }
      hasArrived = true;
      if (!isDialogueDone() || (currentMode === 'afternoon' && stage === 'ETA_SHORT')) setStage('DONE');
      if (speechPhase === 'idle') closeAfterArrival();
    }

    function closeAfterArrival() {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => { if (hasArrived) goHome(); }, ARRIVAL_CLOSE_MS);
    }

    // ========================================================
    // 시간 맞춤 수업 (11.01 회의)
    // 조립과 판단은 dait-lesson.js가 맡고, 여기는 수업을 틀고 화면을 그린다.
    // 답을 말하라고 요구하지 않는다. 기록을 켠 사람의 답만 이 기기에 글로 남긴다.
    // ========================================================
    const LESSON_KEY = 'dait.lessonProgress';
    const LESSON_RECORD_KEY = 'dait.lessonRecord';
    let lessonRun = null; // 지금 듣는 교시: { lesson, trip, pieces, index, heard, answers, reachedEnd, done, finished, stopped, saved }
    let lessonMinutes = Lesson.DEFAULT_MINUTES;
    let lessonSubject = ''; // 고르는 화면의 과목 칩. 빈 값은 전체
    let lessonTimer = null;
    const TOP_SPEED_MPS = 50; // 이보다 빨리 줄어든 남은 거리는 달린 것이 아니라 목적지를 바꾼 것이다

    function lessonProgress() {
      return Lesson.normalize(readStored(LESSON_KEY));
    }

    function lessonRecordOn() {
      return readStored(LESSON_RECORD_KEY) === true;
    }

    function canRecordAnswer() {
      return lessonRecordOn() && canListen();
    }

    function openLessons() {
      if (isDrivingMode) return;
      const eta = remainMinutes();
      lessonMinutes = eta !== null ? Lesson.minutesFor(eta) : Lesson.DEFAULT_MINUTES;
      lessonSubject = '';
      currentMode = 'lessonPick';
      render();
    }

    function pickLessonTime(minutes) {
      lessonMinutes = minutes;
      if (armed && armed.lesson) armed.minutes = minutes;
      render();
    }

    function pickLessonSubject(subject) {
      lessonSubject = subject;
      render();
    }

    // 긴 이동이면 교시를 짜고, 아니면 고른 수업 하나로 교시 하나를 짠다.
    function lessonTripFor(lessonId) {
      const lesson = DAIT_LESSONS.find(item => item.id === lessonId);
      const order = Lesson.isLongTrip(lessonMinutes) ? Lesson.tripOrder(DAIT_LESSONS, lessonProgress().records, lessonId) : [lesson];
      return Lesson.planTrip(order, lessonMinutes);
    }

    // 출발하면 들려주기를 수업에도 쓴다. 마이크는 답을 남기기로 한 사람에게만 묻는다.
    function toggleLessonArm(lessonId) {
      if (isDrivingMode) return;
      if (armed && armed.lesson === lessonId) { disarm(); render(); return; }
      if (lessonRecordOn() && askMicFirst(() => toggleLessonArm(lessonId))) return;
      disarm();
      arm({ mode: 'lesson', lesson: lessonId, minutes: lessonMinutes });
      render();
    }

    function toggleLessonRecord() {
      const on = !lessonRecordOn();
      writeStored(LESSON_RECORD_KEY, on);
      if (on) micAsked = false; // 답을 남기겠다고 고른 지금 마이크 허락을 묻는다
      if (!on || !askMicFirst(render)) render();
    }

    function lessonRecordLabel() {
      if (!lessonRecordOn()) return '꺼짐';
      return canListen() || micState() === 'loading' ? '켜짐' : '켜짐, 마이크를 쓸 수 없어요';
    }

    function doneHomework() {
      writeStored(LESSON_KEY, Lesson.finishHomework(lessonProgress()));
      render();
    }

    function forgetLessonAnswers() {
      writeStored(LESSON_KEY, Lesson.forgetAnswers(lessonProgress()));
      render();
    }

    function renderLessonPick(container) {
      const progress = lessonProgress();
      const eta = remainMinutes();
      const choices = eta !== null ? [Lesson.minutesFor(eta)] : [...Lesson.TIME_CHOICES, ...Lesson.LONG_CHOICES];
      if (!choices.includes(lessonMinutes)) lessonMinutes = eta !== null ? choices[0] : Lesson.DEFAULT_MINUTES;
      const trip = Lesson.planTrip(Lesson.tripOrder(DAIT_LESSONS, progress.records, armed && armed.lesson), lessonMinutes);
      const periods = trip.lesson ? Lesson.periods(trip) : [];
      const lessons = Lesson.recommend(DAIT_LESSONS, trip.minutes, progress.records);
      const subjects = Lesson.subjects(DAIT_LESSONS.filter(lesson => lessons.includes(lesson)));
      if (!subjects.includes(lessonSubject)) lessonSubject = '';
      const reserved = armed && armed.lesson ? DAIT_LESSONS.find(lesson => lesson.id === armed.lesson) : null;
      const scrolled = document.querySelector('.lesson-main')?.scrollTop || 0;
      const km = Math.round(progress.km[Lesson.monthOf(toYmd(new Date()))] || 0);
      const answers = progress.records.flatMap(record => record.answers).slice(-3).reverse();
      const mileage = km ? `이번 달 ${km}km ${Lesson.mileageLine(km)}`.trim() : '';
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span class="top-label">수업</span>
          </div>
          <div class="lesson-pick">
            <div class="lesson-main">
              <div class="main-question">${eta === null ? '몇 분 수업을 들을까요?' : `도착까지 ${Lesson.minutesFor(eta)}분, ${periods.length > 1 ? `${periods.length}교시로 들어요` : '이 수업을 들어요'}`}</div>
              <div class="lesson-times">
                ${choices.map(minutes => `<button class="choice-chip" aria-pressed="${minutes === lessonMinutes}" onclick="pickLessonTime(${minutes})">${minutes}분</button>`).join('')}
              </div>
              ${periods.length > 1 ? `<div class="card-sub">${periods.map((lesson, i) => `${i + 1}교시 ${escapeHtml(lesson.subject)}`).join(' · ')} · 쉬는 시간 ${Lesson.BREAK_MINUTES}분</div>` : ''}
              ${subjects.length > 1 ? `<div class="lesson-subjects">
                ${['', ...subjects].map(subject => `<button class="choice-chip" aria-pressed="${subject === lessonSubject}" data-subject="${escapeHtml(subject)}" onclick="pickLessonSubject(this.dataset.subject)">${escapeHtml(subject || '전체')}</button>`).join('')}
              </div>` : ''}
              ${reserved ? `<div class="card-sub">출발하면 들려줄게요: ${escapeHtml(reserved.title)}</div>` : ''}
              ${lessons.length === 0 ? '<div class="settings-message">이 시간에 맞는 수업이 아직 없어요</div>' : ''}
              ${Lesson.bySubject(lessons, lessonSubject).map(lesson => `<div class="lesson-row">
                <button class="choice-chip" onclick="startLesson('${lesson.id}')">
                  <span class="lesson-title">${escapeHtml(lesson.title)}</span>
                  <span class="lesson-meta">${escapeHtml(lesson.subject)} · ${escapeHtml(lesson.field)} · 약 ${Math.round(Lesson.totalSeconds(Lesson.assemble(lesson, trip.minutes)) / 60)}분</span>
                </button>
                <button class="card-btn quiet" onclick="toggleLessonArm('${lesson.id}')">${reserved === lesson ? '예약 취소' : '출발하면 듣기'}</button>
              </div>`).join('')}
            </div>
            <div class="lesson-side">
              <div class="card-label">배움과 이어진 수</div>
              <div class="card-focus">이음 ${progress.ieum}</div>
              ${mileage ? `<div class="card-sub">${escapeHtml(mileage)}</div>` : ''}
              ${progress.homework ? `<div class="card-label">숙제</div><div class="card-sub">${escapeHtml(progress.homework.title)}</div><button class="card-btn" onclick="doneHomework()">했어요</button>` : ''}
              <button class="card-btn quiet" onclick="toggleLessonRecord()">내 답 글로 남기기: ${lessonRecordLabel()}</button>
              <div class="card-sub">켜면 발문에 말한 답을 이 차 안에만 글로 남겨요. 녹음 파일은 만들지 않고 서버로 보내지 않아요.</div>
              ${answers.map(answer => `<div class="card-sub">${escapeHtml(answer.question)}: “${escapeHtml(answer.text)}”</div>`).join('')}
              ${answers.length ? '<button class="card-btn quiet" onclick="forgetLessonAnswers()">남긴 답 지우기</button>' : ''}
            </div>
          </div>
        </div>
      `;
      const main = document.querySelector('.lesson-main');
      if (main) main.scrollTop = scrolled; // 예약을 눌러도 보던 자리에 머문다
    }

    function renderLesson(container) {
      const run = lessonRun;
      const piece = run.pieces[run.index];
      const resting = !run.done && Lesson.isBreak(piece);
      const title = run.done ? lessonDoneLine(run) : run.stopped ? '수업을 잠시 멈췄어요' : piece.line;
      const replay = `<button class="primary-btn" onclick="handlePrimaryAction()">${run.stopped ? '이어 듣기' : '다시 듣기'}</button>`;
      const buttons = run.done ? '<button class="primary-btn" onclick="handlePrimaryAction()">마치기</button>'
        : `${resting ? '' : replay}<button class="primary-btn secondary" onclick="skipQuestion()">넘기기</button>`;
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span class="top-label">${escapeHtml(lessonLabel(run, resting))}</span>
          </div>
          <div class="dialogue-card">
            <div class="card-center">
              <div class="main-question">${escapeHtml(title)}</div>
              ${run.done || resting || piece.voiced ? '' : '<div class="card-sub">음원 준비 중</div>'}
              <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
            </div>
          </div>
          <div class="bottom-bar">${buttons}</div>
        </div>
      `;
    }

    function lessonLabel(run, resting) {
      const { number, count } = run.trip;
      if (resting) return `${number}교시 마침`;
      return number > 1 || count > 0 ? `${number}교시 ${run.lesson.subject}` : `${run.lesson.subject} 수업`;
    }

    function lessonDoneLine(run) {
      return run.trip.earned ? `배움과 이어졌어요, 이음 +${run.trip.earned}` : '수업을 멈췄어요. 다음에 이어 가요';
    }

    function isLessonResting() {
      return !!lessonRun && !lessonRun.done && Lesson.isBreak(lessonRun.pieces[lessonRun.index]);
    }

    function startLesson(lessonId) {
      const trip = lessonTripFor(lessonId);
      if (!trip.lesson || !Lesson.fits(trip.lesson, trip.minutes)) return;
      if (lessonRecordOn() && askMicFirst(() => startLesson(lessonId))) return;
      disarm();
      tripForDoor = null; // 내릴 때 한마디가 수업을 끊고 지나가지 않게 한다
      clearTimeout(doorTimer);
      currentMode = 'lesson';
      stage = '';
      hasArrived = false;
      micBroken = false;
      startPeriod({ ...trip, earned: 0, endsAt: Date.now() + lessonMinutes * 60 * 1000 });
      syncJourney();
    }

    // 교시마다 기록을 따로 남기려고 교시마다 새로 시작한다. 앞 교시를 마쳤으면 그 복습이 앞에 붙는다.
    function startPeriod(trip) {
      const pieces = Lesson.plan(trip.lesson, DAIT_LESSONS, trip.minutes, lessonProgress().records);
      const run = {
        lesson: trip.lesson, trip, pieces: Lesson.withBreak(pieces, trip), plannedSeconds: Lesson.lessonSeconds(pieces),
        index: 0, heard: [], answers: [], meters: 0, lastMeters: null, lastMetersAt: 0,
        reachedEnd: false, done: false, finished: false, stopped: false, saved: false
      };
      lessonRun = run;
      setTimeout(() => { if (lessonRun === run) endLesson(); }, TRIP_CAP_MS); // 차 상태가 멈춰도 앞쪽 작업이 끝없이 남지 않게 한다
      heard = '';
      noteLessonNavi();
      fitLessonToEta(remainMinutes());
      playLessonPiece();
    }

    // 길 안내가 있으면 남은 시간을, 없으면 고른 시간에서 지난 만큼 뺀 시간을 뒤 교시에 나눈다.
    function tripSeconds(trip) {
      const eta = remainMinutes();
      return eta !== null ? eta * 60 : (trip.endsAt - Date.now()) / 1000;
    }

    function playLessonPiece() {
      const run = lessonRun;
      if (!run || run.done) return;
      clearTimeout(lessonTimer);
      run.stopped = false;
      const piece = run.pieces[run.index];
      if (Lesson.isClosing(piece)) run.reachedEnd = true;
      if (Lesson.isBreak(piece)) {
        saveLesson(run); // 마친 교시는 쉬는 시간이 시작될 때 바로 남긴다
        run.restedFrom = Date.now();
      }
      heard = '';
      speakLessonPiece(piece);
      renderStage();
      updateDriveScreen(piece.line);
    }

    // 음원이 오기 전에는 대사 길이만큼 소리 없이 기다려, 흐름과 시간 맞춤을 그대로 시험한다.
    function speakLessonPiece(piece) {
      if (piece.voiced) {
        speak([piece.clip], Lesson.isQuestion(piece) && canRecordAnswer() ? 'free' : '');
        return;
      }
      stopSpeech();
      speechPhase = 'speaking';
      const seq = speechSeq;
      lessonTimer = setTimeout(() => window.onSpeechEvent(JSON.stringify({ event: 'ended', seq })), Lesson.speechSeconds(piece) * 1000);
    }

    function nextLessonPiece() {
      const run = lessonRun;
      if (!run || run.done) return;
      clearTimeout(lessonTimer);
      const rested = Lesson.isBreak(run.pieces[run.index]);
      run.index++;
      if (rested) startPeriod(Lesson.nextPeriod(run.trip, tripSeconds(run.trip)));
      else if (run.index >= run.pieces.length) endLesson();
      else playLessonPiece();
    }

    function onLessonSpeech(info) {
      const run = lessonRun;
      if (!run || run.done || info.event === 'listening') return;
      const piece = run.pieces[run.index];
      if (Lesson.isBreak(piece) && !isDrivingMode) { endLesson(); return; } // 쉬는 시간이 끝났을 때 주차 중이면 사람 없는 차에서 말을 시작하지 않는다
      if (info.event === 'stopped') {
        run.stopped = true; // 음악이나 통화가 소리를 돌려주지 않으면 사람이 이어 듣기를 누를 때까지 멈춘다
        renderStage();
        updateDriveScreen();
        return;
      }
      if (Lesson.isBreak(piece)) { nextLessonPiece(); return; }
      if (!run.heard.includes(piece)) run.heard.push(piece);
      if (info.event === 'heard') {
        if (info.text.length <= 12 && Journey.isQuiet(info.text)) { endLesson(); return; }
        run.answers.push({ level: piece.level, question: piece.line, text: info.text });
        nextLessonPiece();
      } else if (info.event === 'silence') nextLessonPiece(); // 답하지 않아도 재촉하지 않는다
      else if (Lesson.isQuestion(piece)) {
        if (info.event === 'micFailed') micBroken = true;
        lessonTimer = setTimeout(nextLessonPiece, piece.wait * 1000); // 생각할 틈
      } else nextLessonPiece();
    }

    // 내비의 남은 거리로 이번 수업에서 달린 거리를 잰다. 길 안내가 없으면 거리를 더하지 않는다.
    function noteLessonNavi() {
      const run = lessonRun;
      if (!run || !naviInfo || !Number.isFinite(naviInfo.remainDistance)) return;
      const now = Date.now();
      if (run.lastMeters !== null) {
        const reachable = TOP_SPEED_MPS * (now - run.lastMetersAt) / 1000;
        run.meters += Math.min(Math.max(0, run.lastMeters - naviInfo.remainDistance), reachable);
      }
      run.lastMeters = naviInfo.remainDistance;
      run.lastMetersAt = now;
    }

    function fitLessonToEta(minutes) {
      const run = lessonRun;
      if (!run || run.done || minutes === null) return;
      // 쉬는 시간을 지낸 만큼은 앞으로 쉴 시간이 아니므로 남은 시간에 도로 더해 맞춘다.
      const rested = isLessonResting() ? (Date.now() - run.restedFrom) / 1000 : 0;
      const fitted = Lesson.fitTrip(run.pieces, run.index, minutes * 60 + rested, run.lesson, run.trip);
      run.pieces = fitted.pieces;
      run.trip.count = fitted.count;
      if (run.index >= run.pieces.length) endLesson(); // 쉬는 시간에 뒤 교시가 다 빠졌다
    }

    function endLesson() {
      const run = lessonRun;
      if (!run || run.done) return;
      clearTimeout(lessonTimer);
      stopSpeech();
      run.done = true;
      saveLesson(run);
      heard = '';
      render();
      updateDriveScreen();
      if (hasArrived) closeAfterArrival();
    }

    // 교시마다 한 번만 남긴다. 마친 교시는 저마다 이음과 숙제가 된다.
    function saveLesson(run) {
      if (run.saved) return;
      run.saved = true;
      run.finished = Lesson.countsAsFinished(run);
      if (run.finished) run.trip.earned++;
      if (run.heard.length > 0) {
        writeStored(LESSON_KEY, Lesson.finishLesson(lessonProgress(), run.lesson, toYmd(new Date()), run.finished, run.meters / 1000, run.answers));
      }
    }

    // 처음으로 돌아갈 때 듣던 수업을 정리한다.
    function closeLesson() {
      endLesson();
      lessonRun = null;
    }

    // 주행 중에는 고르는 화면을 열지 않고, 가는 길에 들어갈 수업 하나를 버튼 하나로 제안한다.
    function lessonOffer(trip) {
      if (trip.kind !== 'weekend' && !(naviInfo && !trip.known)) return null;
      return Lesson.recommend(DAIT_LESSONS, Lesson.minutesFor(remainMinutes()), lessonProgress().records)[0] || null;
    }

    // ========================================================
    // 학교 정보 (나이스 교육정보 개방 포털)
    // ========================================================
    const NEIS_URL = 'https://relay-khaki-omega.vercel.app/neis/';
    const SCHOOL_KEY = 'dait.school';
    const DAYS_KEY = 'dait.schoolDays';
    const DAYS_AHEAD = 7;
    const EVENTS_KEY = 'dait.schoolEvents';
    const EVENT_DAYS_AHEAD = 45;
    const GRADE_FIELDS = ['ONE', 'TW', 'THREE', 'FR', 'FIV', 'SIX'];
    const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    let school = readStored(SCHOOL_KEY);
    let schoolDays = readStored(DAYS_KEY) || {};
    let schoolEvents = readStored(EVENTS_KEY) || {};
    let settings = {};
    let neisSeq = 0;
    let homeStale = false;
    const neisWaiting = {};

    function readStored(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }

    function writeStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.log('Storage error:', e); }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function toYmd(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}${month}${day}`;
    }

    function fromYmd(ymd) {
      return new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)) - 1, Number(ymd.slice(6, 8)));
    }

    function upcomingDates() {
      const start = new Date();
      return Array.from({ length: DAYS_AHEAD + 1 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }

    function dayLabel(ymd) {
      const dates = upcomingDates();
      if (ymd === toYmd(dates[0])) return '오늘';
      if (ymd === toYmd(dates[1])) return '내일';
      return WEEKDAYS[fromYmd(ymd).getDay()];
    }

    // 인증키는 중계 서버에만 있다. 앱에서는 Kotlin이 대신 받고, 브라우저 미리보기는 중계 서버에 직접 묻는다.
    window.onNeisResult = function(requestId, body) {
      const resolve = neisWaiting[requestId];
      delete neisWaiting[requestId];
      if (resolve) resolve(body);
    };

    function neisBody(service, query) {
      if (window.AndroidBridge) {
        return new Promise(resolve => {
          const requestId = ++neisSeq;
          neisWaiting[requestId] = resolve;
          window.AndroidBridge.neisGet(requestId, service, query);
        });
      }
      return fetch(`${NEIS_URL}${service}?${query}`).then(response => response.text());
    }

    async function neisRows(service, params) {
      const query = new URLSearchParams({ Type: 'json', pIndex: '1', pSize: '100', ...params }).toString();
      const data = JSON.parse(await neisBody(service, query));
      if (data.RESULT) {
        if (data.RESULT.CODE === 'INFO-200') return [];
        throw new Error(data.RESULT.CODE);
      }
      return data[service][1].row;
    }

    function mainDish(dishes) {
      const items = dishes.split(/<br\s*\/?>/i)
        .map(item => item.replace(/\([^)]*\)/g, '').replace(/[*]/g, '').replace(/[a-zA-Z]+\s*$/, '').trim())
        .filter(Boolean);
      return items.find(item => !/(밥|국|탕|찌개|김치|깍두기|우유|주스)$/.test(item)) || items[0] || '';
    }

    // 시간표 창구는 학교급마다 다르다.
    const SCHOOL_KINDS = {
      '초등학교': { service: 'elsTimetable', grades: [1, 2, 3, 4, 5, 6] },
      '중학교': { service: 'misTimetable', grades: [1, 2, 3] },
      '고등학교': { service: 'hisTimetable', grades: [1, 2, 3] }
    };

    function timetableService(target) {
      return (SCHOOL_KINDS[target.kind] || SCHOOL_KINDS['초등학교']).service;
    }

    // 학사일정에서 우리 학년 일정만 날짜별로 모은다. 토요휴업일은 뺀다.
    function eventsByDay(rows, grade) {
      const days = {};
      rows.forEach(row => {
        if (row.EVENT_NM.includes('토요휴업')) return;
        const marks = GRADE_FIELDS.map(field => row[`${field}_GRADE_EVENT_YN`]);
        if (marks.includes('Y') && marks[Number(grade) - 1] !== 'Y') return;
        (days[row.AA_YMD] = days[row.AA_YMD] || []).push({ name: row.EVENT_NM, off: row.SBTR_DD_SC_NM !== '해당없음' });
      });
      return days;
    }

    async function refreshSchoolEvents(target) {
      const today = toYmd(new Date());
      try {
        const rows = await neisRows('SchoolSchedule', {
          ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code, AA_FROM_YMD: today, AA_TO_YMD: toYmd(new Date(fromYmd(today).getTime() + EVENT_DAYS_AHEAD * 86400000))
        });
        if (school !== target) return;
        schoolEvents = eventsByDay(rows, target.grade);
        writeStored(EVENTS_KEY, schoolEvents);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School events error:', e);
      }
    }

    // 시간표는 하루씩 받는다.
    async function refreshSchoolDays() {
      if (!school) return;
      const target = school;
      refreshSchoolEvents(target);
      const dates = upcomingDates();
      const ymds = dates.map(toYmd);
      const base = { ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code };
      try {
        const schoolDates = dates.filter(date => date.getDay() !== 0 && date.getDay() !== 6);
        const [timetables, meals] = await Promise.all([
          Promise.all(schoolDates.map(date => neisRows(timetableService(target), {
            ...base, GRADE: target.grade, CLASS_NM: target.classNm, ALL_TI_YMD: toYmd(date)
          }))),
          neisRows('mealServiceDietInfo', {
            ...base, MMEAL_SC_CODE: '2', MLSV_FROM_YMD: ymds[0], MLSV_TO_YMD: ymds[ymds.length - 1]
          })
        ]);
        const days = {};
        ymds.forEach(ymd => { days[ymd] = { subjects: [], meal: '' }; });
        timetables.flat().sort((a, b) => Number(a.PERIO) - Number(b.PERIO)).forEach(row => {
          const day = days[row.ALL_TI_YMD];
          if (day && !day.subjects.includes(row.ITRT_CNTNT)) day.subjects.push(row.ITRT_CNTNT);
        });
        meals.forEach(row => {
          if (days[row.MLSV_YMD]) days[row.MLSV_YMD].meal = mainDish(row.DDISH_NM);
        });
        if (school !== target) return;
        schoolDays = days;
        lastRefreshDay = ymds[0];
        writeStored(DAYS_KEY, days);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School data error:', e);
      }
    }

    // 시험 날은 시간표가 없을 수 있으므로 점심이나 학사일정이 있어도 수업일로 본다.
    function isClassDay(ymd) {
      if (!Journey.isSchoolDay(ymd, schoolEvents)) return false;
      const day = schoolDays[ymd];
      return !!(day && (day.subjects.length > 0 || day.meal)) || !!schoolEvents[ymd];
    }

    // 앱을 다시 볼 때 날짜가 바뀌었으면 자료를 새로 받고 첫 화면도 지금 시각으로 다시 그린다.
    window.onAppResumed = function() {
      syncLocation();
      if (school && lastRefreshDay !== toYmd(new Date())) refreshSchoolDays();
      refreshHomeIfIdle();
    };

    function schoolPlan() {
      const today = toYmd(new Date());
      const ymd = Object.keys(schoolDays).sort()
        .find(key => key >= today && isClassDay(key));
      if (!school || !ymd) return null;
      const day = schoolDays[ymd];
      return { ...day, ymd, weekday: fromYmd(ymd).getDay(), label: dayLabel(ymd), hasPe: day.subjects.some(subject => subject.replace(/[^가-힣]/g, '').startsWith('체육')) };
    }

    function schoolLevel() {
      return school ? school.kind.charAt(0) : '초';
    }

    // 지금 여정에 맞는 교사 규칙. 하교는 오늘, 등교는 다가오는 수업일을 기준으로 본다.
    function ruleFor(mode) {
      if (!school) return null;
      const plan = schoolPlan();
      const ymd = mode === 'afternoon' || !plan ? toYmd(new Date()) : plan.ymd;
      return Journey.pickRule(DAIT_RULES.rules, { mode, level: schoolLevel(), ymd, events: schoolEvents });
    }

    function subjectChoices() {
      const plan = schoolPlan();
      if (!plan || plan.subjects.length === 0) return null;
      const preferred = ['체육', '과학', '국어'].filter(subject => plan.subjects.includes(subject));
      return [...new Set([...preferred, ...plan.subjects])].slice(0, 3);
    }

    // 지금 여정을 한 곳에서 정한다. 첫 화면·칸·대화 시작이 모두 이것을 따른다.
    // 우선순위: 내비 목적지(학교/집) → 주말·방학은 다음 수업일 준비 → 다니는 길 기억 → 수업일의 시간대(오전 등교·오후 하교)
    function currentTrip() {
      const now = new Date();
      const minutes = naviRemainMinutes();
      const mins = minutes === null ? null : Math.max(1, Math.round(minutes));
      if (naviInfo && naviInfo.name) {
        const fig = { figure: mins === null ? '' : String(mins), figureUnit: mins === null ? '' : '분' };
        if (school && placeMatches(naviInfo, school)) return { mode: 'morning', kind: 'school', known: true, where: `${school.name}까지`, minutes: mins, when: '', ...fig };
        if (homePlace && placeMatches(naviInfo, homePlace)) return { mode: 'afternoon', kind: 'home', known: true, where: '집까지', minutes: mins, when: '', ...fig };
      }
      // 여기부터는 목적지가 학교도 집도 아니거나 없다. 남은 시간은 쓰지 않는다
      const unknownMins = null;
      const todayYmd = toYmd(now);
      const todayHasClass = isClassDay(todayYmd);
      const isWeekend = now.getDay() === 0 || now.getDay() === 6;
      if (school && schoolDays[todayYmd] && !todayHasClass) {
        const plan = schoolPlan();
        const label = plan ? plan.label : '다음 수업일';
        return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: `${label} 준비`, figure: label.replace('요일', ''), figureUnit: label.endsWith('요일') ? '요일' : '' };
      }
      if ((!school || !schoolDays[todayYmd]) && isWeekend) return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: '다음 수업일 준비', figure: '월', figureUnit: '요일' };
      const guess = tripGuess(now);
      const afternoon = guess ? guess === 'afternoon' : now.getHours() >= 12;
      const hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      return { mode: afternoon ? 'afternoon' : 'morning', kind: afternoon ? 'afternoon' : 'morning', known: false, where: '', minutes: unknownMins, when: afternoon ? '오늘 오후' : '오늘 아침', figure: hhmm, figureUnit: '' };
    }

    // 교사 규칙이 있는 날은 첫 화면의 말도 규칙을 따른다.
    function homeInfo(trip) {
      const info = plainHomeInfo(trip);
      const rule = ruleFor(trip.mode);
      if (!rule) return info;
      const plan = schoolPlan();
      const ahead = !!plan && plan.ymd !== toYmd(new Date());
      if (ahead && rule.eventYmd !== plan.ymd) return info; // 다음 수업일의 일정이 아니면 미리 말하지 않는다
      return {
        ...info,
        title: ahead ? `${plan.label} ${rule.eventName}` : rule.title,
        desc: rule.desc,
        ...(rule.prep ? { prepLabel: '준비물', prep: rule.prep, prepSub: '학교 안내 확인' } : {})
      };
    }

    // 오후에는 다음 수업일의 점심을 보여 준다.
    function nextMeal() {
      const today = toYmd(new Date());
      const ymd = Object.keys(schoolDays).sort().find(key => key > today && isClassDay(key));
      if (!ymd) return { mealLabel: '다음 점심', meal: '확인 필요', mealSub: '' };
      return { mealLabel: `${dayLabel(ymd)} 점심`, meal: schoolDays[ymd].meal || '확인 필요', mealSub: '' };
    }

    function plainHomeInfo(trip) {
      const plan = school ? schoolPlan() : null;
      const dayWord = plan ? plan.label : (school ? '다음 수업일' : '오늘');
      const memory = readStored(MEMORY_KEY);
      const morningSubject = memory && memory.date === toYmd(new Date()) ? memory.subject : null;
      const prepLine = !school ? { prep: '등록 필요', prepSub: '' }
        : !plan ? { prep: '확인 필요', prepSub: '' }
        : plan.hasPe ? { prep: '체육복', prepSub: '시간표 기준' }
        : { prep: '학교 안내 확인', prepSub: '' };
      const mealLine = !school ? { meal: '등록 필요', mealSub: '' } : { meal: plan && plan.meal ? plan.meal : '확인 필요', mealSub: '' };

      const subjects = plan ? plan.subjects : [];
      // 오늘의 질문: 시간표에서 고른다. 기획안 교사 규칙표의 과목별 질문
      const common = {
        question: Journey.pickQuestion(DAIT_RULES.rules, subjects, schoolLevel()),
        scheduleLabel: `${dayWord} 시간표`,
        subjects: subjects.slice(0, 6)
      };

      if (!school) {
        return {
          title: '학교를 등록해 주세요',
          desc: '시간표와 점심으로 이야기를 시작해요',
          prepLabel: '준비물', ...prepLine,
          mealLabel: '점심', ...mealLine,
          ...common
        };
      }
      if (trip.mode === 'afternoon') {
        return {
          title: morningSubject ? `아침에 고른 ${morningSubject}, 어땠나요?` : '오늘은 어땠나요?',
          desc: '기억나는 장면 하나만 들려줘요',
          prepLabel: '아침에 고른 수업', prep: morningSubject || '없음', prepSub: '',
          ...nextMeal(),
          ...common
        };
      }
      if (trip.kind === 'weekend') {
        return {
          title: `${dayWord} 준비 됐나요?`,
          desc: plan ? (plan.hasPe ? '체육이 있어요. 체육복을 미리 챙겨요' : `${plan.subjects.slice(0, 3).join(' · ')}`) : '수업일이 다가오면 시간표를 보여 줘요',
          prepLabel: `${dayWord} 준비물`, ...prepLine,
          mealLabel: `${dayWord} 점심`, ...mealLine,
          ...common
        };
      }
      return {
