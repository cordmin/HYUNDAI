<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAIT</title>
  <style>
    :root {
      --surface: #F3F6F9;
      --paper: #FFFFFF;
      --accent: #004DA0;
      --accent-hover: #003673;
      --accent-soft: #E5EFFB;
      --ink: #0E1B2A;
      --muted: #5B6D82;
      --outline: #D5DFEA;
      --control: #E8EEF5;
      --control-hover: #DCE5F0;
      /* 큰 카드 색. 여정에 따라 바뀐다 */
      --hero-a: #061B3D;
      --hero-b: #0B3B7A;
      --hero-glow: #22B8E8;
      --hero-ink: #0B2A5B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #D5DBE3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Pleos Display */
    .pleos-display {
      width: 100%;
      max-width: 1060px;
      height: 600px;
      background:
        radial-gradient(80% 60% at 100% 100%, #E7EEF8 0%, transparent 60%),
        var(--surface);
      border-radius: 28px;
      border: 2px solid #C4CDD7;
      box-shadow: 0 24px 50px rgba(11, 26, 44, 0.16);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* In-App Fullscreen Integration for Hyundai Pleos */
    body.in-app {
      background: var(--surface);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    body.in-app .pleos-display {
      max-width: 100%;
      height: 100vh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    body.in-app .stage-container {
      padding: 30px 40px;
    }

    .restricted-message {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.6px;
    }

    /* Driving Simple Screen: 문장 하나와 큰 버튼 둘 */
    .drive-screen {
      position: absolute;
      inset: 0;
      background: var(--surface);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 48px;
      text-align: center;
    }
    body.driving .drive-screen { display: flex; }
    .drive-sentence {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--ink);
      letter-spacing: -0.6px;
      max-width: 900px;
    }
    .drive-sub {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .drive-actions {
      display: flex;
      gap: 20px;
    }
    .drive-btn {
      min-width: 220px;
      height: 76px;
      padding: 0 32px;
      border-radius: 24px;
      border: 1px solid var(--outline);
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }
    .drive-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .drive-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Demo Panel (시연용) */
    .demo-panel {
      position: absolute;
      right: 36px;
      bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 500;
    }
    body.in-app .demo-panel { right: 40px; }
    body.driving .demo-panel { z-index: 10000; }
    body.real-driving .demo-panel { display: none; } /* 실제 주행 중에는 문장 하나와 큰 버튼 둘만 */
    .demo-panel button {
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--control);
      border: 1px solid var(--outline);
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-panel button:hover { background: var(--control-hover); }
    .demo-panel button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .demo-panel button:disabled { cursor: default; opacity: 0.9; }


    /* Main Stage */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px 36px;
      position: relative;
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ========================================================
       첫 화면: 여정 하나를 크게, 보조 정보는 얇게
       왼쪽 큰 카드 = 지금 여정(어디로 · 몇 분 · 할 말 한 문장)
       오른쪽 = 오늘 챙길 것 두 줄 + 다른 여정으로 가는 작은 길
       ======================================================== */
    .bento-stage {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    /* 큰 카드 */
    .bento-hero {
      background:
        radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--hero-glow) 55%, transparent) 0%, transparent 55%),
        linear-gradient(160deg, var(--hero-b) 0%, var(--hero-a) 100%);
      border-radius: 28px;
      padding: 26px 30px 28px;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      min-height: 0;
      box-shadow: 0 24px 48px -18px color-mix(in srgb, var(--hero-a) 70%, transparent);
      transition: transform 0.18s ease;
    }
    .bento-hero.afternoon { --hero-a: #3B1033; --hero-b: #8A2E4F; --hero-glow: #FFA14A; --hero-ink: #5B1F3D; }
    .bento-hero.weekend { --hero-a: #1C1F3A; --hero-b: #3C3F6E; --hero-glow: #9A8CFF; --hero-ink: #2A2D55; }
    .bento-hero:hover { transform: translateY(-2px); }
    /* 가는 격자: 차량 계기판의 결 */
    .bento-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 1.2px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 70%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 70%);
      pointer-events: none;
    }
    .hero-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .dait-brand-badge {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
    }
    .school-setting-btn {
      min-height: 48px;
      padding: 8px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.22);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .school-setting-btn:hover { background: rgba(255,255,255,0.18); }
    .hero-top-actions { display: flex; gap: 8px; }

    /* 여정 그림: 출발점에서 목적지까지 한 획. 차 위치 점이 남은 시간만큼 가 있다 */
    .hero-figure {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .hero-route {
      width: 100%;
      height: auto;
      max-height: 100%;
      overflow: visible;
    }
    .hero-route .route-path { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .hero-route .route-done { stroke: #FFFFFF; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .hero-route .route-dot { fill: #FFFFFF; }
    .hero-route .route-dot-halo { fill: var(--hero-glow); opacity: 0.35; }
    .hero-route .route-end { fill: none; stroke: #FFFFFF; stroke-width: 2.5; }
    .hero-route .route-end-fill { fill: var(--hero-glow); }
    .hero-route text { font-family: inherit; font-weight: 800; fill: #FFFFFF; }
    .hero-route .route-figure { font-size: 34px; letter-spacing: -1.5px; }
    .hero-route .route-unit { font-size: 15px; font-weight: 700; fill: rgba(255,255,255,0.75); letter-spacing: 0; }
    .hero-route .route-label { font-size: 13px; font-weight: 700; fill: rgba(255,255,255,0.6); letter-spacing: 0.3px; }

    /* 여정 줄: 어디로 · 몇 분 */
    .hero-trip {
      margin-top: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.2px;
      min-height: 24px;
    }
    .hero-trip strong {
      color: #FFFFFF;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .hero-trip .trip-sep { opacity: 0.45; }

    /* 한 문장 */
    .hero-title {
      margin-top: 8px;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.14;
      letter-spacing: -1.4px;
      text-wrap: balance;
      position: relative;
      z-index: 1;
    }
    .hero-desc {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.4;
      color: rgba(255,255,255,0.78);
      position: relative;
      z-index: 1;
    }
    .hero-trip { position: relative; z-index: 1; }

    /* 시작 버튼 */
    .hero-cta {
      margin-top: 22px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      color: var(--hero-ink);
      padding: 0 10px 0 24px;
      height: 68px;
      border-radius: 20px;
      font-size: 21px;
      font-weight: 800;
      transition: transform 0.15s ease;
    }
    .hero-cta:hover { transform: translateX(2px); }
    .hero-cta-plane {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--hero-ink);
      color: #FFFFFF;
    }
    .cta-left { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .cta-arm {
      margin-left: auto;
      margin-right: 10px;
      height: 40px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cta-arm.on { background: rgba(255, 255, 255, 0.22); }
    .heard-bubble[hidden] { display: none; }

    /* 오른쪽 열 */
    .bento-right-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .info-dual-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .info-mini-tile {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px -14px rgba(11, 26, 44, 0.25);
      border-radius: 20px;
      padding: 18px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 118px;
      min-width: 0;
    }
    .tile-tint-prep { border-top: 4px solid var(--accent); }
    .tile-tint-meal { border-top: 4px solid #C2410C; }
    .mini-tile-label { display: flex; align-items: center; }
    .mini-text-bold {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .text-prep { color: var(--accent); }
    .text-meal { color: #C2410C; }
    .mini-tile-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .mini-tile-focus {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .mini-tile-sub {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
    }

    /* 오른쪽 큰 카드: 다른 여정으로 가는 길 */
    .bento-wide-card {
      flex: 1;
      min-height: 0;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px -14px rgba(11, 26, 44, 0.25);
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .bento-wide-card:hover { border-color: var(--accent); }
    .bento-wide-card.info {
      cursor: default;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    .bento-wide-card.info:hover { border-color: rgba(255,255,255,0.9); border-left-color: var(--accent); }
    .bento-wide-card.info .wide-card-title { font-size: 28px; line-height: 1.25; text-wrap: balance; }
    .wide-card-text { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; min-width: 0; }
    .wide-card-kicker {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .wide-card-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .wide-card-desc {
      font-size: 17px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.35;
    }
    .wide-card-arrow {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .subject-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .subject-chip {
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }
    .subject-chip.pe { background: #E0F2FE; color: #0369A1; }
    .subject-chip.art { background: #FDF2E9; color: #B45309; }
    .subject-chip.sci { background: #ECFDF5; color: #047857; }

    /* Dialogue Screen */
    .dialogue-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .dialogue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .back-btn {
      min-height: 48px;
      padding: 8px 22px;
      border-radius: 16px;
      background: var(--control);
      border: 1px solid var(--outline);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--control-hover); }

    .dialogue-card {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 32px;
      padding: 40px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 20px rgba(28, 46, 42, 0.05);
    }
    .card-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Dialogue Ambient Orb */
    .dialogue-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00B4D8 0%, #0077B6 50%, #04244B 100%);
      box-shadow: 0 0 35px rgba(0, 180, 216, 0.45), inset 0 0 14px rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Voice Visualizer Wave */
    .voice-visualizer {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 32px;
      margin-bottom: 24px;
    }
    .v-bar {
      width: 4px;
      height: 12px;
      background: var(--accent);
      border-radius: 4px;
      transform: scaleY(0.8);
      opacity: 0.9;
    }
    .v-bar:nth-child(2) { animation-delay: 0.15s; height: 26px; }
    .v-bar:nth-child(3) { animation-delay: 0.3s; height: 32px; }
    .v-bar:nth-child(4) { animation-delay: 0.45s; height: 20px; }
    .v-bar:nth-child(5) { animation-delay: 0.6s; height: 14px; }

    .main-question {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
      max-width: 780px;
    }
    .heard-bubble {
      margin-top: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 16px;
      display: inline-block;
    }

    /* Choice Chips */
    .options-row {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-top: 20px;
      justify-content: center;
    }
    .choice-chip {
      flex: 1;
      max-width: 240px;
      height: 60px;
      background: var(--control);
      border: 1px solid var(--outline);
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-chip:hover,
    .choice-chip[aria-pressed="true"] {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Primary Bottom Action */
    .bottom-bar {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }
    .primary-btn.secondary {
      width: 200px;
      background: var(--control);
      color: var(--ink);
      box-shadow: none;
    }
    .primary-btn.secondary:hover { background: var(--control-hover); }
    .primary-btn {
      width: 280px;
      height: 60px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 20px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 77, 160, 0.28);
    }
    .primary-btn:hover { background: var(--accent-hover); }

    /* ========================================================
       시그니처 인트로 스플래시 애니메이션 (Signature Splash Intro)
       ======================================================== */
    .splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background: linear-gradient(145deg, #07172C 0%, #0E294E 50%, #153C70 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      box-shadow: 0 14px 34px rgba(7, 23, 44, 0.32);
      transition: 
        top 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        left 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.22s ease,
        visibility 0.22s ease;
      cursor: pointer;
    }
    .splash-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* Ambient Pulsing Aura behind the logo */
    .splash-aura {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 180, 216, 0.28) 0%, rgba(0, 77, 160, 0.14) 42%, transparent 70%);
      filter: blur(36px);
      transform: scale(0.9);
      pointer-events: none;
    }

    .splash-bg-decor {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.06) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* Brand Container that will FLIP/glide to the top-left */
    .splash-brand-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transform-origin: center center;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    .splash-logo-svg {
      width: 380px;
      height: 130px;
      overflow: visible;
      filter: drop-shadow(0 12px 32px rgba(0, 180, 216, 0.42));
    }

    .splash-ribbon-path {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Dot Pop Animation & Shockwave Ripple */
    .splash-dot-group {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-group.pop {
      animation: dotPopIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dotPopIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.65); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-dot-ripple {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-ripple.expand {
      animation: rippleExpand 0.75s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { r: 3px; stroke-width: 3.5px; opacity: 1; }
      100% { r: 24px; stroke-width: 0.4px; opacity: 0; }
    }

    /* School Settings */
    .settings-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .school-search-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin-top: 14px;
    }
    .school-input {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      user-select: text;
    }
    .place-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-height: 0;
      margin-top: 14px;
      overflow-y: auto;
    }
    .place-row {
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(127,127,127,0.10);
      text-align: left;
    }
    .place-name { font-size: 18px; font-weight: 700; }
    .place-address { margin-top: 2px; font-size: 16px; color: var(--muted); }
    .place-source { margin-top: 10px; font-size: 16px; color: var(--muted); }
    .settings-message {
      margin-top: 12px;
      font-size: 17px;
      font-weight: 600;
      color: var(--muted);
    }
    .settings-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      min-height: 0;
      margin-top: 14px;
      overflow-y: auto;
    }
    .settings-list .choice-chip {
      flex: 0 1 auto;
      min-width: 72px;
      max-width: none;
      padding: 0 18px;
    }
    .school-search-row .choice-chip {
      flex: 0 0 96px;
      height: 52px;
    }

    /* 작은 앱 창(Pleos 분할 화면 등): 잘리는 곳 없이 한 화면에 들어오도록 줄인다 */
    @media (max-height: 540px), (max-width: 860px) {
      .stage-container,
      body.in-app .stage-container {
        min-height: 0;
        padding: 14px 20px 30px;
      }
      .demo-panel,
      body.in-app .demo-panel { right: 20px; }
      .drive-screen { gap: 18px; padding: 24px 28px 36px; }
      .drive-sentence { font-size: 28px; }
      .drive-btn { height: 60px; min-width: 170px; font-size: 20px; }
      .back-btn, .school-setting-btn { min-height: 44px; }
      .school-setting-btn { padding: 6px 14px; font-size: 16px; }

      .bento-stage { gap: 12px; }
      .bento-hero { padding: 18px 22px 20px; border-radius: 22px; }
      .hero-title { font-size: 27px; letter-spacing: -0.8px; }
      .hero-desc { font-size: 15px; }
      .hero-route .route-figure { font-size: 26px; }
      .hero-route .route-label { font-size: 12px; }
      .subject-chip { font-size: 14px; padding: 4px 10px; }
      .hero-trip { font-size: 15px; }
      .hero-title { margin-top: 6px; }
      .hero-desc { margin-top: 6px; }
      .hero-cta { height: 54px; margin-top: 16px; font-size: 18px; padding: 0 6px 0 18px; }
      .hero-cta-plane { width: 40px; height: 40px; }
      .cta-left { gap: 8px; }

      .bento-right-col { gap: 10px; }
      .info-dual-row { gap: 10px; }
      .info-mini-tile { padding: 12px 14px 12px; min-height: 92px; gap: 4px; }
      .mini-text-bold { font-size: 13px; }
      .mini-tile-focus { font-size: 20px; }
      .mini-tile-sub { font-size: 15px; }
      .bento-wide-card { padding: 14px 16px; }
      .wide-card-title { font-size: 22px; }
      .wide-card-desc { font-size: 15px; }
      .wide-card-arrow { width: 38px; height: 38px; }

      .dialogue-top { margin-bottom: 8px; }
      .back-btn { padding: 6px 16px; }
      .dialogue-card { padding: 12px 20px; border-radius: 24px; }
      .dialogue-orb { width: 52px; height: 52px; margin-bottom: 8px; }
      .main-question { font-size: 26px; }
      .heard-bubble { margin-top: 6px; padding: 4px 14px; }
      .options-row { margin-top: 10px; }
      .choice-chip { height: 48px; font-size: 17px; }
      .bottom-bar { margin-top: 8px; }
      .primary-btn { height: 48px; font-size: 17px; }
    }

  </style>
</head>
<body>

  <!-- Pleos Display (Pure App Window) -->
  <div class="pleos-display">

    <!-- Signature Splash Intro Overlay -->
    <div id="splashOverlay" class="splash-overlay" onclick="skipSplashIntro()">
      <div class="splash-bg-decor"></div>
      <div class="splash-aura"></div>
      
      <div id="splashBrandContainer" class="splash-brand-container">
        <svg id="splashLogoSvg" class="splash-logo-svg" viewBox="0 0 100 34" fill="none">
          <defs>
            <linearGradient id="splashFlowGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#38BDF8"/>
            </linearGradient>
            <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Main cursive ribbon D-a-i-t -->
          <path id="splashRibbonPath"
                class="splash-ribbon-path"
                d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10" 
                stroke="url(#splashFlowGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- t crossbar -->
          <path id="splashCrossbarPath"
                class="splash-ribbon-path"
                d="M74 16 h12"
                stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>

          <!-- i Dot Accent (with shockwave ring) -->
          <g id="splashDotGroup" class="splash-dot-group">
            <circle id="splashDotRipple" class="splash-dot-ripple" cx="62" cy="7.5" r="3" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <circle id="splashDot" cx="62" cy="7.5" r="3.2" fill="#38BDF8" filter="url(#neonGlow)"/>
            <circle cx="62" cy="7.5" r="1.5" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Main Stage -->
    <div id="stageArea" class="stage-container">
      <!-- Injected by JS -->
    </div>

    <!-- Driving Simple Screen: 주행 중에는 문장 하나와 큰 버튼 둘만 -->
    <div id="driveScreen" class="drive-screen">
      <div id="driveSentence" class="drive-sentence">주차 후 이어갈게요</div>
      <div id="driveSub" class="drive-sub"></div>
      <div class="drive-actions">
        <button id="driveReplay" class="drive-btn" onclick="driveReplay()">다시 듣기</button>
        <button id="driveNext" class="drive-btn primary" onclick="driveNext()">넘기기</button>
      </div>
    </div>

    <!-- Demo Panel: 시연용 주행 상태와 남은 시간 -->
    <div class="demo-panel">
      <button id="demoDrive" onclick="toggleDrivingDemo()">주행</button>
      <button id="demoEtaLong" onclick="setEtaDemo(8)">8분 전</button>
      <button id="demoEtaMid" onclick="setEtaDemo(4)">4분 전</button>
      <button id="demoEtaShort" onclick="setEtaDemo(2)">2분 전</button>
      <button id="demoDest" onclick="cycleDestDemo()">목적지</button>
    </div>

  </div>

  <audio id="audioPlayer" preload="none"></audio>

  <script src="dait-rules.js"></script>
  <script src="dait-journey.js"></script>
  <script>
    // State
    const voice = 'nika';
    let currentMode = null; // 'morning' | 'afternoon' | 'tour' | null
    let stage = '';
    let heard = '';
    let isDrivingMode = false;
    let currentChoices = [];
    let demoMinutes = null; // 시연 조작으로 고른 남은 분
    let speechPhase = 'idle'; // 'idle' | 'speaking' | 'listening'
    let unclearCount = 0;
    let listenSince = 0; // 이번 질문을 듣기 시작한 때
    let speechSeq = 0; // 지난 말에 대한 늦은 알림을 가려내는 순번
    let previewQueue = []; // 브라우저 미리보기에서 이어 틀 음원
    let speechPaused = false; // 길 안내나 통화가 소리를 가져간 동안
    let tripMuted = false; // 이번 대화는 소리를 내지 않음
    let pendingIntro = []; // 첫 질문 앞에 붙일 말(남은 시간, 오늘 시간표)
    let micBroken = false; // 이번 대화에서 마이크를 열지 못함
    let noMicTimer = null;
    let currentRule = null; // 이번 대화에 쓰는 교사 규칙
    let ruleMissing = false; // 규칙 대화에서 준비물을 못 챙겼다고 답함
    let armed = null; // 출발하면 들려주기: { mode, timer }
    let pendingStart = null; // 마이크 허락을 기다리는 동작
    let micAsked = false;
    let hasArrived = false;
    let journeyActive = false;
    const MEMORY_KEY = 'dait.morningMemory';
    const VOICE_KEY = 'dait.voiceAnswers';
    const QUESTIONS_KEY = 'dait.questions';
    const ARM_MS = 30 * 60 * 1000;
    const ARRIVAL_CLOSE_MS = 4000;
    const NO_MIC_WAIT_MS = 8000;
    const LISTEN_PATIENCE_MS = 12000;

    // DAIT 공식 확정 캘리그래피 로고 (시안 2 커넥티드 리본 + i Dot)
    function getDaitLogoHtml() {
      return `
        <div class="dait-brand-badge" onclick="event.stopPropagation(); playSplashIntro();">
          <svg width="94" height="28" viewBox="0 0 100 32" fill="none">
            <path d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10 M74 16 h12" 
                  stroke="url(#flowGradBadge)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="62" cy="7.5" r="2.8" fill="#38BDF8"/>
            <defs>
              <linearGradient id="flowGradBadge" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/>
                <stop offset="0.6" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#38BDF8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      `;
    }

    function render() {
      renderStage();
      syncJourney();
    }

    function renderStage() {
      const stageArea = document.getElementById('stageArea');

      // 1. Home Screen (단일 완성형 스마트 벤토)
      if (!currentMode) {
        renderHome(stageArea);
        return;
      }

      // 2. School Settings
      if (currentMode === 'settings') {
        renderSettings(stageArea);
        return;
      }

      // 3. Places to visit
      if (currentMode === 'places') {
        renderPlaces(stageArea);
        return;
      }

      // 4. Dialogue Flow
      renderDialogueFlow(stageArea);
    }

    // --- 스마트 벤토: 완성형 레이아웃 ---
    function renderHome(container) {
      const trip = currentTrip();
      const info = homeInfo(trip);
      const isMorning = trip.mode === 'morning';
      const other = isMorning ? 'afternoon' : 'morning';
      const heroClass = trip.kind === 'weekend' ? 'weekend' : (isMorning ? '' : 'afternoon');
      const ctaLabel = !school ? '학교 등록' : (trip.kind === 'weekend' ? `${(schoolPlan() || { label: '다음 수업일' }).label} 준비 듣기` : '지금 시작');
      const ctaSide = !school ? `<button class="cta-arm" onclick="event.stopPropagation(); startFlow('${trip.mode}')">예시로 듣기</button>`
        : trip.kind === 'weekend' ? ''
        : `<button class="cta-arm${armed ? ' on' : ''}" onclick="event.stopPropagation(); toggleArm('${trip.mode}')">${armed ? '출발하면 들려줄게요' : '출발하면 듣기'}</button>`;
      container.innerHTML = `
        <div class="bento-stage">
          <div class="bento-hero ${heroClass}" onclick="${school ? `startFlow('${trip.mode}')` : 'openSettings()'}">
            <div class="hero-top-meta">
              ${getDaitLogoHtml()}
              <div class="hero-top-actions">
                <button class="school-setting-btn" onclick="event.stopPropagation(); openPlaces();">가 볼 만한 곳</button>
                <button class="school-setting-btn" onclick="event.stopPropagation(); openSettings();">학교 설정</button>
              </div>
            </div>

            <div class="hero-figure">${routeSvg(trip)}</div>
            <div class="hero-trip">${trip.where ? `<strong>${escapeHtml(trip.where)}</strong>` : ''}${trip.where && trip.minutes !== null ? '<span class="trip-sep">·</span>' : ''}${trip.minutes !== null ? `<strong>${trip.minutes}분</strong><span>남음</span>` : ''}${!trip.where && trip.minutes === null ? `<span>${escapeHtml(trip.when)}</span>` : ''}</div>
            <div class="hero-title">${escapeHtml(info.title)}</div>
            <div class="hero-desc">${escapeHtml(info.desc)}</div>

            <div class="hero-cta">
              <div class="cta-left"><span>${ctaLabel}</span></div>
              ${ctaSide}
              <div class="hero-cta-plane">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
              </div>
            </div>
          </div>

          <div class="bento-right-col">
            <div class="info-dual-row">
              <div class="info-mini-tile tile-tint-prep">
                <div class="mini-tile-label"><span class="mini-text-bold text-prep">${escapeHtml(info.prepLabel)}</span></div>
                <div class="mini-tile-body">
                  <div class="mini-tile-focus">${escapeHtml(info.prep)}</div>
                  ${info.prepSub ? `<div class="mini-tile-sub">${escapeHtml(info.prepSub)}</div>` : ''}
                </div>
              </div>
              <div class="info-mini-tile tile-tint-meal">
                <div class="mini-tile-label"><span class="mini-text-bold text-meal">${escapeHtml(info.mealLabel)}</span></div>
                <div class="mini-tile-body">
                  <div class="mini-tile-focus">${escapeHtml(info.meal)}</div>
                  ${info.mealSub ? `<div class="mini-tile-sub">${escapeHtml(info.mealSub)}</div>` : ''}
                </div>
              </div>
            </div>

            <div class="bento-wide-card${trip.known ? ' info' : ''}"${trip.known ? '' : ` onclick="startFlow('${other}')"`}>
              <div class="wide-card-text">
                <div class="wide-card-kicker">${info.otherKicker}</div>
                ${info.otherChips ? `<div class="subject-chips">${info.otherChips.map(c => `<span class="subject-chip${chipClass(c)}">${escapeHtml(c)}</span>`).join('')}</div>` : ''}
                <div class="wide-card-title">${escapeHtml(info.otherTitle)}</div>
                ${info.otherDesc ? `<div class="wide-card-desc">${escapeHtml(info.otherDesc)}</div>` : ''}
              </div>
              ${trip.known ? '' : `<div class="wide-card-arrow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
              </div>`}
            </div>
          </div>
        </div>
      `;
      placeRouteDot();
    }

    function renderDialogueFlow(container) {
      const flow = Journey.flows[currentMode];
      const modeName = currentMode === 'morning' ? '등교' : '하교';
      const data = stage === 'NEXT_DAY' ? Journey.nextDayStep(schoolPlan(), currentRule, DAIT_RULES)
        : stage.startsWith('RULE') ? Journey.ruleStep(stage, currentRule, ruleMissing, DAIT_RULES.extras.rule_missing)
        : (flow[stage] || flow.DONE);

      const subjectStages = ['SUBJECT', 'SUBJECT_MISSING', 'SUBJECT_TODAY'];
      const todayChoices = currentMode === 'morning' && subjectStages.includes(stage) ? subjectChoices() : null;
      currentChoices = todayChoices || data.choices || [];

      speakStage(data.clips || [data.clip]);
      updateDriveScreen(data.title);

      let optionsHtml = '';
      if (currentChoices.length > 0) {
        optionsHtml = `
          <div class="options-row">
            ${currentChoices.map((c, i) => `<button class="choice-chip" onclick="handleAnswer(currentChoices[${i}])">${escapeHtml(c)}</button>`).join('')}
          </div>
        `;
      }

      const buttonLabel = isDialogueDone() ? '마치기' : '다시 듣기';
      const skipHtml = isDialogueDone() ? '' : '<button class="primary-btn secondary" onclick="skipQuestion()">넘기기</button>';

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span style="font-size:17px; font-weight:700; color:var(--muted);">${modeName}</span>
          </div>

          <div class="dialogue-card">
            <div class="card-center">
              <div class="dialogue-orb">
                <div class="voice-visualizer" style="height:26px; margin:0;">
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                </div>
              </div>
              <div class="main-question">${data.title}</div>
              <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
            </div>

            ${optionsHtml}
          </div>

          <div class="bottom-bar">
            <button class="primary-btn" onclick="handlePrimaryAction()">
              ${buttonLabel}
            </button>
            ${skipHtml}
          </div>
        </div>
      `;
    }

    function journeyContext() {
      const plan = schoolPlan();
      const memory = readStored(MEMORY_KEY);
      return {
        tier: Journey.tierFor(remainMinutes()),
        driving: isDrivingMode,
        school: !!school,
        hasPe: !!(plan && plan.hasPe),
        rule: currentRule,
        noQuestions: readStored(QUESTIONS_KEY) === false,
        nextDay: !!school && currentTrip().kind === 'weekend',
        etaMinutes: currentTrip().known ? naviRemainMinutes() : demoMinutes,
        subjects: plan && plan.ymd === toYmd(new Date()) ? plan.subjects : [],
        memory: memory && memory.date === toYmd(new Date()) ? memory : {}
      };
    }

    function remainMinutes() {
      const live = naviRemainMinutes();
      return live === null ? demoMinutes : live;
    }

    function startFlow(mode) {
      if (askMicFirst(() => startFlow(mode))) return;
      disarm();
      currentMode = mode;
      heard = '';
      unclearCount = 0;
      listenSince = 0;
      hasArrived = false;
      micBroken = false;
      tripMuted = false;
      currentRule = ruleFor(mode);
      ruleMissing = false;
      const context = journeyContext();
      stage = Journey.start(mode, context);
      pendingIntro = stage === 'NEXT_DAY' ? [] : Journey.intro(mode, context, DAIT_RULES);
      render();
    }

    function goHome() {
      stopSpeech();
      currentMode = null;
      stage = '';
      heard = '';
      hasArrived = false;
      render();
      updateDriveScreen();
    }

    function setStage(nextStage) {
      stage = nextStage;
      unclearCount = 0;
      listenSince = 0;
      render();
    }

    function handleAnswer(ans, shown = ans) {
      if (isDialogueDone()) return;
      heard = shown;
      const result = Journey.next(currentMode, stage, ans, journeyContext());
      if (result.remember) rememberMorning(result.remember);
      ruleMissing = !!result.missing;
      setStage(result.stage);
    }

    function isDialogueDone() {
      return Journey.isDone(stage);
    }

    // 질문을 건너뛴다. 답을 지어내지 않고 다음 단계로만 넘어간다.
    function skipQuestion() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      heard = '';
      setStage(Journey.skip(currentMode, stage, journeyContext()));
    }

    // 아침에 고른 과목과 쉬기 여부를 기기에 남겨 하교 때 다시 꺼낸다 (기획안 ③⑤)
    function rememberMorning(patch) {
      const today = toYmd(new Date());
      const memory = readStored(MEMORY_KEY);
      const base = memory && memory.date === today ? memory : { date: today };
      writeStored(MEMORY_KEY, { ...base, ...patch });
    }

    function handlePrimaryAction() {
      if (isDialogueDone()) {
        goHome();
      } else {
        render();
      }
    }

    // ========================================================
    // 출발하면 들려주기
    // 시동만으로 말을 시작하지 않는다. 주차 중에 보호자가 고른 여정만 출발할 때 시작한다.
    // ========================================================
    function toggleArm(mode) {
      if (armed) { disarm(); render(); return; }
      if (askMicFirst(() => toggleArm(mode))) return;
      armed = { mode, timer: setTimeout(() => { disarm(); refreshHomeIfIdle(); }, ARM_MS) };
      render();
    }

    function disarm() {
      if (armed) clearTimeout(armed.timer);
      armed = null;
    }

    // 여정 동안에는 내비가 앱을 덮어도 말하고 들을 수 있게 앱을 유지한다.
    // 달리는 중에 내려놓으면 내비 뒤에서 다시 올릴 수 없으므로 주차하거나 대화를 닫을 때까지 둔다.
    function syncJourney() {
      const inDialogue = !!currentMode && !isParkedScreen();
      const finishedParked = isDialogueDone() && speechPhase === 'idle' && !isDrivingMode;
      const active = !!armed || (inDialogue && !finishedParked);
      if (active === journeyActive) return;
      journeyActive = active;
      if (window.AndroidBridge) window.AndroidBridge.setJourneyActive(active);
    }

    // ========================================================
    // 말하기와 듣기
    // 앱에서는 VoiceSession이, 브라우저 미리보기에서는 audio 태그가 소리를 낸다.
    // ========================================================
    function micState() {
      return window.AndroidBridge ? window.AndroidBridge.micState() : 'none';
    }

    // 처음 대화를 시작할 때 주차 중에만 마이크 허락을 묻는다.
    function askMicFirst(action) {
      if (micAsked || isDrivingMode || micState() !== 'ask' || readStored(VOICE_KEY) === false) return false;
      micAsked = true;
      pendingStart = action;
      window.AndroidBridge.requestMic();
      return true;
    }

    window.onMicAnswered = function() {
      const action = pendingStart;
      pendingStart = null;
      if (action) action();
    };

    function canListen() {
      return !micBroken && micState() === 'ready' && readStored(VOICE_KEY) !== false;
    }

    function speakStage(clips) {
      listenSince = 0;
      const intro = pendingIntro;
      pendingIntro = [];
      if (tripMuted) stopSpeech();
      else speak([...intro, ...clips].filter(Boolean), listenNow());
    }

    function listenNow() {
      return canListen() ? Journey.listenSpec(currentMode, stage, currentChoices, currentRule) : '';
    }

    function speak(clips, listen) {
      clearTimeout(noMicTimer);
      speechPhase = 'speaking';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) {
        window.AndroidBridge.speak(JSON.stringify(clips), listen, speechSeq);
        return;
      }
      previewQueue = clips.slice();
      playPreviewClip();
    }

    // 브라우저 미리보기: 음원을 차례로 튼다. temp/로 시작하는 것은 임시 음성이다.
    function playPreviewClip() {
      const clip = previewQueue.shift();
      if (!clip) {
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
        return;
      }
      const player = document.getElementById('audioPlayer');
      player.src = clip.includes('/') ? `voices/${clip}.wav` : `voices/${voice}/${clip}.wav`;
      player.play().catch(e => {
        console.log('Audio error:', e);
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
      });
    }

    function stopSpeech() {
      clearTimeout(noMicTimer);
      speechPhase = 'idle';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) window.AndroidBridge.stopSpeech();
      else document.getElementById('audioPlayer').pause();
    }

    function heardLineText() {
      if (speechPhase === 'listening') return '듣고 있어요';
      return heard ? `“${heard}”` : '';
    }

    function showHeardLine() {
      const line = document.getElementById('heardLine');
      if (line) {
        line.textContent = heardLineText();
        line.hidden = !line.textContent;
      }
      updateDriveScreen();
    }

    window.onSpeechEvent = function(jsonText) {
      const info = JSON.parse(jsonText);
      if (info.seq !== speechSeq) return; // 지난 말에 대한 늦은 알림
      if (info.event === 'paused' || info.event === 'resumed') {
        speechPaused = info.event === 'paused';
        return;
      }
      speechPhase = info.event === 'listening' ? 'listening' : 'idle';
      showHeardLine();
      if (info.event === 'heard') onHeard(info.text, info.reference);
      else if (info.event === 'silence') onUnclear();
      else if (info.event === 'listening') {
        listenSince = listenSince || performance.now();
        applyNaviEta();
      }
      else {
        if (info.event === 'micFailed') micBroken = true;
        applyNaviEta();
        syncJourney();
        if (hasArrived) closeAfterArrival();
        else if (info.event === 'stopped') endWithoutSpeaking();
        else advanceWithoutMic();
      }
    };

    // 음악이나 통화가 소리를 돌려주지 않으면 끼어들지 않고 대화를 마친다.
    function endWithoutSpeaking() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      tripMuted = true;
      setStage('QUIET_END');
    }

    // 마이크를 쓸 수 없는 차에서는 달리는 동안 답을 받을 길이 없다.
    // 가족이 이야기할 틈을 둔 뒤 다음 단계로 넘어가, 질문 하나에서 멈춰 있지 않게 한다.
    function advanceWithoutMic() {
      if (!isDrivingMode || canListen() || !currentMode || isParkedScreen() || isDialogueDone() || stage === 'PARENT_BRIDGE') return;
      clearTimeout(noMicTimer);
      noMicTimer = setTimeout(() => {
        if (speechPhase === 'idle' && isDrivingMode) skipQuestion();
      }, NO_MIC_WAIT_MS);
    }

    function onHeard(text, reference) {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      const result = Journey.interpret(stage, text, reference, currentChoices, currentRule);
      if (result.kind === 'answer') handleAnswer(result.answer, result.heard);
      else if (result.kind === 'quiet') {
        rememberMorning({ rest: true });
        setStage('REST');
      } else if (result.kind === 'sad') setStage('REST_SOFT');
      else if (result.kind === 'repeat') render();
      else if (performance.now() - listenSince < LISTEN_PATIENCE_MS) speak([], listenNow()); // 잡음일 수 있으니 재촉하지 않고 더 듣는다
      else onUnclear();
    }

    // 한 번 더 물어보고, 그래도 답이 없으면 재촉하지 않고 멈춘다 (기획안 ⑤)
    function onUnclear() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      unclearCount++;
      listenSince = 0;
      if (unclearCount >= 2) setStage('QUIET_END');
      else speak(['error_repeat'], listenNow());
    }

    // 도착하면 진행 중이던 질문을 마치고 인사한 뒤 첫 화면으로 돌아간다.
    function finishOnArrival() {
      if (!currentMode || isParkedScreen()) return;
      hasArrived = true;
      if (!isDialogueDone()) setStage('DONE');
      if (speechPhase === 'idle') closeAfterArrival();
    }

    function closeAfterArrival() {
      setTimeout(() => { if (hasArrived) goHome(); }, ARRIVAL_CLOSE_MS);
    }

    // ========================================================
    // 학교 정보 (나이스 교육정보 개방 포털)
    // ========================================================
    const NEIS_URL = 'https://relay-khaki-omega.vercel.app/neis/';
    const SCHOOL_KEY = 'dait.school';
    const DAYS_KEY = 'dait.schoolDays';
    const DAYS_AHEAD = 7;
    const EVENTS_KEY = 'dait.schoolEvents';
    const EVENT_DAYS_AHEAD = 45;
    const GRADE_FIELDS = ['ONE', 'TW', 'THREE', 'FR', 'FIV', 'SIX'];
    const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    let school = readStored(SCHOOL_KEY);
    let schoolDays = readStored(DAYS_KEY) || {};
    let schoolEvents = readStored(EVENTS_KEY) || {};
    let settings = {};
    let neisSeq = 0;
    let homeStale = false;
    const neisWaiting = {};

    function readStored(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }

    function writeStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.log('Storage error:', e); }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function toYmd(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}${month}${day}`;
    }

    function fromYmd(ymd) {
      return new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)) - 1, Number(ymd.slice(6, 8)));
    }

    function upcomingDates() {
      const start = new Date();
      return Array.from({ length: DAYS_AHEAD + 1 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }

    function dayLabel(ymd) {
      const dates = upcomingDates();
      if (ymd === toYmd(dates[0])) return '오늘';
      if (ymd === toYmd(dates[1])) return '내일';
      return WEEKDAYS[fromYmd(ymd).getDay()];
    }

    // 인증키는 중계 서버에만 있다. 앱에서는 Kotlin이 대신 받고, 브라우저 미리보기는 중계 서버에 직접 묻는다.
    window.onNeisResult = function(requestId, body) {
      const resolve = neisWaiting[requestId];
      delete neisWaiting[requestId];
      if (resolve) resolve(body);
    };

    function neisBody(service, query) {
      if (window.AndroidBridge) {
        return new Promise(resolve => {
          const requestId = ++neisSeq;
          neisWaiting[requestId] = resolve;
          window.AndroidBridge.neisGet(requestId, service, query);
        });
      }
      return fetch(`${NEIS_URL}${service}?${query}`).then(response => response.text());
    }

    async function neisRows(service, params) {
      const query = new URLSearchParams({ Type: 'json', pIndex: '1', pSize: '100', ...params }).toString();
      const data = JSON.parse(await neisBody(service, query));
      if (data.RESULT) {
        if (data.RESULT.CODE === 'INFO-200') return [];
        throw new Error(data.RESULT.CODE);
      }
      return data[service][1].row;
    }

    function mainDish(dishes) {
      const items = dishes.split(/<br\s*\/?>/i)
        .map(item => item.replace(/\([^)]*\)/g, '').replace(/[*]/g, '').replace(/[a-zA-Z]+\s*$/, '').trim())
        .filter(Boolean);
      return items.find(item => !/(밥|국|탕|찌개|김치|깍두기|우유|주스)$/.test(item)) || items[0] || '';
    }

    // 시간표 창구는 학교급마다 다르다.
    const SCHOOL_KINDS = {
      '초등학교': { service: 'elsTimetable', grades: [1, 2, 3, 4, 5, 6] },
      '중학교': { service: 'misTimetable', grades: [1, 2, 3] },
      '고등학교': { service: 'hisTimetable', grades: [1, 2, 3] }
    };

    function timetableService(target) {
      return (SCHOOL_KINDS[target.kind] || SCHOOL_KINDS['초등학교']).service;
    }

    // 학사일정에서 우리 학년 일정만 날짜별로 모은다. 토요휴업일은 뺀다.
    function eventsByDay(rows, grade) {
      const days = {};
      rows.forEach(row => {
        if (row.EVENT_NM.includes('토요휴업')) return;
        const marks = GRADE_FIELDS.map(field => row[`${field}_GRADE_EVENT_YN`]);
        if (marks.includes('Y') && marks[Number(grade) - 1] !== 'Y') return;
        (days[row.AA_YMD] = days[row.AA_YMD] || []).push({ name: row.EVENT_NM, off: row.SBTR_DD_SC_NM !== '해당없음' });
      });
      return days;
    }

    async function refreshSchoolEvents(target) {
      const today = toYmd(new Date());
      try {
        const rows = await neisRows('SchoolSchedule', {
          ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code, AA_FROM_YMD: today, AA_TO_YMD: toYmd(new Date(fromYmd(today).getTime() + EVENT_DAYS_AHEAD * 86400000))
        });
        if (school !== target) return;
        schoolEvents = eventsByDay(rows, target.grade);
        writeStored(EVENTS_KEY, schoolEvents);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School events error:', e);
      }
    }

    // 시간표는 하루씩 받는다.
    async function refreshSchoolDays() {
      if (!school) return;
      const target = school;
      refreshSchoolEvents(target);
      const dates = upcomingDates();
      const ymds = dates.map(toYmd);
      const base = { ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code };
      try {
        const schoolDates = dates.filter(date => date.getDay() !== 0 && date.getDay() !== 6);
        const [timetables, meals] = await Promise.all([
          Promise.all(schoolDates.map(date => neisRows(timetableService(target), {
            ...base, GRADE: target.grade, CLASS_NM: target.classNm, ALL_TI_YMD: toYmd(date)
          }))),
          neisRows('mealServiceDietInfo', {
            ...base, MMEAL_SC_CODE: '2', MLSV_FROM_YMD: ymds[0], MLSV_TO_YMD: ymds[ymds.length - 1]
          })
        ]);
        const days = {};
        ymds.forEach(ymd => { days[ymd] = { subjects: [], meal: '' }; });
        timetables.flat().sort((a, b) => Number(a.PERIO) - Number(b.PERIO)).forEach(row => {
          const day = days[row.ALL_TI_YMD];
          if (day && !day.subjects.includes(row.ITRT_CNTNT)) day.subjects.push(row.ITRT_CNTNT);
        });
        meals.forEach(row => {
          if (days[row.MLSV_YMD]) days[row.MLSV_YMD].meal = mainDish(row.DDISH_NM);
        });
        if (school !== target) return;
        schoolDays = days;
        writeStored(DAYS_KEY, days);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School data error:', e);
      }
    }

    // 시험 날은 시간표가 없을 수 있으므로 점심이나 학사일정이 있어도 수업일로 본다.
    function isClassDay(ymd) {
      const day = schoolDays[ymd];
      if (day && (day.subjects.length > 0 || day.meal)) return true;
      return !!schoolEvents[ymd] && Journey.isSchoolDay(ymd, schoolEvents);
    }

    function schoolPlan() {
      const today = toYmd(new Date());
      const ymd = Object.keys(schoolDays).sort()
        .find(key => key >= today && isClassDay(key));
      if (!school || !ymd) return null;
      const day = schoolDays[ymd];
      return { ...day, ymd, weekday: fromYmd(ymd).getDay(), label: dayLabel(ymd), hasPe: day.subjects.includes('체육') };
    }

    function schoolLevel() {
      return school ? school.kind.charAt(0) : '초';
    }

    // 지금 여정에 맞는 교사 규칙. 하교는 오늘, 등교는 다가오는 수업일을 기준으로 본다.
    function ruleFor(mode) {
      if (!school) return null;
      const plan = schoolPlan();
      const ymd = mode === 'afternoon' || !plan ? toYmd(new Date()) : plan.ymd;
      return Journey.pickRule(DAIT_RULES.rules, { mode, level: schoolLevel(), ymd, events: schoolEvents });
    }

    function subjectChoices() {
      const plan = schoolPlan();
      if (!plan || plan.subjects.length === 0) return null;
      const preferred = ['체육', '과학', '국어'].filter(subject => plan.subjects.includes(subject));
      return [...new Set([...preferred, ...plan.subjects])].slice(0, 3);
    }

    function chipClass(subject) {
      if (subject === '체육') return ' pe';
      if (/미술|음악|체육/.test(subject)) return ' art';
      if (/과학|수학/.test(subject)) return ' sci';
      return '';
    }

    // 여정 그림. 출발점에서 목적지까지 한 획, 그 위에 차 위치. 남은 시간이 없으면 선만 그린다.
    function routeSvg(trip) {
      const total = trip.kind === 'school' || trip.kind === 'home' ? 20 : null; // 기준 20분 여정
      const remain = trip.minutes;
      const progress = total && remain !== null ? Math.min(0.92, Math.max(0.08, 1 - remain / total)) : null;
      const W = 420, H = 140;
      const path = `M 24 ${H - 30} C 120 ${H - 30}, 170 34, 250 34 S ${W - 40} ${H - 70}, ${W - 24} 44`;
      const figure = trip.figure || '';
      const unit = trip.figureUnit || '';
      const endLabel = trip.kind === 'school' ? '학교' : trip.kind === 'home' ? '집' : (trip.kind === 'weekend' ? '다음 수업일' : (trip.mode === 'afternoon' ? '집' : '학교'));
      const startLabel = trip.kind === 'school' ? '집' : trip.kind === 'home' ? '학교' : '지금';
      let dot = '';
      if (progress !== null) {
        dot = `<path class="route-done" d="${path}" pathLength="1" stroke-dasharray="${progress} 1"/>
          <g id="routeDot"><circle class="route-dot-halo" r="14"/><circle class="route-dot" r="6"/></g>`;
      }
      return `<svg class="hero-route" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="route-path" d="${path}"/>
        ${dot}
        <circle class="route-dot" cx="24" cy="${H - 30}" r="4"/>
        <text class="route-label" x="24" y="${H - 8}" text-anchor="start">${escapeHtml(startLabel)}</text>
        <circle class="route-end-fill" cx="${W - 24}" cy="44" r="9"/>
        <circle class="route-end" cx="${W - 24}" cy="44" r="9"/>
        <text class="route-label" x="${W - 24}" y="22" text-anchor="end">${escapeHtml(endLabel)}</text>
        <text class="route-figure" x="${W / 2}" y="${H - 14}" text-anchor="middle">${escapeHtml(figure)}<tspan class="route-unit" dx="4">${escapeHtml(unit)}</tspan></text>
      </svg>`;
    }

    // 그린 뒤 차 위치 점을 선 위로 옮긴다 (pathLength 비율 → 실제 좌표)
    function placeRouteDot() {
      const svg = document.querySelector('.hero-route');
      const dot = svg && svg.querySelector('#routeDot');
      const done = svg && svg.querySelector('.route-done');
      if (!svg || !dot || !done) return;
      const ratio = parseFloat(done.getAttribute('stroke-dasharray'));
      const len = done.getTotalLength();
      const pt = done.getPointAtLength(len * ratio);
      dot.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    }

    // 지금 여정을 한 곳에서 정한다. 첫 화면·칸·대화 시작이 모두 이것을 따른다.
    // 우선순위: 내비 목적지(학교/집) → 수업일의 시간대(오전 등교·오후 하교) → 주말·방학은 다음 수업일 준비
    function currentTrip() {
      const now = new Date();
      const minutes = naviRemainMinutes();
      const mins = minutes === null ? null : Math.max(1, Math.round(minutes));
      if (naviInfo && naviInfo.name) {
        const fig = { figure: mins === null ? '' : String(mins), figureUnit: mins === null ? '' : '분' };
        if (school && placeMatches(naviInfo, school)) return { mode: 'morning', kind: 'school', known: true, where: `${school.name}까지`, minutes: mins, when: '', ...fig };
        if (homePlace && placeMatches(naviInfo, homePlace)) return { mode: 'afternoon', kind: 'home', known: true, where: '집까지', minutes: mins, when: '', ...fig };
      }
      // 여기부터는 목적지가 학교도 집도 아니거나 없다. 남은 시간은 쓰지 않는다
      const unknownMins = null;
      const todayYmd = toYmd(now);
      const todayHasClass = isClassDay(todayYmd);
      const isWeekend = now.getDay() === 0 || now.getDay() === 6;
      if (school && Object.keys(schoolDays).length && !todayHasClass) {
        const plan = schoolPlan();
        const label = plan ? plan.label : '다음 수업일';
        return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: `${label} 준비`, figure: label.replace('요일', ''), figureUnit: label.endsWith('요일') ? '요일' : '' };
      }
      if (!school && isWeekend) return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: '다음 수업일 준비', figure: '월', figureUnit: '요일' };
      const afternoon = now.getHours() >= 12;
      const hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      return { mode: afternoon ? 'afternoon' : 'morning', kind: afternoon ? 'afternoon' : 'morning', known: false, where: '', minutes: unknownMins, when: afternoon ? '오늘 오후' : '오늘 아침', figure: hhmm, figureUnit: '' };
    }

    // 교사 규칙이 있는 날은 첫 화면의 말도 규칙을 따른다.
    function homeInfo(trip) {
      const info = plainHomeInfo(trip);
      const rule = ruleFor(trip.mode);
      if (!rule) return info;
      const plan = schoolPlan();
      const upcoming = trip.kind === 'weekend' && plan ? `${plan.label} ${rule.eventName}` : '';
      return {
        ...info,
        title: upcoming || rule.title,
        desc: rule.desc,
        ...(rule.prep ? { prepLabel: '준비물', prep: rule.prep, prepSub: '학교 안내 확인' } : {})
      };
    }

    function plainHomeInfo(trip) {
      const plan = school ? schoolPlan() : null;
      const dayWord = plan ? plan.label : '오늘';
      const memory = readStored(MEMORY_KEY);
      const morningSubject = memory && memory.date === toYmd(new Date()) ? memory.subject : null;
      const prepLine = !school ? { prep: '등록 필요', prepSub: '' }
        : !plan ? { prep: '확인 필요', prepSub: '' }
        : plan.hasPe ? { prep: '체육복', prepSub: '시간표 기준' }
        : { prep: '학교 안내 확인', prepSub: plan.subjects.slice(0, 2).join(' · ') };
      const mealLine = !school ? { meal: '등록 필요', mealSub: '' } : { meal: plan && plan.meal ? plan.meal : '확인 필요', mealSub: '' };

      const subjects = plan ? plan.subjects : [];
      // 오늘의 질문: 시간표에서 고른다. 기획안 교사 규칙표의 과목별 질문
      const question = Journey.pickQuestion(DAIT_RULES.rules, plan ? plan.subjects : [], schoolLevel());
      const otherMorning = trip.known
        ? { otherKicker: '하교 때 다시 물을 질문', otherChips: null, otherTitle: question, otherDesc: '아침에 답하면 집에 갈 때 이어서 물어요' }
        : { otherKicker: '등교', otherChips: subjects.slice(0, 6), otherTitle: `${dayWord} 시간표`, otherDesc: subjects.length ? '' : '학교를 설정하면 보여 줘요' };
      const otherAfternoon = trip.known
        ? { otherKicker: '오늘의 질문', otherChips: subjects.slice(0, 6), otherTitle: question, otherDesc: '대답은 아이가 해요. 부모는 듣다가 끼어들면 돼요' }
        : { otherKicker: trip.kind === 'weekend' ? `${dayWord} 시간표` : '하교', otherChips: trip.kind === 'weekend' ? subjects.slice(0, 6) : null, otherTitle: trip.kind === 'weekend' ? '하교 대화는 집에 갈 때' : '오늘 이야기 들려주기', otherDesc: trip.kind === 'weekend' ? '아침 질문을 기억했다가 이어서 물어요' : '기억나는 장면 하나면 돼요' };

      if (!school) {
        return {
          title: '학교를 등록해 주세요',
          desc: '시간표와 점심으로 이야기를 시작해요',
          prepLabel: '준비물', ...prepLine,
          mealLabel: '점심', ...mealLine,
          ...(trip.mode === 'afternoon' ? otherMorning : otherAfternoon)
        };
      }
      if (trip.mode === 'afternoon') {
        return {
          title: morningSubject ? `아침에 고른 ${morningSubject}, 어땠나요?` : '오늘은 어땠나요?',
          desc: '기억나는 장면 하나만 들려줘요',
          prepLabel: '아침에 고른 수업', prep: morningSubject || '없음', prepSub: morningSubject ? '하교 대화에서 다시 물어요' : '등교 대화에서 고르면 여기 남아요',
          mealLabel: `${dayWord === '오늘' ? '내일' : dayWord} 점심`, ...mealLine,
          ...otherMorning
        };
      }
      if (trip.kind === 'weekend') {
        return {
          title: `${dayWord} 준비 됐나요?`,
          desc: plan ? (plan.hasPe ? '체육이 있어요. 체육복을 미리 챙겨요' : `${plan.subjects.slice(0, 3).join(' · ')}`) : '학교를 설정하면 시간표를 보여 줘요',
          prepLabel: `${dayWord} 준비물`, ...prepLine,
          mealLabel: `${dayWord} 점심`, ...mealLine,
          ...otherAfternoon
        };
      }
      return {
        title: trip.known ? (plan && plan.hasPe ? '체육복 챙겼나요?' : '오늘 준비 됐나요?') : `${dayWord} 준비 됐나요?`,
        desc: !school ? '체육복을 함께 확인해요' : !plan ? '학교 정보를 확인하지 못했어요' : (plan.hasPe ? '체육복을 함께 확인해요' : (plan.subjects.slice(0, 3).join(' · ') || '학교 안내를 확인해요')),
        prepLabel: '준비물', ...prepLine,
        mealLabel: `${dayWord} 점심`, ...mealLine,
        ...otherAfternoon
      };
    }

    // ========================================================
    // 가 볼 만한 곳 (공공데이터포털 한국관광공사 국문 관광정보)
    // 브라우저 미리보기에서는 예시를 보여 준다.
    // ========================================================
    const PLACE_TOPICS = ['과학관', '박물관', '유적지', '체험관'];
    const PLACE_LIMIT = 8;
    const PLACE_TYPES = ['12', '14', '28']; // 관광지, 문화시설, 레포츠. 숙박·식당·쇼핑은 뺀다.
    const REGIONS = [
      ['서울', '11', '서울'], ['부산', '26', '부산'], ['대구', '27', '대구'], ['인천', '28', '인천'],
      ['광주', '29', '광주'], ['대전', '30', '대전'], ['울산', '31', '울산'], ['세종', '36', '세종'],
      ['경기', '41', '경기'], ['강원', '51', '강원'], ['충북', '43', '충북'], ['충청북', '43', '충북'],
      ['충남', '44', '충남'], ['충청남', '44', '충남'], ['전북', '52', '전북'], ['전라북', '52', '전북'],
      ['전남', '46', '전남'], ['전라남', '46', '전남'], ['경북', '47', '경북'], ['경상북', '47', '경북'],
      ['경남', '48', '경남'], ['경상남', '48', '경남'], ['제주', '50', '제주']
    ];
    const SAMPLE_PLACES = {
      '과학관': [['국립과천과학관', '경기도 과천시'], ['국립중앙과학관', '대전광역시 유성구']],
      '박물관': [['국립중앙박물관', '서울특별시 용산구'], ['국립경주박물관', '경상북도 경주시']],
      '유적지': [['경주 불국사', '경상북도 경주시'], ['수원 화성', '경기도 수원시']],
      '체험관': [['한국잡월드', '경기도 성남시'], ['국립어린이과학관', '서울특별시 종로구']]
    };

    let places = {};
    let tourSeq = 0;
    const tourWaiting = {};

    window.onTourResult = function(requestId, body) {
      const resolve = tourWaiting[requestId];
      delete tourWaiting[requestId];
      if (resolve) resolve(body);
    };

    function schoolRegion() {
      const address = school ? school.address : '';
      const found = REGIONS.find(row => address.startsWith(row[0]));
      return found ? { code: found[1], name: found[2] } : null;
    }

    function tourBody(query) {
      return new Promise(resolve => {
        const requestId = ++tourSeq;
        tourWaiting[requestId] = resolve;
        window.AndroidBridge.tourGet(requestId, 'searchKeyword2', query);
      });
    }

    function tourRows(data) {
      const header = data.response.header;
      if (header.resultCode !== '0000') throw new Error(header.resultCode);
      const items = data.response.body.items;
      const rows = items && items.item ? [].concat(items.item) : [];
      return rows
        .filter(row => PLACE_TYPES.includes(String(row.contenttypeid)))
        .slice(0, PLACE_LIMIT)
        .map(row => ({ name: row.title, address: row.addr1 || '' }));
    }

    async function searchPlaces(topic) {
      places = { topic, rows: [], sample: false, message: '찾는 중이에요' };
      render();
      if (!window.AndroidBridge) {
        places = { topic, rows: SAMPLE_PLACES[topic].map(row => ({ name: row[0], address: row[1] })), sample: true, message: '' };
        render();
        return;
      }
      const region = schoolRegion();
      const query = new URLSearchParams({
        numOfRows: '30', pageNo: '1', MobileOS: 'AND', MobileApp: 'DAIT', _type: 'json', arrange: 'A', keyword: topic,
        ...(region ? { lDongRegnCd: region.code } : {})
      }).toString();
      let next;
      try {
        const rows = tourRows(JSON.parse(await tourBody(query)));
        next = { topic, rows, sample: false, message: rows.length > 0 ? '' : '찾는 곳이 없어요' };
      } catch (e) {
        next = { topic, rows: [], sample: false, message: '지금은 찾을 수 없어요' };
      }
      // 기다리는 사이 다른 주제를 골랐거나 화면을 나갔으면 이 결과는 버린다.
      if (currentMode !== 'places' || places.topic !== topic) return;
      places = next;
      render();
    }

    function openPlaces() {
      stopSpeech();
      currentMode = 'places';
      searchPlaces(PLACE_TOPICS[0]);
    }

    function renderPlaces(container) {
      const region = schoolRegion();
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
          </div>
          <div class="dialogue-card">
            <div class="settings-center">
              <div class="main-question">${region ? `${escapeHtml(region.name)}에서 ` : ''}가 볼 만한 곳</div>
              <div class="settings-list">
                ${PLACE_TOPICS.map(topic => `<button class="choice-chip" onclick="searchPlaces('${topic}')"${topic === places.topic ? ' aria-pressed="true"' : ''}>${topic}</button>`).join('')}
              </div>
              ${places.message ? `<div class="settings-message">${escapeHtml(places.message)}</div>` : ''}
              <div class="place-list">
                ${places.rows.map(row => `<div class="place-row"><div class="place-name">${escapeHtml(row.name)}</div><div class="place-address">${escapeHtml(row.address)}</div></div>`).join('')}
              </div>
              ${places.rows.length > 0 ? `<div class="place-source">${places.sample ? '예시' : '자료: 한국관광공사'}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function isParkedScreen() {
      return currentMode === 'settings' || currentMode === 'places';
    }

    function openSettings() {
      stopSpeech();
      currentMode = 'settings';
      settings = { step: 'search', query: '', results: [], classes: [], message: '' };
      render();
    }

    function renderSettings(container) {
      let title = school ? `${school.name} ${school.grade}학년 ${school.classNm}반` : '학교를 찾아 주세요';
      let body = '';

      if (settings.step === 'search') {
        body = `
          <div class="school-search-row">
            <input id="schoolInput" class="school-input" type="text" placeholder="학교 이름" value="${escapeHtml(settings.query)}"
                   onkeydown="if (event.key === 'Enter') searchSchools()">
            <button class="choice-chip" onclick="searchSchools()">찾기</button>
          </div>
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.results.map((row, i) => `<button class="choice-chip" onclick="pickSchool(${i})">${escapeHtml(row.SCHUL_NM)} · ${escapeHtml(row.LCTN_SC_NM)}</button>`).join('')}
          </div>
        `;
      } else if (settings.step === 'grade') {
        title = '몇 학년인가요?';
        body = `<div class="settings-list">${SCHOOL_KINDS[settings.picked.SCHUL_KND_SC_NM].grades.map(grade => `<button class="choice-chip" onclick="pickGrade(${grade})">${grade}학년</button>`).join('')}</div>`;
      } else {
        title = '몇 반인가요?';
        body = `
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.classes.map((name, i) => `<button class="choice-chip" onclick="pickClass(${i})">${escapeHtml(name)}${/^\d+$/.test(name) ? '반' : ''}</button>`).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            ${school ? '<button class="back-btn" onclick="clearSchool()">학교 지우기</button>' : ''}
            ${homePlace ? `<button class="back-btn" onclick="clearHome()">집 지우기 (${escapeHtml(homePlace.name)})</button>` : ''}
            ${canSaveHome() ? `<button class="back-btn" onclick="saveHomeFromNavi()">지금 목적지를 집으로</button>` : ''}
            <button class="back-btn" onclick="toggleQuestions()">질문 ${readStored(QUESTIONS_KEY) === false ? '꺼짐' : '켜짐'}</button>
            ${micState() === 'none' ? '' : `<button class="back-btn" onclick="toggleVoiceAnswers()">말로 답하기 ${readStored(VOICE_KEY) === false ? '꺼짐' : '켜짐'}</button>`}
          </div>
          <div class="dialogue-card">
            <div class="settings-center">
              <div class="main-question">${escapeHtml(title)}</div>
              ${body}
            </div>
          </div>
        </div>
      `;
    }

    function toggleQuestions() {
      writeStored(QUESTIONS_KEY, readStored(QUESTIONS_KEY) === false);
      render();
    }

    function toggleVoiceAnswers() {
      writeStored(VOICE_KEY, readStored(VOICE_KEY) === false);
      render();
    }

    async function searchSchools() {
      const query = document.getElementById('schoolInput').value.trim();
      if (!query) return;
      settings.query = query;
      settings.results = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('schoolInfo', { SCHUL_NM: query });
        settings.results = rows.filter(row => row.SD_SCHUL_CODE.trim() && SCHOOL_KINDS[row.SCHUL_KND_SC_NM]).slice(0, 8);
        settings.message = settings.results.length > 0 ? '' : '찾는 학교가 없어요';
      } catch (e) {
        console.log('School search error:', e);
        settings.message = '지금은 학교를 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickSchool(index) {
      settings.picked = settings.results[index];
      settings.step = 'grade';
      render();
    }

    async function pickGrade(grade) {
      const now = new Date();
      settings.grade = grade;
      settings.step = 'class';
      settings.classes = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('classInfo', {
          ATPT_OFCDC_SC_CODE: settings.picked.ATPT_OFCDC_SC_CODE,
          SD_SCHUL_CODE: settings.picked.SD_SCHUL_CODE,
          AY: String(now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear()),
          GRADE: String(grade)
        });
        settings.classes = [...new Set(rows.map(row => row.CLASS_NM))];
        settings.message = settings.classes.length > 0 ? '' : '찾는 반이 없어요';
      } catch (e) {
        console.log('Class search error:', e);
        settings.message = '지금은 반을 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickClass(index) {
      school = {
        office: settings.picked.ATPT_OFCDC_SC_CODE,
        code: settings.picked.SD_SCHUL_CODE,
        name: settings.picked.SCHUL_NM,
        address: settings.picked.ORG_RDNMA || '',
        kind: settings.picked.SCHUL_KND_SC_NM,
        grade: String(settings.grade),
        classNm: settings.classes[index]
      };
      schoolDays = {};
      writeStored(SCHOOL_KEY, school);
      writeStored(DAYS_KEY, schoolDays);
      schoolEvents = {};
      writeStored(EVENTS_KEY, schoolEvents);
      goHome();
      refreshSchoolDays();
    }

    function clearSchool() {
      school = null;
      schoolDays = {};
      schoolEvents = {};
      try {
        localStorage.removeItem(SCHOOL_KEY);
        localStorage.removeItem(DAYS_KEY);
        localStorage.removeItem(EVENTS_KEY);
      } catch (e) {
        console.log('Storage error:', e);
      }
      goHome();
    }

    document.getElementById('audioPlayer').addEventListener('ended', playPreviewClip);

    // In-App Detection & Driving Restriction API
    if (window.location.href.includes('android_asset') || navigator.userAgent.includes('Android')) {
      document.body.classList.add('in-app');
    }

    // 주행 중: 상세 화면을 닫고 문장 하나와 큰 버튼 둘만 보여 준다. 재생 중인 음성은 이어 간다.
    // 대화 중이 아니면(첫 화면·설정) 조작할 것이 없으므로 "주차 후 이어갈게요"만 보여 준다.
    window.setDrivingMode = function(isDriving, isRealDriving) {
      const departing = isDriving && !isDrivingMode;
      isDrivingMode = isDriving;
      document.body.classList.toggle('driving', isDriving);
      document.body.classList.toggle('real-driving', !!isRealDriving);
      document.getElementById('demoDrive').classList.toggle('on', isDriving);
      if (isDriving && isParkedScreen()) goHome();
      if (departing && armed) startFlow(armed.mode);
      else if (departing && speechPhase === 'idle') advanceWithoutMic();
      updateDriveScreen();
      syncJourney();
    };

    function updateDriveScreen(sentence) {
      const inDialogue = currentMode && !isParkedScreen();
      const trip = inDialogue ? null : currentTrip();
      const canStart = !inDialogue && trip.kind !== 'weekend';
      const text = inDialogue ? (sentence || document.querySelector('.main-question')?.textContent || '')
        : canStart ? `${trip.mode === 'morning' ? '등교' : '하교'} 이야기를 들을까요?` : '주차 후 이어갈게요';
      document.getElementById('driveSentence').textContent = text;
      document.getElementById('driveSub').textContent = inDialogue ? heardLineText() : (canStart ? '' : '설정과 자세한 내용은 주차한 뒤 열어요');
      const done = inDialogue && isDialogueDone();
      const replay = document.getElementById('driveReplay');
      replay.disabled = !inDialogue;
      replay.hidden = canStart;
      const next = document.getElementById('driveNext');
      next.textContent = canStart ? '듣기' : (done ? '마치기' : '넘기기');
      next.disabled = !inDialogue && !canStart;
    }

    function driveReplay() {
      if (currentMode && !isParkedScreen()) render();
    }

    function driveNext() {
      if (!currentMode || isParkedScreen()) {
        const trip = currentTrip();
        if (trip.kind !== 'weekend') startFlow(trip.mode);
      } else if (isDialogueDone()) goHome();
      else skipQuestion();
      updateDriveScreen();
    }

    function toggleDrivingDemo() {
      if (window.AndroidBridge) {
        window.AndroidBridge.toggleDrivingSim();
      } else {
        window.setDrivingMode(!isDrivingMode);
      }
    }

    // 차가 보내는 목적지와 남은 시간. 앱의 NaviBridge가 부른다.
    // 실제 값이 오면 시연 조작(8분 전·4분 전·2분 전)보다 우선한다.
    let naviInfo = null;

    window.onNaviUpdate = function(jsonText) {
      let info;
      try { info = JSON.parse(jsonText); } catch (e) { return; }
      console.log('Navi:', jsonText);
      if (info.event === 'destination' || info.event === 'routeStarted') {
        // 길 안내가 없을 때는 이름 없이 0으로 오므로 도착 직전과 구분한다.
        if (!info.name && !(Number(info.remainTime) > 0)) { const had = !!naviInfo; naviInfo = null; renderDemoPanel(); if (had) refreshHomeIfIdle(); return; }
        const changed = !naviInfo || naviInfo.name !== (info.name || '') || (currentMode === 'settings' && !document.querySelector('[onclick="saveHomeFromNavi()"]') && canSaveHomeFor(info));
        naviInfo = { name: info.name || '', address: info.address || '', remainTime: Number(info.remainTime), remainDistance: Number(info.remainDistance), at: Date.now() };
        applyNaviEta();
        if (changed) refreshHomeIfIdle();
      } else if (info.event === 'routeCancelled' || info.event === 'routeEnded' || info.event === 'arrived' || info.event === 'unavailable') {
        // 내비에 따라 도착 신호 없이 안내 종료만 올 수 있으므로, 거의 다 온 때의 종료도 도착으로 본다.
        const reached = info.event === 'arrived' || (info.event === 'routeEnded' && Journey.tierFor(naviRemainMinutes()) === 'arrive');
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
        if (reached) finishOnArrival();
      } else if (info.event === 'status' && info.status !== 'ROUTE_DRIVE') {
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
      }
    };

    function refreshHomeIfIdle() {
      if (isIntroPlaying) { homeStale = true; return; }
      if (!currentMode || currentMode === 'settings') render();
    }
    // 길 안내 중 10초마다 같은 목적지가 와도 설정 화면의 '집으로' 버튼이 늦지 않게, 목적지 이름이 생기면 다시 그린다

    // ========================================================
    // 목적지로 등교·하교 제안 (기획안 ②: 목적지가 학교면 등교, 집이면 하교)
    // 자동으로 대화를 시작하지는 않는다. 안전 원칙: 운전자 조작 없이 소리를 내지 않는다.
    // ========================================================
    const HOME_KEY = 'dait.home';
    let homePlace = readStored(HOME_KEY);

    function normalizePlace(text) {
      return String(text || '').replace(/\s+/g, '').replace(/[()·,.]/g, '');
    }

    // 도로명 주소에서 '산정로 171'처럼 도로 이름과 번지만 뽑는다.
    function roadPart(address) {
      const m = String(address || '').match(/([가-힣A-Za-z0-9]+(?:로|길|대로))\s*(\d+(?:-\d+)?)/);
      return m ? m[1] + m[2] : '';
    }

    function placeMatches(dest, place) {
      if (!dest || !place) return false;
      const destName = normalizePlace(dest.name), placeName = normalizePlace(place.name);
