<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAIT</title>
  <style>
    :root {
      --surface: #F3F6F9;
      --paper: #FFFFFF;
      --accent: #004DA0;
      --accent-hover: #003673;
      --accent-soft: #E5EFFB;
      --ink: #0E1B2A;
      --muted: #5B6D82;
      --outline: #D5DFEA;
      --control: #E8EEF5;
      --control-hover: #DCE5F0;
      /* 큰 카드 색. 여정에 따라 바뀐다 */
      --hero-a: #061B3D;
      --hero-b: #0B3B7A;
      --hero-glow: #22B8E8;
      --hero-ink: #0B2A5B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #D5DBE3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Pleos Display */
    .pleos-display {
      width: 100%;
      max-width: 1060px;
      height: 600px;
      background:
        radial-gradient(80% 60% at 100% 100%, #E7EEF8 0%, transparent 60%),
        var(--surface);
      border-radius: 28px;
      border: 2px solid #C4CDD7;
      box-shadow: 0 24px 50px rgba(11, 26, 44, 0.16);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* In-App Fullscreen Integration for Hyundai Pleos */
    body.in-app {
      background: var(--surface);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    body.in-app .pleos-display {
      max-width: 100%;
      height: 100vh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    body.in-app .stage-container {
      padding: 30px 40px;
    }

    .restricted-message {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.6px;
    }

    /* Driving Simple Screen: 문장 하나와 큰 버튼 둘 */
    .drive-screen {
      position: absolute;
      inset: 0;
      background: var(--surface);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 48px;
      text-align: center;
    }
    body.driving .drive-screen { display: flex; }
    .drive-sentence {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--ink);
      letter-spacing: -0.6px;
      max-width: 900px;
    }
    .drive-sub {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .drive-actions {
      display: flex;
      gap: 20px;
    }
    .drive-btn {
      min-width: 220px;
      height: 76px;
      padding: 0 32px;
      border-radius: 24px;
      border: 1px solid var(--outline);
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }
    .drive-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .drive-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Demo Panel (시연용) */
    .demo-panel {
      position: absolute;
      right: 36px;
      bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 500;
    }
    body.in-app .demo-panel { right: 40px; }
    body.driving .demo-panel { z-index: 10000; }
    .demo-panel button {
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--control);
      border: 1px solid var(--outline);
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-panel button:hover { background: var(--control-hover); }
    .demo-panel button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .demo-panel button:disabled { cursor: default; opacity: 0.9; }


    /* Main Stage */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px 36px;
      position: relative;
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ========================================================
       첫 화면: 여정 하나를 크게, 보조 정보는 얇게
       왼쪽 큰 카드 = 지금 여정(어디로 · 몇 분 · 할 말 한 문장)
       오른쪽 = 오늘 챙길 것 두 줄 + 다른 여정으로 가는 작은 길
       ======================================================== */
    .bento-stage {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    /* 큰 카드 */
    .bento-hero {
      background:
        radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--hero-glow) 55%, transparent) 0%, transparent 55%),
        linear-gradient(160deg, var(--hero-b) 0%, var(--hero-a) 100%);
      border-radius: 28px;
      padding: 26px 30px 28px;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      min-height: 0;
      box-shadow: 0 24px 48px -18px color-mix(in srgb, var(--hero-a) 70%, transparent);
      transition: transform 0.18s ease;
    }
    .bento-hero.afternoon { --hero-a: #3B1033; --hero-b: #8A2E4F; --hero-glow: #FFA14A; --hero-ink: #5B1F3D; }
    .bento-hero.weekend { --hero-a: #1C1F3A; --hero-b: #3C3F6E; --hero-glow: #9A8CFF; --hero-ink: #2A2D55; }
    .bento-hero:hover { transform: translateY(-2px); }
    /* 가는 격자: 차량 계기판의 결 */
    .bento-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 1.2px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 70%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 70%);
      pointer-events: none;
    }
    .hero-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .dait-brand-badge {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
    }
    .school-setting-btn {
      min-height: 48px;
      padding: 8px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.22);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .school-setting-btn:hover { background: rgba(255,255,255,0.18); }

    /* 여정 그림: 출발점에서 목적지까지 한 획. 차 위치 점이 남은 시간만큼 가 있다 */
    .hero-figure {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .hero-route {
      width: 100%;
      height: auto;
      max-height: 100%;
      overflow: visible;
    }
    .hero-route .route-path { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .hero-route .route-done { stroke: #FFFFFF; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .hero-route .route-dot { fill: #FFFFFF; }
    .hero-route .route-dot-halo { fill: var(--hero-glow); opacity: 0.35; }
    .hero-route .route-end { fill: none; stroke: #FFFFFF; stroke-width: 2.5; }
    .hero-route .route-end-fill { fill: var(--hero-glow); }
    .hero-route text { font-family: inherit; font-weight: 800; fill: #FFFFFF; }
    .hero-route .route-figure { font-size: 34px; letter-spacing: -1.5px; }
    .hero-route .route-unit { font-size: 15px; font-weight: 700; fill: rgba(255,255,255,0.75); letter-spacing: 0; }
    .hero-route .route-label { font-size: 13px; font-weight: 700; fill: rgba(255,255,255,0.6); letter-spacing: 0.3px; }

    /* 여정 줄: 어디로 · 몇 분 */
    .hero-trip {
      margin-top: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.2px;
      min-height: 24px;
    }
    .hero-trip strong {
      color: #FFFFFF;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .hero-trip .trip-sep { opacity: 0.45; }

    /* 한 문장 */
    .hero-title {
      margin-top: 8px;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.14;
      letter-spacing: -1.4px;
      text-wrap: balance;
      position: relative;
      z-index: 1;
    }
    .hero-desc {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.4;
      color: rgba(255,255,255,0.78);
      position: relative;
      z-index: 1;
    }
    .hero-trip { position: relative; z-index: 1; }

    /* 시작 버튼 */
    .hero-cta {
      margin-top: 22px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      color: var(--hero-ink);
      padding: 0 10px 0 24px;
      height: 68px;
      border-radius: 20px;
      font-size: 21px;
      font-weight: 800;
      transition: transform 0.15s ease;
    }
    .hero-cta:hover { transform: translateX(2px); }
    .hero-cta-plane {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--hero-ink);
      color: #FFFFFF;
    }
    .cta-left { display: flex; align-items: center; gap: 12px; }

    /* 오른쪽 열 */
    .bento-right-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .info-dual-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .info-mini-tile {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px -14px rgba(11, 26, 44, 0.25);
      border-radius: 20px;
      padding: 18px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 118px;
      min-width: 0;
    }
    .tile-tint-prep { border-top: 4px solid var(--accent); }
    .tile-tint-meal { border-top: 4px solid #C2410C; }
    .mini-tile-label { display: flex; align-items: center; }
    .mini-text-bold {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .text-prep { color: var(--accent); }
    .text-meal { color: #C2410C; }
    .mini-tile-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .mini-tile-focus {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .mini-tile-sub {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
    }

    /* 오른쪽 큰 카드: 다른 여정으로 가는 길 */
    .bento-wide-card {
      flex: 1;
      min-height: 0;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px -14px rgba(11, 26, 44, 0.25);
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .bento-wide-card:hover { border-color: var(--accent); }
    .bento-wide-card.info {
      cursor: default;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    .bento-wide-card.info:hover { border-color: rgba(255,255,255,0.9); border-left-color: var(--accent); }
    .bento-wide-card.info .wide-card-title { font-size: 28px; line-height: 1.25; text-wrap: balance; }
    .wide-card-text { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; min-width: 0; }
    .wide-card-kicker {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .wide-card-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .wide-card-desc {
      font-size: 17px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.35;
    }
    .wide-card-arrow {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .subject-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .subject-chip {
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }
    .subject-chip.pe { background: #E0F2FE; color: #0369A1; }
    .subject-chip.art { background: #FDF2E9; color: #B45309; }
    .subject-chip.sci { background: #ECFDF5; color: #047857; }

    /* Dialogue Screen */
    .dialogue-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .dialogue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .back-btn {
      min-height: 48px;
      padding: 8px 22px;
      border-radius: 16px;
      background: var(--control);
      border: 1px solid var(--outline);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--control-hover); }

    .dialogue-card {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 32px;
      padding: 40px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 20px rgba(28, 46, 42, 0.05);
    }
    .card-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Dialogue Ambient Orb */
    .dialogue-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00B4D8 0%, #0077B6 50%, #04244B 100%);
      box-shadow: 0 0 35px rgba(0, 180, 216, 0.45), inset 0 0 14px rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Voice Visualizer Wave */
    .voice-visualizer {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 32px;
      margin-bottom: 24px;
    }
    .v-bar {
      width: 4px;
      height: 12px;
      background: var(--accent);
      border-radius: 4px;
      transform: scaleY(0.8);
      opacity: 0.9;
    }
    .v-bar:nth-child(2) { animation-delay: 0.15s; height: 26px; }
    .v-bar:nth-child(3) { animation-delay: 0.3s; height: 32px; }
    .v-bar:nth-child(4) { animation-delay: 0.45s; height: 20px; }
    .v-bar:nth-child(5) { animation-delay: 0.6s; height: 14px; }

    .main-question {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
      max-width: 780px;
    }
    .heard-bubble {
      margin-top: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 16px;
      display: inline-block;
    }

    /* Choice Chips */
    .options-row {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-top: 20px;
      justify-content: center;
    }
    .choice-chip {
      flex: 1;
      max-width: 240px;
      height: 60px;
      background: var(--control);
      border: 1px solid var(--outline);
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-chip:hover {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Primary Bottom Action */
    .bottom-bar {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }
    .primary-btn.secondary {
      width: 200px;
      background: var(--control);
      color: var(--ink);
      box-shadow: none;
    }
    .primary-btn.secondary:hover { background: var(--control-hover); }
    .primary-btn {
      width: 280px;
      height: 60px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 20px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 77, 160, 0.28);
    }
    .primary-btn:hover { background: var(--accent-hover); }

    /* ========================================================
       시그니처 인트로 스플래시 애니메이션 (Signature Splash Intro)
       ======================================================== */
    .splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background: linear-gradient(145deg, #07172C 0%, #0E294E 50%, #153C70 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      box-shadow: 0 14px 34px rgba(7, 23, 44, 0.32);
      transition: 
        top 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        left 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.22s ease,
        visibility 0.22s ease;
      cursor: pointer;
    }
    .splash-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* Ambient Pulsing Aura behind the logo */
    .splash-aura {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 180, 216, 0.28) 0%, rgba(0, 77, 160, 0.14) 42%, transparent 70%);
      filter: blur(36px);
      transform: scale(0.9);
      pointer-events: none;
    }

    .splash-bg-decor {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.06) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* Brand Container that will FLIP/glide to the top-left */
    .splash-brand-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transform-origin: center center;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    .splash-logo-svg {
      width: 380px;
      height: 130px;
      overflow: visible;
      filter: drop-shadow(0 12px 32px rgba(0, 180, 216, 0.42));
    }

    .splash-ribbon-path {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Dot Pop Animation & Shockwave Ripple */
    .splash-dot-group {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-group.pop {
      animation: dotPopIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dotPopIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.65); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-dot-ripple {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-ripple.expand {
      animation: rippleExpand 0.75s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { r: 3px; stroke-width: 3.5px; opacity: 1; }

    /* School Settings */

    /* 작은 앱 창(Pleos 분할 화면 등): 잘리는 곳 없이 한 화면에 들어오도록 줄인다 */

      .mini-tile-sub { font-size: 15px; }
      .bento-wide-card { padding: 14px 16px; }
      .wide-card-title { font-size: 22px; }
      .wide-card-desc { font-size: 15px; }

      .dialogue-top { margin-bottom: 8px; }

    /* ========================================================
       진로·진학 안내: 쉬운 기사 요약 + 관련 체험 여행 루트
       ======================================================== */
    .career-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .career-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .career-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .data-badge {
      font-size: 12px;

    .news-card-icon {

    .news-card-title {

      font-weight: 800;
      line-height: 1.35;

      font-size: 14px;

    /* 기사 상세 */
    .news-detail {

    .media-tabs {

    /* 짧은 영상: 장면 + 자막 + 내레이션 */
    .video-stage {
      flex: 1;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(145deg, #07172C 0%, #0E294E 55%, var(--cat) 140%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-progress {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
    }
    .video-progress span {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }
    .video-progress span i {
      display: block;
      height: 100%;
      width: 0;
      background: #FFFFFF;
    }
    .video-progress span.done i { width: 100%; }
    .video-progress span.now i { animation: sceneFill var(--scene-ms) linear forwards; }
    @keyframes sceneFill { to { width: 100%; } }
    .video-art {
      color: #FFFFFF;
      opacity: 0.95;
      margin-bottom: 70px;
      animation: sceneArt 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .video-art svg { width: 120px; height: 120px; }
    @keyframes sceneArt {
      from { transform: scale(0.82) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 0.95; }
    }
    .video-caption {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      background: rgba(4, 14, 28, 0.6);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;

    .video-end {
      text-align: center;
    }
    .video-end .back-btn { margin-top: 14px; }

    .news-side {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .side-block {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 20px;
      padding: 16px 18px;
    }
    .side-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .side-question {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }
    .job-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .job-chip {
      font-size: 14px;

    .side-actions {
      margin-top: auto;

      flex-direction: column;
      gap: 10px;
    }
    .wide-btn {
      height: 54px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--outline);

      color: var(--ink);

    .wide-btn:hover { background: var(--control-hover); }
    .wide-btn.primary {
      border: none;
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(0, 77, 160, 0.28);

    .wide-btn.primary:hover { background: var(--accent-hover); }

    /* 여행 루트 */
    .route-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
      min-height: 0;
    }
    .route-list {
      background: var(--paper);
      border: 1px solid var(--outline);
      border-radius: 24px;
      padding: 18px 22px;
      overflow-y: auto;
    }
    .route-leg {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0 4px 15px;
      font-size: 13px;
      font-weight: 700;

    }
    .route-leg::before {
      content: '';

    .route-start {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;

    .route-start .stop-num { background: var(--control); color: var(--muted); }
    .route-stop {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .stop-num {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-body { flex: 1; min-width: 0; }
    .stop-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stop-name {
      font-size: 18px;
      font-weight: 800;
    }
    .stop-type {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .stop-type.t-exp { background: #E5EFFB; color: #004DA0; }
    .stop-type.t-museum { background: #F3E8FF; color: #6D28D9; }
    .stop-type.t-heritage { background: #FEF3C7; color: #92400E; }
    .stop-type.t-trip { background: #DCFCE7; color: #166534; }
    .stop-meta {

    .stop-desc {
      font-size: 14px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .route-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .route-stat {
      text-align: center;
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 4px;
    }
    .route-stat b {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }
    .route-stat span {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .route-why {
      font-size: 15px;
      line-height: 1.5;
    }
    .source-note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }


    .bento-wide-card.career { border-left: 4px solid #9A8CFF; }
    .career-toast {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #0E1F36;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 600;
      max-width: 80%;

    @media (max-height: 540px), (max-width: 860px) {
      .career-head { margin-bottom: 8px; }

      .side-question { font-size: 15px; }
      .wide-btn { height: 46px; font-size: 15px; }
    }

  </style>
</head>
<body>

  <!-- Pleos Display (Pure App Window) -->
  <div class="pleos-display">

    <!-- Signature Splash Intro Overlay -->
    <div id="splashOverlay" class="splash-overlay" onclick="skipSplashIntro()">
      <div class="splash-bg-decor"></div>
      <div class="splash-aura"></div>
      
      <div id="splashBrandContainer" class="splash-brand-container">
        <svg id="splashLogoSvg" class="splash-logo-svg" viewBox="0 0 100 34" fill="none">
          <defs>
            <linearGradient id="splashFlowGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#38BDF8"/>
            </linearGradient>
            <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Main cursive ribbon D-a-i-t -->
          <path id="splashRibbonPath"
                class="splash-ribbon-path"
                d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10" 
                stroke="url(#splashFlowGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <!-- t crossbar -->
          <path id="splashCrossbarPath"
                class="splash-ribbon-path"
                d="M74 16 h12"
                stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>

          <!-- i Dot Accent (with shockwave ring) -->
          <g id="splashDotGroup" class="splash-dot-group">
            <circle id="splashDotRipple" class="splash-dot-ripple" cx="62" cy="7.5" r="3" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <circle id="splashDot" cx="62" cy="7.5" r="3.2" fill="#38BDF8" filter="url(#neonGlow)"/>
            <circle cx="62" cy="7.5" r="1.5" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Main Stage -->
    <div id="stageArea" class="stage-container">
      <!-- Injected by JS -->
    </div>

    <!-- Driving Simple Screen: 주행 중에는 문장 하나와 큰 버튼 둘만 -->
    <div id="driveScreen" class="drive-screen">
      <div id="driveSentence" class="drive-sentence">주차 후 이어갈게요</div>
      <div id="driveSub" class="drive-sub"></div>
      <div class="drive-actions">
        <button id="driveReplay" class="drive-btn" onclick="driveReplay()">다시 듣기</button>
        <button id="driveNext" class="drive-btn primary" onclick="driveNext()">넘기기</button>
      </div>
    </div>

    <!-- Demo Panel: 시연용 주행 상태와 남은 시간 -->
    <div class="demo-panel">
      <button id="demoDrive" onclick="toggleDrivingDemo()">주행</button>
      <button id="demoEtaLong" onclick="setEtaDemo('long')">8분 전</button>
      <button id="demoEtaShort" onclick="setEtaDemo('short')">2분 전</button>
      <button id="demoDest" onclick="cycleDestDemo()">목적지</button>
      <button id="demoWeekend" onclick="toggleWeekendDemo()">주말</button>
    </div>

    <div id="careerToast" class="career-toast"></div>

  </div>

  <audio id="audioPlayer" preload="none"></audio>

  <script>
    // State
    const voice = 'nika';
    let currentMode = null; // 'morning' | 'afternoon' | 'tour' | 'career' | null
    let stage = '';
    let heard = '';
    let isFinished = false;
    let currentClip = '';
    let isDrivingMode = false;
    let weekendDemo = false;
    // 주말 진로 체험 화면 상태
    let careerView = 'list'; // 'list' | 'detail' | 'route'
    let careerNewsId = null;
    let mediaTab = 'read'; // 'read' | 'listen' | 'video'
    let videoScene = 0;
    let videoTimer = null;
    let currentChoices = [];
    let etaState = 'unknown'; // 'unknown' | 'long' | 'short'
    const MEMORY_KEY = 'dait.morningMemory';

    // DAIT 공식 확정 캘리그래피 로고 (시안 2 커넥티드 리본 + i Dot)
    function getDaitLogoHtml() {
      return `
        <div class="dait-brand-badge" onclick="event.stopPropagation(); playSplashIntro();">
          <svg width="94" height="28" viewBox="0 0 100 32" fill="none">
            <path d="M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10 M74 16 h12" 
                  stroke="url(#flowGradBadge)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="62" cy="7.5" r="2.8" fill="#38BDF8"/>
            <defs>
              <linearGradient id="flowGradBadge" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/>
                <stop offset="0.6" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#38BDF8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

          <div class="dialogue-card">
            <div class="card-center">
              <div class="dialogue-orb">
                <div class="voice-visualizer" style="height:26px; margin:0;">
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                </div>
              </div>
              <div class="main-question">${data.title}</div>
              ${heard ? `<div class="heard-bubble">“${escapeHtml(heard)}”</div>` : ''}
            </div>

            ${optionsHtml}
          </div>

          <div class="bottom-bar">
            <button class="primary-btn" onclick="handlePrimaryAction()">
              ${buttonLabel}
            </button>
            ${skipHtml}
          </div>
        </div>
      `;
    }

    function startFlow(mode) {
      currentMode = mode;
      heard = '';
      isFinished = false;

      if (mode === 'morning') {
        const plan = schoolPlan();
        stage = school && !(plan && plan.hasPe) ? 'SUBJECT_TODAY' : 'PREP';
      } else if (mode === 'afternoon') {
        const memory = readStored(MEMORY_KEY);
        const fresh = memory && memory.date === toYmd(new Date());
        if (fresh && memory.rest) stage = 'REST';
        else if (fresh && memory.subject === '체육') stage = 'AFTER_PE';
        else if (fresh && memory.subject === '과학') stage = 'AFTER_SCIENCE';
        else stage = 'AFTER_EVENT';
      } else if (mode === 'tour') {
        stage = 'STEP1';
      } else if (mode === 'career') {
        careerView = 'list';
        careerNewsId = null;
        render();
        return;
      }
      if (etaState === 'short' && stage !== 'REST') stage = 'ETA_SHORT';
      render();
    }

    function goHome() {
      stopCareerMedia();
      document.getElementById('audioPlayer').pause();
      currentMode = null;
      stage = '';
      heard = '';
      isFinished = false;
      render();
      updateDriveScreen();
    }

    function handleAnswer(ans) {
      heard = ans;
      if (currentMode === 'morning') {
        if (stage === 'PREP') stage = ans === '깜빡했어' ? 'SUBJECT_MISSING' : 'SUBJECT';
        else if (stage === 'SUBJECT' || stage === 'SUBJECT_MISSING' || stage === 'SUBJECT_TODAY') {
          rememberMorning({ subject: ans });
          if (ans === '과학') stage = 'SCIENCE_DETAIL';
          else if (ans === '독서' || ans === '국어') stage = 'READING_DETAIL';
          else stage = 'DONE';
        } else if (stage === 'SCIENCE_DETAIL' || stage === 'READING_DETAIL') {
          stage = 'DONE';
          isFinished = true;
        }
      } else if (currentMode === 'afternoon') {
        if (ans === '쉬고 싶어') {
          rememberMorning({ rest: true });
          stage = 'REST';
        } else if (stage === 'AFTER_EVENT' || stage === 'AFTER_PE' || stage === 'AFTER_SCIENCE') {
          stage = ans === '시간표랑 달랐어' ? 'AFTER_CHANGED' : 'AFTER_DETAIL';
        } else if (stage === 'AFTER_DETAIL') stage = ans === '시간표랑 달랐어' ? 'AFTER_CHANGED' : 'PARENT_BRIDGE';
        else if (stage === 'AFTER_CHANGED') stage = 'PARENT_BRIDGE';
        else if (stage === 'PARENT_BRIDGE') {
          stage = 'DONE';
          isFinished = true;
        }
      } else if (currentMode === 'tour') {
        if (stage === 'STEP1') stage = 'STEP2';
        else if (stage === 'STEP2') {
          stage = 'DONE';
          isFinished = true;
        }
      }
      // 도착이 가까우면 새 질문 대신 마무리 (기획안 ④)
      if (etaState === 'short' && !isDialogueDone()) stage = 'ETA_SHORT';
      render();
    }

    // ========================================================
    // 주말 진로 체험: 기사 목록 · 기사 상세(글/듣기/짧은 영상) · 여행 루트
    // ========================================================
    const SCENE_MS = 5200;

    function showCareerToast(message) {
      const toast = document.getElementById('careerToast');
      toast.textContent = message;
      toast.style.display = 'block';
      clearTimeout(showCareerToast.timer);
      showCareerToast.timer = setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    function currentNews() {
      return careerNews.find(n => n.id === careerNewsId);
    }

    function catStyle(id) {
      const c = careerCategories[id];
      return `--cat:${c.color}; --cat-soft:${c.soft};`;
    }

    function formatMinutes(min) {
      const h = Math.floor(min / 60), m = min % 60;
      if (!h) return `${m}분`;
      return m ? `${h}시간 ${m}분` : `${h}시간`;
    }

    function renderCareer(container) {
      if (careerView === 'detail') renderCareerDetail(container);
      else if (careerView === 'route') renderCareerRoute(container);
      else renderCareerList(container);
    }

    function renderCareerList(container) {
      container.innerHTML = `

    // 듣기: 문장마다 읽으면서 해당 줄을 강조한다.
    function startListening() {
      const n = currentNews();
      const lines = [n.title, ...n.points];
      speakLines(lines, idx => {
        document.querySelectorAll('#listenLines li').forEach((li, i) => li.classList.toggle('speaking', i === idx - 1));
      });
    }

    // 짧은 영상: 요약 문장마다 장면 하나, 자막과 내레이션을 함께 재생한다.
    function startVideo() {
      videoScene = 0;
      showVideoScene();
    }

    function showVideoScene() {
      const n = currentNews();
      const stageEl = document.getElementById('videoStage');
      if (!stageEl) return;
      const total = n.points.length;

      if (videoScene >= total) {
        stageEl.innerHTML = `
          <div class="video-end">
            <div class="video-art">${careerCategories[n.id].icon}</div>
            <button class="back-btn" onclick="startVideo()">다시 보기</button>
          </div>`;
        return;
      }

      stageEl.innerHTML = `
        <div class="video-progress">
          ${n.points.map((_, i) => `<span class="${i < videoScene ? 'done' : i === videoScene ? 'now' : ''}"><i></i></span>`).join('')}
        </div>
        <div class="video-art">${careerCategories[n.id].icon}</div>
        <div class="video-caption">${n.points[videoScene]}</div>`;
      speakLines([n.points[videoScene]]);
      videoTimer = setTimeout(() => {
        videoScene += 1;
        showVideoScene();
      }, SCENE_MS);
    }

    function stopCareerMedia() {
      clearTimeout(videoTimer);
      videoTimer = null;
      stopSpeaking();
    }

    // 기사 낭독: 앱에서는 Android TTS, 브라우저 프리뷰에서는 Web Speech API
    function speakLines(lines, onLine) {
      stopSpeaking();
      if (window.AndroidBridge && window.AndroidBridge.speak) {
        window.AndroidBridge.speak(lines.join(' '));
        return;
      }
      if (!('speechSynthesis' in window)) return;
      lines.forEach((line, idx) => {
        const u = new SpeechSynthesisUtterance(line);
        u.lang = 'ko-KR';
        if (onLine) u.onstart = () => onLine(idx);
        if (onLine && idx === lines.length - 1) u.onend = () => onLine(-1);
        window.speechSynthesis.speak(u);
      });
    }

    function stopSpeaking() {
      if (window.AndroidBridge && window.AndroidBridge.stopSpeaking) window.AndroidBridge.stopSpeaking();
      else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function isDialogueDone() {
      return isFinished || stage === 'DONE' || stage === 'REST' || stage === 'ETA_SHORT';
    }

    // 질문을 건너뛴다. 답을 지어내지 않고 다음 단계로만 넘어간다.
    function skipQuestion() {
      if (!currentMode || currentMode === 'settings' || isDialogueDone()) return;
      heard = '';
      if (currentMode === 'morning') {
        if (stage === 'PREP') stage = 'SUBJECT_TODAY';
        else stage = 'DONE';
      } else if (currentMode === 'afternoon') {
        if (stage === 'AFTER_EVENT' || stage === 'AFTER_PE' || stage === 'AFTER_SCIENCE') stage = 'PARENT_BRIDGE';
        else stage = 'DONE';
      } else {
        stage = 'DONE';
      }
      if (stage === 'DONE') isFinished = true;
      if (etaState === 'short' && !isDialogueDone()) stage = 'ETA_SHORT';
      render();
    }

    // 아침에 고른 과목과 쉬기 여부를 기기에 남겨 하교 때 다시 꺼낸다 (기획안 ③⑤)
    function rememberMorning(patch) {
      const today = toYmd(new Date());
      const memory = readStored(MEMORY_KEY);
      const base = memory && memory.date === today ? memory : { date: today };
      writeStored(MEMORY_KEY, { ...base, ...patch });
    }

    function handlePrimaryAction() {
      if (isDialogueDone()) {
        goHome();
      } else {
        playAudio(currentClip);
      }
    }

    // ========================================================
    // 학교 정보 (나이스 교육정보 개방 포털)
    // ========================================================
    const NEIS_URL = 'https://open.neis.go.kr/hub/';
    const SCHOOL_KEY = 'dait.school';
    const DAYS_KEY = 'dait.schoolDays';
    const DAYS_AHEAD = 7;
    const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    let school = readStored(SCHOOL_KEY);
    let schoolDays = readStored(DAYS_KEY) || {};
    let settings = {};
    let neisSeq = 0;
    let homeStale = false;
    const neisWaiting = {};

    function readStored(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }

    function writeStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.log('Storage error:', e); }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function toYmd(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}${month}${day}`;
    }

    function fromYmd(ymd) {
      return new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)) - 1, Number(ymd.slice(6, 8)));
    }

    function upcomingDates() {
      const start = new Date();
      return Array.from({ length: DAYS_AHEAD + 1 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }

    function dayLabel(ymd) {
      const dates = upcomingDates();
      if (ymd === toYmd(dates[0])) return '오늘';
      if (ymd === toYmd(dates[1])) return '내일';
      return WEEKDAYS[fromYmd(ymd).getDay()];
    }

    // 앱에서는 Kotlin이 대신 받아 인증키를 화면 코드 밖에 두고, 브라우저 미리보기는 직접 받는다.
    window.onNeisResult = function(requestId, body) {
      const resolve = neisWaiting[requestId];
      delete neisWaiting[requestId];
      if (resolve) resolve(body);
    };

    function neisBody(service, query) {
      if (window.AndroidBridge) {
        return new Promise(resolve => {
          const requestId = ++neisSeq;
          neisWaiting[requestId] = resolve;
          window.AndroidBridge.neisGet(requestId, service, query);
        });
      }
      return fetch(`${NEIS_URL}${service}?${query}`).then(response => response.text());
    }

    async function neisRows(service, params) {
      const query = new URLSearchParams({ Type: 'json', pIndex: '1', pSize: '100', ...params }).toString();
      const data = JSON.parse(await neisBody(service, query));
      if (data.RESULT) {
        if (data.RESULT.CODE === 'INFO-200') return [];
        throw new Error(data.RESULT.CODE);
      }
      return data[service][1].row;
    }

    function mainDish(dishes) {
      const items = dishes.split(/<br\s*\/?>/i)
        .map(item => item.replace(/\([^)]*\)/g, '').replace(/[*]/g, '').replace(/[a-zA-Z]+\s*$/, '').trim())
        .filter(Boolean);
      return items.find(item => !/(밥|국|탕|찌개|김치|깍두기|우유|주스)$/.test(item)) || items[0] || '';
    }

    // 시간표 창구는 학교급마다 다르다.
    const SCHOOL_KINDS = {
      '초등학교': { service: 'elsTimetable', grades: [1, 2, 3, 4, 5, 6] },
      '중학교': { service: 'misTimetable', grades: [1, 2, 3] },
      '고등학교': { service: 'hisTimetable', grades: [1, 2, 3] }
    };

    function timetableService(target) {
      return (SCHOOL_KINDS[target.kind] || SCHOOL_KINDS['초등학교']).service;
    }

    // 인증키가 없으면 응답이 5건으로 줄어들어 시간표는 하루씩 받는다.
    async function refreshSchoolDays() {
      if (!school) return;
      const target = school;
      const dates = upcomingDates();
      const ymds = dates.map(toYmd);
      const base = { ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code };
      try {
        const schoolDates = dates.filter(date => date.getDay() !== 0 && date.getDay() !== 6);
        const [timetables, meals] = await Promise.all([
          Promise.all(schoolDates.map(date => neisRows(timetableService(target), {
            ...base, GRADE: target.grade, CLASS_NM: target.classNm, ALL_TI_YMD: toYmd(date)
          }))),
          neisRows('mealServiceDietInfo', {
            ...base, MMEAL_SC_CODE: '2', MLSV_FROM_YMD: ymds[0], MLSV_TO_YMD: ymds[ymds.length - 1]
          })
        ]);
        const days = {};
        ymds.forEach(ymd => { days[ymd] = { subjects: [], meal: '' }; });
        timetables.flat().sort((a, b) => Number(a.PERIO) - Number(b.PERIO)).forEach(row => {
          const day = days[row.ALL_TI_YMD];
          if (day && !day.subjects.includes(row.ITRT_CNTNT)) day.subjects.push(row.ITRT_CNTNT);
        });
        meals.forEach(row => {
          if (days[row.MLSV_YMD]) days[row.MLSV_YMD].meal = mainDish(row.DDISH_NM);
        });
        if (school !== target) return;
        schoolDays = days;
        writeStored(DAYS_KEY, days);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School data error:', e);
      }
    }

    function schoolPlan() {
      const today = toYmd(new Date());
      const ymd = Object.keys(schoolDays).sort()
        .find(key => key >= today && (schoolDays[key].subjects.length > 0 || schoolDays[key].meal));
      if (!school || !ymd) return null;
      const day = schoolDays[ymd];
      return { ...day, label: dayLabel(ymd), hasPe: day.subjects.includes('체육') };
    }

    function subjectChoices() {
      const plan = schoolPlan();
      if (!plan || plan.subjects.length === 0) return null;
      const preferred = ['체육', '과학', '국어'].filter(subject => plan.subjects.includes(subject));
      return [...new Set([...preferred, ...plan.subjects])].slice(0, 3);
    }

    function chipClass(subject) {
      if (subject === '체육') return ' pe';
      if (/미술|음악|체육/.test(subject)) return ' art';
      if (/과학|수학/.test(subject)) return ' sci';
      return '';
    }

    // 여정 그림. 출발점에서 목적지까지 한 획, 그 위에 차 위치. 남은 시간이 없으면 선만 그린다.
    function routeSvg(trip) {
      const total = trip.kind === 'school' || trip.kind === 'home' ? 20 : null; // 기준 20분 여정
      const remain = trip.minutes;
      const progress = total && remain !== null ? Math.min(0.92, Math.max(0.08, 1 - remain / total)) : null;
      const W = 420, H = 140;
      const path = `M 24 ${H - 30} C 120 ${H - 30}, 170 34, 250 34 S ${W - 40} ${H - 70}, ${W - 24} 44`;
      const figure = trip.figure || '';
      const unit = trip.figureUnit || '';
      const endLabel = trip.kind === 'school' ? '학교' : trip.kind === 'home' ? '집' : (trip.kind === 'weekend' ? '다음 수업일' : (trip.mode === 'afternoon' ? '집' : '학교'));
      const startLabel = trip.kind === 'school' ? '집' : trip.kind === 'home' ? '학교' : '지금';
      let dot = '';
      if (progress !== null) {
        dot = `<path class="route-done" d="${path}" pathLength="1" stroke-dasharray="${progress} 1"/>
          <g id="routeDot"><circle class="route-dot-halo" r="14"/><circle class="route-dot" r="6"/></g>`;
      }
      return `<svg class="hero-route" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="route-path" d="${path}"/>
        ${dot}
        <circle class="route-dot" cx="24" cy="${H - 30}" r="4"/>
        <text class="route-label" x="24" y="${H - 8}" text-anchor="start">${escapeHtml(startLabel)}</text>
        <circle class="route-end-fill" cx="${W - 24}" cy="44" r="9"/>
        <circle class="route-end" cx="${W - 24}" cy="44" r="9"/>
        <text class="route-label" x="${W - 24}" y="22" text-anchor="end">${escapeHtml(endLabel)}</text>
        <text class="route-figure" x="${W / 2}" y="${H - 14}" text-anchor="middle">${escapeHtml(figure)}<tspan class="route-unit" dx="4">${escapeHtml(unit)}</tspan></text>
      </svg>`;
    }

    // 그린 뒤 차 위치 점을 선 위로 옮긴다 (pathLength 비율 → 실제 좌표)
    function placeRouteDot() {
      const svg = document.querySelector('.hero-route');
      const dot = svg && svg.querySelector('#routeDot');
      const done = svg && svg.querySelector('.route-done');
      if (!svg || !dot || !done) return;
      const ratio = parseFloat(done.getAttribute('stroke-dasharray'));
      const len = done.getTotalLength();
      const pt = done.getPointAtLength(len * ratio);
      dot.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    }

    // 지금 여정을 한 곳에서 정한다. 첫 화면·칸·대화 시작이 모두 이것을 따른다.
    // 우선순위: 내비 목적지(학교/집) → 수업일의 시간대(오전 등교·오후 하교) → 주말·방학은 다음 수업일 준비
    function currentTrip() {
      const now = new Date();
      const minutes = naviRemainMinutes();
      const mins = minutes === null ? null : Math.max(1, Math.round(minutes));
      if (naviInfo && naviInfo.name) {
        const fig = { figure: mins === null ? '' : String(mins), figureUnit: mins === null ? '' : '분' };
        if (school && placeMatches(naviInfo, school)) return { mode: 'morning', kind: 'school', known: true, where: `${school.name}까지`, minutes: mins, when: '', ...fig };
        if (homePlace && placeMatches(naviInfo, homePlace)) return { mode: 'afternoon', kind: 'home', known: true, where: '집까지', minutes: mins, when: '', ...fig };
      }
      // 여기부터는 목적지가 학교도 집도 아니거나 없다. 남은 시간은 쓰지 않는다
      const unknownMins = null;
      const todayYmd = toYmd(now);
      const todayHasClass = !weekendDemo && !!(schoolDays[todayYmd] && schoolDays[todayYmd].subjects.length);
      const isWeekend = weekendDemo || now.getDay() === 0 || now.getDay() === 6;
      if (school && Object.keys(schoolDays).length && !todayHasClass) {
        const plan = schoolPlan();
        const label = plan ? plan.label : '다음 수업일';
        return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: `${label} 준비`, figure: label.replace('요일', ''), figureUnit: label.endsWith('요일') ? '요일' : '' };
      }
      if (!school && isWeekend) return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: '다음 수업일 준비', figure: '월', figureUnit: '요일' };
      const afternoon = now.getHours() >= 12;
      const hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      return { mode: afternoon ? 'afternoon' : 'morning', kind: afternoon ? 'afternoon' : 'morning', known: false, where: '', minutes: unknownMins, when: afternoon ? '오늘 오후' : '오늘 아침', figure: hhmm, figureUnit: '' };
    }

    function homeInfo(trip) {
      const plan = school ? schoolPlan() : null;
      const dayWord = plan ? plan.label : '오늘';
      const memory = readStored(MEMORY_KEY);
      const morningSubject = memory && memory.date === toYmd(new Date()) ? memory.subject : null;
      const prepLine = !school ? { prep: '체육복', prepSub: '예시' }
        : !plan ? { prep: '확인 필요', prepSub: '' }
        : plan.hasPe ? { prep: '체육복', prepSub: '시간표 기준' }
        : { prep: '학교 안내 확인', prepSub: plan.subjects.slice(0, 2).join(' · ') };
      const mealLine = !school ? { meal: '떡갈비구이', mealSub: '예시' } : { meal: plan && plan.meal ? plan.meal : '확인 필요', mealSub: '' };

      const subjects = plan ? plan.subjects : (!school ? ['체육', '국어', '수학', '과학'] : []);
      // 오늘의 질문: 시간표에서 고른다. 기획안 교사 규칙표의 과목별 질문
      const question = plan && plan.subjects.includes('과학') ? '오늘 과학 시간엔 뭐가 궁금해?'
        : plan && plan.hasPe ? '체육 시간에 해 보고 싶은 게 있어?'
        : plan && plan.subjects.includes('미술') ? '오늘은 뭘 그리고 싶어?'
        : plan && plan.subjects.includes('국어') ? '기억나는 이야기 하나 있어?'
        : '오늘 가장 기대되는 시간은 언제야?';
      const otherMorning = trip.known
        ? { otherKicker: '하교 때 다시 물을 질문', otherChips: null, otherTitle: question, otherDesc: '아침에 답하면 집에 갈 때 이어서 물어요' }
        : { otherKicker: '등교', otherChips: subjects.slice(0, 6), otherTitle: `${dayWord} 시간표`, otherDesc: subjects.length ? '' : '학교를 설정하면 보여 줘요' };
      const otherAfternoon = trip.known
        ? { otherKicker: '오늘의 질문', otherChips: subjects.slice(0, 6), otherTitle: question, otherDesc: '대답은 아이가 해요. 부모는 듣다가 끼어들면 돼요' }
        : { otherKicker: trip.kind === 'weekend' ? `${dayWord} 시간표` : '하교', otherChips: trip.kind === 'weekend' ? subjects.slice(0, 6) : null, otherTitle: trip.kind === 'weekend' ? '하교 대화는 집에 갈 때' : '오늘 이야기 들려주기', otherDesc: trip.kind === 'weekend' ? '아침 질문을 기억했다가 이어서 물어요' : '기억나는 장면 하나면 돼요' };

      if (trip.mode === 'afternoon') {
        return {
          title: morningSubject ? `아침에 고른 ${morningSubject}, 어땠나요?` : '오늘은 어땠나요?',
          desc: '기억나는 장면 하나만 들려줘요',
          prepLabel: '아침에 고른 수업', prep: morningSubject || '없음', prepSub: morningSubject ? '하교 대화에서 다시 물어요' : '등교 대화에서 고르면 여기 남아요',
          mealLabel: `${dayWord === '오늘' ? '내일' : dayWord} 점심`, ...mealLine,
          ...otherMorning
        };
      }
      if (trip.kind === 'weekend') {
        return {
          title: `${dayWord} 준비 됐나요?`,
          desc: plan ? (plan.hasPe ? '체육이 있어요. 체육복을 미리 챙겨요' : `${plan.subjects.slice(0, 3).join(' · ')}`) : '학교를 설정하면 시간표를 보여 줘요',
          prepLabel: `${dayWord} 준비물`, ...prepLine,
          mealLabel: `${dayWord} 점심`, ...mealLine,
          ...otherAfternoon
        };
      }
      return {
        title: trip.known ? (plan && plan.hasPe ? '체육복 챙겼나요?' : '오늘 준비 됐나요?') : `${dayWord} 준비 됐나요?`,
        desc: !school ? '체육복을 함께 확인해요' : !plan ? '학교 정보를 확인하지 못했어요' : (plan.hasPe ? '체육복을 함께 확인해요' : (plan.subjects.slice(0, 3).join(' · ') || '학교 안내를 확인해요')),
        prepLabel: '준비물', ...prepLine,
        mealLabel: `${dayWord} 점심`, ...mealLine,
        ...otherAfternoon
      };
    }

    function openSettings() {
      document.getElementById('audioPlayer').pause();
      currentMode = 'settings';
      settings = { step: 'search', query: '', results: [], classes: [], message: '' };
      render();
    }

    function renderSettings(container) {
      let title = school ? `${school.name} ${school.grade}학년 ${school.classNm}반` : '학교를 찾아 주세요';
      let body = '';

      if (settings.step === 'search') {
        body = `
          <div class="school-search-row">
            <input id="schoolInput" class="school-input" type="text" placeholder="학교 이름" value="${escapeHtml(settings.query)}"
                   onkeydown="if (event.key === 'Enter') searchSchools()">
            <button class="choice-chip" onclick="searchSchools()">찾기</button>
          </div>
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.results.map((row, i) => `<button class="choice-chip" onclick="pickSchool(${i})">${escapeHtml(row.SCHUL_NM)} · ${escapeHtml(row.LCTN_SC_NM)}</button>`).join('')}
          </div>
        `;
      } else if (settings.step === 'grade') {
        title = '몇 학년인가요?';
        body = `<div class="settings-list">${SCHOOL_KINDS[settings.picked.SCHUL_KND_SC_NM].grades.map(grade => `<button class="choice-chip" onclick="pickGrade(${grade})">${grade}학년</button>`).join('')}</div>`;
      } else {
        title = '몇 반인가요?';
        body = `
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.classes.map((name, i) => `<button class="choice-chip" onclick="pickClass(${i})">${escapeHtml(name)}${/^\d+$/.test(name) ? '반' : ''}</button>`).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            ${school ? '<button class="back-btn" onclick="clearSchool()">학교 지우기</button>' : ''}
            ${homePlace ? `<button class="back-btn" onclick="clearHome()">집 지우기 (${escapeHtml(homePlace.name)})</button>` : ''}
            ${canSaveHome() ? `<button class="back-btn" onclick="saveHomeFromNavi()">지금 목적지를 집으로</button>` : ''}
          </div>
          <div class="dialogue-card">
            <div class="settings-center">
              <div class="main-question">${escapeHtml(title)}</div>
              ${body}
            </div>
          </div>
        </div>
      `;
    }

    async function searchSchools() {
      const query = document.getElementById('schoolInput').value.trim();
      if (!query) return;
      settings.query = query;
      settings.results = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('schoolInfo', { SCHUL_NM: query });
        settings.results = rows.filter(row => row.SD_SCHUL_CODE.trim() && SCHOOL_KINDS[row.SCHUL_KND_SC_NM]).slice(0, 8);
        settings.message = settings.results.length > 0 ? '' : '찾는 학교가 없어요';
      } catch (e) {
        console.log('School search error:', e);
        settings.message = '지금은 학교를 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickSchool(index) {
      settings.picked = settings.results[index];
      settings.step = 'grade';
      render();
    }

    async function pickGrade(grade) {
      const now = new Date();
      settings.grade = grade;
      settings.step = 'class';
      settings.classes = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('classInfo', {
          ATPT_OFCDC_SC_CODE: settings.picked.ATPT_OFCDC_SC_CODE,
          SD_SCHUL_CODE: settings.picked.SD_SCHUL_CODE,
          AY: String(now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear()),
          GRADE: String(grade)
        });
        settings.classes = [...new Set(rows.map(row => row.CLASS_NM))];
        settings.message = settings.classes.length > 0 ? '' : '찾는 반이 없어요';
      } catch (e) {
        console.log('Class search error:', e);
        settings.message = '지금은 반을 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickClass(index) {
      school = {
        office: settings.picked.ATPT_OFCDC_SC_CODE,
        code: settings.picked.SD_SCHUL_CODE,
        name: settings.picked.SCHUL_NM,
        address: settings.picked.ORG_RDNMA || '',
        kind: settings.picked.SCHUL_KND_SC_NM,
        grade: String(settings.grade),
        classNm: settings.classes[index]
      };
      schoolDays = {};
      writeStored(SCHOOL_KEY, school);
      writeStored(DAYS_KEY, schoolDays);
      goHome();
      refreshSchoolDays();
    }

    function clearSchool() {
      school = null;
      schoolDays = {};
      try {
        localStorage.removeItem(SCHOOL_KEY);
        localStorage.removeItem(DAYS_KEY);
      } catch (e) {
        console.log('Storage error:', e);
      }
      goHome();
    }

    function playAudio(clipId) {
      currentClip = clipId;
      // 음원은 '오늘' 기준으로 녹음되어 있어, 수업이 없는 날에는 틀지 않는다. 음원 조각 작업에서 요일별로 바꾼다.
      if (currentTrip().kind === 'weekend') return;
      const player = document.getElementById('audioPlayer');
      const isAndroidAsset = window.location.href.includes('android_asset');
      const src = isAndroidAsset 
        ? `voices/${voice.toLowerCase()}/${clipId}.wav` 
        : `../android/app/src/main/assets/voices/${voice.toLowerCase()}/${clipId}.wav`;
      player.src = src;
      player.play().catch(e => console.log('Audio error:', e));
    }

    // In-App Detection & Driving Restriction API
    if (window.location.href.includes('android_asset') || navigator.userAgent.includes('Android')) {
      document.body.classList.add('in-app');
    }

    // 주행 중: 상세 화면을 닫고 문장 하나와 큰 버튼 둘만 보여 준다. 재생 중인 음성은 이어 간다.
    // 대화 중이 아니면(첫 화면·설정) 조작할 것이 없으므로 "주차 후 이어갈게요"만 보여 준다.
    window.setDrivingMode = function(isDriving) {
      isDrivingMode = isDriving;
      document.body.classList.toggle('driving', isDriving);
      document.getElementById('demoDrive').classList.toggle('on', isDriving);
      if (isDriving && currentMode === 'settings') goHome();
      // 진로 체험: 영상은 멈추고, 듣기 중인 기사 낭독은 이어 간다.
      if (isDriving && currentMode === 'career' && mediaTab === 'video') stopCareerMedia();
      updateDriveScreen();
    };

    function updateDriveScreen(sentence) {
      const inDialogue = currentMode && currentMode !== 'settings' && currentMode !== 'career';
      const text = inDialogue ? (sentence || document.querySelector('.main-question')?.textContent || '') : '주차 후 이어갈게요';
      document.getElementById('driveSentence').textContent = text;
      document.getElementById('driveSub').textContent = inDialogue && heard ? `“${heard}”` : (inDialogue ? '' : '설정과 자세한 내용은 주차한 뒤 열어요');
      const done = inDialogue && isDialogueDone();
      document.getElementById('driveReplay').disabled = !inDialogue;
      document.getElementById('driveNext').textContent = done ? '마치기' : '넘기기';
      document.getElementById('driveNext').disabled = !inDialogue;
    }

    function driveReplay() {
      if (currentMode && currentMode !== 'settings') playAudio(currentClip);
    }

    function driveNext() {
      if (isDialogueDone()) goHome();
      else skipQuestion();
      updateDriveScreen();
    }

    // 시연용 주말. 수업이 있는 날에도 주말 첫 화면(진로 체험 카드)을 보여 준다.
    function toggleWeekendDemo() {
      weekendDemo = !weekendDemo;
      document.getElementById('demoWeekend').classList.toggle('on', weekendDemo);
      if (!currentMode) render();
    }

    function toggleDrivingDemo() {
      if (window.AndroidBridge) {
        window.AndroidBridge.toggleDrivingSim();
      } else {
        window.setDrivingMode(!isDrivingMode);
      }
    }

    // 차가 보내는 목적지와 남은 시간. 앱의 NaviBridge가 부른다.
    // 실제 값이 오면 시연 조작(8분 전·2분 전)보다 우선한다.
    let naviInfo = null;
    const ETA_SHORT_MIN = 2;

    window.onNaviUpdate = function(jsonText) {
      let info;
      try { info = JSON.parse(jsonText); } catch (e) { return; }
      console.log('Navi:', jsonText);
      if (info.event === 'destination' || info.event === 'routeStarted') {
        // 길 안내가 없을 때는 이름 없이 0으로 오므로 도착 직전과 구분한다.
        if (!info.name && !(Number(info.remainTime) > 0)) { const had = !!naviInfo; naviInfo = null; renderDemoPanel(); if (had) refreshHomeIfIdle(); return; }
        const changed = !naviInfo || naviInfo.name !== (info.name || '') || (currentMode === 'settings' && !document.querySelector('[onclick="saveHomeFromNavi()"]') && canSaveHomeFor(info));
        naviInfo = { name: info.name || '', address: info.address || '', remainTime: Number(info.remainTime), remainDistance: Number(info.remainDistance), at: Date.now() };
        applyNaviEta();
        if (changed) refreshHomeIfIdle();
      } else if (info.event === 'routeCancelled' || info.event === 'routeEnded' || info.event === 'arrived' || info.event === 'unavailable') {
        if (info.event === 'arrived' && naviInfo) { naviInfo.remainTime = 0; applyNaviEta(); }
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
      } else if (info.event === 'status' && info.status !== 'ROUTE_DRIVE') {
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
      }
    };

    function refreshHomeIfIdle() {
      if (isIntroPlaying) { homeStale = true; return; }
      if (!currentMode || currentMode === 'settings') render();
    }
    // 길 안내 중 10초마다 같은 목적지가 와도 설정 화면의 '집으로' 버튼이 늦지 않게, 목적지 이름이 생기면 다시 그린다

    // ========================================================
    // 목적지로 등교·하교 제안 (기획안 ②: 목적지가 학교면 등교, 집이면 하교)
    // 자동으로 대화를 시작하지는 않는다. 안전 원칙: 운전자 조작 없이 소리를 내지 않는다.
    // ========================================================
    const HOME_KEY = 'dait.home';
    let homePlace = readStored(HOME_KEY);

    function normalizePlace(text) {
      return String(text || '').replace(/\s+/g, '').replace(/[()·,.]/g, '');
    }

    // 도로명 주소에서 '산정로 171'처럼 도로 이름과 번지만 뽑는다.
    function roadPart(address) {
      const m = String(address || '').match(/([가-힣A-Za-z0-9]+(?:로|길|대로))\s*(\d+(?:-\d+)?)/);
      return m ? m[1] + m[2] : '';
    }

    function placeMatches(dest, place) {
      if (!dest || !place) return false;
      const destName = normalizePlace(dest.name), placeName = normalizePlace(place.name);
      if (destName && placeName && (destName === placeName || destName.includes(placeName) || placeName.includes(destName))) return true;
      const destRoad = roadPart(dest.address), placeRoad = roadPart(place.address);
      return !!(destRoad && placeRoad && destRoad === placeRoad);
    }

    function canSaveHome() { return canSaveHomeFor(naviInfo); }
    function canSaveHomeFor(dest) {
      return !!(dest && dest.name) && !(school && placeMatches(dest, school)) && !(homePlace && placeMatches(dest, homePlace));
    }

    function saveHomeFromNavi() {
      if (!canSaveHome()) return;
      homePlace = { name: naviInfo.name, address: naviInfo.address || '' };
      writeStored(HOME_KEY, homePlace);
      goHome();
    }

    function clearHome() {
      homePlace = null;
      try { localStorage.removeItem(HOME_KEY); } catch (e) { console.log('Storage error:', e); }
      render();
    }

    // 남은 시간은 초, 남은 거리는 m 단위다. 에뮬레이터에서 판교→서울시청 1740초·26000m로 확인했다.
    function naviRemainMinutes() {
      if (!naviInfo || !Number.isFinite(naviInfo.remainTime)) return null;
      return naviInfo.remainTime / 60;
    }

    function applyNaviEta() {
      const minutes = naviRemainMinutes();
      if (minutes === null) return;
      etaState = minutes <= ETA_SHORT_MIN ? 'short' : 'long';
      renderDemoPanel();
      if (etaState === 'short' && currentMode && currentMode !== 'settings' && !isDialogueDone()) {
        stage = 'ETA_SHORT';
        render();
      }
    }

    function renderDemoPanel() {
      const minutes = naviRemainMinutes();
      const live = minutes !== null;
      document.getElementById('demoEtaLong').classList.toggle('on', etaState === 'long');
      document.getElementById('demoEtaShort').classList.toggle('on', etaState === 'short');
      document.getElementById('demoEtaLong').textContent = live ? `${Math.max(1, Math.round(minutes))}분 전` : '8분 전';
      document.getElementById('demoEtaLong').disabled = live;
      document.getElementById('demoEtaShort').disabled = live;
    }

    // 시연용 목적지. 차에서 실제 값이 오면(앱 안) 쓰지 않는다. 없음 → 학교 → 집 → 없음 순으로 돈다.
    let destDemoStep = 0;
    function cycleDestDemo() {
      if (window.AndroidBridge) return;
      destDemoStep = (destDemoStep + 1) % 3;
      const fake = destDemoStep === 1 && school ? { name: school.name, address: school.address, remainTime: 480, remainDistance: 4000 }
        : destDemoStep === 2 ? { name: homePlace ? homePlace.name : '우리집', address: homePlace ? homePlace.address : '', remainTime: 480, remainDistance: 4000 }
        : null;
      document.getElementById('demoDest').classList.toggle('on', !!fake);
      if (fake) window.onNaviUpdate(JSON.stringify({ event: 'destination', ...fake }));
      else window.onNaviUpdate(JSON.stringify({ event: 'routeCancelled' }));
    }

    // 시연용 남은 시간. 차에서 실제 값이 오면 쓰지 않는다.
    function setEtaDemo(state) {
      if (naviRemainMinutes() !== null) return;
      etaState = etaState === state ? 'unknown' : state;
      renderDemoPanel();
      if (etaState === 'short' && currentMode && currentMode !== 'settings' && !isDialogueDone()) {
        stage = 'ETA_SHORT';
        render();
      }
    }

    // ========================================================
    // 시그니처 인트로 스플래시 애니메이션 엔진
    // ========================================================
    let isIntroPlaying = false;
    let introTimers = [];

    function clearIntroTimers() {
      introTimers.forEach(t => clearTimeout(t));
      introTimers = [];
    }

    function playChimeSound() {
      if (isDrivingMode) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        // 산뜻하고 경쾌한 현대 ccNC 차음 스타일 피치 (880Hz -> 1760Hz)
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {
        // 브라우저 자동 재생 정책 제한 시 안전 패스
      }
    }

    function playSplashIntro() {
      if (isIntroPlaying) return;
      isIntroPlaying = true;
      clearIntroTimers();

      const overlay = document.getElementById('splashOverlay');
      const brand = document.getElementById('splashBrandContainer');
      const ribbon = document.getElementById('splashRibbonPath');
      const crossbar = document.getElementById('splashCrossbarPath');
      const dotGroup = document.getElementById('splashDotGroup');
      const dotRipple = document.getElementById('splashDotRipple');
      const aura = document.querySelector('.splash-aura');

      if (!overlay || !ribbon) {
        isIntroPlaying = false;
        return;
      }

      // 오버레이 및 브랜드 상태 초기화 (전체 화면 상태로 리셋)
      overlay.style.transition = 'none';
      overlay.style.top = '0px';
      overlay.style.left = '0px';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.borderRadius = '28px';
      overlay.style.boxShadow = 'none';
      overlay.classList.remove('fade-out');
      overlay.style.display = 'flex';
      overlay.style.opacity = '1';
      overlay.style.visibility = 'visible';

      if (aura) {
        aura.style.transition = 'none';
        aura.style.opacity = '0.9';
      }

      brand.style.transition = 'none';
      brand.style.transform = 'translate(0, 0) scale(1)';
      brand.style.opacity = '1';

      if (dotGroup) dotGroup.classList.remove('pop');
      if (dotRipple) dotRipple.classList.remove('expand');

      // 우측 메뉴 카드 초기화 (오른쪽에서 당겨져 들어올 준비)
      const rightCards = document.querySelectorAll('.bento-right-col > *');
      rightCards.forEach((card) => {
        card.style.transition = 'none';
        card.style.transform = 'translateX(65px)';
        card.style.opacity = '0';
      });

      // SVG 스트로크 대시 설정 (전체 길이 측정)
      const ribbonLength = ribbon.getTotalLength ? ribbon.getTotalLength() : 380;
      ribbon.style.transition = 'none';
      ribbon.style.strokeDasharray = ribbonLength;
      ribbon.style.strokeDashoffset = ribbonLength;

      const crossbarLength = crossbar.getTotalLength ? crossbar.getTotalLength() : 20;
      crossbar.style.transition = 'none';
      crossbar.style.strokeDasharray = crossbarLength;
      crossbar.style.strokeDashoffset = crossbarLength;

      // 동기식 리플로우 강제 (트랜지션 보장)
      void ribbon.getBoundingClientRect();

      // 1. 손글씨 쓰듯 캘리그래피 스트로크 스르륵 써내려가기 (0 ~ 1.05s)
      requestAnimationFrame(() => {
        ribbon.style.transition = 'stroke-dashoffset 1.05s cubic-bezier(0.42, 0, 0.18, 1)';
        ribbon.style.strokeDashoffset = '0';
      });

      // 2. t 가로획 연결 (0.92s)
      introTimers.push(setTimeout(() => {
        crossbar.style.transition = 'stroke-dashoffset 0.18s ease-out';
        crossbar.style.strokeDashoffset = '0';
      }, 920));

      // 3. i 위에 점(Dot) 하나 마지막으로 딱! 찍히며 충격파 확산 (1.12s)
      introTimers.push(setTimeout(() => {
        if (dotGroup) dotGroup.classList.add('pop');
        if (dotRipple) dotRipple.classList.add('expand');
        playChimeSound();
      }, 1120));

      // 4. 파란색 화면 전체가 hero 카드 크기로 함께 줄어들면서, 로고도 좌측 상단으로 같이 빨려들어가는 모션 (1.62s)
      introTimers.push(setTimeout(() => {
        const hero = document.querySelector('.bento-hero');
        const display = document.querySelector('.pleos-display');
        const targetBadge = document.querySelector('.dait-brand-badge');

        if (hero && display && targetBadge) {
          const hRect = hero.getBoundingClientRect();
          const dRect = display.getBoundingClientRect();
          const targetTop = hRect.top - dRect.top;
          const targetLeft = hRect.left - dRect.left;
          const targetWidth = hRect.width;
          const targetHeight = hRect.height;

          // (1) 전체 파란색 화면이 hero 카드 위치와 크기로 함께 수축 (빨려들어가기)
          overlay.style.transition = 'top 0.72s cubic-bezier(0.22, 1, 0.36, 1), left 0.72s cubic-bezier(0.22, 1, 0.36, 1), width 0.72s cubic-bezier(0.22, 1, 0.36, 1), height 0.72s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.72s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.72s cubic-bezier(0.22, 1, 0.36, 1)';
          overlay.style.top = `${targetTop}px`;
          overlay.style.left = `${targetLeft}px`;
          overlay.style.width = `${targetWidth}px`;
          overlay.style.height = `${targetHeight}px`;
          overlay.style.borderRadius = '22px';
          overlay.style.boxShadow = '0 14px 34px rgba(7, 23, 44, 0.32)';

          // (2) 로고도 수축하는 파란색 화면 내부에서 좌측 상단으로 정확히 이동
          // 축소된 카드 내부 기준: padding-left 28px, padding-top 24px
          const targetX = 28 + (targetBadge.offsetWidth / 2) - (targetWidth / 2);
          const targetY = 24 + (targetBadge.offsetHeight / 2) - (targetHeight / 2);
          const scale = targetBadge.offsetWidth / brand.offsetWidth;

          brand.style.transition = 'transform 0.72s cubic-bezier(0.22, 1, 0.36, 1)';
          brand.style.transform = `translate(${targetX}px, ${targetY}px) scale(${scale})`;

          // (3) 오버레이 내부 발광 아우라는 수축하면서 은은하게 소멸
          if (aura) {
            aura.style.transition = 'opacity 0.55s ease';
            aura.style.opacity = '0';
          }
        }

        // (4) 우측 메뉴 카드들이 왼쪽 수축 모션에 이끌리듯 오른쪽에서 화면 안으로 부드럽게 당겨져 들어옴 (스태거 캐스케이드)
        rightCards.forEach((card, idx) => {
          const delay = idx * 65; // 상단 2분할(0ms) -> 하교 대화(65ms) 순차 진입
          introTimers.push(setTimeout(() => {
            card.style.transition = 'transform 0.68s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.48s ease-out';
            card.style.transform = 'translateX(0)';
            card.style.opacity = '1';
          }, delay));
        });
      }, 1620));

      // 5. 수축 완료 시점 (2.36s) - 파란색 화면이 hero 카드와 완전히 포개졌으므로 부드럽게 핸드오버
      introTimers.push(setTimeout(() => {
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '0';
      }, 2360));

      // 5.5 우측 메뉴 카드 스타일 정리 (2.46s - 도착 완료 후 기본 CSS 호버 효과 정상화)
      introTimers.push(setTimeout(() => {
        rightCards.forEach((card) => {
          card.style.transition = '';
          card.style.transform = '';
          card.style.opacity = '';
        });
      }, 2460));

      // 6. 스플래시 완전 정리 (2.58s)
      introTimers.push(setTimeout(() => {
        overlay.style.display = 'none';
        finishIntro();
      }, 2580));
    }

    function finishIntro() {
      isIntroPlaying = false;
      if (homeStale && !currentMode) render();
      homeStale = false;
    }

    function skipSplashIntro() {
      clearIntroTimers();
      const overlay = document.getElementById('splashOverlay');
      const rightCards = document.querySelectorAll('.bento-right-col > *');
      rightCards.forEach((card) => {
        card.style.transition = 'opacity 0.2s ease';
        card.style.transform = '';
        card.style.opacity = '1';
        setTimeout(() => {
          card.style.transition = '';
        }, 200);
      });
      if (overlay) {
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
          finishIntro();
        }, 200);
      }
    }

    // Initial render and signature splash intro
    render();
    refreshSchoolDays();
    setTimeout(() => {
      playSplashIntro();
    }, 120);
  </script>
</body>
</html>
