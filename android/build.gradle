plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
// Keep generated class paths ASCII on Windows; sources stay in the user's workspace.
def outputRoot = providers.gradleProperty('daitBuildRoot').orNull
if (outputRoot != null) {
    allprojects { project -> project.layout.buildDirectory.set(file("${outputRoot}/${project.name}")) }
}
