<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소리 모양 시안</title>
<style>
:root { --ink:#352832; --lilac:#884d62; --rose:#c98fa5; --soft:#f1dfe5; --paper:#fcf5f6; --line:#e5cdd6; --muted:#715e69; }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:linear-gradient(135deg,transparent 30%,#d7a9ba59),linear-gradient(120deg,#f8e9eb,#ecd9df); min-height:100vh; font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
.head { max-width:980px; margin:0 auto 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.head p { margin:0; color:var(--muted); font-size:14px; flex:1; }
.head button { border:0; border-radius:999px; padding:10px 18px; background:var(--lilac); color:#fff; font:700 15px inherit; cursor:pointer; }
.grid { max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; }
.card { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:16px; }
.card h2 { margin:0; font-size:18px; color:var(--lilac); }
.card p { margin:4px 0 12px; font-size:13px; color:var(--muted); min-height:34px; }
.stage { height:120px; display:grid; place-items:center; background:#fff8f9; border-radius:14px; }
.paused * { animation-play-state:paused !important; }

/* 지금 모양 (비교용) */
.now { display:flex; align-items:center; gap:4px; }
.now i { width:5px; border-radius:9px; background:linear-gradient(var(--rose),var(--lilac)); height:calc(var(--h)*1px); animation:now 1.4s ease-in-out infinite alternate; animation-delay:var(--d); transform:scaleY(.55); }
@keyframes now { from{transform:scaleY(.4)} to{transform:scaleY(1)} }

/* A 굵은 막대 다섯 개 */
.a { display:flex; align-items:center; gap:9px; height:64px; }
.a i { width:14px; height:64px; border-radius:99px; background:var(--lilac); transform:scaleY(.35); animation:a 1.1s ease-in-out infinite; animation-delay:var(--d); }
.a i:nth-child(odd) { background:var(--rose); }
@keyframes a { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

/* B 물결 선 두 줄 */
.b svg { width:220px; height:80px; overflow:visible; }
.b path { fill:none; stroke-linecap:round; }
.b .w1 { stroke:var(--lilac); stroke-width:5; animation:b 2.2s linear infinite; }
.b .w2 { stroke:var(--rose); stroke-width:4; opacity:.7; animation:b 3.1s linear infinite reverse; }
@keyframes b { to { transform:translateX(-80px); } }
.b .clip { overflow:hidden; width:160px; }

/* C 퍼지는 동그라미 */
.c { position:relative; width:90px; height:90px; display:grid; place-items:center; }
.c b { position:absolute; inset:0; border-radius:50%; border:3px solid var(--rose); opacity:0; animation:c 2.4s ease-out infinite; }
.c b:nth-child(2){animation-delay:.8s} .c b:nth-child(3){animation-delay:1.6s}
.c i { width:30px; height:30px; border-radius:50%; background:var(--lilac); box-shadow:0 0 0 8px #884d6222; }
@keyframes c { from{transform:scale(.35);opacity:.9} to{transform:scale(1.15);opacity:0} }

/* D 통통 뛰는 점 */
.d { display:flex; gap:12px; align-items:center; height:60px; }
.d i { width:16px; height:16px; border-radius:50%; background:var(--lilac); animation:d 1.2s ease-in-out infinite; animation-delay:var(--d); }
.d i:nth-child(even){ background:var(--rose); }
@keyframes d { 0%,100%{transform:translateY(10px)} 50%{transform:translateY(-14px)} }

/* E 숨 쉬는 몽글 원 */
.e { width:86px; height:86px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#f4ccd9,var(--rose) 45%,var(--lilac)); animation:e 3s ease-in-out infinite; box-shadow:0 10px 26px #884d6233; }
@keyframes e { 0%,100%{transform:scale(.88); border-radius:50% 50% 50% 50%} 33%{transform:scale(1); border-radius:56% 44% 52% 48%} 66%{transform:scale(.95); border-radius:46% 54% 44% 56%} }

/* F 반원 무지개 (가운데서 퍼지는 호) */
.f svg { width:150px; height:90px; }
.f path { fill:none; stroke-linecap:round; stroke-width:7; }
.f .r1 { stroke:var(--lilac); } .f .r2 { stroke:var(--rose); } .f .r3 { stroke:#e3b3c4; }
.f path { animation:f 1.6s ease-in-out infinite; transform-origin:75px 85px; }
.f .r2 { animation-delay:.2s } .f .r3 { animation-delay:.4s }
@keyframes f { 0%,100%{opacity:.35; transform:scale(.92)} 50%{opacity:1; transform:scale(1)} }

@media (prefers-reduced-motion:reduce) { .stage * { animation:none !important; } }
</style></head><body>
<div class="head"><p>앱의 '지금' 화면 큰 카드 오른쪽과, 수업 재생 화면에 들어가는 소리 모양이에요. 운전 중에는 움직임을 멈춰요. 아래 버튼으로 멈춘 모양도 볼 수 있어요.</p><button id="toggle">멈춘 모양 보기</button></div>
<div class="grid" id="grid"></div>
<script>
const bars = (n, cls, h) => `<div class="${cls}">${Array.from({length:n},(_,i)=>`<i style="--d:${(-i*.13).toFixed(2)}s${h?`;--h:${h[i]}`:''}"></i>`).join('')}</div>`;
const looks = [
  ['지금 모양', '비교용. 가늘고 촘촘한 막대 12개.', bars(12,'now',[24,38,52,68,78,68,56,76,64,46,32,20])],
  ['A · 굵은 막대 다섯 개', '막대를 적고 굵고 둥글게. 같은 "소리" 느낌이지만 훨씬 순하고 깔끔함.', bars(5,'a')],
  ['B · 물결 선', '두 줄 물결이 천천히 흘러감. 가장 차분하고 부드러움.', `<div class="b"><div class="clip"><svg viewBox="0 0 240 80"><path class="w1" d="M0 40 q20 -26 40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/><path class="w2" d="M0 40 q20 18 40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/></svg></div></div>`],
  ['C · 퍼지는 동그라미', '가운데 점에서 동그라미가 퍼져 나감. "지금 말하고 있어요" 느낌.', '<div class="c"><b></b><b></b><b></b><i></i></div>'],
  ['D · 통통 뛰는 점', '점 네 개가 차례로 통통. 아이들 앱답게 귀엽고 가벼움.', bars(4,'d')],
  ['E · 숨 쉬는 몽글 원', '말랑한 원이 천천히 숨 쉬듯 커졌다 작아짐. 가장 단순함.', '<div class="e"></div>'],
  ['F · 퍼지는 반원', '스피커에서 소리가 나가는 모양. 소리라는 뜻이 가장 잘 보임.', '<div class="f"><svg viewBox="0 0 150 90"><path class="r1" d="M55 85 a20 20 0 0 1 40 0"/><path class="r2" d="M35 85 a40 40 0 0 1 80 0"/><path class="r3" d="M15 85 a60 60 0 0 1 120 0"/></svg></div>'],
];
document.getElementById('grid').innerHTML = looks.map(([t,n,html]) => `<div class="card"><h2>${t}</h2><p>${n}</p><div class="stage">${html}</div></div>`).join('');
const btn = document.getElementById('toggle');
btn.onclick = () => { const p = document.body.classList.toggle('paused'); btn.textContent = p ? '움직이는 모양 보기' : '멈춘 모양 보기'; };
</script>
</body></html>
