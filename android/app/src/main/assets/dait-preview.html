<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAIT</title>
  <style>
    :root {
      --bg-top: #3D3C70;
      --bg-bottom: #171C38;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.14);
      --line: rgba(255, 255, 255, 0.10);
      --ink: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.68);
      --lilac: #B3A6F5;
      --lilac-hover: #C6BCF8;
      --on-lilac: #1B1E3D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #D5DBE3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      word-break: keep-all;
    }
    button { font-family: inherit; }

    /* Pleos Display. 앱 창 665×420을 기준으로 창 크기에 맞춰 함께 커진다 */
    .pleos-display {
      --u: clamp(0.9px, min(100cqw / 665, 100cqh / 420), 1.7px);
      container-type: size;
      width: 100%;
      max-width: 1060px;
      height: 600px;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      border-radius: 28px;
      box-shadow: 0 24px 50px rgba(11, 26, 44, 0.16);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* In-App Fullscreen Integration for Hyundai Pleos */
    body.in-app {
      background: var(--bg-bottom);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    body.in-app .pleos-display {
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }

    /* Driving Simple Screen: 문장 하나와 큰 버튼 둘 */
    .drive-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(20 * var(--u));
      padding: calc(24 * var(--u)) calc(32 * var(--u)) calc(36 * var(--u));
      text-align: center;
    }
    body.driving .drive-screen { display: flex; }
    .drive-sentence {
      font-size: calc(30 * var(--u));
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.6px;
      max-width: 90%;
    }
    .drive-sub {
      font-size: calc(16 * var(--u));
      font-weight: 600;
      color: var(--muted);
    }
    .drive-actions {
      display: flex;
      gap: calc(16 * var(--u));
    }
    .drive-btn {
      min-width: calc(180 * var(--u));
      height: calc(64 * var(--u));
      padding: 0 calc(24 * var(--u));
      border-radius: calc(18 * var(--u));
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      font-size: calc(22 * var(--u));
      font-weight: 800;
      cursor: pointer;
    }
    .drive-btn.primary {
      background: var(--lilac);
      border-color: var(--lilac);
      color: var(--on-lilac);
    }
    .drive-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Demo Panel (시연용) */
    .demo-panel {
      position: absolute;
      right: calc(20 * var(--u));
      bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 500;
    }
    body.driving .demo-panel { z-index: 10000; }
    body.real-driving .demo-panel { display: none; } /* 실제 주행 중에는 문장 하나와 큰 버튼 둘만 */
    body.release .demo-panel { display: none; } /* 제출용 앱에는 시연 조작을 두지 않는다 */
    .demo-panel button {
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-panel button:hover { background: var(--glass-hover); }
    .demo-panel button.on {
      background: var(--lilac);
      border-color: var(--lilac);
      color: var(--on-lilac);
    }
    .demo-panel button:disabled { cursor: default; opacity: 0.9; }

    /* Main Stage */
    .stage-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: calc(14 * var(--u)) calc(20 * var(--u)) calc(30 * var(--u));
      position: relative;
    }

    /* ========================================================
       첫 화면: 인사 두 줄, 그 아래 작은 카드 여섯 장
       카드 한 장에는 이름 한 줄, 내용 한두 줄, 버튼 하나까지만 넣는다
       ======================================================== */
    .home-top {
      display: flex;
      align-items: center;
      gap: calc(12 * var(--u));
      margin-bottom: calc(10 * var(--u));
    }
    .dait-brand-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .dait-brand-badge svg {
      width: calc(62 * var(--u));
      height: calc(19 * var(--u));
    }
    .dait-brand-badge .brand-dot { transform-origin: 62px 7.5px; }
    .dait-brand-badge.waiting .brand-dot { animation: brandBreath 2.4s ease-in-out infinite; }
    @keyframes brandBreath {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dait-brand-badge.waiting .brand-dot { animation: none; }
    }
    .home-greeting {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: calc(10 * var(--u));
    }
    .home-title {
      font-size: calc(19 * var(--u));
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.4px;
    }
    .home-desc {
      font-size: calc(14 * var(--u));
      font-weight: 500;
      line-height: 1.3;
      color: var(--muted);
    }
    .home-tools { display: flex; gap: calc(8 * var(--u)); flex-shrink: 0; }
    .icon-btn {
      width: calc(44 * var(--u));
      height: calc(44 * var(--u));
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--glass-hover); }
    .icon-btn svg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }

    .home-card {
      min-width: 0;
      min-height: 0;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(16 * var(--u));
      padding: calc(12 * var(--u)) calc(14 * var(--u));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-label {
      font-size: calc(13 * var(--u));
      font-weight: 700;
      line-height: 1.3;
      color: var(--muted);
    }
    .card-focus {
      margin-top: calc(6 * var(--u));
      font-size: calc(18 * var(--u));
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
    }
    .card-text {
      margin-top: calc(6 * var(--u));
      font-size: calc(14 * var(--u));
      font-weight: 700;
      line-height: 1.3;
    }
    /* 카드의 핵심 단어. 글자 수가 많으면 작아진다 */
    .card-big {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }
    .card-big.size-1 { font-size: calc(34 * var(--u)); }
    .card-big.size-2 { font-size: calc(26 * var(--u)); }
    .card-big.size-3 { font-size: calc(20 * var(--u)); }
    .card-big.size-4 { font-size: calc(17 * var(--u)); }
    .card-big .card-sub { letter-spacing: 0; }
    .card-sub {
      margin-top: calc(2 * var(--u));
      font-size: calc(13 * var(--u));
      font-weight: 500;
      line-height: 1.3;
      color: var(--muted);
    }
    .card-btn {
      margin-top: auto;
      width: 100%;
      min-height: calc(44 * var(--u));
      padding: 0 calc(8 * var(--u));
      border: none;
      border-radius: calc(12 * var(--u));
      background: var(--lilac);
      color: var(--on-lilac);
      font-size: calc(14 * var(--u));
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .card-btn:hover { background: var(--lilac-hover); }
    .card-btn.quiet { background: var(--glass-hover); color: var(--ink); }
    .card-btn.quiet:hover { background: rgba(255, 255, 255, 0.2); }

    /* 수업 카드의 바탕. 학교 등록 전후 첫 화면이 함께 쓴다 */
    .home-card.start {
      background: linear-gradient(150deg, #4B6BE8 0%, #7D59D8 58%, #B85BB4 100%);
      border-color: rgba(255, 255, 255, 0.18);
      cursor: pointer;
    }

    /* 학교 등록 전 첫 화면: 빈 칸 없이 수업의 질문 하나를 크게 보여 준다 */
    .question-home {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
      gap: calc(10 * var(--u));
    }
    .home-card.question-card { cursor: default; padding: calc(16 * var(--u)) calc(18 * var(--u)); }
    .question-title {
      margin-top: calc(8 * var(--u));
      font-size: calc(27 * var(--u));
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.6px;
      overflow-wrap: anywhere;
    }
    .question-promise { margin-top: calc(8 * var(--u)); font-size: calc(15 * var(--u)); font-weight: 600; }
    .question-actions { margin-top: auto; display: flex; gap: calc(8 * var(--u)); }
    .question-actions .card-btn { margin-top: 0; flex: 1; }
    .question-side { min-height: 0; display: flex; flex-direction: column; gap: calc(10 * var(--u)); }
    .question-side .home-card { flex: 1; }
    /* 등하교 대화 카드: 누르면 대화를 시작하고, 아래 버튼으로 출발할 때 들려주기를 고른다 */
    .home-card.talk-card { cursor: pointer; }
    .home-card.talk-card .card-focus { font-size: calc(19 * var(--u)); }
    .talk-actions { margin-top: auto; display: flex; gap: calc(6 * var(--u)); }
    .talk-actions .card-btn { margin-top: 0; flex: 1; font-size: calc(13 * var(--u)); }
    .question-times { margin-top: auto; display: flex; gap: calc(6 * var(--u)); }
    .question-times .choice-chip { min-width: 0; font-size: calc(14 * var(--u)); }
    .register-line {
      flex-shrink: 0;
      margin-top: calc(10 * var(--u));
      min-height: calc(44 * var(--u));
      padding: 0 calc(14 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(10 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(12 * var(--u));
      color: var(--ink);
      font-size: calc(14 * var(--u));
      font-weight: 600;
      cursor: pointer;
    }
    .register-line b { color: var(--lilac); font-weight: 800; }
    .home-card.start .card-label { color: rgba(255, 255, 255, 0.85); }

    /* 좁고 긴 창에서는 두 줄로 놓고 내려서 본다 */
    @container (max-width: 520px) {
      .settings-grid { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
      .place-list { grid-template-columns: minmax(0, 1fr); }
    }

    /* Dialogue Screen */
    .dialogue-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .dialogue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: calc(8 * var(--u));
      margin-bottom: calc(10 * var(--u));
    }
    .top-label {
      font-size: calc(14 * var(--u));
      font-weight: 700;
      color: var(--muted);
    }
    .back-btn {
      min-height: calc(44 * var(--u));
      padding: 0 calc(16 * var(--u));
      border-radius: calc(14 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: calc(14 * var(--u));
      font-weight: 700;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--glass-hover); }

    .lesson-progress { flex-shrink: 0; min-width: 0; }
    .lesson-progress-times { display: flex; justify-content: space-between; gap: calc(8 * var(--u)); font-size: calc(13 * var(--u)); color: var(--muted); }
    .lesson-progress-track { position: relative; height: calc(44 * var(--u)); display: flex; align-items: center; }
    .lesson-progress-segments { display: flex; gap: calc(2 * var(--u)); width: 100%; height: calc(6 * var(--u)); }
    .lesson-progress-segments span { min-width: 0; border-radius: calc(2 * var(--u)); background: linear-gradient(to right, #B8A9F5 var(--heard, 0%), rgba(255,255,255,.18) var(--heard, 0%)); }
    .lesson-progress-track input { position: absolute; inset: 0; margin: 0; width: 100%; height: 100%; appearance: none; background: transparent; cursor: pointer; accent-color: #D4C7FF; }
    .lesson-progress-track input::-webkit-slider-runnable-track { height: calc(6 * var(--u)); background: transparent; }
    .lesson-progress-track input::-webkit-slider-thumb { appearance: none; width: calc(16 * var(--u)); height: calc(16 * var(--u)); border-radius: 50%; background: #E3D9FF; margin-top: calc(-5 * var(--u)); }
    .lesson-progress-track input:focus-visible { outline: 2px solid #D4C7FF; border-radius: calc(6 * var(--u)); }
    .lesson-sections { display: flex; gap: calc(6 * var(--u)); overflow-x: auto; padding-bottom: calc(3 * var(--u)); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }
    .lesson-sections button { flex-shrink: 0; min-height: calc(44 * var(--u)); max-width: calc(210 * var(--u)); padding: 0 calc(10 * var(--u)); border: 1px solid var(--line); border-radius: calc(10 * var(--u)); background: var(--glass); color: var(--ink); font-size: calc(14 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .lesson-sections button[aria-current="step"] { border-color: #C4B5FD; background: rgba(167,139,250,.25); }

    .dialogue-card {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(18 * var(--u));
      padding: calc(14 * var(--u)) calc(20 * var(--u));
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }
    .card-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Dialogue Ambient Orb */
    .dialogue-orb {
      width: calc(44 * var(--u));
      height: calc(44 * var(--u));
      flex-shrink: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #B3A6F5 0%, #7D59D8 55%, #3A2F80 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: calc(10 * var(--u));
    }

    /* Voice Visualizer Wave */
    .voice-visualizer {
      display: flex;
      gap: calc(3 * var(--u));
      align-items: center;
    }
    .v-bar {
      width: calc(2.5 * var(--u));
      height: calc(7 * var(--u));
      background: #FFFFFF;
      border-radius: calc(2 * var(--u));
    }
    .v-bar:nth-child(2) { height: calc(13 * var(--u)); }
    .v-bar:nth-child(3) { height: calc(17 * var(--u)); }
    .v-bar:nth-child(4) { height: calc(11 * var(--u)); }

    .main-question {
      font-size: calc(22 * var(--u));
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.4px;
      max-width: 90%;
    }
    .heard-bubble {
      margin-top: calc(8 * var(--u));
      background: var(--glass-hover);
      font-size: calc(14 * var(--u));
      font-weight: 700;
      padding: calc(4 * var(--u)) calc(14 * var(--u));
      border-radius: calc(12 * var(--u));
      display: inline-block;
    }
    .heard-bubble[hidden] { display: none; }

    /* Choice Chips */
    .options-row {
      display: flex;
      gap: calc(10 * var(--u));
      width: 100%;
      margin-top: calc(10 * var(--u));
      justify-content: center;
    }
    .choice-chip {
      flex: 1;
      max-width: calc(180 * var(--u));
      min-height: calc(44 * var(--u));
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: calc(12 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .choice-chip:hover,
    .choice-chip[aria-pressed="true"] {
      background: var(--lilac);
      color: var(--on-lilac);
      border-color: var(--lilac);
    }

    /* Primary Bottom Action */
    .bottom-bar {
      margin-top: calc(10 * var(--u));
      display: flex;
      justify-content: center;
      gap: calc(10 * var(--u));
    }
    .primary-btn {
      width: calc(190 * var(--u));
      height: calc(44 * var(--u));
      background: var(--lilac);
      color: var(--on-lilac);
      border: none;
      border-radius: calc(12 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 800;
      cursor: pointer;
    }
    .primary-btn:hover { background: var(--lilac-hover); }
    .primary-btn.secondary {
      width: calc(130 * var(--u));
      background: var(--glass-hover);
      color: var(--ink);
    }

    /* ========================================================
       시그니처 인트로 스플래시 애니메이션 (Signature Splash Intro)
       ======================================================== */
    .splash-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      cursor: pointer;
    }

    /* Ambient Pulsing Aura behind the logo */
    .splash-aura {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(179, 166, 245, 0.28) 0%, rgba(125, 89, 216, 0.14) 42%, transparent 70%);
      filter: blur(36px);
      transform: scale(0.9);
      pointer-events: none;
    }

    /* Brand Container that glides to the logo in the header */
    .splash-brand-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transform-origin: center center;
    }

    .splash-logo-svg {
      width: calc(240 * var(--u));
      height: calc(82 * var(--u));
      overflow: visible;
    }

    .splash-ribbon-path {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Dot Pop Animation & Shockwave Ripple */
    .splash-dot-group {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-group.pop {
      animation: dotPopIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dotPopIn {
      0% { transform: scale(0); opacity: 0; }
      55% { transform: scale(1.65); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-dot-ripple {
      transform-origin: 62px 7.5px;
      opacity: 0;
    }
    .splash-dot-ripple.expand {
      animation: rippleExpand 0.75s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { r: 3px; stroke-width: 3.5px; opacity: 1; }
      100% { r: 24px; stroke-width: 0.4px; opacity: 0; }
    }

    /* 수업 끝 화면의 잇찌: 로고 획이 이어져 잇찌가 되고, 깃털을 내려놓은 뒤 다시 로고로 돌아간다.
       움직임은 itchiPlay가 그린다. 잇찌는 말하지 않는다(말풍선·입 모양 없음). */
    .itchi { width: calc(200 * var(--u)); height: auto; margin-bottom: calc(6 * var(--u)); overflow: visible; }

    /* School Settings: 왼쪽 학교 찾기, 오른쪽 설정 목록 */
    .settings-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: calc(10 * var(--u));
    }

  <script>
    // State
    const voice = 'nika';
    let currentMode = null; // 'morning' | 'afternoon' | 'tour' | null
    let stage = '';
    let heard = '';
    let isDrivingMode = false;
    let currentChoices = [];
    let demoMinutes = null; // 시연 조작으로 고른 남은 분
    let speechPhase = 'idle'; // 'idle' | 'speaking' | 'listening'
    let unclearCount = 0;
    let listenSince = 0; // 이번 질문을 듣기 시작한 때
    let speechSeq = 0; // 지난 말에 대한 늦은 알림을 가려내는 순번
    let previewQueue = []; // 브라우저 미리보기에서 이어 틀 음원
    let speechPaused = false; // 길 안내나 통화가 소리를 가져간 동안
    let tripMuted = false; // 이번 대화는 소리를 내지 않음
    let pendingIntro = []; // 첫 질문 앞에 붙일 말(남은 시간, 오늘 시간표)
    let micBroken = false; // 이번 대화에서 마이크를 열지 못함
    let noMicTimer = null;
    let doorTimer = null;
    let closeTimer = null;
    let routeStartedAt = 0;
    let lastRefreshDay = '';
    let tripForDoor = null; // 내릴 때 한마디: 대화를 시작한 여정. 달렸는지와 주차 시각을 기억한다.
    let currentRule = null; // 이번 대화에 쓰는 교사 규칙
    let ruleMissing = false; // 규칙 대화에서 준비물을 못 챙겼다고 답함
    let armed = null; // 출발하면 들려주기: { mode, timer }. 수업이면 mode는 'lesson'이고 lesson과 minutes를 함께 둔다
    let pendingStart = null; // 마이크 허락을 기다리는 동작
    let micAsked = false;
    let hasArrived = false;
    let journeyActive = false;
    const MEMORY_KEY = 'dait.morningMemory';
    const VOICE_KEY = 'dait.voiceAnswers';
    const QUESTIONS_KEY = 'dait.questions';
    const ROUTE_KEY = 'dait.routePlaces';
    const HOME_CLEARED_KEY = 'dait.homeCleared'; // 보호자가 지운 집을 내비 즐겨찾기로 되살리지 않는다
    const ARM_MS = 30 * 60 * 1000;
    const ARRIVAL_CLOSE_MS = 4000;
    const NO_MIC_WAIT_MS = 8000;
    const LISTEN_PATIENCE_MS = 12000;
    const DOOR_WINDOW_MS = 5 * 60 * 1000;
    const TRIP_CAP_MS = 2 * 60 * 60 * 1000;
    const ROUTE_SWAP_MS = 3000;

    // DAIT 공식 확정 캘리그래피 로고 (시안 2 커넥티드 리본 + i Dot)
    const DAIT_LOGO_PATH = 'M10 26 C12 10, 16 6, 22 6 C28 6, 32 12, 30 20 C28 28, 20 28, 16 28 C26 28, 38 28, 42 20 C44 14, 48 14, 50 18 C52 24, 48 28, 54 28 C60 28, 62 18, 62 14 C62 26, 68 28, 72 28 C76 28, 80 18, 80 10 M74 16 h12';

    // 첫 화면 로고: 「출발하면 듣기」를 예약해 두면 i 점이 숨 쉬듯 깜빡인다.
    function getDaitLogoHtml() {
      return `
        <div class="dait-brand-badge${armed ? ' waiting' : ''}" onclick="event.stopPropagation(); playSplashIntro();">
          <svg width="94" height="28" viewBox="0 0 100 32" fill="none">
            <path d="${DAIT_LOGO_PATH}"
                  stroke="url(#flowGradBadge)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle class="brand-dot" cx="62" cy="7.5" r="2.8" fill="#38BDF8"/>
            <defs>
              <linearGradient id="flowGradBadge" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/>
                <stop offset="0.6" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#38BDF8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      `;
    }

    function render() {
      renderStage();
      syncJourney();
    }

    function renderStage() {
      const stageArea = document.getElementById('stageArea');
      document.body.classList.toggle('lesson-playing', !!(currentMode === 'lesson' && lessonRun && !lessonRun.done && !isLessonResting()));
      renderPearlNav();
      if (currentMode === 'records') { renderRecords(stageArea); return; }

      // 1. Home Screen (단일 완성형 스마트 벤토)
      if (!currentMode) {
        renderHome(stageArea);
        return;
      }

      // 2. School Settings
      if (currentMode === 'settings') {
        renderSettings(stageArea);
        return;
      }

      // 3. Places to visit
      if (currentMode === 'places') {
        renderPlaces(stageArea);
        return;
      }

      // 4. Lessons
      if (currentMode === 'lessonPick') {
        renderLessonPick(stageArea);
        return;
      }
      if (currentMode === 'lesson') {
        renderLesson(stageArea);
        return;
      }

      // 5. Dialogue Flow
      renderDialogueFlow(stageArea);
    }

    // Pearl: 수업이 중심인 지금 화면. 학교 등록 여부와 관계없이 같은 구성을 쓴다.
    function renderHome(container) {
      const { lesson, reserved } = homeLesson();
      const progress = lessonProgress();
      const trip = currentTrip();
      const afterSchool = school && trip.mode === 'afternoon' && trip.kind !== 'weekend';
      container.innerHTML = `<div class="pearl-home">
        ${lessonCardHtml(lesson, reserved)}
        <div class="pearl-home-footer">
          <button class="pearl-feathers" onclick="openPearlTab('records')">모은 깃털 <strong>${progress.ieum}개</strong></button>
          <div class="pearl-home-links">
            ${afterSchool ? `<button class="card-btn quiet" onclick="startFlow('afternoon')">하교 대화</button>` : ''}
          </div>
        </div>
      </div>`;
    }

    // 남은 시간을 알면 그 시간에, 모르면 고른 시간(처음에는 15분)에 맞춘 수업 하나를 고른다. 예약한 수업이 있으면 그 수업이다.
    function homeLesson() {
      const eta = remainMinutes();
      if (eta !== null) lessonMinutes = Lesson.minutesFor(eta);
      else if (!Lesson.TIME_CHOICES.includes(lessonMinutes)) lessonMinutes = Lesson.DEFAULT_MINUTES;
      const reserved = armed && armed.lesson ? DAIT_LESSONS.find(item => item.id === armed.lesson) : null;
      return { reserved, lesson: reserved || Lesson.recommend(DAIT_LESSONS, lessonMinutes, lessonProgress().records)[0] };
    }

    // 수업 카드: 두 첫 화면이 함께 쓴다. 수업의 질문으로 바로 시작한다.
    function lessonCardHtml(lesson, reserved) {
      return `<div class="home-card start question-card pearl-hero">
        ${lesson ? `<div class="pearl-hero-copy">
          <div class="question-title">${escapeHtml(lesson.question)}</div>
          <div class="card-label">${escapeHtml(lesson.subject)} · ${escapeHtml(lesson.title)}</div>
          <div class="question-promise">${escapeHtml(lessonPromise(lesson, lessonMinutes))}</div>
          <div class="question-actions">
            <button class="card-btn" onclick="startLesson('${lesson.id}')">듣기</button>
            <button class="card-btn quiet" aria-pressed="${!!reserved}" onclick="toggleLessonArm('${lesson.id}')">${reserved ? '수업 예약 취소' : '출발하면 듣기'}</button>
          </div>
        </div><div class="pearl-wave" aria-hidden="true">${[12,24,36,48,58,64,58,48,36,24,12].map(n => `<i style="--bar:${n}"></i>`).join('')}</div>`
        : '<div class="question-title">이번 길은 짧아서 다음에 들려 드릴게요</div>'}
      </div>`;
    }

    let recordTab = 'lessons';
    function renderPearlNav() {
      const lessonTab = currentMode === 'lessonPick' || currentMode === 'lesson';
      const active = currentMode === 'records' ? 'records' : lessonTab ? 'lessons' : 'now';
      const minutes = remainMinutes();
      const eta = minutes === null ? `${lessonMinutes}분 수업` : `도착까지 ${Math.max(0, Math.ceil(minutes))}분`;
      document.getElementById('pearlNav').innerHTML = `
        <button class="pearl-brand" aria-label="다잇 첫 화면" onclick="if (!isDrivingMode) goHome()">${getDaitLogoHtml()}</button>
        <nav>${[['now','지금'],['lessons','수업'],['records','기록']].map(([id,label]) => `<button aria-current="${active === id ? 'page' : 'false'}" onclick="openPearlTab('${id}')">${label}</button>`).join('')}</nav>
        <button class="pearl-eta" aria-label="듣는 시간" onclick="openPearlTab('lessons')"${minutes !== null || currentMode === 'lesson' ? ' disabled' : ''}>${eta}</button>
        <button class="icon-btn" aria-label="설정" onclick="openPearlSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="17" r="2" fill="currentColor"/></svg></button>`;
    }

    function openPearlTab(tab) {
      if (isDrivingMode) return;
      if (tab === 'lessons' && currentMode === 'lesson' && lessonRun && !lessonRun.done) return; // 듣던 수업을 계속 보여 준다.
      if (currentMode === 'lesson') closeLesson();
      stopSpeech();
      if (tab === 'lessons') { openLessons(); return; }
      if (tab === 'records') { currentMode = 'records'; render(); return; }
      goHome();
    }

    function selectRecordTab(tab) {
      if (isDrivingMode) return;
      recordTab = tab;
      render();
    }

    const PEARL_BADGES = [
      ['first-discovery','첫 발견'], ['korean','국어'], ['math','수학'],
      ['exploration','탐험'], ['well-rounded-explorer','골고루 탐험가'], ['everyday-discoverer','생활 속 발견가']
    ];
    function renderRecords(container) {
      const progress = lessonProgress();
      const records = [...progress.records].reverse();
      container.innerHTML = `<section class="pearl-records">
        <div class="pearl-page-title"><h1>내 배움 보관함</h1><span>모은 깃털 ${progress.ieum}개</span></div>
        <div class="pearl-record-tabs" role="tablist" aria-label="배움 기록 종류">
          <button role="tab" aria-selected="${recordTab === 'lessons'}" onclick="selectRecordTab('lessons')">수업 기록</button>
          <button role="tab" aria-selected="${recordTab === 'badges'}" onclick="selectRecordTab('badges')">배지</button>
        </div>
        <div class="pearl-record-body">${recordTab === 'badges'
          ? `<p class="pearl-hint">배지 둘러보기 · 받는 방법은 준비 중이에요</p><div class="pearl-badges">${PEARL_BADGES.map(([id,name]) => `<div class="pearl-badge"><img src="badges/${id}.png" alt="${name} 배지"><span>${name}</span></div>`).join('')}</div>`
          : `${progress.homework ? `<div class="pearl-homework"><span>숙제 · ${escapeHtml(progress.homework.title)}</span><button class="card-btn quiet" onclick="doneHomework()">했어요</button></div>` : ''}
            ${records.length ? records.map(record => `<div class="pearl-record-row"><strong>${escapeHtml(record.title)}</strong><span>${escapeHtml(record.ymd)} · ${record.finished ? '마친 수업' : '듣던 수업'}</span></div>`).join('') : '<div class="pearl-empty">수업을 들으면 여기에 쌓여요</div>'}`}
        </div>
      </section>`;
    }

    // 도착 시간을 알 때만 도착을 약속한다. 모르면 수업 길이만 말한다.
    function lessonPromise(lesson, minutes) {
      if (remainMinutes() !== null) return '도착할 때쯤 답을 알게 돼요';
      return `약 ${Math.round(Lesson.totalSeconds(Lesson.assemble(lesson, minutes)) / 60)}분이면 답을 알게 돼요`;
    }

    function bigWordHtml(word, sub) {
      const size = word.length <= 4 ? 1 : word.length <= 6 ? 2 : word.length <= 10 ? 3 : 4;
      return `<div class="card-big size-${size}"><span>${escapeHtml(word)}</span>${sub ? `<div class="card-sub">${escapeHtml(sub)}</div>` : ''}</div>`;
    }

    // 대화 카드의 예약 버튼. 수업 카드의 「출발하면 듣기」와 헷갈리지 않게 「대화」라고 쓴다. 수업을 예약하면 이 버튼은 숨긴다.
    function armLabel(trip) {
      if (armed) return '출발하면 대화할게요';
      if (routePlaceFor(trip.mode) && !naviInfo) return trip.mode === 'morning' ? '학교로 안내' : '집으로 안내';
      return '출발하면 대화';
    }

    function renderDialogueFlow(container) {
      const flow = Journey.flows[currentMode];
      const modeName = currentMode === 'morning' ? '등교' : '하교';
      const data = stage === 'NEXT_DAY' ? Journey.nextDayStep(schoolPlan(), currentRule, DAIT_RULES)
        : stage.startsWith('RULE') ? Journey.ruleStep(stage, currentRule, ruleMissing, DAIT_RULES.extras.rule_missing)
        : stage === 'AFTER_SUBJECT' ? Journey.subjectStep((readStored(MEMORY_KEY) || {}).subject || '', DAIT_RULES)
        : (flow[stage] || flow.DONE);

      const subjectStages = ['SUBJECT', 'SUBJECT_MISSING', 'SUBJECT_TODAY'];
      const todayChoices = currentMode === 'morning' && subjectStages.includes(stage) ? subjectChoices() : null;
      currentChoices = todayChoices || data.choices || [];

      speakStage(data.clips || [data.clip]);
      updateDriveScreen(data.title);

      let optionsHtml = '';
      if (currentChoices.length > 0) {
        optionsHtml = `
          <div class="options-row">
            ${currentChoices.map((c, i) => `<button class="choice-chip" onclick="handleAnswer(currentChoices[${i}])">${escapeHtml(c)}</button>`).join('')}
          </div>
        `;
      }

      const buttonLabel = isDialogueDone() ? '마치기' : '다시 듣기';
      const skipHtml = isDialogueDone() ? '' : '<button class="primary-btn secondary" onclick="skipQuestion()">넘기기</button>';

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span class="top-label">${modeName}</span>
          </div>

          <div class="dialogue-card">
            <div class="card-center">
              <div class="dialogue-orb">
                <div class="voice-visualizer">
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                  <div class="v-bar"></div>
                </div>
              </div>
              <div class="main-question">${escapeHtml(data.title)}</div>
              <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
            </div>

            ${optionsHtml}
          </div>

          <div class="bottom-bar">
            <button class="primary-btn" onclick="handlePrimaryAction()">
              ${buttonLabel}
            </button>
            ${skipHtml}
          </div>
        </div>
      `;
    }

    function journeyContext() {
      const plan = schoolPlan();
      const memory = readStored(MEMORY_KEY);
      return {
        tier: Journey.tierFor(remainMinutes()),
        driving: isDrivingMode,
        school: !!school,
        hasPe: !!(plan && plan.hasPe),
        rule: currentRule,
        noQuestions: readStored(QUESTIONS_KEY) === false,
        nextDay: !!school && !!schoolDays[toYmd(new Date())] && !isClassDay(toYmd(new Date())),
        etaMinutes: currentTrip().known ? naviRemainMinutes() : demoMinutes,
        subjects: plan && plan.ymd === toYmd(new Date()) ? plan.subjects : [],
        memory: memory && memory.date === toYmd(new Date()) ? memory : {}
      };
    }

    function remainMinutes() {
      const live = naviRemainMinutes();
      return live === null ? demoMinutes : live;
    }

    function startFlow(mode) {
      if (mode !== 'afternoon') return; // 등교 대화·준비물 안내는 제거했다.
      if (askMicFirst(() => startFlow(mode))) return;
      disarm();
      currentMode = mode;
      heard = '';
      unclearCount = 0;
      listenSince = 0;
      hasArrived = false;
      micBroken = false;
      tripMuted = false;
      currentRule = ruleFor(mode);
      ruleMissing = false;
      const context = journeyContext();
      stage = Journey.start(mode, context);
      pendingIntro = stage === 'NEXT_DAY' ? [] : Journey.intro(mode, context, DAIT_RULES);
      const trip = { drove: isDrivingMode, parkedAt: 0 };
      tripForDoor = trip;
      setTimeout(() => endDoorTrip(trip), TRIP_CAP_MS); // 차 상태가 멈춰도 앞쪽 작업이 끝없이 남지 않게 한다
      noteTripChoice(mode);
      render();
    }

    function goHome() {
      if (currentMode === 'lesson') closeLesson();
      stopSpeech();
      if (tripForDoor && !tripForDoor.drove) tripForDoor = null; // 주차 중에 들어 본 대화는 여정이 아니다
      currentMode = null;
      stage = '';
      heard = '';
      hasArrived = false;
      render();
      updateDriveScreen();
    }

    function setStage(nextStage) {
      stage = nextStage;
      unclearCount = 0;
      listenSince = 0;
      render();
    }

    function handleAnswer(ans, shown = ans) {
      if (isDialogueDone()) return;
      heard = shown;
      const result = Journey.next(currentMode, stage, ans, journeyContext());
      if (result.remember) rememberMorning(result.remember);
      ruleMissing = !!result.missing;
      setStage(result.stage);
    }

    function isDialogueDone() {
      if (currentMode === 'lesson') return !!lessonRun && lessonRun.done;
      return Journey.isDone(stage);
    }

    // 질문을 건너뛴다. 답을 지어내지 않고 다음 단계로만 넘어간다.
    function skipQuestion() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      if (currentMode === 'lesson') { nextLessonPiece(); return; }
      heard = '';
      setStage(Journey.skip(currentMode, stage, journeyContext()));
    }

    // 아침에 고른 과목과 쉬기 여부를 기기에 남겨 하교 때 다시 꺼낸다 (기획안 ③⑤)
    function rememberMorning(patch) {
      const today = toYmd(new Date());
      const memory = readStored(MEMORY_KEY);
      const base = memory && memory.date === today ? memory : { date: today };
      writeStored(MEMORY_KEY, { ...base, ...patch });
    }

    function handlePrimaryAction() {
      if (isDialogueDone()) {
        goHome();
      } else if (currentMode === 'lesson') {
        if (!isLessonResting()) playLessonPiece();
      } else {
        render();
      }
    }

    // ========================================================
    // 출발하면 들려주기
    // 시동만으로 말을 시작하지 않는다. 주차 중에 보호자가 고른 여정만 출발할 때 시작한다.
    // ========================================================
    function toggleArm(mode) {
      if (mode !== 'afternoon') return;
      if (armed) { disarm(); render(); return; }
      if (askMicFirst(() => toggleArm(mode))) return;
      arm({ mode });
      render();
      const place = routePlaceFor(mode);
      if (place && !naviInfo && window.AndroidBridge) window.AndroidBridge.startRoute(JSON.stringify(place));
    }

    function arm(choice) {
      if (choice.mode !== 'lesson' && choice.mode !== 'afternoon') return;
      armed = { ...choice, timer: setTimeout(() => {
        disarm();
        refreshHomeIfIdle();
        if (currentMode === 'lessonPick') render();
      }, ARM_MS) };
    }

    // 고른 대로 출발할 때 시작한다. 수업은 출발할 때 아는 남은 시간을 먼저 쓴다.
    // 그 시간에 들어가지 않는 수업이면 말을 시작하지 않고 예약만 지운다.
    function startArmed() {
      const { mode, lesson, minutes, fromStop } = armed;
      disarm();
      if (mode !== 'lesson') { startFlow(mode); return; }
      const eta = remainMinutes();
      lessonMinutes = eta !== null ? Lesson.minutesFor(eta) : minutes;
      startLesson(lesson, fromStop);
      refreshHomeIfIdle(); // 시간이 모자라 시작하지 못했으면 예약이 사라진 것을 보여 준다
    }

    // 내비에서 알아 둔 학교와 집의 좌표. 있으면 첫 화면에서 바로 길 안내를 시작할 수 있다.
    function routePlaceFor(mode) {
      return routePlaces[mode === 'morning' ? 'school' : 'home'] || null;
    }

    function learnRoutePlace(kind, place) {
      if (!Number.isFinite(place.lat) || !place.lat) return;
      const known = routePlaces[kind];
      if (known && known.lat === place.lat && known.lng === place.lng) return;
      routePlaces[kind] = { name: place.name || '', address: place.address || '', lat: place.lat, lng: place.lng, poiId: place.poiId || '', poiSubId: place.poiSubId || '', poiProvider: place.poiProvider || '' };
      writeStored(ROUTE_KEY, routePlaces);
      updateCarPlace();
      refreshHomeIfIdle();
    }

    // 내비 즐겨찾기와 최근 목적지에서 학교를 찾고, '집' 즐겨찾기는 집으로 등록한다.
    function learnFromNavi(places) {
      places.filter(place => place.name && place.lat).forEach(place => {
        if (school && isSamePlace(place, school)) learnRoutePlace('school', place);
        if (place.category === 'HOME' && !homePlace && readStored(HOME_CLEARED_KEY) !== true) {
          homePlace = { name: place.name, address: place.address || '' };
          writeStored(HOME_KEY, homePlace);
        }
        if (homePlace && isSamePlace(place, homePlace)) learnRoutePlace('home', place);
      });
    }

    function disarm() {
      if (armed) clearTimeout(armed.timer);
      armed = null;
    }

    // 여정 동안에는 내비가 앱을 덮어도 말하고 들을 수 있게 앱을 유지한다.
    // 달리는 중에 내려놓으면 내비 뒤에서 다시 올릴 수 없으므로 주차하거나 대화를 닫을 때까지 둔다.
    function syncJourney() {
      const inDialogue = !!currentMode && !isParkedScreen();
      const finishedParked = isDialogueDone() && speechPhase === 'idle' && !isDrivingMode;
      const active = !!armed || (inDialogue && !finishedParked);
      if (active === journeyActive) return;
      journeyActive = active;
      if (window.AndroidBridge) window.AndroidBridge.setJourneyActive(active);
    }

    // 실제로 달린 여정 뒤 주차한 상태에서 아이 쪽 문이 처음 열릴 때 한 번만 말한다 (기획안 ④)
    function trackDoorTrip(isDriving) {
      if (!tripForDoor) return;
      if (isDriving) {
        tripForDoor.drove = true;
        tripForDoor.parkedAt = 0;
        clearTimeout(doorTimer);
      } else if (tripForDoor.drove && !tripForDoor.parkedAt) {
        const parked = tripForDoor;
        parked.parkedAt = Date.now();
        doorTimer = setTimeout(() => endDoorTrip(parked), DOOR_WINDOW_MS);
      }
    }

    function endDoorTrip(trip) {
      if (tripForDoor !== trip) return;
      tripForDoor = null;
      syncJourney();
    }

    window.onDoorOpened = function() {
      noteTripDoor();
      if (!tripForDoor || !tripForDoor.drove || currentMode === 'lesson') return;
      const stoppedAtEnd = isDrivingMode && Journey.tierFor(remainMinutes()) === 'arrive';
      if (!stoppedAtEnd && (isDrivingMode || !tripForDoor.parkedAt)) return;
      clearTimeout(closeTimer);
      tripForDoor = null;
      if (currentMode === 'afternoon') finishOnArrival();
      syncJourney();
    };

    // ========================================================
    // 말하기와 듣기
    // 앱에서는 VoiceSession이, 브라우저 미리보기에서는 audio 태그가 소리를 낸다.
    // ========================================================
    function micState() {
      return window.AndroidBridge ? window.AndroidBridge.micState() : 'none';
    }

    // 처음 대화를 시작할 때 주차 중에만 마이크 허락을 묻는다.
    function askMicFirst(action) {
      if (micAsked || isDrivingMode || micState() !== 'ask' || readStored(VOICE_KEY) === false) return false;
      micAsked = true;
      pendingStart = action;
      window.AndroidBridge.requestMic();
      return true;
    }

    window.onMicAnswered = function() {
      const action = pendingStart;
      pendingStart = null;
      if (action) action();
    };

    function canListen() {
      return !micBroken && micState() === 'ready' && readStored(VOICE_KEY) !== false;
    }

    function speakStage(clips) {
      listenSince = 0;
      const intro = pendingIntro;
      pendingIntro = [];
      if (tripMuted) stopSpeech();
      else speak([...intro, ...clips].filter(Boolean), listenNow());
    }

    function listenNow() {
      return canListen() ? Journey.listenSpec(currentMode, stage, currentChoices, currentRule) : '';
    }

    function speak(clips, listen) {
      clearTimeout(noMicTimer);
      speechPhase = 'speaking';
      speechPaused = false;
      speechSeq++;
      applyLessonAudioRate();
      if (window.AndroidBridge) {
        window.AndroidBridge.speak(JSON.stringify(clips), listen, speechSeq);
        return;
      }
      previewQueue = clips.slice();
      playPreviewClip();
    }

    // 브라우저 미리보기: 음원을 차례로 튼다. temp/로 시작하는 것은 임시 음성이다.
    function playPreviewClip() {
      const clip = previewQueue.shift();
      if (!clip) {
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
        return;
      }
      const player = document.getElementById('audioPlayer');
      const seq = speechSeq; // 재생 실패 알림이 늦게 와도 그사이 시작한 다음 말을 끝내지 않게 한다
      player.src = clip.startsWith('lesson/') ? `voices/${clip}.m4a` : clip.includes('/') ? `voices/${clip}.wav` : `voices/${voice}/${clip}.wav`;
      player.play().catch(e => {
        if (e.name === 'AbortError') return; // 위치 이동이나 일시정지가 진행 중인 재생 요청을 취소할 수 있다.
        console.log('Audio error:', e);
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq }));
      });
    }

    function stopSpeech() {
      clearTimeout(noMicTimer);
      speechPhase = 'idle';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) window.AndroidBridge.stopSpeech();
      else document.getElementById('audioPlayer').pause();
    }

    function holdSpeech() {
      if (window.AndroidBridge) window.AndroidBridge.holdSpeech();
      else document.getElementById('audioPlayer').pause();
    }

    function proceedSpeech() {
      if (window.AndroidBridge) window.AndroidBridge.proceedSpeech();
      else document.getElementById('audioPlayer').play().catch(() => window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq })));
    }

    function heardLineText() {
      if (speechPhase === 'listening') return '듣고 있어요';
      return heard ? `“${heard}”` : '';
    }

    function showHeardLine() {
      const line = document.getElementById('heardLine');
      if (line) {
        line.textContent = heardLineText();
        line.hidden = !line.textContent;
      }
      updateDriveScreen();
    }

    window.onSpeechEvent = function(jsonText) {
      const info = JSON.parse(jsonText);
      if (info.seq !== speechSeq) return; // 지난 말에 대한 늦은 알림
      if (info.event === 'position') {
        if (lessonRun && !lessonRun.done && Number.isFinite(info.position)) {
          lessonRun.positionSeconds = info.position / 1000;
          updateLessonProgress();
        }
        return;
      }
      if (info.event === 'paused' || info.event === 'resumed') {
        speechPaused = info.event === 'paused';
        return;
      }
      speechPhase = info.event === 'listening' ? 'listening' : 'idle';
      showHeardLine();
      if (currentMode === 'lesson') { onLessonSpeech(info); return; }
      if (info.event === 'heard') onHeard(info.text, info.reference);
      else if (info.event === 'silence') onUnclear();
      else if (info.event === 'listening') {
        listenSince = listenSince || performance.now();
        applyNaviEta();
      }
      else {
        if (info.event === 'micFailed') micBroken = true;
        applyNaviEta();
        syncJourney();
        if (hasArrived) closeAfterArrival();
        else if (info.event === 'stopped') endWithoutSpeaking();
        else if (!listenIfMicIsReady()) advanceWithoutMic();
      }
    };

    // 첫 말을 하는 사이에 음성 모델이 준비되었으면 지금부터 듣는다.
    function listenIfMicIsReady() {
      if (!currentMode || isParkedScreen() || isDialogueDone() || !listenNow()) return false;
      speak([], listenNow());
      return true;
    }

    // 음악이나 통화가 소리를 돌려주지 않으면 끼어들지 않고 대화를 마친다.
    function endWithoutSpeaking() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      tripMuted = true;
      setStage('QUIET_END');
    }

    // 마이크를 쓸 수 없는 차에서는 달리는 동안 답을 받을 길이 없다.
    // 가족이 이야기할 틈을 둔 뒤 다음 단계로 넘어가, 질문 하나에서 멈춰 있지 않게 한다.
    function advanceWithoutMic() {
      if (currentMode === 'lesson' || !isDrivingMode || canListen() || !currentMode || isParkedScreen() || isDialogueDone() || stage === 'PARENT_BRIDGE') return;
      clearTimeout(noMicTimer);
      noMicTimer = setTimeout(() => {
        if (speechPhase === 'idle' && isDrivingMode) skipQuestion();
      }, NO_MIC_WAIT_MS);
    }

    function onHeard(text, reference) {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      const result = Journey.interpret(stage, text, reference, currentChoices, currentRule);
      if (result.kind === 'answer') handleAnswer(result.answer, result.heard);
      else if (result.kind === 'quiet') {
        rememberMorning({ rest: true });
        setStage('REST');
      } else if (result.kind === 'sad') {
        rememberMorning({ rest: true }); // 「오늘은 질문 없이」라고 했으니 그날은 다시 묻지 않는다
        setStage('REST_SOFT');
      }
      else if (result.kind === 'repeat') render();
      else if (performance.now() - listenSince < LISTEN_PATIENCE_MS) speak([], listenNow()); // 잡음일 수 있으니 재촉하지 않고 더 듣는다
      else onUnclear();
    }

    // 한 번 더 물어보고, 그래도 답이 없으면 재촉하지 않고 멈춘다 (기획안 ⑤)
    function onUnclear() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      if (stage === 'AFTER_DETAIL') { setStage('PARENT_BRIDGE'); return; } // 더 말하지 않아도 된다고 했으니 재촉하지 않는다
      unclearCount++;
      listenSince = 0;
      if (unclearCount >= 2) setStage('QUIET_END');
      else speak(['error_repeat'], listenNow());
    }

    // 도착하면 진행 중이던 질문을 마치고 인사한 뒤 첫 화면으로 돌아간다.
    function finishOnArrival() {
      if (!currentMode || isParkedScreen()) return;
      if (currentMode === 'lesson') {
        hasArrived = true;
        if (lessonRun.done) closeAfterArrival();
        else if (lessonRun.stopped || lessonRun.paused) endLesson(); // 멈춰 둔 채 도착하면 이어 말하지 않고 기록을 남긴다
        else fitLessonToEta(0);
        return;
      }
      hasArrived = true;
      if (!isDialogueDone() || (currentMode === 'afternoon' && stage === 'ETA_SHORT')) setStage('DONE');
      if (speechPhase === 'idle') closeAfterArrival();
    }

    function closeAfterArrival() {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => { if (hasArrived) goHome(); }, ARRIVAL_CLOSE_MS);
    }

    // ========================================================
    // 시간 맞춤 수업 (11.01 회의)
    // 조립과 판단은 dait-lesson.js가 맡고, 여기는 수업을 틀고 화면을 그린다.
    // 답을 말하라고 요구하지 않는다. 기록을 켠 사람의 답만 이 기기에 글로 남긴다.
    // ========================================================
    const LESSON_KEY = 'dait.lessonProgress';
    const LESSON_RECORD_KEY = 'dait.lessonRecord';
    let lessonRun = null; // 지금 듣는 교시: { lesson, trip, pieces, index, heard, answers, reachedEnd, done, finished, stopped, saved }
    let lessonMinutes = Lesson.DEFAULT_MINUTES;
    let lessonSubject = ''; // 고르는 화면의 과목 칩. 빈 값은 전체
    let lessonTimer = null;
    let lessonProgressTimer = null;
    const PLAYBACK_KEY = 'dait.pearl.playback.v2';
    const LESSON_RATES = [.8, 1, 1.2, 1.5, 2];
    function readLessonPlaybackPrefs() {
      const prefs = readStored(PLAYBACK_KEY);
      return prefs && ['back', 'forward'].every(key => Number.isInteger(prefs[key]) && prefs[key] >= 1 && prefs[key] <= 3600)
        ? { back: prefs.back, forward: prefs.forward, rate: LESSON_RATES.includes(prefs.rate) ? prefs.rate : 1 }
        : { back: 15, forward: 30, rate: 1 };
    }
    let lessonPlaybackPrefs = readLessonPlaybackPrefs();
    function applyLessonAudioRate() {
      const rate = currentMode === 'lesson' && lessonRun && !isLessonResting() ? lessonPlaybackPrefs.rate : 1;
      if (window.AndroidBridge?.setSpeechRate) window.AndroidBridge.setSpeechRate(rate);
      else if (!window.AndroidBridge) document.getElementById('audioPlayer').playbackRate = rate;
    }
    function saveLessonPlaybackPrefs(prefs) {
      if (isDrivingMode || !['back', 'forward'].every(key => Number.isInteger(prefs[key]) && prefs[key] >= 1 && prefs[key] <= 3600) || !LESSON_RATES.includes(prefs.rate)) return false;
      localStorage.setItem(PLAYBACK_KEY, JSON.stringify(prefs));
      const run = lessonRun, wait = run?.wait;
      const left = wait && !run.paused ? Math.max(0, wait.endsAt - Date.now()) * (wait.rate || 1) : null;
      lessonPlaybackPrefs = { ...prefs };
      applyLessonAudioRate();
      if (left !== null) lessonWait(left, wait.then);
      if (currentMode === 'lesson' && run && !run.done) { fitLessonToEta(hasArrived ? 0 : remainMinutes()); renderStage(); }
      return true;
    }
    const LESSON_RESUME_MS = 30 * 1000; // 이보다 오래 멈추면 이어 들을 때 지금 조각을 처음부터 다시 말한다
    const LESSON_BACK_MS = 3000; // 조각을 이만큼 들었으면 「이전」은 그 조각을 처음부터, 덜 들었으면 앞 조각을 말한다
    const TOP_SPEED_MPS = 50; // 이보다 빨리 줄어든 남은 거리는 달린 것이 아니라 목적지를 바꾼 것이다

    function lessonProgress() {
      return Lesson.normalize(readStored(LESSON_KEY));
    }

    function lessonRecordOn() {
      return readStored(LESSON_RECORD_KEY) === true;
    }

    function canRecordAnswer() {
      return lessonRecordOn() && canListen();
    }

    function openLessons() {
      if (isDrivingMode) return;
      const eta = remainMinutes();
      lessonMinutes = eta !== null ? Lesson.minutesFor(eta) : Lesson.DEFAULT_MINUTES;
      lessonSubject = '';
      currentMode = 'lessonPick';
      render();
    }

    function pickLessonTime(minutes) {
      lessonMinutes = minutes;
      if (armed && armed.lesson) armed.minutes = minutes;
      render();
    }

    function pickLessonSubject(subject) {
      lessonSubject = subject;
      render();
    }

    // 고른 수업을 맨 앞에 두고 다른 수업을 줄 세운다. 긴 이동이면 교시로 나누고,
    // 짧은 이동이어도 고른 수업 뒤에 5분 넘게 남으면 다른 수업을 쉬지 않고 이어 붙인다.
    function lessonTripFor(lessonId) {
      return Lesson.planTrip(Lesson.tripOrder(DAIT_LESSONS, lessonProgress().records, lessonId), lessonMinutes);
    }

    // 출발하면 들려주기를 수업에도 쓴다. 마이크는 답을 남기기로 한 사람에게만 묻는다.
    function toggleLessonArm(lessonId, fromStop) {
      if (isDrivingMode) return;
      if (armed && armed.lesson === lessonId && !!armed.fromStop === !!fromStop) { disarm(); render(); return; }
      if (lessonRecordOn() && askMicFirst(() => toggleLessonArm(lessonId, fromStop))) return;
      disarm();
      arm({ mode: 'lesson', lesson: lessonId, minutes: lessonMinutes, fromStop: !!fromStop });
      render();
    }

    function toggleLessonRecord() {
      const on = !lessonRecordOn();
      writeStored(LESSON_RECORD_KEY, on);
      if (on) micAsked = false; // 답을 남기겠다고 고른 지금 마이크 허락을 묻는다
      if (!on || !askMicFirst(render)) render();
    }

    function lessonRecordLabel() {
      if (!lessonRecordOn()) return '꺼짐';
      return '켜짐';
    }

    // 켜 두었어도 마이크를 쓸 수 없으면 답을 받을 수 없다. 버튼은 짧게 두고 사정은 설명 줄에서 말한다.
    function lessonRecordNote() {
      return lessonRecordOn() && !canListen() && micState() !== 'loading' ? '마이크를 쓸 수 없어 지금은 답을 남기지 못해요.' : '';
    }

    function doneHomework() {
      writeStored(LESSON_KEY, Lesson.finishHomework(lessonProgress()));
      render();
    }

    function forgetLessonAnswers() {
      writeStored(LESSON_KEY, Lesson.forgetAnswers(lessonProgress()));
      render();
    }

    // 카드를 누르면 바로 듣는다는 표시
    const LESSON_PLAY_ICON = '<span class="lesson-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></span>';

    function renderLessonPick(container) {
      const progress = lessonProgress();
      const eta = remainMinutes();
      const choices = eta !== null ? [Lesson.minutesFor(eta)] : [...Lesson.TIME_CHOICES, ...Lesson.LONG_CHOICES];
      if (!choices.includes(lessonMinutes)) lessonMinutes = eta !== null ? choices[0] : Lesson.DEFAULT_MINUTES;
      const trip = Lesson.planTrip(Lesson.tripOrder(DAIT_LESSONS, progress.records, armed && armed.lesson), lessonMinutes);
      const periods = trip.lesson ? Lesson.periods(trip) : [];
      const lessons = Lesson.recommend(DAIT_LESSONS, trip.minutes, progress.records);
      const subjects = Lesson.subjects(DAIT_LESSONS.filter(lesson => lessons.includes(lesson)));
      // 과목마다 수업이 하나뿐이면 거를 것이 없으므로 과목 칩을 두지 않는다. 과목은 카드에 적혀 있다.
      const showSubjects = subjects.length > 1 && subjects.length < lessons.length;
      if (!showSubjects || !subjects.includes(lessonSubject)) lessonSubject = '';
      const reserved = armed && armed.lesson ? DAIT_LESSONS.find(lesson => lesson.id === armed.lesson) : null;
      const stopped = stoppedLesson(lessonMinutes);
      const stopReserved = !!reserved && armed.fromStop;
      const scrolled = document.querySelector('.lesson-main')?.scrollTop || 0;
      const km = Math.round(progress.km[Lesson.monthOf(toYmd(new Date()))] || 0);
      const answers = progress.records.flatMap(record => record.answers).slice(-3).reverse();
      const mileage = km ? `이번 달 ${km}km ${Lesson.mileageLine(km)}`.trim() : '';
      container.innerHTML = `
        <div class="dialogue-wrap pearl-picker">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span class="top-label">수업</span>
          </div>
          <div class="lesson-pick">
            <div class="lesson-main">
              <div class="main-question">${eta === null ? '몇 분 수업을 들을까요?' : `도착까지 ${Lesson.minutesFor(eta)}분, ${periods.length > 1 ? (trip.rest ? `${periods.length}교시로 들어요` : '수업을 이어 들어요') : '이 수업을 들어요'}`}</div>
              ${eta === null ? `<div class="lesson-times">
                ${choices.map(minutes => `<button class="choice-chip" aria-pressed="${minutes === lessonMinutes}" onclick="pickLessonTime(${minutes})">${minutes}분</button>`).join('')}
              </div>` : ''}<!-- 길 안내 중에는 남은 시간이 위 문장에 있으므로 고를 버튼을 두지 않는다 -->
              ${periods.length > 1 && trip.rest ? `<div class="card-sub">${periods.map((lesson, i) => `${i + 1}교시 ${escapeHtml(lesson.subject)}`).join(' · ')} · 쉬는 시간 ${trip.rest}분</div>` : ''}
              ${periods.length > 1 && !trip.rest ? '<div class="card-sub">고른 수업이 끝나고 남는 시간은 다른 수업으로 이어 채워요</div>' : ''}
              ${showSubjects ? `<div class="lesson-subjects">
                ${['', ...subjects].map(subject => `<button class="choice-chip" aria-pressed="${subject === lessonSubject}" data-subject="${escapeHtml(subject)}" onclick="pickLessonSubject(this.dataset.subject)">${escapeHtml(subject || '전체')}</button>`).join('')}
              </div>` : ''}
              ${reserved ? `<div class="card-sub">출발하면 들려줄게요: ${escapeHtml(reserved.title)}${stopReserved ? ' (멈춘 곳부터)' : ''}</div>` : ''}
              ${lessons.length === 0 && !stopped ? '<div class="settings-message">이 시간에 맞는 수업이 아직 없어요</div>' : ''}
              ${stopped ? `<div class="lesson-row">
                <button class="choice-chip" onclick="startLesson('${stopped.id}', true)">
                  ${LESSON_PLAY_ICON}
                  <span class="lesson-text">
                    <span class="lesson-title">지난번 멈춘 곳부터: ${escapeHtml(stopped.title)}</span>
                    <span class="lesson-meta">${escapeHtml(stopped.subject)} · 남은 약 ${stopMinutesLeft(stopped, lessonMinutes)}분</span>
                  </span>
                </button>
                <button class="card-btn quiet" onclick="toggleLessonArm('${stopped.id}', true)">${stopReserved && reserved === stopped ? '예약 취소' : '출발하면 듣기'}</button>
              </div>` : ''}
              ${Lesson.bySubject(lessons, lessonSubject).filter(lesson => lesson !== stopped).map(lesson => `<div class="lesson-row">
                <button class="choice-chip" onclick="startLesson('${lesson.id}')">
                  ${LESSON_PLAY_ICON}
                  <span class="lesson-text">
                    <span class="lesson-title">${escapeHtml(lesson.question || lesson.title)}</span>
                    <span class="lesson-meta">${escapeHtml(lesson.subject)} · 약 ${Math.round(Lesson.totalSeconds(Lesson.assemble(lesson, trip.minutes)) / 60)}분 · ${escapeHtml(lesson.title)}</span>
                  </span>
                </button>
                <button class="card-btn quiet" onclick="toggleLessonArm('${lesson.id}')">${reserved === lesson && !stopReserved ? '예약 취소' : '출발하면 듣기'}</button>
              </div>`).join('')}
            </div>
            <div class="lesson-side">
              <div class="card-label">모은 깃털</div>
              ${progress.ieum ? `<div class="card-focus">${featherCount(progress)}</div>` : `<div class="card-sub">${featherCount(progress)}</div>`}
              ${mileage ? `<div class="card-sub">${escapeHtml(mileage)}</div>` : ''}
              ${progress.homework ? `<div class="card-label">숙제</div><div class="card-sub">${escapeHtml(progress.homework.title)}</div><button class="card-btn" onclick="doneHomework()">했어요</button>` : ''}
              ${answers.length ? '<div class="card-label">남긴 답</div>' : ''}
              ${answers.map(answer => `<div class="card-sub">${escapeHtml(answer.question)}: “${escapeHtml(answer.text)}”</div>`).join('')}
              ${answers.length ? '<button class="card-btn quiet" onclick="forgetLessonAnswers()">남긴 답 지우기</button>' : ''}
            </div>
          </div>
        </div>
      `;
      const main = document.querySelector('.lesson-main');
      if (main) main.scrollTop = scrolled; // 예약을 눌러도 보던 자리에 머문다
    }

    function renderLesson(container) {
      const run = lessonRun;
      if (!run.done && !isLessonResting()) { renderLessonPlayer(container, run); return; }
      const piece = run.pieces[run.index];
      const resting = !run.done && Lesson.isBreak(piece);
      const title = run.done ? lessonDoneLine(run) : run.stopped ? '수업을 잠시 멈췄어요' : piece.line;
      const celebrate = run.done && run.trip.earned > 0;
      const back = '<button class="primary-btn secondary" onclick="prevLessonPiece()">이전</button>';
      const buttons = run.done ? '<button class="primary-btn" onclick="handlePrimaryAction()">마치기</button>'
        : `${resting ? '' : back}<button class="primary-btn" onclick="lessonMainAction()">${lessonMainLabel(run)}</button>`;
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            ${!isDrivingMode && !run.done && !resting ? '<button class="back-btn" onclick="restartLesson()">처음부터 듣기</button>' : ''}
            <span class="top-label">${escapeHtml(lessonLabel(run, resting))}</span>
          </div>
          <div class="dialogue-card">
            <div class="card-center">
              ${celebrate ? itchiHtml(run) : ''}
              <div class="main-question">${escapeHtml(title)}</div>
              ${celebrate ? `<div class="card-sub">모은 깃털 ${lessonProgress().ieum}개</div>` : ''}
              ${run.done || resting ? '' : run.paused ? '<div class="card-sub">잠시 멈췄어요</div>' : piece.voiced ? '' : '<div class="card-sub">음원 준비 중</div>'}
              <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
            </div>
          </div>
          ${!isDrivingMode && !resting ? lessonProgressHtml(run) : ''}
          <div class="bottom-bar">${buttons}</div>
        </div>
      `;
      if (celebrate && container.querySelector) ITCHI.play(container.querySelector('.itchi'));
      tickLessonProgress();
    }

    function lessonIntervalText(seconds) {
      return seconds % 60 === 0 ? `${seconds / 60}분` : `${seconds}초`;
    }

    function lessonTransportIcon(name) {
      const paths = { back: '<path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/>', forward: '<path d="M20 10a8 8 0 1 0-1 8M20 4v6h-6"/>', play: '<path d="m8 5 12 7-12 7Z" fill="currentColor" stroke="none"/>', pause: '<path d="M8 6v12M16 6v12"/>' };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
    }

    function renderLessonPlayer(container, run) {
      const piece = run.pieces[run.index], playing = !run.paused && !run.stopped && !speechPaused;
      const prefs = lessonPlaybackPrefs;
      container.innerHTML = `<div class="pearl-player${playing ? ' is-playing' : ''}" aria-label="수업 재생">
        <div class="pearl-player-heading">
          <h1 class="main-question">${escapeHtml(piece.line)}</h1>
          <p class="pearl-player-meta">${escapeHtml(lessonLabel(run, false))} · ${escapeHtml(run.lesson.title)}</p>
          <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
        </div>
        <div class="pearl-player-wave" aria-hidden="true">${[12,19,26,34,39,34,28,38,32,23,16,10].map((n,i) => `<i style="--wave-height:${n};--wave-delay:${-i*.13}s"></i>`).join('')}</div>
        <div class="pearl-transport">
          <button class="pearl-seek" onclick="seekLessonBy(-lessonPlaybackPrefs.back)" aria-label="${lessonIntervalText(prefs.back)} 뒤로">${lessonTransportIcon('back')}<span>${lessonIntervalText(prefs.back)}</span></button>
          <button class="pearl-play" onclick="lessonMainAction()" aria-label="${playing ? '일시정지' : '이어 듣기'}">${lessonTransportIcon(playing ? 'pause' : 'play')}</button>
          <button class="pearl-seek" onclick="seekLessonBy(lessonPlaybackPrefs.forward)" aria-label="${lessonIntervalText(prefs.forward)} 앞으로">${lessonTransportIcon('forward')}<span>${lessonIntervalText(prefs.forward)}</span></button>
        </div>
        <div class="pearl-player-progress" aria-label="수업 진행">
          <input id="lessonSeek" type="range" min="0" max="${lessonTimeline(run).seconds}" step="0.1" value="0" aria-label="${isDrivingMode ? '수업 진행 시간' : '수업 재생 위치'}" oninput="previewLessonSeek(Number(this.value))" onchange="seekLessonAt(Number(this.value))" onblur="cancelLessonScrub()" onpointercancel="cancelLessonScrub()"${isDrivingMode ? ' disabled' : ''}>
          <div class="pearl-player-times"><span id="lessonElapsed">0:00</span><span id="lessonTimingNote"></span><span id="lessonRemaining"></span></div>
        </div>
      </div>`;
      tickLessonProgress();
    }

    function lessonTimeline(run) {
      let seconds = 0;
      const sections = run.pieces.flatMap((piece, index) => {
        if (Lesson.isBreak(piece)) return [];
        const section = { piece, index, start: seconds, seconds: Lesson.totalSeconds([piece]) };
        seconds += section.seconds;
        return [section];
      });
      return { sections, seconds };
    }

    function lessonTimeText(seconds) {
      const whole = Math.max(0, Math.floor(seconds));
      return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`;
    }

    function lessonProgressHtml(run) {
      const timeline = lessonTimeline(run);
      return `<div class="lesson-progress" aria-label="수업 진행">
        <div class="lesson-progress-times"><span id="lessonElapsed">0:00</span><span id="lessonSectionName"></span><span>${lessonTimeText(timeline.seconds)}</span></div>
        <div class="lesson-progress-track">
          <div class="lesson-progress-segments" aria-hidden="true">${timeline.sections.map(section => `<span data-lesson-segment="${section.index}" style="flex:${section.seconds}"></span>`).join('')}</div>
          <input id="lessonSeek" type="range" min="0" max="${timeline.seconds}" step="0.1" value="0" aria-label="수업 재생 위치" oninput="previewLessonSeek(Number(this.value))" onchange="seekLessonAt(Number(this.value))" onblur="cancelLessonScrub()" onpointercancel="cancelLessonScrub()"${run.done ? ' disabled' : ''}>
        </div>
        <div class="lesson-sections" aria-label="수업 구간">${timeline.sections.map((section, n) => `<button onclick="seekLessonSection(${section.index})" data-lesson-section="${section.index}" aria-label="${n + 1}구간 ${escapeHtml(section.piece.line)}"${run.done ? ' disabled' : ''}>${n + 1}. ${escapeHtml(section.piece.line)}</button>`).join('')}</div>
      </div>`;
    }

    function currentLessonPosition(run) {
      const piece = run.pieces[run.index];
      if (run.wait && (!piece.voiced || (Lesson.isQuestion(piece) && speechPhase !== 'speaking'))) {
        const left = run.paused ? run.wait.left : Math.max(0, run.wait.endsAt - Date.now()) * (run.wait.rate || 1);
        return Lesson.totalSeconds([piece]) - left / 1000;
      }
      if (!window.AndroidBridge && piece.voiced) {
        const player = document.getElementById('audioPlayer'), time = player.currentTime;
        if (player.readyState >= 1 && Number.isFinite(time)) return time;
      }
      return run.positionSeconds || 0;
    }

    function updateLessonProgress() {
      const run = lessonRun;
      if (!run || currentMode !== 'lesson') return;
      const timeline = lessonTimeline(run);
      const section = timeline.sections.find(item => item.index === run.index);
      const position = run.done ? timeline.seconds : (section ? section.start + Math.min(section.seconds, currentLessonPosition(run)) : timeline.seconds);
      if (!run.scrubbing) {
        const slider = document.getElementById('lessonSeek');
        if (!slider) return;
        slider.max = timeline.seconds; slider.value = position;
        slider.style.setProperty('--seek-fill', `${timeline.seconds ? position / timeline.seconds * 100 : 0}%`);
        slider.setAttribute('aria-valuetext', `${lessonTimeText(position)} / ${lessonTimeText(timeline.seconds)}`);
        document.getElementById('lessonElapsed').textContent = lessonTimeText(position);
      }
      const remaining = document.getElementById('lessonRemaining');
      if (remaining) remaining.textContent = '−' + lessonTimeText((timeline.seconds - position) / lessonPlaybackPrefs.rate);
      const note = document.getElementById('lessonTimingNote');

      const section = timeline.sections.find(item => wanted < item.start + item.seconds);

      stopSpeech();

        const K1 = [TOP[0] + dx / len * 197, TOP[1] + dy / len * 197], K2 = [WING[0] + 40, WING[1] - 140];
        const [bx, by] = bez(TOP, K1, K2, WING, p);
        const th = 2 * Math.PI * 2 * p, ramp = Math.pow(Math.sin(Math.PI / 2 * Math.min(1, p / 0.25)), 2), swing = ramp * (1 - p);
        const x = bx - 110 * swing * Math.sin(th);
        const y = by - 24 * swing * Math.pow(Math.sin(th), 2);
        const r = mix(174, ROLL, p * p) + 30 * swing * Math.cos(th);
        return [x, y, r, 1, 0.78 + 0.22 * Math.cos(2 * th), 1.2 - 0.1 * p];
      }

      // T: 로고(0) → 잇찌(FULL) 장면의 시각
      function draw(svg, T, lw = 16.6) {
        const $ = c => svg.querySelector('.' + c);
        const pAll = win(T, MORPH, MDUR + SPREAD);
        let d = '';
        for (let i = 0; i < A.length; i++) {
          const p = inOut(win(T, MORPH + SPREAD * i / A.length, MDUR));
          d += (i ? 'L' : 'M') + mix(A[i][0], B[i][0], p).toFixed(1) + ' ' + mix(A[i][1], B[i][1], p).toFixed(1);
        }
        const pc = inOut(pAll);
        ['it-rb', 'it-logo', 'it-glow'].forEach(c => $(c).setAttribute('d', d));
        $('it-rb').setAttribute('stroke-width', mix(lw, 10.5, pc));
        $('it-logo').setAttribute('stroke-width', mix(lw, 10.5, pc));
        $('it-logo').setAttribute('opacity', pc >= 1 ? 0 : 1);
        $('it-rb').setAttribute('opacity', pc);
        $('it-glow').setAttribute('opacity', 0.14 * pc);
        // t 가로줄은 꼬리를 따라 내려가 꼬리 리본을 가로지른다
        const pb = inOut(win(T, MORPH + SPREAD * 0.8, MDUR));
        $('it-bar').setAttribute('d', `M ${mix(BAR0[0][0], BAR1[0][0], pb).toFixed(1)} ${mix(BAR0[0][1], BAR1[0][1], pb).toFixed(1)} L ${mix(BAR0[1][0], BAR1[1][0], pb).toFixed(1)} ${mix(BAR0[0][1], BAR1[0][1], pb).toFixed(1)}`);
        $('it-bar').setAttribute('stroke-width', mix(lw * 0.873, 7.8, pb));
        // i 점은 톡 튄 뒤 포물선을 그리며 눈 자리로
        const pop = win(T, 250, 380), popS = 1 + 0.4 * Math.sin(Math.PI * pop);
        const pj = inOut(win(T, MORPH + 150, 950)), u = 1 - pj, C = [720, 90];
        const x = u * u * DOT0[0] + 2 * u * pj * C[0] + pj * pj * EYE[0];
        const y = u * u * DOT0[1] + 2 * u * pj * C[1] + pj * pj * EYE[1];
        ['it-halo', 'it-iris', 'it-core'].forEach(c => { $(c).setAttribute('cx', x); $(c).setAttribute('cy', y); });
        $('it-iris').setAttribute('r', mix(17.9, 11, pj) * popS);
        $('it-core').setAttribute('r', mix(8.5, 5.2, pj) * popS);
        $('it-halo').setAttribute('opacity', 0.5 + 0.5 * Math.sin(Math.PI * pop) + 0.5 * pj);
        // 리본이 자리 잡은 곳부터 색이 차오른다: 머리 → 날개·등 → 배 → 꼬리
        [['it-head', 1450, 622, 280], ['it-wing', 1750, 760, 330], ['it-belly', 1900, 720, 420], ['it-tail', 2150, 900, 440]].forEach(([c, start, ax, ay]) => {
          const k = win(T, start, 560), s = mix(0.6, 1, outBack(k));
          $(c).setAttribute('opacity', clamp(k * 1.5));
          $(c).setAttribute('transform', `translate(${ax} ${ay}) scale(${s}) translate(${-ax} ${-ay})`);
        });
        // 가지가 그어지고 다리를 내려 앉으며 몸이 살짝 눌렸다 돌아온다
        const br = inOut(win(T, 2350, 520));
        $('it-branch').setAttribute('x1', mix(722, 564, br));
        $('it-branch').setAttribute('x2', mix(722, 880, br));
        $('it-branch').setAttribute('opacity', br > 0 ? 1 : 0);
        const lg = win(T, 2650, 320);
        $('it-legs').setAttribute('opacity', lg);
        $('it-legs').setAttribute('transform', `translate(0 ${((1 - inOut(lg)) * -14).toFixed(1)})`);
        const settle = win(T, 2850, 450);
        $('it-bob').setAttribute('transform', `translate(0 ${(6 * Math.sin(Math.PI * settle) * (1 - settle * 0.4)).toFixed(2)})`);
      }

      // t: 실제로 흐른 시간. 깃털 i는 글자에서 솟아올라 그네 타듯 내려와 날개에 닿고, 작아지며 스며든다.
      // 솟아오르는 동안만 옅은 잔상 셋이 뒤따른다. 닿으면 날개 결이 한 번 밝아지고 잇찌가 살짝 몸을 낮춘다.
      function feathers(svg, t, S) {
        let shine = 0, target = null, landed = -1, wingOpen = 0;
        svg.querySelectorAll('.it-fly').forEach((g, i) => {
          const f = (t - FWD - LEAD - i * STAGGER) / FLY;
          const main = g.querySelector('.it-feather'), trails = g.querySelectorAll('.it-trail');
          const hide = () => { main.setAttribute('opacity', 0); trails.forEach(el => el.setAttribute('opacity', 0)); };
          wingOpen = Math.max(wingOpen, clamp((f - (LAND - 0.16)) / 0.08) * (1 - clamp((f - (LAND + 0.05)) / 0.08))); // 날개에 닿기 조금 전부터 펴서 받는다
          if (f < 0 || f >= 1) return hide();
          if (f < LAND) {
            const [x, y, r, sx, sy, size] = featherPose(S, i, f);
            if (!target) target = [x, y]; // 먼저 날아온 깃털을 본다
            const op = clamp(f * 14);
            main.setAttribute('transform', place([x, y, r, sx, sy], size));
            main.setAttribute('opacity', op.toFixed(3));
            const trailOn = clamp((RISE + 0.08 - f) / 0.08); // 솟아오를 때만, 내려오기 시작하면 사라진다
            trails.forEach((el, k) => {
              const [tx, ty, tr, tsx, tsy, ts] = featherPose(S, i, Math.max(0, f - 0.018 * (k + 1)));
              el.setAttribute('transform', place([tx, ty, tr, tsx, tsy], ts * (0.94 - 0.08 * k)));
              el.setAttribute('opacity', (op * [0.32, 0.18, 0.08][k] * clamp(f * 20) * trailOn).toFixed(3));
            });
          } else {
            const p = (f - LAND) / (1 - LAND);
            main.setAttribute('transform', place([WING[0] + 6 * p, WING[1] + 4 * p, ROLL, 1, mix(1, 0.6, p)], mix(1.1, 0.3, p)));
            main.setAttribute('opacity', (1 - p).toFixed(3));
            trails.forEach(el => el.setAttribute('opacity', 0));
            shine = Math.max(shine, Math.sin(Math.PI * p));
          }
        });
        svg.querySelectorAll('.it-fly').forEach((g, i) => { // 가장 최근에 날개에 닿은 시각
          const at = FWD + LEAD + i * STAGGER + FLY * LAND;
          if (t >= at) landed = Math.max(landed, at);
        });
        svg.querySelector('.it-shine').setAttribute('opacity', (0.9 * shine).toFixed(3));
        return { target, landed, wingOpen };
      }

      // 잇찌의 작은 행동(잇찌 모습으로 머무는 동안만). 그림이 옆모습이라 눈동자와 몸짓으로 마음을 보여 준다.
      // - 숨 쉬듯 몸이 아주 조금 오르내린다
      // - 깃털이 날아오면 눈동자가 깃털을 따라가고, 몸도 깃털 쪽으로 살짝 기운다
      // - 처음과 끝에 한 번씩 눈을 깜빡인다
      // - 깃털이 날개에 닿으면 웃는 눈(^)이 되어 깡충 뛴다
      // - 로고로 돌아가기 전에 고개를 갸웃하고 앞(보는 사람 쪽)을 본다
      const FEET = [720, 534];
      function alive(svg, t, back0, seen) {
        const eye = svg.querySelector('.it-eye'), core = svg.querySelector('.it-core'), bob = svg.querySelector('.it-bob');
        if (t < FWD || t >= back0) { eye.removeAttribute('transform'); setWings(svg, 0, 0); return; }
        const w = clamp((t - FWD) / 300) * clamp((back0 - t) / 300); // 시작과 끝은 부드럽게
        const breath = 1.6 * Math.sin(2 * Math.PI * (t - FWD) / 1300);
        const ago = seen.landed < 0 ? -1 : t - seen.landed;
        const hop = ago >= 0 && ago < 380 ? -12 * Math.sin(Math.PI * ago / 380) : 0;
        const settle = ago >= 0 && ago < 140 ? 3 * Math.sin(Math.PI * ago / 140) : 0; // 닿는 순간 살짝 눌림
        // 기울기: 깃털 쪽으로 몸을 기울이고, 끝에는 갸웃한다
        let lean = 0, gaze = [-0.6, 0.5]; // 아무것도 없을 때는 앞을 본다
        if (seen.target) {
          const dx = seen.target[0] - EYE[0], dy = seen.target[1] - EYE[1], d = Math.hypot(dx, dy) || 1;
          gaze = [dx / d, dy / d];
          lean = 5 * clamp((seen.target[0] - 640) / 350) - 2.5 * clamp((640 - seen.target[0]) / 300);
        }
        const tilt = inOut(clamp((t - (back0 - 1000)) / 350)) * (1 - clamp((t - (back0 - 300)) / 300));
        lean = mix(lean, -8, tilt);
        bob.setAttribute('transform', `translate(0 ${((breath + hop + settle) * w).toFixed(2)}) rotate(${(lean * w).toFixed(2)} ${FEET[0]} ${FEET[1]})`);
        setWings(svg, 0.55 + 0.25 * Math.sin(t / 90), 0.6 * seen.wingOpen * w); // 까치 날개를 펴서 깃털을 받는다
        core.setAttribute('cx', (EYE[0] + 4.5 * gaze[0] * w).toFixed(1));
        core.setAttribute('cy', (EYE[1] + 4.5 * gaze[1] * w).toFixed(1));
        // 눈: 깜빡임과 웃는 눈. 웃는 눈은 눈을 납작하게 눌러 위로 둥근 모양을 만든다
        const blink = (at, len = 160) => { const k = (t - at) / len; return k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0; };
        const shut = Math.max(blink(FWD + 350), blink(back0 - 650), blink(back0 - 450));
        const smile = ago >= 0 ? Math.sin(Math.PI * clamp(ago / 900)) : 0;
        const sy = Math.max(0.08, 1 - 0.92 * shut - 0.55 * smile);
        eye.setAttribute('transform', `translate(${EYE[0]} ${EYE[1]}) scale(1 ${sy.toFixed(3)}) translate(${-EYE[0]} ${-EYE[1]})`);
      }

      // 「깃털 +1」 글자의 끝을 잇찌 그림 좌표로 바꾼다. 찾지 못하면 그림 아래 오른쪽에서 날아오른다.
      function startPoint(svg) {
        try {
          const q = svg.parentElement.querySelector('.main-question'), m = svg.getScreenCTM();
          const r = q.getBoundingClientRect();
          const pt = new DOMPoint(r.right - r.height * 0.8, r.top + r.height / 2).matrixTransform(m.inverse());
          if (isFinite(pt.x) && isFinite(pt.y)) return [pt.x, pt.y];
        } catch (e) { /* 아래 기본값 */ }
        return [960, 640];
      }

      function play(svg) {
        if (!svg || typeof svg.querySelector !== 'function') return;
        const still = svg.getAttribute('data-play') !== '1'
          || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (still) return; // 끝 모습(로고)은 처음부터 그려져 있다
        if (!A) {
          A = sample(svg, LOGO, (x, y) => [lx(x), ly(y)]);
          B = sample(svg, BIRD, (x, y) => [x, y]);
        }
        const n = Number(svg.getAttribute('data-feathers')) || 1;
        const back0 = FWD + LEAD + STAGGER * (n - 1) + FLY + HOLD, end = back0 + BACK;
        const S = startPoint(svg);
        let t0 = null;
        const step = ts => {
          if (!svg.isConnected) return; // 화면이 바뀌면 멈춘다
          if (t0 === null) t0 = ts;
          const t = Math.min(ts - t0, end);
          const T = t < FWD ? t * 1.25 : t < back0 ? FULL : FULL * (1 - inOut(clamp((t - back0) / BACK)));
          draw(svg, T);
          alive(svg, t, back0, feathers(svg, t, S));
          if (t < end) requestAnimationFrame(step);
          else draw(svg, 0);
        };
        requestAnimationFrame(step);
      }

      // 앱 시작: 잇찌가 날갯짓하며 오른쪽 위에서 날아와 앉았다가, 다시 다잇 로고로 바뀐다
      // (팀에서 받은 오프닝 「새 → 로고」 생각을 잇찌로, character/itchi-opening.html). 끝나면 done()을 부른다.
      function splash(svg, done) {
        if (!A) { A = sample(svg, LOGO, (x, y) => [lx(x), ly(y)]); B = sample(svg, BIRD, (x, y) => [x, y]); }
        const FLYIN = 1300, REST = 250, TURN = 1300, LW = 3.8 * 6.4; // LW: 시작 화면 로고 굵기를 잇찌 좌표로
        const bob = svg.querySelector('.it-bob'), legs = svg.querySelector('.it-legs'), branch = svg.querySelector('.it-branch');
        let t0 = null, stopped = false;
        const step = ts => {
          if (stopped || !svg.isConnected) return;
          if (t0 === null) t0 = ts;
          const t = ts - t0;
          if (t < FLYIN + REST) {
            draw(svg, FULL, LW);
            const p = clamp(t / FLYIN), e = 1 - Math.pow(1 - p, 3), land = Math.sin(Math.PI * clamp((t - FLYIN) / REST));
            const lean = -18 * (1 - e) * (1 - e) + 6 * Math.sin(Math.PI * e) * (1 - e);
            bob.setAttribute('transform', `translate(${(560 * (1 - e)).toFixed(1)} ${(-330 * (1 - e) * (1 - e) + 4 * land).toFixed(1)}) rotate(${lean.toFixed(2)} 720 534) translate(720 534) scale(${mix(0.65, 1, e).toFixed(3)} ${(mix(0.65, 1, e) * (1 - 0.05 * land)).toFixed(3)}) translate(-720 -534)`);
            legs.setAttribute('opacity', clamp((t - FLYIN * 0.7) / (FLYIN * 0.3)).toFixed(3));
            setWings(svg, Math.cos(2 * Math.PI * t / 310), 1 - clamp((t - FLYIN * 0.78) / (FLYIN * 0.22)));
          } else {
            const k = clamp((t - FLYIN - REST) / TURN);
            bob.removeAttribute('transform');
            setWings(svg, 0, 0);
            draw(svg, FULL * (1 - inOut(k)), LW);
            if (k >= 1) { stopped = true; done(); return; }
          }
          branch.setAttribute('opacity', 0); // 시작 화면에는 가지가 없다
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
        return () => { stopped = true; };
      }

      return { lx, ly, play, wings, splash };
    })();
    const ITCHI_LOGO_D = DAIT_LOGO_PATH.replace(/ M74 16 h12$/, '')
