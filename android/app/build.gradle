plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// The release key stays off the repository: tools/Make-Release-Key.ps1 writes android/keystore.properties.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
android {
    namespace 'io.dait.app'
    compileSdk 34
    useLibrary 'android.car'
    defaultConfig {
        applicationId 'io.dait.app'
        minSdk 28
        targetSdk 34
        versionCode 4
        versionName '0.4-pearl'
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += ['wav', 'm4a'] }
}
dependencies {
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // 컴퓨터에서 도는 시험에는 Android의 org.json이 없다
}
