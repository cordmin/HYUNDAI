<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>달 버튼 시안</title>
<style>
:root { --ink:#352832; --lilac:#884d62; --soft:#f1dfe5; --paper:#fcf5f6; --line:#e5cdd6; --muted:#715e69; }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:linear-gradient(135deg,transparent 30%,#d7a9ba59),linear-gradient(120deg,#f8e9eb,#ecd9df); min-height:100vh; font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
p.head { max-width:900px; margin:0 auto 14px; color:var(--muted); font-size:14px; }
.grid { max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.card { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:16px; }
.card h2 { margin:0 0 4px; font-size:18px; color:var(--lilac); } .card p { margin:0 0 12px; font-size:13px; color:var(--muted); min-height:34px; }
.row { display:flex; gap:22px; align-items:center; }
.row figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
/* 실제 앱 버튼 크기: 알약 카드 안 동그란 버튼 */
.pill { display:flex; gap:10px; padding:5px 7px; background:var(--paper); border:1px solid var(--line); border-radius:99px; }
.pill.dark { background:#392a33; border-color:#795564; }
.btn { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--soft); color:var(--ink); }
.dark .btn { background:#f0b9cc; color:#392a33; }
.btn svg { width:24px; height:24px; }
</style></head><body>
<p class="head">왼쪽은 밝은 화면일 때(꺼짐), 오른쪽은 어두운 화면일 때(켜짐) 모습이에요. 크기는 실제 앱 버튼과 같아요.</p>
<div class="grid" id="grid"></div>
<script>
const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const looks = [
  ['지금 모양', '가는 선 초승달. 비교용.', `<svg viewBox="0 0 24 24" ${S}><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`],
  ['A · 꽉 찬 초승달', '선 대신 속을 채운 초승달. 작아도 또렷하게 보임.', `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>`],
  ['B · 달과 작은 별', '초승달 옆에 반짝이는 별 둘. "밤"이라는 뜻이 가장 잘 보임.', `<svg viewBox="0 0 24 24"><path d="M18 15.5A7.5 7.5 0 1 1 8.5 6a6 6 0 0 0 9.5 9.5z" fill="currentColor"/><path d="M17 3.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z M21 8.5l.45 1.05 1.05.45-1.05.45L21 11.5l-.45-1.05L19.5 10l1.05-.45z" fill="currentColor"/></svg>`],
  ['C · 반달', '동그라미 반쪽만 채운 모양. 밝음/어두움을 반반으로 보여 줌.', `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>`],
  ['D · 동글동글 초승달', '굵고 둥근 선의 초승달. 앱의 둥근 막대·버튼과 어울림.', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14.6A7.5 7.5 0 1 1 9.4 5a5.8 5.8 0 0 0 9.6 9.6z"/></svg>`],
  ['E · 초승달 + 점 별', '꽉 찬 초승달 안쪽에 작은 점 별 셋. 귀엽고 아이 앱다움.', `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 20.5A9 9 0 0 1 9 3.6a7.5 7.5 0 1 0 11.4 13.8 9 9 0 0 1-4.9 3.1z"/><circle cx="17" cy="6" r="1.3"/><circle cx="20.3" cy="10" r=".9"/><circle cx="14" cy="9.2" r=".8"/></svg>`],
  ['F · 해 ↔ 달 바뀜', '밝은 화면에서는 해, 어두운 화면에서는 달. 지금 상태를 그대로 보여 줌.', `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`, `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>`],
];
const pill = (svg, dark) => `<div class="pill${dark ? ' dark' : ''}"><span class="btn">${svg}</span></div>`;
document.getElementById('grid').innerHTML = looks.map(([t, n, off, on]) => `<div class="card"><h2>${t}</h2><p>${n}</p><div class="row"><figure>${pill(off, false)}밝은 화면</figure><figure>${pill(on || off, true)}어두운 화면</figure></div></div>`).join('');
</script>
</body></html>
