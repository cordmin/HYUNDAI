              </div>
              ${trip.known ? '' : `<div class="wide-card-arrow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
              </div>`}
            </div>

            ${trip.kind === 'weekend' ? `<div class="bento-wide-card career" onclick="openCareer()">
              <div class="wide-card-text">
                <div class="wide-card-kicker">이번 주말 진로 체험</div>
                <div class="wide-card-title">뉴스 보고 체험 떠나기</div>
                <div class="wide-card-desc">쉬운 기사와 체험관·유적지 루트</div>
              </div>
              <div class="wide-card-arrow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
              </div>
            </div>` : ''}
          </div>
        </div>
      `;
      placeRouteDot();
    }

    function renderDialogueFlow(container) {
      const flow = Journey.flows[currentMode];
      const modeName = currentMode === 'morning' ? '등교' : '하교';
      const data = stage === 'NEXT_DAY' ? Journey.nextDayStep(schoolPlan(), currentRule, DAIT_RULES)
        : stage.startsWith('RULE') ? Journey.ruleStep(stage, currentRule, ruleMissing, DAIT_RULES.extras.rule_missing)
        : (flow[stage] || flow.DONE);

      const subjectStages = ['SUBJECT', 'SUBJECT_MISSING', 'SUBJECT_TODAY'];
      const todayChoices = currentMode === 'morning' && subjectStages.includes(stage) ? subjectChoices() : null;
      currentChoices = todayChoices || data.choices || [];

      speakStage(data.clips || [data.clip]);
      updateDriveScreen(data.title);

      let optionsHtml = '';
      if (currentChoices.length > 0) {
        optionsHtml = `
          <div class="options-row">
            ${currentChoices.map((c, i) => `<button class="choice-chip" onclick="handleAnswer(currentChoices[${i}])">${escapeHtml(c)}</button>`).join('')}
          </div>
        `;
      }

      const buttonLabel = isDialogueDone() ? '마치기' : '다시 듣기';
      const skipHtml = isDialogueDone() ? '' : '<button class="primary-btn secondary" onclick="skipQuestion()">넘기기</button>';

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span style="font-size:17px; font-weight:700; color:var(--muted);">${modeName}</span>
          </div>

          <div class="dialogue-card">
            <div class="card-center">
              <div class="dialogue-orb">
                <div class="voice-visualizer" style="height:26px; margin:0;">
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                  <div class="v-bar" style="background:#fff;"></div>
                </div>
              </div>
              <div class="main-question">${data.title}</div>
              <div id="heardLine" class="heard-bubble"${heard || speechPhase === 'listening' ? '' : ' hidden'}>${escapeHtml(heardLineText())}</div>
            </div>

            ${optionsHtml}
          </div>

          <div class="bottom-bar">
            <button class="primary-btn" onclick="handlePrimaryAction()">
              ${buttonLabel}
            </button>
            ${skipHtml}
          </div>
        </div>
      `;
    }

    function journeyContext() {
      const plan = schoolPlan();
      const memory = readStored(MEMORY_KEY);
      return {
        tier: Journey.tierFor(remainMinutes()),
        driving: isDrivingMode,
        school: !!school,
        hasPe: !!(plan && plan.hasPe),
        rule: currentRule,
        noQuestions: readStored(QUESTIONS_KEY) === false,
        nextDay: !!school && currentTrip().kind === 'weekend',
        etaMinutes: currentTrip().known ? naviRemainMinutes() : demoMinutes,
        subjects: plan && plan.ymd === toYmd(new Date()) ? plan.subjects : [],
        memory: memory && memory.date === toYmd(new Date()) ? memory : {}
      };
    }

    function remainMinutes() {
      const live = naviRemainMinutes();
      return live === null ? demoMinutes : live;
    }

    function startFlow(mode) {
      if (askMicFirst(() => startFlow(mode))) return;
      disarm();
      currentMode = mode;
      heard = '';
      unclearCount = 0;
      listenSince = 0;
      hasArrived = false;
      micBroken = false;
      tripMuted = false;
      currentRule = ruleFor(mode);
      ruleMissing = false;
      const context = journeyContext();
      stage = Journey.start(mode, context);
      pendingIntro = stage === 'NEXT_DAY' ? [] : Journey.intro(mode, context, DAIT_RULES);
      render();
    }

    function goHome() {
      stopCareerMedia();
      stopSpeech();
      currentMode = null;
      stage = '';
      heard = '';
      hasArrived = false;
      render();
      updateDriveScreen();
    }

    function setStage(nextStage) {
      stage = nextStage;
      unclearCount = 0;
      listenSince = 0;
      render();
    }

    function handleAnswer(ans, shown = ans) {
      if (isDialogueDone()) return;
      heard = shown;
      const result = Journey.next(currentMode, stage, ans, journeyContext());
      if (result.remember) rememberMorning(result.remember);
      ruleMissing = !!result.missing;
      setStage(result.stage);
    }

    function isDialogueDone() {
      return Journey.isDone(stage);
    }

    // 질문을 건너뛴다. 답을 지어내지 않고 다음 단계로만 넘어간다.
    function skipQuestion() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      heard = '';
      setStage(Journey.skip(currentMode, stage, journeyContext()));
    }

    // 아침에 고른 과목과 쉬기 여부를 기기에 남겨 하교 때 다시 꺼낸다 (기획안 ③⑤)
    function rememberMorning(patch) {
      const today = toYmd(new Date());
      const memory = readStored(MEMORY_KEY);
      const base = memory && memory.date === today ? memory : { date: today };
      writeStored(MEMORY_KEY, { ...base, ...patch });
    }

    function handlePrimaryAction() {
      if (isDialogueDone()) {
        goHome();
      } else {
        render();
      }
    }

    // ========================================================
    // 출발하면 들려주기
    // 시동만으로 말을 시작하지 않는다. 주차 중에 보호자가 고른 여정만 출발할 때 시작한다.
    // ========================================================
    function toggleArm(mode) {
      if (armed) { disarm(); render(); return; }
      if (askMicFirst(() => toggleArm(mode))) return;
      armed = { mode, timer: setTimeout(() => { disarm(); refreshHomeIfIdle(); }, ARM_MS) };
      render();
    }

    function disarm() {
      if (armed) clearTimeout(armed.timer);
      armed = null;
    }

    // 여정 동안에는 내비가 앱을 덮어도 말하고 들을 수 있게 앱을 유지한다.
    // 달리는 중에 내려놓으면 내비 뒤에서 다시 올릴 수 없으므로 주차하거나 대화를 닫을 때까지 둔다.
    function syncJourney() {
      const inDialogue = !!currentMode && !isParkedScreen();
      const finishedParked = isDialogueDone() && speechPhase === 'idle' && !isDrivingMode;
      const active = !!armed || (inDialogue && !finishedParked);
      if (active === journeyActive) return;
      journeyActive = active;
      if (window.AndroidBridge) window.AndroidBridge.setJourneyActive(active);
    }

    // ========================================================
    // 말하기와 듣기
    // 앱에서는 VoiceSession이, 브라우저 미리보기에서는 audio 태그가 소리를 낸다.
    // ========================================================
    function micState() {
      return window.AndroidBridge ? window.AndroidBridge.micState() : 'none';
    }

    // 처음 대화를 시작할 때 주차 중에만 마이크 허락을 묻는다.
    function askMicFirst(action) {
      if (micAsked || isDrivingMode || micState() !== 'ask' || readStored(VOICE_KEY) === false) return false;
      micAsked = true;
      pendingStart = action;
      window.AndroidBridge.requestMic();
      return true;
    }

    window.onMicAnswered = function() {
      const action = pendingStart;
      pendingStart = null;
      if (action) action();
    };

    function canListen() {
      return !micBroken && micState() === 'ready' && readStored(VOICE_KEY) !== false;
    }

    function speakStage(clips) {
      listenSince = 0;
      const intro = pendingIntro;
      pendingIntro = [];
      if (tripMuted) stopSpeech();
      else speak([...intro, ...clips].filter(Boolean), listenNow());
    }

    function listenNow() {
      return canListen() ? Journey.listenSpec(currentMode, stage, currentChoices, currentRule) : '';
    }

    function speak(clips, listen) {
      clearTimeout(noMicTimer);
      speechPhase = 'speaking';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) {
        window.AndroidBridge.speak(JSON.stringify(clips), listen, speechSeq);
        return;
      }
      previewQueue = clips.slice();
      playPreviewClip();
    }

    // 브라우저 미리보기: 음원을 차례로 튼다. temp/로 시작하는 것은 임시 음성이다.
    function playPreviewClip() {
      const clip = previewQueue.shift();
      if (!clip) {
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
        return;
      }
      const player = document.getElementById('audioPlayer');
      player.src = clip.includes('/') ? `voices/${clip}.wav` : `voices/${voice}/${clip}.wav`;
      player.play().catch(e => {
        console.log('Audio error:', e);
        window.onSpeechEvent(JSON.stringify({ event: 'ended', seq: speechSeq }));
      });
    }

    function stopSpeech() {
      clearTimeout(noMicTimer);
      speechPhase = 'idle';
      speechPaused = false;
      speechSeq++;
      if (window.AndroidBridge) window.AndroidBridge.stopSpeech();
      else document.getElementById('audioPlayer').pause();
    }

    function heardLineText() {
      if (speechPhase === 'listening') return '듣고 있어요';
      return heard ? `“${heard}”` : '';
    }

    function showHeardLine() {
      const line = document.getElementById('heardLine');
      if (line) {
        line.textContent = heardLineText();
        line.hidden = !line.textContent;
      }
      updateDriveScreen();
    }

    window.onSpeechEvent = function(jsonText) {
      const info = JSON.parse(jsonText);
      if (info.seq !== speechSeq) return; // 지난 말에 대한 늦은 알림
      if (info.event === 'paused' || info.event === 'resumed') {
        speechPaused = info.event === 'paused';
        return;
      }
      speechPhase = info.event === 'listening' ? 'listening' : 'idle';
      showHeardLine();
      if (info.event === 'heard') onHeard(info.text, info.reference);
      else if (info.event === 'silence') onUnclear();
      else if (info.event === 'listening') {
        listenSince = listenSince || performance.now();
        applyNaviEta();
      }
      else {
        if (info.event === 'micFailed') micBroken = true;
        applyNaviEta();
        syncJourney();
        if (hasArrived) closeAfterArrival();
        else if (info.event === 'stopped') endWithoutSpeaking();
        else advanceWithoutMic();
      }
    };

    // 음악이나 통화가 소리를 돌려주지 않으면 끼어들지 않고 대화를 마친다.
    function endWithoutSpeaking() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      tripMuted = true;
      setStage('QUIET_END');
    }

    // 마이크를 쓸 수 없는 차에서는 달리는 동안 답을 받을 길이 없다.
    // 가족이 이야기할 틈을 둔 뒤 다음 단계로 넘어가, 질문 하나에서 멈춰 있지 않게 한다.
    function advanceWithoutMic() {
      if (!isDrivingMode || canListen() || !currentMode || isParkedScreen() || isDialogueDone() || stage === 'PARENT_BRIDGE') return;
      clearTimeout(noMicTimer);
      noMicTimer = setTimeout(() => {
        if (speechPhase === 'idle' && isDrivingMode) skipQuestion();
      }, NO_MIC_WAIT_MS);
    }

    function onHeard(text, reference) {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      const result = Journey.interpret(stage, text, reference, currentChoices, currentRule);
      if (result.kind === 'answer') handleAnswer(result.answer, result.heard);
      else if (result.kind === 'quiet') {
        rememberMorning({ rest: true });
        setStage('REST');
      } else if (result.kind === 'sad') setStage('REST_SOFT');
      else if (result.kind === 'repeat') render();
      else if (performance.now() - listenSince < LISTEN_PATIENCE_MS) speak([], listenNow()); // 잡음일 수 있으니 재촉하지 않고 더 듣는다
      else onUnclear();
    }

    // 한 번 더 물어보고, 그래도 답이 없으면 재촉하지 않고 멈춘다 (기획안 ⑤)
    function onUnclear() {
      if (!currentMode || isParkedScreen() || isDialogueDone()) return;
      unclearCount++;
      listenSince = 0;
      if (unclearCount >= 2) setStage('QUIET_END');
      else speak(['error_repeat'], listenNow());
    }

    // 도착하면 진행 중이던 질문을 마치고 인사한 뒤 첫 화면으로 돌아간다.
    function finishOnArrival() {
      if (!currentMode || isParkedScreen()) return;
      hasArrived = true;
      if (!isDialogueDone()) setStage('DONE');
      if (speechPhase === 'idle') closeAfterArrival();
    }

    function closeAfterArrival() {
      setTimeout(() => { if (hasArrived) goHome(); }, ARRIVAL_CLOSE_MS);
    }

    // ========================================================
    // 학교 정보 (나이스 교육정보 개방 포털)
    // ========================================================
    const NEIS_URL = 'https://relay-khaki-omega.vercel.app/neis/';
    const SCHOOL_KEY = 'dait.school';
    const DAYS_KEY = 'dait.schoolDays';
    const DAYS_AHEAD = 7;
    const EVENTS_KEY = 'dait.schoolEvents';
    const EVENT_DAYS_AHEAD = 45;
    const GRADE_FIELDS = ['ONE', 'TW', 'THREE', 'FR', 'FIV', 'SIX'];
    const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    let school = readStored(SCHOOL_KEY);
    let schoolDays = readStored(DAYS_KEY) || {};
    let schoolEvents = readStored(EVENTS_KEY) || {};
    let settings = {};
    let neisSeq = 0;
    let homeStale = false;
    const neisWaiting = {};

    function readStored(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }

    function writeStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.log('Storage error:', e); }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    }

    function toYmd(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}${month}${day}`;
    }

    function fromYmd(ymd) {
      return new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)) - 1, Number(ymd.slice(6, 8)));
    }

    function upcomingDates() {
      const start = new Date();
      return Array.from({ length: DAYS_AHEAD + 1 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }

    function dayLabel(ymd) {
      const dates = upcomingDates();
      if (ymd === toYmd(dates[0])) return '오늘';
      if (ymd === toYmd(dates[1])) return '내일';
      return WEEKDAYS[fromYmd(ymd).getDay()];
    }

    // 인증키는 중계 서버에만 있다. 앱에서는 Kotlin이 대신 받고, 브라우저 미리보기는 중계 서버에 직접 묻는다.
    window.onNeisResult = function(requestId, body) {
      const resolve = neisWaiting[requestId];
      delete neisWaiting[requestId];
      if (resolve) resolve(body);
    };

    function neisBody(service, query) {
      if (window.AndroidBridge) {
        return new Promise(resolve => {
          const requestId = ++neisSeq;
          neisWaiting[requestId] = resolve;
          window.AndroidBridge.neisGet(requestId, service, query);
        });
      }
      return fetch(`${NEIS_URL}${service}?${query}`).then(response => response.text());
    }

    async function neisRows(service, params) {
      const query = new URLSearchParams({ Type: 'json', pIndex: '1', pSize: '100', ...params }).toString();
      const data = JSON.parse(await neisBody(service, query));
      if (data.RESULT) {
        if (data.RESULT.CODE === 'INFO-200') return [];
        throw new Error(data.RESULT.CODE);
      }
      return data[service][1].row;
    }

    function mainDish(dishes) {
      const items = dishes.split(/<br\s*\/?>/i)
        .map(item => item.replace(/\([^)]*\)/g, '').replace(/[*]/g, '').replace(/[a-zA-Z]+\s*$/, '').trim())
        .filter(Boolean);
      return items.find(item => !/(밥|국|탕|찌개|김치|깍두기|우유|주스)$/.test(item)) || items[0] || '';
    }

    // 시간표 창구는 학교급마다 다르다.
    const SCHOOL_KINDS = {
      '초등학교': { service: 'elsTimetable', grades: [1, 2, 3, 4, 5, 6] },
      '중학교': { service: 'misTimetable', grades: [1, 2, 3] },
      '고등학교': { service: 'hisTimetable', grades: [1, 2, 3] }
    };

    function timetableService(target) {
      return (SCHOOL_KINDS[target.kind] || SCHOOL_KINDS['초등학교']).service;
    }

    // 학사일정에서 우리 학년 일정만 날짜별로 모은다. 토요휴업일은 뺀다.
    function eventsByDay(rows, grade) {
      const days = {};
      rows.forEach(row => {
        if (row.EVENT_NM.includes('토요휴업')) return;
        const marks = GRADE_FIELDS.map(field => row[`${field}_GRADE_EVENT_YN`]);
        if (marks.includes('Y') && marks[Number(grade) - 1] !== 'Y') return;
        (days[row.AA_YMD] = days[row.AA_YMD] || []).push({ name: row.EVENT_NM, off: row.SBTR_DD_SC_NM !== '해당없음' });
      });
      return days;
    }

    async function refreshSchoolEvents(target) {
      const today = toYmd(new Date());
      try {
        const rows = await neisRows('SchoolSchedule', {
          ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code, AA_FROM_YMD: today, AA_TO_YMD: toYmd(new Date(fromYmd(today).getTime() + EVENT_DAYS_AHEAD * 86400000))
        });
        if (school !== target) return;
        schoolEvents = eventsByDay(rows, target.grade);
        writeStored(EVENTS_KEY, schoolEvents);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School events error:', e);
      }
    }

    // 시간표는 하루씩 받는다.
    async function refreshSchoolDays() {
      if (!school) return;
      const target = school;
      refreshSchoolEvents(target);
      const dates = upcomingDates();
      const ymds = dates.map(toYmd);
      const base = { ATPT_OFCDC_SC_CODE: target.office, SD_SCHUL_CODE: target.code };
      try {
        const schoolDates = dates.filter(date => date.getDay() !== 0 && date.getDay() !== 6);
        const [timetables, meals] = await Promise.all([
          Promise.all(schoolDates.map(date => neisRows(timetableService(target), {
            ...base, GRADE: target.grade, CLASS_NM: target.classNm, ALL_TI_YMD: toYmd(date)
          }))),
          neisRows('mealServiceDietInfo', {
            ...base, MMEAL_SC_CODE: '2', MLSV_FROM_YMD: ymds[0], MLSV_TO_YMD: ymds[ymds.length - 1]
          })
        ]);
        const days = {};
        ymds.forEach(ymd => { days[ymd] = { subjects: [], meal: '' }; });
        timetables.flat().sort((a, b) => Number(a.PERIO) - Number(b.PERIO)).forEach(row => {
          const day = days[row.ALL_TI_YMD];
          if (day && !day.subjects.includes(row.ITRT_CNTNT)) day.subjects.push(row.ITRT_CNTNT);
        });
        meals.forEach(row => {
          if (days[row.MLSV_YMD]) days[row.MLSV_YMD].meal = mainDish(row.DDISH_NM);
        });
        if (school !== target) return;
        schoolDays = days;
        writeStored(DAYS_KEY, days);
        if (isIntroPlaying) homeStale = true;
        else if (!currentMode) render();
      } catch (e) {
        console.log('School data error:', e);
      }
    }

    // 시험 날은 시간표가 없을 수 있으므로 점심이나 학사일정이 있어도 수업일로 본다.
    function isClassDay(ymd) {
      const day = schoolDays[ymd];
      if (day && (day.subjects.length > 0 || day.meal)) return true;
      return !!schoolEvents[ymd] && Journey.isSchoolDay(ymd, schoolEvents);
    }

    function schoolPlan() {
      const today = toYmd(new Date());
      const ymd = Object.keys(schoolDays).sort()
        .find(key => key >= today && isClassDay(key));
      if (!school || !ymd) return null;
      const day = schoolDays[ymd];
      return { ...day, ymd, weekday: fromYmd(ymd).getDay(), label: dayLabel(ymd), hasPe: day.subjects.includes('체육') };
    }

    function schoolLevel() {
      return school ? school.kind.charAt(0) : '초';
    }

    // 지금 여정에 맞는 교사 규칙. 하교는 오늘, 등교는 다가오는 수업일을 기준으로 본다.
    function ruleFor(mode) {
      if (!school) return null;
      const plan = schoolPlan();
      const ymd = mode === 'afternoon' || !plan ? toYmd(new Date()) : plan.ymd;
      return Journey.pickRule(DAIT_RULES.rules, { mode, level: schoolLevel(), ymd, events: schoolEvents });
    }

    function subjectChoices() {
      const plan = schoolPlan();
      if (!plan || plan.subjects.length === 0) return null;
      const preferred = ['체육', '과학', '국어'].filter(subject => plan.subjects.includes(subject));
      return [...new Set([...preferred, ...plan.subjects])].slice(0, 3);
    }

    function chipClass(subject) {
      if (subject === '체육') return ' pe';
      if (/미술|음악|체육/.test(subject)) return ' art';
      if (/과학|수학/.test(subject)) return ' sci';
      return '';
    }

    // 여정 그림. 출발점에서 목적지까지 한 획, 그 위에 차 위치. 남은 시간이 없으면 선만 그린다.
    function routeSvg(trip) {
      const total = trip.kind === 'school' || trip.kind === 'home' ? 20 : null; // 기준 20분 여정
      const remain = trip.minutes;
      const progress = total && remain !== null ? Math.min(0.92, Math.max(0.08, 1 - remain / total)) : null;
      const W = 420, H = 140;
      const path = `M 24 ${H - 30} C 120 ${H - 30}, 170 34, 250 34 S ${W - 40} ${H - 70}, ${W - 24} 44`;
      const figure = trip.figure || '';
      const unit = trip.figureUnit || '';
      const endLabel = trip.kind === 'school' ? '학교' : trip.kind === 'home' ? '집' : (trip.kind === 'weekend' ? '다음 수업일' : (trip.mode === 'afternoon' ? '집' : '학교'));
      const startLabel = trip.kind === 'school' ? '집' : trip.kind === 'home' ? '학교' : '지금';
      let dot = '';
      if (progress !== null) {
        dot = `<path class="route-done" d="${path}" pathLength="1" stroke-dasharray="${progress} 1"/>
          <g id="routeDot"><circle class="route-dot-halo" r="14"/><circle class="route-dot" r="6"/></g>`;
      }
      return `<svg class="hero-route" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="route-path" d="${path}"/>
        ${dot}
        <circle class="route-dot" cx="24" cy="${H - 30}" r="4"/>
        <text class="route-label" x="24" y="${H - 8}" text-anchor="start">${escapeHtml(startLabel)}</text>
        <circle class="route-end-fill" cx="${W - 24}" cy="44" r="9"/>
        <circle class="route-end" cx="${W - 24}" cy="44" r="9"/>
        <text class="route-label" x="${W - 24}" y="22" text-anchor="end">${escapeHtml(endLabel)}</text>
        <text class="route-figure" x="${W / 2}" y="${H - 14}" text-anchor="middle">${escapeHtml(figure)}<tspan class="route-unit" dx="4">${escapeHtml(unit)}</tspan></text>
      </svg>`;
    }

    // 그린 뒤 차 위치 점을 선 위로 옮긴다 (pathLength 비율 → 실제 좌표)
    function placeRouteDot() {
      const svg = document.querySelector('.hero-route');
      const dot = svg && svg.querySelector('#routeDot');
      const done = svg && svg.querySelector('.route-done');
      if (!svg || !dot || !done) return;
      const ratio = parseFloat(done.getAttribute('stroke-dasharray'));
      const len = done.getTotalLength();
      const pt = done.getPointAtLength(len * ratio);
      dot.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    }

    // 지금 여정을 한 곳에서 정한다. 첫 화면·칸·대화 시작이 모두 이것을 따른다.
    // 우선순위: 내비 목적지(학교/집) → 수업일의 시간대(오전 등교·오후 하교) → 주말·방학은 다음 수업일 준비
    function currentTrip() {
      const now = new Date();
      const minutes = naviRemainMinutes();
      const mins = minutes === null ? null : Math.max(1, Math.round(minutes));
      if (naviInfo && naviInfo.name) {
        const fig = { figure: mins === null ? '' : String(mins), figureUnit: mins === null ? '' : '분' };
        if (school && placeMatches(naviInfo, school)) return { mode: 'morning', kind: 'school', known: true, where: `${school.name}까지`, minutes: mins, when: '', ...fig };
        if (homePlace && placeMatches(naviInfo, homePlace)) return { mode: 'afternoon', kind: 'home', known: true, where: '집까지', minutes: mins, when: '', ...fig };
      }
      // 여기부터는 목적지가 학교도 집도 아니거나 없다. 남은 시간은 쓰지 않는다
      const unknownMins = null;
      const todayYmd = toYmd(now);
      const todayHasClass = !weekendDemo && isClassDay(todayYmd);
      const isWeekend = weekendDemo || now.getDay() === 0 || now.getDay() === 6;
      if (school && Object.keys(schoolDays).length && !todayHasClass) {
        const plan = schoolPlan();
        const label = plan ? plan.label : '다음 수업일';
        return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: `${label} 준비`, figure: label.replace('요일', ''), figureUnit: label.endsWith('요일') ? '요일' : '' };
      }
      if (!school && isWeekend) return { mode: 'morning', kind: 'weekend', known: false, where: '', minutes: unknownMins, when: '다음 수업일 준비', figure: '월', figureUnit: '요일' };
      const afternoon = now.getHours() >= 12;
      const hhmm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      return { mode: afternoon ? 'afternoon' : 'morning', kind: afternoon ? 'afternoon' : 'morning', known: false, where: '', minutes: unknownMins, when: afternoon ? '오늘 오후' : '오늘 아침', figure: hhmm, figureUnit: '' };
    }

    // 교사 규칙이 있는 날은 첫 화면의 말도 규칙을 따른다.
    function homeInfo(trip) {
      const info = plainHomeInfo(trip);
      const rule = ruleFor(trip.mode);
      if (!rule) return info;
      const plan = schoolPlan();
      const upcoming = trip.kind === 'weekend' && plan ? `${plan.label} ${rule.eventName}` : '';
      return {
        ...info,
        title: upcoming || rule.title,
        desc: rule.desc,
        ...(rule.prep ? { prepLabel: '준비물', prep: rule.prep, prepSub: '학교 안내 확인' } : {})
      };
    }

    function plainHomeInfo(trip) {
      const plan = school ? schoolPlan() : null;
      const dayWord = plan ? plan.label : '오늘';
      const memory = readStored(MEMORY_KEY);
      const morningSubject = memory && memory.date === toYmd(new Date()) ? memory.subject : null;
      const prepLine = !school ? { prep: '등록 필요', prepSub: '' }
        : !plan ? { prep: '확인 필요', prepSub: '' }
        : plan.hasPe ? { prep: '체육복', prepSub: '시간표 기준' }
        : { prep: '학교 안내 확인', prepSub: plan.subjects.slice(0, 2).join(' · ') };
      const mealLine = !school ? { meal: '등록 필요', mealSub: '' } : { meal: plan && plan.meal ? plan.meal : '확인 필요', mealSub: '' };

      const subjects = plan ? plan.subjects : [];
      // 오늘의 질문: 시간표에서 고른다. 기획안 교사 규칙표의 과목별 질문
      const question = Journey.pickQuestion(DAIT_RULES.rules, plan ? plan.subjects : [], schoolLevel());
      const otherMorning = trip.known
        ? { otherKicker: '하교 때 다시 물을 질문', otherChips: null, otherTitle: question, otherDesc: '아침에 답하면 집에 갈 때 이어서 물어요' }
        : { otherKicker: '등교', otherChips: subjects.slice(0, 6), otherTitle: `${dayWord} 시간표`, otherDesc: subjects.length ? '' : '학교를 설정하면 보여 줘요' };
      const otherAfternoon = trip.known
        ? { otherKicker: '오늘의 질문', otherChips: subjects.slice(0, 6), otherTitle: question, otherDesc: '대답은 아이가 해요. 부모는 듣다가 끼어들면 돼요' }
        : { otherKicker: trip.kind === 'weekend' ? `${dayWord} 시간표` : '하교', otherChips: trip.kind === 'weekend' ? subjects.slice(0, 6) : null, otherTitle: trip.kind === 'weekend' ? '하교 대화는 집에 갈 때' : '오늘 이야기 들려주기', otherDesc: trip.kind === 'weekend' ? '아침 질문을 기억했다가 이어서 물어요' : '기억나는 장면 하나면 돼요' };

      if (!school) {
        return {
          title: '학교를 등록해 주세요',
          desc: '시간표와 점심으로 이야기를 시작해요',
          prepLabel: '준비물', ...prepLine,
          mealLabel: '점심', ...mealLine,
          ...(trip.mode === 'afternoon' ? otherMorning : otherAfternoon)
        };
      }
      if (trip.mode === 'afternoon') {
        return {
          title: morningSubject ? `아침에 고른 ${morningSubject}, 어땠나요?` : '오늘은 어땠나요?',
          desc: '기억나는 장면 하나만 들려줘요',
          prepLabel: '아침에 고른 수업', prep: morningSubject || '없음', prepSub: morningSubject ? '하교 대화에서 다시 물어요' : '등교 대화에서 고르면 여기 남아요',
          mealLabel: `${dayWord === '오늘' ? '내일' : dayWord} 점심`, ...mealLine,
          ...otherMorning
        };
      }
      if (trip.kind === 'weekend') {
        return {
          title: `${dayWord} 준비 됐나요?`,
          desc: plan ? (plan.hasPe ? '체육이 있어요. 체육복을 미리 챙겨요' : `${plan.subjects.slice(0, 3).join(' · ')}`) : '학교를 설정하면 시간표를 보여 줘요',
          prepLabel: `${dayWord} 준비물`, ...prepLine,
          mealLabel: `${dayWord} 점심`, ...mealLine,
          ...otherAfternoon
        };
      }
      return {
        title: trip.known ? (plan && plan.hasPe ? '체육복 챙겼나요?' : '오늘 준비 됐나요?') : `${dayWord} 준비 됐나요?`,
        desc: !school ? '체육복을 함께 확인해요' : !plan ? '학교 정보를 확인하지 못했어요' : (plan.hasPe ? '체육복을 함께 확인해요' : (plan.subjects.slice(0, 3).join(' · ') || '학교 안내를 확인해요')),
        prepLabel: '준비물', ...prepLine,
        mealLabel: `${dayWord} 점심`, ...mealLine,
        ...otherAfternoon
      };
    }

    // ========================================================
    // 가 볼 만한 곳 (공공데이터포털 한국관광공사 국문 관광정보)
    // 브라우저 미리보기에서는 예시를 보여 준다.
    // ========================================================
    const PLACE_TOPICS = ['과학관', '박물관', '유적지', '체험관'];
    const PLACE_LIMIT = 8;
    const PLACE_TYPES = ['12', '14', '28']; // 관광지, 문화시설, 레포츠. 숙박·식당·쇼핑은 뺀다.
    const REGIONS = [
      ['서울', '11', '서울'], ['부산', '26', '부산'], ['대구', '27', '대구'], ['인천', '28', '인천'],
      ['광주', '29', '광주'], ['대전', '30', '대전'], ['울산', '31', '울산'], ['세종', '36', '세종'],
      ['경기', '41', '경기'], ['강원', '51', '강원'], ['충북', '43', '충북'], ['충청북', '43', '충북'],
      ['충남', '44', '충남'], ['충청남', '44', '충남'], ['전북', '52', '전북'], ['전라북', '52', '전북'],
      ['전남', '46', '전남'], ['전라남', '46', '전남'], ['경북', '47', '경북'], ['경상북', '47', '경북'],
      ['경남', '48', '경남'], ['경상남', '48', '경남'], ['제주', '50', '제주']
    ];
    const SAMPLE_PLACES = {
      '과학관': [['국립과천과학관', '경기도 과천시'], ['국립중앙과학관', '대전광역시 유성구']],
      '박물관': [['국립중앙박물관', '서울특별시 용산구'], ['국립경주박물관', '경상북도 경주시']],
      '유적지': [['경주 불국사', '경상북도 경주시'], ['수원 화성', '경기도 수원시']],
      '체험관': [['한국잡월드', '경기도 성남시'], ['국립어린이과학관', '서울특별시 종로구']]
    };

    let places = {};
    let tourSeq = 0;
    const tourWaiting = {};

    window.onTourResult = function(requestId, body) {
      const resolve = tourWaiting[requestId];
      delete tourWaiting[requestId];
      if (resolve) resolve(body);
    };

    function schoolRegion() {
      const address = school ? school.address : '';
      const found = REGIONS.find(row => address.startsWith(row[0]));
      return found ? { code: found[1], name: found[2] } : null;
    }

    function tourBody(query) {
      return new Promise(resolve => {
        const requestId = ++tourSeq;
        tourWaiting[requestId] = resolve;
        window.AndroidBridge.tourGet(requestId, 'searchKeyword2', query);
      });
    }

    function tourRows(data) {
      const header = data.response.header;
      if (header.resultCode !== '0000') throw new Error(header.resultCode);
      const items = data.response.body.items;
      const rows = items && items.item ? [].concat(items.item) : [];
      return rows
        .filter(row => PLACE_TYPES.includes(String(row.contenttypeid)))
        .slice(0, PLACE_LIMIT)
        .map(row => ({ name: row.title, address: row.addr1 || '' }));
    }

    async function searchPlaces(topic) {
      places = { topic, rows: [], sample: false, message: '찾는 중이에요' };
      render();
      if (!window.AndroidBridge) {
        places = { topic, rows: SAMPLE_PLACES[topic].map(row => ({ name: row[0], address: row[1] })), sample: true, message: '' };
        render();
        return;
      }
      const region = schoolRegion();
      const query = new URLSearchParams({
        numOfRows: '30', pageNo: '1', MobileOS: 'AND', MobileApp: 'DAIT', _type: 'json', arrange: 'A', keyword: topic,
        ...(region ? { lDongRegnCd: region.code } : {})
      }).toString();
      let next;
      try {
        const rows = tourRows(JSON.parse(await tourBody(query)));
        next = { topic, rows, sample: false, message: rows.length > 0 ? '' : '찾는 곳이 없어요' };
      } catch (e) {
        next = { topic, rows: [], sample: false, message: '지금은 찾을 수 없어요' };
      }
      // 기다리는 사이 다른 주제를 골랐거나 화면을 나갔으면 이 결과는 버린다.
      if (currentMode !== 'places' || places.topic !== topic) return;
      places = next;
      render();
    }

    function openPlaces(topic = PLACE_TOPICS[0]) {
      stopCareerMedia();
      stopSpeech();
      currentMode = 'places';
      searchPlaces(topic);
    }

    function renderPlaces(container) {
      const region = schoolRegion();
      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
          </div>
          <div class="dialogue-card">
            <div class="settings-center">
              <div class="main-question">${region ? `${escapeHtml(region.name)}에서 ` : ''}가 볼 만한 곳</div>
              <div class="settings-list">
                ${PLACE_TOPICS.map(topic => `<button class="choice-chip" onclick="searchPlaces('${topic}')"${topic === places.topic ? ' aria-pressed="true"' : ''}>${topic}</button>`).join('')}
              </div>
              ${places.message ? `<div class="settings-message">${escapeHtml(places.message)}</div>` : ''}
              <div class="place-list">
                ${places.rows.map(row => `<div class="place-row"><div class="place-name">${escapeHtml(row.name)}</div><div class="place-address">${escapeHtml(row.address)}</div></div>`).join('')}
              </div>
              ${places.rows.length > 0 ? `<div class="place-source">${places.sample ? '예시' : '자료: 한국관광공사'}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // ========================================================
    // 주말 진로 체험: 기사 목록 · 기사 상세(글/듣기/짧은 영상) · 여행 루트
    // ========================================================
    const SCENE_MS = 5200;

    function showCareerToast(message) {
      const toast = document.getElementById('careerToast');
      toast.textContent = message;
      toast.style.display = 'block';
      clearTimeout(showCareerToast.timer);
      showCareerToast.timer = setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    function currentNews() {
      return careerNews.find(n => n.id === careerNewsId);
    }

    function catStyle(id) {
      const c = careerCategories[id];
      return `--cat:${c.color}; --cat-soft:${c.soft};`;
    }

    function formatMinutes(min) {
      const h = Math.floor(min / 60), m = min % 60;
      if (!h) return `${m}분`;
      return m ? `${h}시간 ${m}분` : `${h}시간`;
    }

    function renderCareer(container) {
      if (careerView === 'detail') renderCareerDetail(container);
      else if (careerView === 'route') renderCareerRoute(container);
      else renderCareerList(container);
    }

    function renderCareerList(container) {
      container.innerHTML = `
        <div class="career-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            <span style="font-size:15px; font-weight:700; color:var(--muted);">주말 진로 체험</span>
          </div>
          <div class="career-head">
            <div class="career-title">이번 주 진로 뉴스</div>
            <span class="data-badge">빅카인즈 기사 · 초중등 눈높이 요약 · 예시 데이터</span>
          </div>
          <div class="news-grid">
            ${careerNews.map(n => {
              const c = careerCategories[n.id];
              return `
                <div class="news-card" style="${catStyle(n.id)}" onclick="openCareerNews('${n.id}')">
                  <div class="news-card-icon"><svg width="40" height="40" viewBox="0 0 64 64">${c.icon.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg></div>
                  <div class="news-card-body">
                    <div><span class="cat-tag">${c.label}</span></div>
                    <div class="news-card-title">${n.title}</div>
                    <div class="news-card-lead">${n.lead}</div>
                    <div class="news-card-foot">글 · 듣기 · 짧은 영상 →</div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCareerDetail(container) {
      const n = currentNews();
      const c = careerCategories[n.id];
      const tabs = [['read', '글로 읽기'], ['listen', '듣기'], ['video', '짧은 영상']];

      let body = '';
      if (mediaTab === 'read') {
        body = `
          <div><span class="cat-tag">${c.label}</span></div>
          <div class="news-headline">${n.title}</div>
          <ul class="easy-points">${n.points.map(p => `<li>${p}</li>`).join('')}</ul>`;
      } else if (mediaTab === 'listen') {
        body = `
          <div class="listen-head">
            <div class="dialogue-orb">
              <div class="voice-visualizer" style="height:20px; margin:0;">
                ${'<div class="v-bar" style="background:#fff;"></div>'.repeat(5)}
              </div>
            </div>
            <div>
              <div class="listen-label">니카가 읽어 줘요</div>
              <div style="font-size:19px; font-weight:800;">${n.title}</div>
            </div>
          </div>
          <ul class="easy-points" id="listenLines">${n.points.map(p => `<li>${p}</li>`).join('')}</ul>
          <button class="back-btn media-replay" style="margin-top:14px;" onclick="startListening()">다시 듣기</button>`;
      } else {
        body = `<div class="video-stage" id="videoStage" style="--scene-ms:${SCENE_MS}ms;"></div>`;
      }

      container.innerHTML = `
        <div class="career-wrap" style="${catStyle(n.id)}">
          <div class="dialogue-top">
            <button class="back-btn" onclick="showCareerList()">기사 목록</button>
            <span style="font-size:15px; font-weight:700; color:var(--muted);">주말 진로 체험</span>
          </div>
          <div class="news-detail">
            <div class="news-media">
              <div class="media-tabs">
                ${tabs.map(([id, label]) => `<button class="media-tab ${mediaTab === id ? 'active' : ''}" onclick="setMediaTab('${id}')">${label}</button>`).join('')}
              </div>
              <div class="media-body">${body}</div>
            </div>
            <div class="news-side">
              <div class="side-block">
                <div class="side-label">생각해 볼 질문</div>
                <div class="side-question">${n.question}</div>
              </div>
              <div class="side-block">
                <div class="side-label">이런 직업과 이어져요</div>
                <div class="job-chips">${n.jobs.map(j => `<span class="job-chip">${j}</span>`).join('')}</div>
              </div>
              <div class="side-actions">
                <button class="wide-btn" onclick="openOriginalArticle()">원문 기사 보기</button>
                <button class="wide-btn primary" onclick="showCareerRoute()">관련 체험 여행 루트</button>
              </div>
            </div>
          </div>
        </div>
      `;

      if (mediaTab === 'listen') startListening();
      if (mediaTab === 'video') startVideo();
    }

    // 루트에 보일 장소 목록. 학교 지역 자료가 있으면 그것을, 없으면 서울 예시를 쓴다.
    function careerRouteStops() {
      if (careerRoute.status === 'ready') return careerRoute.stops;
      return careerRoutes[careerNewsId].stops;
    }

    function renderCareerRoute(container) {
      const n = currentNews();
      const c = careerCategories[n.id];
      const local = careerRoute.status === 'ready';
      const loading = careerRoute.status === 'loading';
      const regionName = careerRoute.region ? careerRoute.region.name : '';
      const stops = careerRouteStops();
      const stayTotal = stops.reduce((sum, s) => sum + s.stay, 0);
      const driveTotal = local ? null : stops.reduce((sum, s) => sum + s.drive, 0);

      const stopsHtml = loading
        ? `<div class="route-wait">${escapeHtml(regionName)} 장소를 찾는 중이에요</div>`
        : stops.map((s, i) => `
        <div class="route-leg">${local ? '다음 장소' : `이동 약 ${formatMinutes(s.drive)}`}</div>
        <div class="route-stop">
          <div class="stop-num">${i + 1}</div>
          <div class="stop-body">
            <div class="stop-top">
              <span class="stop-name">${escapeHtml(s.name)}</span>
              <span class="stop-type t-${s.type}">${stopTypeLabels[s.type]}</span>
            </div>
            <div class="stop-meta">${escapeHtml(s.region)} · 머무는 시간 약 ${formatMinutes(s.stay)}</div>
            <div class="stop-desc">${escapeHtml(s.desc)}</div>
          </div>
        </div>`).join('');

      // 예시 루트를 보여 주는 까닭을 감추지 않는다.
      const notice = local || loading ? ''
        : careerRoute.reason === 'no-school' ? '학교를 등록하면 우리 지역 장소로 바꿔 줘요. 지금은 서울 예시예요.'
        : `${regionName} 장소를 불러오지 못해 서울 예시를 보여 줘요.`;
      const source = local
        ? `장소: 한국관광공사 (${escapeHtml(regionName)}) · 들르는 순서와 이동 시간은 내비에서 정해요`
        : '장소·시간: 서울 출발 기준 예시 데이터';

      container.innerHTML = `
        <div class="career-wrap" style="${catStyle(n.id)}">
          <div class="dialogue-top">
            <button class="back-btn" onclick="openCareerNews('${n.id}')">기사로 돌아가기</button>
            <span style="font-size:15px; font-weight:700; color:var(--muted);">주말 진로 체험</span>
          </div>
          <div class="career-head">
            <div class="career-title">${local || loading ? `${escapeHtml(regionName)} ` : ''}${c.label} 체험 여행 루트</div>
            <span class="cat-tag">${local || loading ? '우리 지역' : '예시 루트'}</span>
          </div>
          <div class="route-layout">
            <div class="route-list">
              <div class="route-start"><div class="stop-num">집</div>${local || loading ? '출발' : '출발 (서울 기준)'}</div>
              ${stopsHtml}
            </div>
            <div class="news-side">
              <div class="side-block">
                <div class="route-stats">
                  <div class="route-stat"><b>${loading ? '-' : `${stops.length}곳`}</b><span>방문</span></div>
                  <div class="route-stat"><b>${loading ? '-' : formatMinutes(stayTotal)}</b><span>체험</span></div>
                  <div class="route-stat"><b>${driveTotal === null ? '내비' : formatMinutes(driveTotal)}</b><span>이동</span></div>
                </div>
              </div>
              ${notice ? `<div class="route-notice">${escapeHtml(notice)}</div>` : ''}
              <div class="side-block">
                <div class="side-label">이 루트를 추천하는 이유</div>
                <div class="route-why">${careerRoutes[n.id].why}</div>
              </div>
              <div class="source-note">${source}</div>
              <div class="side-actions">
                <button class="wide-btn" onclick="openPlaces(careerPlaceTopics[careerNewsId])">근처에서 더 찾기</button>
                <button class="wide-btn primary" onclick="sendRouteToNavi()">차량 내비로 보내기</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openCareer() {
      stopSpeech();
      currentMode = 'career';
      careerView = 'list';
      careerNewsId = null;
      render();
    }

    function openCareerNews(id) {
      stopCareerMedia();
      careerNewsId = id;
      careerView = 'detail';
      mediaTab = 'read';
      render();
    }

    function showCareerList() {
      stopCareerMedia();
      careerView = 'list';
      render();
    }

    function showCareerRoute() {
      stopCareerMedia();
      careerView = 'route';
      const region = schoolRegion();
      careerRoute = region ? { status: 'loading', region, stops: [], reason: '' } : { status: 'sample', region: null, stops: [], reason: 'no-school' };
      render();
      if (region) loadCareerRoute(careerNewsId, region);
    }

    // 학교 지역에서 주제별 검색어마다 한 곳씩 골라 루트를 만든다. 두 곳 이상 모이면 쓴다.
    async function loadCareerRoute(newsId, region) {
      const stops = [];
      for (const [keyword, type] of careerRouteKeywords[newsId]) {
        const query = new URLSearchParams({
          numOfRows: '30', pageNo: '1', MobileOS: 'AND', MobileApp: 'DAIT', _type: 'json', arrange: 'A',
          keyword, lDongRegnCd: region.code
        }).toString();
        try {
          const rows = tourRows(JSON.parse(await careerTourBody(query)));
          const pick = rows.find(row => !stops.some(s => s.name === row.name));
          if (pick) stops.push({ name: pick.name, type, region: pick.address || region.name, stay: stopStayMinutes[type], desc: stopTypeLines[type] });
        } catch (e) {
          break; // 중계 서버나 자료가 없으면 나머지도 같으므로 멈춘다.
        }
      }
      // 기다리는 사이 다른 화면이나 기사로 옮겼으면 버린다.
      if (currentMode !== 'career' || careerView !== 'route' || careerNewsId !== newsId) return;
      careerRoute = stops.length >= 2
        ? { status: 'ready', region, stops, reason: '' }
        : { status: 'sample', region, stops: [], reason: 'no-data' };
      render();
    }

    // 앱에서는 TourClient가, 브라우저 미리보기에서는 같은 중계 서버를 직접 부른다.
    function careerTourBody(query) {
      if (window.AndroidBridge) return tourBody(query);
      return fetch(`${TOUR_URL}searchKeyword2?${query}`).then(response => response.text());
    }

    function setMediaTab(tab) {
      stopCareerMedia();
      mediaTab = tab;
      render();
    }

    function openOriginalArticle() {
      const url = currentNews().url;
      if (window.AndroidBridge && window.AndroidBridge.openUrl) window.AndroidBridge.openUrl(url);
      else window.open(url, '_blank', 'noopener');
    }

    function sendRouteToNavi() {
      // Pleos NaviHelper 연결 전: 경유지 목록을 넘기는 자리
      const stops = careerRouteStops().map(s => s.name).join(' → ');
      showCareerToast(`내비게이션에 경로를 보냈어요: ${stops}`);
    }


    // 듣기: 문장마다 읽으면서 해당 줄을 강조한다.
    function startListening() {
      const n = currentNews();
      const lines = [n.title, ...n.points];
      speakLines(lines, idx => {
        document.querySelectorAll('#listenLines li').forEach((li, i) => li.classList.toggle('speaking', i === idx - 1));
      });
    }

    // 짧은 영상: 요약 문장마다 장면 하나, 자막과 내레이션을 함께 재생한다.
    function startVideo() {
      videoScene = 0;
      showVideoScene();
    }

    function showVideoScene() {
      const n = currentNews();
      const stageEl = document.getElementById('videoStage');
      if (!stageEl) return;
      const total = n.points.length;

      if (videoScene >= total) {
        stageEl.innerHTML = `
          <div class="video-end">
            <div class="video-art">${careerCategories[n.id].icon}</div>
            <button class="back-btn" onclick="startVideo()">다시 보기</button>
          </div>`;
        return;
      }

      stageEl.innerHTML = `
        <div class="video-progress">
          ${n.points.map((_, i) => `<span class="${i < videoScene ? 'done' : i === videoScene ? 'now' : ''}"><i></i></span>`).join('')}
        </div>
        <div class="video-art">${careerCategories[n.id].icon}</div>
        <div class="video-caption">${n.points[videoScene]}</div>`;
      speakLines([n.points[videoScene]]);
      videoTimer = setTimeout(() => {
        videoScene += 1;
        showVideoScene();
      }, SCENE_MS);
    }

    function stopCareerMedia() {
      clearTimeout(videoTimer);
      videoTimer = null;
      stopSpeaking();
    }

    // 기사 낭독: 앱에서는 Android TTS, 브라우저 프리뷰에서는 Web Speech API
    function speakLines(lines, onLine) {
      stopSpeaking();
      if (window.AndroidBridge && window.AndroidBridge.speakText) {
        window.AndroidBridge.speakText(lines.join(' '));
        return;
      }
      if (!('speechSynthesis' in window)) return;
      lines.forEach((line, idx) => {
        const u = new SpeechSynthesisUtterance(line);
        u.lang = 'ko-KR';
        if (onLine) u.onstart = () => onLine(idx);
        if (onLine && idx === lines.length - 1) u.onend = () => onLine(-1);
        window.speechSynthesis.speak(u);
      });
    }

    function stopSpeaking() {
      if (window.AndroidBridge && window.AndroidBridge.stopText) window.AndroidBridge.stopText();
      else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function isParkedScreen() {
      return currentMode === 'settings' || currentMode === 'places' || currentMode === 'career';
    }

    function openSettings() {
      stopSpeech();
      currentMode = 'settings';
      settings = { step: 'search', query: '', results: [], classes: [], message: '' };
      render();
    }

    function renderSettings(container) {
      let title = school ? `${school.name} ${school.grade}학년 ${school.classNm}반` : '학교를 찾아 주세요';
      let body = '';

      if (settings.step === 'search') {
        body = `
          <div class="school-search-row">
            <input id="schoolInput" class="school-input" type="text" placeholder="학교 이름" value="${escapeHtml(settings.query)}"
                   onkeydown="if (event.key === 'Enter') searchSchools()">
            <button class="choice-chip" onclick="searchSchools()">찾기</button>
          </div>
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.results.map((row, i) => `<button class="choice-chip" onclick="pickSchool(${i})">${escapeHtml(row.SCHUL_NM)} · ${escapeHtml(row.LCTN_SC_NM)}</button>`).join('')}
          </div>
        `;
      } else if (settings.step === 'grade') {
        title = '몇 학년인가요?';
        body = `<div class="settings-list">${SCHOOL_KINDS[settings.picked.SCHUL_KND_SC_NM].grades.map(grade => `<button class="choice-chip" onclick="pickGrade(${grade})">${grade}학년</button>`).join('')}</div>`;
      } else {
        title = '몇 반인가요?';
        body = `
          ${settings.message ? `<div class="settings-message">${escapeHtml(settings.message)}</div>` : ''}
          <div class="settings-list">
            ${settings.classes.map((name, i) => `<button class="choice-chip" onclick="pickClass(${i})">${escapeHtml(name)}${/^\d+$/.test(name) ? '반' : ''}</button>`).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="dialogue-wrap">
          <div class="dialogue-top">
            <button class="back-btn" onclick="goHome()">처음으로</button>
            ${school ? '<button class="back-btn" onclick="clearSchool()">학교 지우기</button>' : ''}
            ${homePlace ? `<button class="back-btn" onclick="clearHome()">집 지우기 (${escapeHtml(homePlace.name)})</button>` : ''}
            ${canSaveHome() ? `<button class="back-btn" onclick="saveHomeFromNavi()">지금 목적지를 집으로</button>` : ''}
            <button class="back-btn" onclick="toggleQuestions()">질문 ${readStored(QUESTIONS_KEY) === false ? '꺼짐' : '켜짐'}</button>
            ${micState() === 'none' ? '' : `<button class="back-btn" onclick="toggleVoiceAnswers()">말로 답하기 ${readStored(VOICE_KEY) === false ? '꺼짐' : '켜짐'}</button>`}
          </div>
          <div class="dialogue-card">
            <div class="settings-center">
              <div class="main-question">${escapeHtml(title)}</div>
              ${body}
            </div>
          </div>
        </div>
      `;
    }

    function toggleQuestions() {
      writeStored(QUESTIONS_KEY, readStored(QUESTIONS_KEY) === false);
      render();
    }

    function toggleVoiceAnswers() {
      writeStored(VOICE_KEY, readStored(VOICE_KEY) === false);
      render();
    }

    async function searchSchools() {
      const query = document.getElementById('schoolInput').value.trim();
      if (!query) return;
      settings.query = query;
      settings.results = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('schoolInfo', { SCHUL_NM: query });
        settings.results = rows.filter(row => row.SD_SCHUL_CODE.trim() && SCHOOL_KINDS[row.SCHUL_KND_SC_NM]).slice(0, 8);
        settings.message = settings.results.length > 0 ? '' : '찾는 학교가 없어요';
      } catch (e) {
        console.log('School search error:', e);
        settings.message = '지금은 학교를 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickSchool(index) {
      settings.picked = settings.results[index];
      settings.step = 'grade';
      render();
    }

    async function pickGrade(grade) {
      const now = new Date();
      settings.grade = grade;
      settings.step = 'class';
      settings.classes = [];
      settings.message = '찾는 중이에요';
      render();
      try {
        const rows = await neisRows('classInfo', {
          ATPT_OFCDC_SC_CODE: settings.picked.ATPT_OFCDC_SC_CODE,
          SD_SCHUL_CODE: settings.picked.SD_SCHUL_CODE,
          AY: String(now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear()),
          GRADE: String(grade)
        });
        settings.classes = [...new Set(rows.map(row => row.CLASS_NM))];
        settings.message = settings.classes.length > 0 ? '' : '찾는 반이 없어요';
      } catch (e) {
        console.log('Class search error:', e);
        settings.message = '지금은 반을 찾을 수 없어요';
      }
      if (currentMode === 'settings') render();
    }

    function pickClass(index) {
      school = {
        office: settings.picked.ATPT_OFCDC_SC_CODE,
        code: settings.picked.SD_SCHUL_CODE,
        name: settings.picked.SCHUL_NM,
        address: settings.picked.ORG_RDNMA || '',
        kind: settings.picked.SCHUL_KND_SC_NM,
        grade: String(settings.grade),
        classNm: settings.classes[index]
      };
      schoolDays = {};
      writeStored(SCHOOL_KEY, school);
      writeStored(DAYS_KEY, schoolDays);
      schoolEvents = {};
      writeStored(EVENTS_KEY, schoolEvents);
      goHome();
      refreshSchoolDays();
    }

    function clearSchool() {
      school = null;
      schoolDays = {};
      schoolEvents = {};
      try {
        localStorage.removeItem(SCHOOL_KEY);
        localStorage.removeItem(DAYS_KEY);
        localStorage.removeItem(EVENTS_KEY);
      } catch (e) {
        console.log('Storage error:', e);
      }
      goHome();
    }

    document.getElementById('audioPlayer').addEventListener('ended', playPreviewClip);

    // In-App Detection & Driving Restriction API
    if (window.location.href.includes('android_asset') || navigator.userAgent.includes('Android')) {
      document.body.classList.add('in-app');
    }

    // 주행 중: 상세 화면을 닫고 문장 하나와 큰 버튼 둘만 보여 준다. 재생 중인 음성은 이어 간다.
    // 대화 중이 아니면(첫 화면·설정) 조작할 것이 없으므로 "주차 후 이어갈게요"만 보여 준다.
    window.setDrivingMode = function(isDriving, isRealDriving) {
      const departing = isDriving && !isDrivingMode;
      isDrivingMode = isDriving;
      document.body.classList.toggle('driving', isDriving);
      document.body.classList.toggle('real-driving', !!isRealDriving);
      document.getElementById('demoDrive').classList.toggle('on', isDriving);
      if (isDriving && isParkedScreen()) goHome();
      if (departing && armed) startFlow(armed.mode);
      else if (departing && speechPhase === 'idle') advanceWithoutMic();
      updateDriveScreen();
      syncJourney();
    };

    function updateDriveScreen(sentence) {
      const inDialogue = currentMode && !isParkedScreen();
      const trip = inDialogue ? null : currentTrip();
      const canStart = !inDialogue && trip.kind !== 'weekend';
      const text = inDialogue ? (sentence || document.querySelector('.main-question')?.textContent || '')
        : canStart ? `${trip.mode === 'morning' ? '등교' : '하교'} 이야기를 들을까요?` : '주차 후 이어갈게요';
      document.getElementById('driveSentence').textContent = text;
      document.getElementById('driveSub').textContent = inDialogue ? heardLineText() : (canStart ? '' : '설정과 자세한 내용은 주차한 뒤 열어요');
      const done = inDialogue && isDialogueDone();
      const replay = document.getElementById('driveReplay');
      replay.disabled = !inDialogue;
      replay.hidden = canStart;
      const next = document.getElementById('driveNext');
      next.textContent = canStart ? '듣기' : (done ? '마치기' : '넘기기');
      next.disabled = !inDialogue && !canStart;
    }

    function driveReplay() {
      if (currentMode && !isParkedScreen()) render();
    }

    function driveNext() {
      if (!currentMode || isParkedScreen()) {
        const trip = currentTrip();
        if (trip.kind !== 'weekend') startFlow(trip.mode);
      } else if (isDialogueDone()) goHome();
      else skipQuestion();
      updateDriveScreen();
    }

    // 시연용 주말. 수업이 있는 날에도 주말 첫 화면(진로 체험 카드)을 보여 준다.
    function toggleWeekendDemo() {
      weekendDemo = !weekendDemo;
      document.getElementById('demoWeekend').classList.toggle('on', weekendDemo);
      if (!currentMode) render();
    }

    function toggleDrivingDemo() {
      if (window.AndroidBridge) {
        window.AndroidBridge.toggleDrivingSim();
      } else {
        window.setDrivingMode(!isDrivingMode);
      }
    }

    // 차가 보내는 목적지와 남은 시간. 앱의 NaviBridge가 부른다.
    // 실제 값이 오면 시연 조작(8분 전·4분 전·2분 전)보다 우선한다.
    let naviInfo = null;

    window.onNaviUpdate = function(jsonText) {
      let info;
      try { info = JSON.parse(jsonText); } catch (e) { return; }
      console.log('Navi:', jsonText);
      if (info.event === 'destination' || info.event === 'routeStarted') {
        // 길 안내가 없을 때는 이름 없이 0으로 오므로 도착 직전과 구분한다.
        if (!info.name && !(Number(info.remainTime) > 0)) { const had = !!naviInfo; naviInfo = null; renderDemoPanel(); if (had) refreshHomeIfIdle(); return; }
        const changed = !naviInfo || naviInfo.name !== (info.name || '') || (currentMode === 'settings' && !document.querySelector('[onclick="saveHomeFromNavi()"]') && canSaveHomeFor(info));
        naviInfo = { name: info.name || '', address: info.address || '', remainTime: Number(info.remainTime), remainDistance: Number(info.remainDistance), at: Date.now() };
        applyNaviEta();
        if (changed) refreshHomeIfIdle();
      } else if (info.event === 'routeCancelled' || info.event === 'routeEnded' || info.event === 'arrived' || info.event === 'unavailable') {
        // 내비에 따라 도착 신호 없이 안내 종료만 올 수 있으므로, 거의 다 온 때의 종료도 도착으로 본다.
        const reached = info.event === 'arrived' || (info.event === 'routeEnded' && Journey.tierFor(naviRemainMinutes()) === 'arrive');
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
        if (reached) finishOnArrival();
      } else if (info.event === 'status' && info.status !== 'ROUTE_DRIVE') {
        naviInfo = null;
        renderDemoPanel();
        refreshHomeIfIdle();
      }
    };

    function refreshHomeIfIdle() {
      if (isIntroPlaying) { homeStale = true; return; }
      if (!currentMode || currentMode === 'settings') render();
    }
    // 길 안내 중 10초마다 같은 목적지가 와도 설정 화면의 '집으로' 버튼이 늦지 않게, 목적지 이름이 생기면 다시 그린다

    // ========================================================
    // 목적지로 등교·하교 제안 (기획안 ②: 목적지가 학교면 등교, 집이면 하교)
    // 자동으로 대화를 시작하지는 않는다. 안전 원칙: 운전자 조작 없이 소리를 내지 않는다.
    // ========================================================
    const HOME_KEY = 'dait.home';
    let homePlace = readStored(HOME_KEY);

    function normalizePlace(text) {
      return String(text || '').replace(/\s+/g, '').replace(/[()·,.]/g, '');
    }

    // 도로명 주소에서 '산정로 171'처럼 도로 이름과 번지만 뽑는다.
    function roadPart(address) {
      const m = String(address || '').match(/([가-힣A-Za-z0-9]+(?:로|길|대로))\s*(\d+(?:-\d+)?)/);
      return m ? m[1] + m[2] : '';
    }

    function placeMatches(dest, place) {
      if (!dest || !place) return false;
      const destName = normalizePlace(dest.name), placeName = normalizePlace(place.name);
      if (destName && placeName && (destName === placeName || destName.includes(placeName) || placeName.includes(destName))) return true;
      const destRoad = roadPart(dest.address), placeRoad = roadPart(place.address);
      return !!(destRoad && placeRoad && destRoad === placeRoad);
    }

    function canSaveHome() { return canSaveHomeFor(naviInfo); }
    function canSaveHomeFor(dest) {
      return !!(dest && dest.name) && !(school && placeMatches(dest, school)) && !(homePlace && placeMatches(dest, homePlace));
    }

    function saveHomeFromNavi() {
      if (!canSaveHome()) return;
      homePlace = { name: naviInfo.name, address: naviInfo.address || '' };
      writeStored(HOME_KEY, homePlace);
      goHome();
    }

    function clearHome() {
      homePlace = null;
      try { localStorage.removeItem(HOME_KEY); } catch (e) { console.log('Storage error:', e); }
      render();
    }

    // 남은 시간은 초, 남은 거리는 m 단위다. 에뮬레이터에서 판교→서울시청 1740초·26000m로 확인했다.
    function naviRemainMinutes() {
      if (!naviInfo || !Number.isFinite(naviInfo.remainTime)) return null;
      return naviInfo.remainTime / 60;
    }

    // 도착이 가까워지면 말하던 문장은 끝까지 하고, 다음 내비 응답 때 마무리로 넘어간다.
    function applyNaviEta() {
      renderDemoPanel();
      if (!currentMode || isParkedScreen() || speechPhase === 'speaking' || speechPaused) return;
      if (Journey.tierFor(remainMinutes()) !== 'arrive') return;
      if (!isDialogueDone() || (currentMode === 'morning' && stage === 'REST')) setStage('ETA_SHORT');
    }

    function renderDemoPanel() {
      const minutes = naviRemainMinutes();
      const live = minutes !== null;
      const shown = remainMinutes();
      const buttons = [['demoEtaLong', 8], ['demoEtaMid', 4], ['demoEtaShort', 2]];
      buttons.forEach(([id, value]) => {
        const button = document.getElementById(id);
        button.classList.toggle('on', !live && shown === value);
        button.disabled = live;
      });
      document.getElementById('demoEtaLong').textContent = live ? `${Math.max(1, Math.round(minutes))}분 전` : '8분 전';
      document.getElementById('demoEtaLong').classList.toggle('on', live || shown === 8);
    }

    // 시연용 목적지. 차에서 실제 값이 오면(앱 안) 쓰지 않는다. 없음 → 학교 → 집 → 없음 순으로 돈다.
    let destDemoStep = 0;
    function cycleDestDemo() {
      if (window.AndroidBridge) return;
      destDemoStep = (destDemoStep + 1) % 3;
      const fake = destDemoStep === 1 && school ? { name: school.name, address: school.address, remainTime: 480, remainDistance: 4000 }
        : destDemoStep === 2 ? { name: homePlace ? homePlace.name : '우리집', address: homePlace ? homePlace.address : '', remainTime: 480, remainDistance: 4000 }
        : null;
      document.getElementById('demoDest').classList.toggle('on', !!fake);
      if (fake) window.onNaviUpdate(JSON.stringify({ event: 'destination', ...fake }));
      else window.onNaviUpdate(JSON.stringify({ event: 'routeCancelled' }));
    }

    // 시연용 남은 시간. 차에서 실제 값이 오면 쓰지 않는다.
    function setEtaDemo(minutes) {
      if (naviRemainMinutes() !== null) return;
      demoMinutes = demoMinutes === minutes ? null : minutes;
      applyNaviEta();
    }

    // ========================================================
    // 시그니처 인트로 스플래시 애니메이션 엔진
    // ========================================================
    let isIntroPlaying = false;
    let introTimers = [];

    function clearIntroTimers() {
      introTimers.forEach(t => clearTimeout(t));
      introTimers = [];
    }

    function playChimeSound() {
      if (isDrivingMode) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        // 산뜻하고 경쾌한 현대 ccNC 차음 스타일 피치 (880Hz -> 1760Hz)
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {
        // 브라우저 자동 재생 정책 제한 시 안전 패스
      }
    }

    function playSplashIntro() {
      if (isIntroPlaying) return;
      isIntroPlaying = true;
      clearIntroTimers();

      const overlay = document.getElementById('splashOverlay');
      const brand = document.getElementById('splashBrandContainer');
      const ribbon = document.getElementById('splashRibbonPath');
      const crossbar = document.getElementById('splashCrossbarPath');
      const dotGroup = document.getElementById('splashDotGroup');
      const dotRipple = document.getElementById('splashDotRipple');
      const aura = document.querySelector('.splash-aura');

      if (!overlay || !ribbon) {
        isIntroPlaying = false;
        return;
      }

      // 오버레이 및 브랜드 상태 초기화 (전체 화면 상태로 리셋)
      overlay.style.transition = 'none';
      overlay.style.top = '0px';
      overlay.style.left = '0px';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.borderRadius = '28px';
      overlay.style.boxShadow = 'none';
      overlay.classList.remove('fade-out');
      overlay.style.display = 'flex';
      overlay.style.opacity = '1';
      overlay.style.visibility = 'visible';

      if (aura) {
        aura.style.transition = 'none';
        aura.style.opacity = '0.9';
      }

      brand.style.transition = 'none';
      brand.style.transform = 'translate(0, 0) scale(1)';
      brand.style.opacity = '1';

      if (dotGroup) dotGroup.classList.remove('pop');
      if (dotRipple) dotRipple.classList.remove('expand');

      // 우측 메뉴 카드 초기화 (오른쪽에서 당겨져 들어올 준비)
      const rightCards = document.querySelectorAll('.bento-right-col > *');
      rightCards.forEach((card) => {
        card.style.transition = 'none';
        card.style.transform = 'translateX(65px)';
        card.style.opacity = '0';
      });

      // SVG 스트로크 대시 설정 (전체 길이 측정)
      const ribbonLength = ribbon.getTotalLength ? ribbon.getTotalLength() : 380;
      ribbon.style.transition = 'none';
      ribbon.style.strokeDasharray = ribbonLength;
      ribbon.style.strokeDashoffset = ribbonLength;

      const crossbarLength = crossbar.getTotalLength ? crossbar.getTotalLength() : 20;
      crossbar.style.transition = 'none';
      crossbar.style.strokeDasharray = crossbarLength;
      crossbar.style.strokeDashoffset = crossbarLength;

      // 동기식 리플로우 강제 (트랜지션 보장)
      void ribbon.getBoundingClientRect();

      // 1. 손글씨 쓰듯 캘리그래피 스트로크 스르륵 써내려가기 (0 ~ 1.05s)
      requestAnimationFrame(() => {
        ribbon.style.transition = 'stroke-dashoffset 1.05s cubic-bezier(0.42, 0, 0.18, 1)';
        ribbon.style.strokeDashoffset = '0';
      });

      // 2. t 가로획 연결 (0.92s)
      introTimers.push(setTimeout(() => {
        crossbar.style.transition = 'stroke-dashoffset 0.18s ease-out';
        crossbar.style.strokeDashoffset = '0';
      }, 920));

      // 3. i 위에 점(Dot) 하나 마지막으로 딱! 찍히며 충격파 확산 (1.12s)
      introTimers.push(setTimeout(() => {
        if (dotGroup) dotGroup.classList.add('pop');
        if (dotRipple) dotRipple.classList.add('expand');
        playChimeSound();
      }, 1120));

      // 4. 파란색 화면 전체가 hero 카드 크기로 함께 줄어들면서, 로고도 좌측 상단으로 같이 빨려들어가는 모션 (1.62s)
      introTimers.push(setTimeout(() => {
        const hero = document.querySelector('.bento-hero');
        const display = document.querySelector('.pleos-display');
        const targetBadge = document.querySelector('.dait-brand-badge');

        if (hero && display && targetBadge) {
          const hRect = hero.getBoundingClientRect();
          const dRect = display.getBoundingClientRect();
          const targetTop = hRect.top - dRect.top;
          const targetLeft = hRect.left - dRect.left;
          const targetWidth = hRect.width;
          const targetHeight = hRect.height;

          // (1) 전체 파란색 화면이 hero 카드 위치와 크기로 함께 수축 (빨려들어가기)
          overlay.style.transition = 'top 0.72s cubic-bezier(0.22, 1, 0.36, 1), left 0.72s cubic-bezier(0.22, 1, 0.36, 1), width 0.72s cubic-bezier(0.22, 1, 0.36, 1), height 0.72s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.72s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.72s cubic-bezier(0.22, 1, 0.36, 1)';
          overlay.style.top = `${targetTop}px`;
          overlay.style.left = `${targetLeft}px`;
          overlay.style.width = `${targetWidth}px`;
          overlay.style.height = `${targetHeight}px`;
          overlay.style.borderRadius = '22px';
          overlay.style.boxShadow = '0 14px 34px rgba(7, 23, 44, 0.32)';

          // (2) 로고도 수축하는 파란색 화면 내부에서 좌측 상단으로 정확히 이동
          // 축소된 카드 내부 기준: padding-left 28px, padding-top 24px
          const targetX = 28 + (targetBadge.offsetWidth / 2) - (targetWidth / 2);
          const targetY = 24 + (targetBadge.offsetHeight / 2) - (targetHeight / 2);
          const scale = targetBadge.offsetWidth / brand.offsetWidth;

          brand.style.transition = 'transform 0.72s cubic-bezier(0.22, 1, 0.36, 1)';
          brand.style.transform = `translate(${targetX}px, ${targetY}px) scale(${scale})`;

          // (3) 오버레이 내부 발광 아우라는 수축하면서 은은하게 소멸
          if (aura) {
            aura.style.transition = 'opacity 0.55s ease';
            aura.style.opacity = '0';
          }
        }

        // (4) 우측 메뉴 카드들이 왼쪽 수축 모션에 이끌리듯 오른쪽에서 화면 안으로 부드럽게 당겨져 들어옴 (스태거 캐스케이드)
        rightCards.forEach((card, idx) => {
          const delay = idx * 65; // 상단 2분할(0ms) -> 하교 대화(65ms) 순차 진입
          introTimers.push(setTimeout(() => {
            card.style.transition = 'transform 0.68s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.48s ease-out';
            card.style.transform = 'translateX(0)';
            card.style.opacity = '1';
          }, delay));
        });
      }, 1620));

      // 5. 수축 완료 시점 (2.36s) - 파란색 화면이 hero 카드와 완전히 포개졌으므로 부드럽게 핸드오버
      introTimers.push(setTimeout(() => {
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '0';
      }, 2360));

      // 5.5 우측 메뉴 카드 스타일 정리 (2.46s - 도착 완료 후 기본 CSS 호버 효과 정상화)
      introTimers.push(setTimeout(() => {
        rightCards.forEach((card) => {
          card.style.transition = '';
          card.style.transform = '';
          card.style.opacity = '';
        });
      }, 2460));

      // 6. 스플래시 완전 정리 (2.58s)
      introTimers.push(setTimeout(() => {
        overlay.style.display = 'none';
        finishIntro();
      }, 2580));
    }

    function finishIntro() {
      isIntroPlaying = false;
      if (homeStale && !currentMode) render();
      homeStale = false;
    }

    function skipSplashIntro() {
      clearIntroTimers();
      const overlay = document.getElementById('splashOverlay');
      const rightCards = document.querySelectorAll('.bento-right-col > *');
      rightCards.forEach((card) => {
        card.style.transition = 'opacity 0.2s ease';
        card.style.transform = '';
        card.style.opacity = '1';
        setTimeout(() => {
          card.style.transition = '';
        }, 200);
      });
      if (overlay) {
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
          finishIntro();
        }, 200);
      }
    }

    // Initial render and signature splash intro
    render();
    refreshSchoolDays();
    setTimeout(() => {
      playSplashIntro();
    }, 120);
  </script>
</body>
</html>
